<script>
/* ============================================================
   Dashboard pengurus (scrKelola).
   Sisi lain dari layar komunitas: di sana penggunanya calon anggota yang
   minta gabung; di sini dia pengurus komunitas yang baru dibuatnya sendiri,
   dan yang dikerjakannya persis tiga hal yang belum ada padanannya di produk:

     1. Menyetujui pendaftaran   — approval yang selama ini disimulasikan
        tombol demo, di sini jadi tindakan sungguhan di panel Permintaan.
     2. Mengangkat kepengurusan  — anggota biasa diberi jabatan, jadi pengurus.
     3. Memindahkan hak setuju   — satu orang memegang "peninjau pendaftaran",
        dan haknya bisa dipindahkan ke pengurus lain. Begitu dipindah, panel
        Permintaan di sisi pengurus lama terkunci — supaya pemindahan itu
        terasa nyata, bukan sekadar label.

   Datanya tumbuh saat prototipe dipakai (seperti keanggotaan pengguna di
   layar komunitas), jadi tanpa penyimpanan — muat ulang mengulang dari awal.
   ============================================================ */
(function(){
  const el = function(id){ return document.getElementById(id); };
  const scr = el('scrKelola');
  if(!scr) return;

  const JABATAN = ['Ketua', 'Wakil Ketua', 'Sekretaris', 'Bendahara', 'Humas', 'Pengurus'];

  /* pendaftar contoh. Sengaja bukan salah satu dari empat wajah ber-foto AI —
     pendaftar pakai inisial, jadi tidak ada foto orang yang dipakai tanpa izin */
  /* hari = umur permintaan ("yang paling lama menunggu"). Tiga yang terakhir
     ditambahkan supaya antreannya terasa menumpuk, seperti keluhan pengurus di
     laporan feedback 7 Agustus 2026 ("kewalahan approve satu-satu"). */
  const SEED = [
    { nama: 'Putri Maharani',  panggil: 'Putri', full: 'Putri Maharani Lestari', jk: 'Perempuan', kerja: 'Guru SD',         kota: 'Bekasi',        wa: '0812-••••-4417', email: 'putri••••@gmail.com', lengkap: true,  waktu: '2 hari lalu', hari: 2, tahun: 2014, teks: ['Diajak teman seangkatan', 'Ingin ikut kegiatan alumni'] },
    { nama: 'Andi Firmansyah', panggil: 'Andi',  full: 'Andi Firmansyah',        jk: 'Laki-laki', kerja: 'Karyawan swasta', kota: 'Jakarta Timur', wa: '0813-••••-2210', email: 'andi.f••••@gmail.com', lengkap: true,  waktu: 'kemarin',     hari: 1, tahun: 2010, teks: ['Ketemu di grup WhatsApp', 'Cari koneksi seprofesi'] },
    { nama: 'Sinta Dewi',      panggil: 'Sinta', full: 'Sinta Dewi Anggraini',   jk: 'Perempuan', kerja: 'Wiraswasta',      kota: 'Depok',         wa: '0857-••••-3390', email: 'sinta••••@gmail.com',  lengkap: false, waktu: '3 jam lalu',  hari: 0, tahun: 2016, teks: ['Nemu halaman ini di Kolavo', 'Mau kenal alumni lain'] },
    { nama: 'Rina Kartika',    panggil: 'Rina',  full: 'Rina Kartika Sari',      jk: 'Perempuan', kerja: 'Perawat',         kota: 'Jakarta Utara', wa: '0821-••••-7702', email: 'rinaks••••@gmail.com', lengkap: true,  waktu: '5 hari lalu', hari: 5, tahun: 2012, teks: ['Diajak ketua angkatan', 'Mau bantu kegiatan sosial'] },
    { nama: 'Bayu Setiawan',   panggil: 'Bayu',  full: 'Bayu Setiawan',          jk: 'Laki-laki', kerja: 'Teknisi jaringan', kota: 'Bekasi',       wa: '0838-••••-1185', email: 'bayu.s••••@gmail.com', lengkap: true,  waktu: '8 hari lalu', hari: 8, tahun: 2010, teks: ['Dari grup WhatsApp angkatan', 'Cari info lowongan'] },
    { nama: 'Galih Pramudya',  panggil: 'Galih', full: 'Galih Pramudya',         jk: 'Laki-laki', kerja: 'Desainer grafis', kota: 'Tangerang',     wa: '0877-••••-5543', email: 'galihp••••@gmail.com', lengkap: false, waktu: '6 hari lalu', hari: 6, tahun: 2015, teks: ['Lihat unggahan di Instagram', 'Ingin ikut reuni'] }
  ];

  const D = {
    built: false, kom: null, aku: 'Kamu', akuKerja: '', akuKota: '',
    mem: {}, minta: [], anggotaBiasa: [], pengurus: [], peninjau: 'Kamu',
    tab: 'minta', angkatFor: null, ubahFor: null, riwayat: [],
    /* penomoran anggota */
    nomorMode: 'auto', kode: 'KOMU', tahun: new Date().getFullYear(), urut: 0, idUbahFor: null
  };
  window.KolavoDashboard = D;
  /* kait buat modul yang menempel ke dashboard (50-js-sekretariat) */
  D.onBangun = [];
  D.onGambar = [];

  function inisial(n){
    return n.trim().split(/\s+/).slice(0, 2).map(function(k){ return k[0]; }).join('').toUpperCase();
  }
  function lolos(s){
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function nilaiProfil(id){ const e = el(id); return e ? (e.value || '').trim() : ''; }

  /* tag jawaban pendaftar, disusun dari pertanyaan yang tadi dirancang pengurus —
     nama panggilan tidak jadi tag (itu cara menyapa, bukan cara mengenali) */
  /* jawaban pendaftar disusun dari pertanyaan yang dirancang pengurus saat buat
     halaman (kom.tanya) — bukan field tetap. Nama panggilan tidak diulang di sini
     karena sudah tampil di sebelah nama. */
  function jawabanFor(s){
    const tanya = (D.kom && D.kom.tanya) || [];
    const teks = Array.isArray(s.teks) ? s.teks : (s.teks ? [s.teks] : []);
    let ti = 0;
    return tanya.filter(function(t){ return t.id !== 'nickname'; }).map(function(t){
      const nilai = t.tipe === 'tahun' ? String(s.tahun) : (teks[ti++] || '—');
      return { judul: t.judul || 'Pertanyaan', nilai: nilai };
    });
  }
  /* versi ringkas (tag) untuk daftar anggota */
  function tagsFor(s){
    return jawabanFor(s).map(function(j){
      return /^\d{4}$/.test(j.nilai) ? j.judul + ' ' + j.nilai : j.nilai;
    });
  }

  const IKON_CEK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg>';
  const IKON_X   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>';
  const IKON_MATA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="2.6"/></svg>';
  const IKON_CEK_KECIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg>';

  /* ---------- membangun dari komunitas yang baru dibuat ---------- */
  function bangun(){
    const kom = (window.KolavoApp || {}).dibuat;
    if(!kom) return false;

    /* dibangun ulang tiap komunitas baru; kalau komunitas sama, keadaan dijaga */
    if(D.built && D.kom && D.kom.slug === kom.slug){ D.kom = kom; return true; }

    D.kom = kom;
    D.aku = nilaiProfil('pfNm') || (el('pfNm') && el('pfNm').textContent.trim()) || 'Kamu';
    D.akuKerja = nilaiProfil('kerja') || 'Pengurus';
    D.akuKota = nilaiProfil('kota') || kom.kota || '';
    /* penomoran anggota: mode + kode awalan ditetapkan saat halaman dibuat */
    D.nomorMode = kom.nomorMode || 'auto';
    D.kode = (kom.kode || (kom.slug || '').toUpperCase().replace(/[^0-9A-Z]/g, '') || 'KOMU');
    D.tahun = new Date().getFullYear();
    D.urut = 0;
    D.idUbahFor = null;

    D.mem = {};
    D.mem[D.aku] = { nama: D.aku, kerja: D.akuKerja, kota: D.akuKota, panggil: 'Kamu', aku: true };
    /* pembuat halaman anggota pertama — dapat nomor 001 kalau penomoran otomatis */
    if(D.nomorMode === 'auto'){ D.urut = 1; D.mem[D.aku].id = fmtId(1); }
    /* pembuat halaman belum tentu ketua — defaultnya Community Builder
       sampai diberi jabatan sungguhan lewat menu Struktur Kepengurusan */
    D.pengurus = [{ nama: D.aku, jabatan: 'Community Builder', aku: true }];
    /* peninjau pendaftaran boleh lebih dari satu — daftar nama, bukan satu orang.
       Awalnya cuma pembuatnya; pengurus lain bisa ditambahkan kapan saja. */
    D.peninjau = [D.aku];
    D.anggotaBiasa = [];
    D.minta = SEED.map(function(s, i){
      return {
        id: 'r' + i, nama: s.nama, panggil: s.panggil, full: s.full, jk: s.jk,
        kerja: s.kerja, kota: s.kota, wa: s.wa, email: s.email, lengkap: s.lengkap,
        waktu: s.waktu, hari: s.hari, tahun: s.tahun,
        jawaban: jawabanFor(s), tags: tagsFor(s)
      };
    });
    D.tab = 'minta';
    D.angkatFor = null;
    D.ubahFor = null;
    D.riwayat = [];
    D.built = true;
    /* modul lain (Sekretariat) mengosongkan keadaannya sendiri di sini */
    D.onBangun.forEach(function(f){ f(); });
    return true;
  }

  /* nomor anggota: KODE-TAHUN MASUK-URUTAN (3 digit). urut = jumlah yang sudah
     masuk tahun itu; di prototipe satu tahun berjalan saja. */
  function fmtId(n){ return D.kode + '-' + D.tahun + '-' + String(n).padStart(3, '0'); }
  function idBerikut(){ return fmtId(D.urut + 1); }   /* nomor untuk yang diterima berikutnya */
  function pakaiNomor(){ return D.nomorMode !== 'off'; }

  function jumlahAnggota(){ return D.pengurus.length + D.anggotaBiasa.length; }
  function modeAdvance(){ return D.mode === 'advance'; }
  function akuPeninjau(){ return D.peninjau.indexOf(D.aku) >= 0; }
  function adaPeninjau(nama){ return D.peninjau.indexOf(nama) >= 0; }
  function jabatanDari(nama){
    const p = D.pengurus.filter(function(x){ return x.nama === nama; })[0];
    return p ? p.jabatan : null;
  }
  /* nama peninjau selain diri sendiri, buat kalimat kunci di panel permintaan */
  function peninjauLain(){ return D.peninjau.filter(function(n){ return n !== D.aku; }); }
  function sebutNama(daftar){
    const p = daftar.map(function(n){ return n.split(' ')[0]; });
    if(p.length <= 1) return p[0] || '';
    if(p.length === 2) return p[0] + ' dan ' + p[1];
    return p.slice(0, -1).join(', ') + ', dan ' + p[p.length - 1];
  }
  D.jabatanAku = function(){ return jabatanDari(D.aku) || 'Pengurus'; };

  /* ---------- kepala halaman ---------- */
  function gambarKepala(){
    const kom = D.kom;
    const jk = el('klJalurKom'); if(jk) jk.textContent = kom.nama;
    el('klNm').textContent = kom.nama;
    const logo = el('klLogo');
    logo.textContent = kom.logo ? '' : (kom.inisial || inisial(kom.nama));
    logo.style.backgroundImage = kom.logo ? 'url("' + kom.logo + '")' : '';

    el('klMeta').innerHTML = '';
    [kom.bentuk, kom.kota, jumlahAnggota() + ' anggota'].filter(Boolean).forEach(function(v, i){
      if(i){ const t = document.createElement('span'); t.className = 'titik'; t.textContent = '·'; el('klMeta').appendChild(t); }
      const s = document.createElement('span'); s.textContent = v; el('klMeta').appendChild(s);
    });

    el('klRole').lastChild.textContent = 'Kamu ' + D.jabatanAku() + ' di sini';
    if(window.KolavoWarnai) window.KolavoWarnai(scr, kom.warna);
  }

  /* ---------- panel: permintaan gabung (approval) ---------- */
  function gambarMinta(){
    el('klMintaN').textContent = D.minta.length;

    const lock = el('klLock');
    if(akuPeninjau()){
      lock.hidden = true;
    } else {
      lock.hidden = false;
      const nm = D.peninjau.map(function(n){ return '<b>' + lolos(n) + '</b>'; }).join(', ');
      el('klLockTeks').innerHTML = 'Hak menyetujui pendaftaran dipegang ' + nm +
        '. Kamu masih bisa melihat yang mendaftar, tapi keputusannya ada di mereka. ' +
        'Tambahkan dirimu lagi lewat menu Struktur Kepengurusan kalau perlu.';
    }

    const wadah = el('klMintaList');
    if(!D.minta.length){
      wadah.innerHTML =
        '<div class="empty">' +
          '<div class="empty-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg></div>' +
          '<h3>Belum ada permintaan gabung</h3>' +
          '<p>Sebar lagi link halamanmu ke grup. Setiap yang mendaftar muncul di sini untuk kamu setujui.</p>' +
        '</div>';
      return;
    }

    const bisa = akuPeninjau();
    wadah.innerHTML = D.minta.map(function(r, i){
      const av = '<div class="av ' + 'abc'[i % 3] + '" aria-hidden="true">' + inisial(r.nama) + '</div>';

      /* Jawaban pertanyaan pendaftaran — pertanyaan yang disusun pengurus saat
         buat halaman. Ini sinyal utama buat memutuskan, jadi ditaruh menonjol. */
      const jawab = (r.jawaban && r.jawaban.length)
        ? '<div class="kl-req-jawab"><span class="kl-jawab-h">Jawaban pertanyaan pendaftaran</span>' +
            r.jawaban.map(function(j){
              return '<div class="kl-jawab-row"><span class="kl-jawab-q">' + lolos(j.judul) + '</span>' +
                     '<span class="kl-jawab-a">' + lolos(j.nilai) + '</span></div>';
            }).join('') +
          '</div>'
        : '';

      /* data profil dari Kolavo — melekat ke orangnya, sama di komunitas mana pun */
      const info =
        '<div class="kl-req-info"><span class="kl-info-h">Data profil</span>' +
          baris2('WhatsApp', lolos(r.wa) + ' <span class="kl-verif">' + IKON_CEK_KECIL + 'terverifikasi</span>') +
          baris2('Email', lolos(r.email)) +
          baris2('Jenis kelamin', lolos(r.jk)) +
          baris2('Kelengkapan profil', r.lengkap
            ? '<span class="kl-ok">Profil lengkap</span>'
            : '<span class="kl-warn">Sebagian belum diisi</span>') +
        '</div>';

      /* nomor anggota: otomatis (pratinjau format) atau manual (isi/ubah saat menerima) */
      let nomor = '';
      if(pakaiNomor()){
        nomor = '<div class="kl-req-nomor"><span class="kl-info-k">Nomor anggota</span>' +
          (D.nomorMode === 'auto'
            ? '<span class="kl-idbadge">' + lolos(D.kode + '-' + D.tahun + '-•••') + '</span><span class="kl-id-note">dibuat otomatis saat diterima</span>'
            : '<input class="inp kl-idfield" type="text" data-idinput value="' + lolos(idBerikut()) + '" placeholder="Nomor anggota" ' + (bisa ? '' : 'disabled') + '>') +
          '</div>';
      }

      const catatan = bisa
        ? '<div class="kl-req-catatan"><label class="kl-info-k" for="kat-' + r.id + '">Catatan keputusan <span class="kl-opt">opsional</span></label>' +
          '<input class="inp" id="kat-' + r.id + '" type="text" data-catatan maxlength="80" placeholder="Mis. alumni angkatan 2014, dikenal pengurus"></div>'
        : '';

      const aksi = bisa
        ? '<div class="kl-req-aksi">' +
            '<button type="button" class="btn sm" data-setuju="' + r.id + '">' + IKON_CEK + 'Setujui</button>' +
            '<button type="button" class="btn sm tolak" data-tolak="' + r.id + '">' + IKON_X + 'Tolak</button>' +
          '</div>'
        : '<div class="kl-req-aksi"><span class="tag">Menunggu ditinjau ' + lolos(sebutNama(D.peninjau)) + '</span></div>';

      return '<div class="kl-req" data-req="' + r.id + '">' +
          '<div class="kl-req-top">' + av +
            '<div class="t"><div class="kl-req-nm">' + lolos(r.full || r.nama) +
              ' <span class="kl-req-panggil">“' + lolos(r.panggil) + '”</span></div>' +
            '<div class="kl-req-sub">' + lolos(r.kerja) + ' · ' + lolos(r.kota) + '</div></div>' +
            '<span class="kl-req-when">Minta gabung ' + lolos(r.waktu) + '</span>' +
          '</div>' +
          info + jawab + nomor + catatan + aksi +
        '</div>';
    }).join('');
  }

  /* satu baris "label : nilai" di kartu permintaan */
  function baris2(k, v){
    return '<div class="kl-info-row"><span class="kl-info-k">' + k + '</span><span class="kl-info-v">' + v + '</span></div>';
  }
  function bacaCatatan(kartu){
    const c = kartu && kartu.querySelector('[data-catatan]');
    return c ? c.value.trim() : '';
  }

  /* ---------- panel: anggota (angkat kepengurusan + nomor anggota) ---------- */
  function editNomor(nama, m){
    if(D.idUbahFor !== nama) return '';
    const siapa = (m.panggil && m.panggil !== 'Kamu') ? lolos(m.panggil) : (m.aku ? 'kamu' : lolos(nama.split(' ')[0]));
    return '<div class="kl-angkat">' +
        '<span class="kl-angkat-lbl">Nomor anggota ' + siapa + ':</span>' +
        '<input class="inp kl-idfield" id="klIdSel" type="text" value="' + lolos(m.id || idBerikut()) + '" placeholder="Nomor anggota">' +
        '<button type="button" class="btn sm" data-idubah-ok="' + lolos(nama) + '">Simpan</button>' +
        '<button type="button" class="btn outline sm" data-idubah-batal>Batal</button>' +
      '</div>';
  }
  function tombolNomor(nama, m){
    if(!pakaiNomor() || D.idUbahFor === nama) return '';
    return '<button type="button" class="btn outline sm" data-idubah="' + lolos(nama) + '">' + (m && m.id ? 'Ubah nomor' : 'Beri nomor') + '</button>';
  }

  function gambarAnggota(){
    el('klAnggotaN').textContent = jumlahAnggota();
    const wadah = el('klAnggotaList');
    let html = '';

    /* pengurus dulu, dengan jabatannya — lalu anggota biasa yang bisa diangkat */
    D.pengurus.forEach(function(p){
      const m = D.mem[p.nama] || { nama: p.nama, kerja: '', kota: '' };
      const kanan = '<span class="kl-jabatan">' + lolos(p.jabatan) + '</span>' + (p.aku ? '<span class="tag hi">Kamu</span>' : '');
      const t = tombolNomor(p.nama, m);
      html += baris(m, kanan, t ? '<div class="kl-row-aksi">' + t + '</div>' : '') + editNomor(p.nama, m);
    });

    D.anggotaBiasa.forEach(function(nama){
      const m = D.mem[nama];
      let aksi = '';
      if(D.angkatFor !== nama && D.idUbahFor !== nama){
        aksi = '<div class="kl-row-aksi">' + tombolNomor(nama, m) +
          (modeAdvance() ? '<button type="button" class="btn outline sm" data-angkat="' + lolos(nama) + '">Angkat jadi pengurus</button>' : '') + '</div>';
      }
      html += baris(m, '', aksi) + editNomor(nama, m);
      if(D.angkatFor === nama){
        html += '<div class="kl-angkat">' +
            '<span class="kl-angkat-lbl">Jadikan ' + lolos((m.panggil && m.panggil !== 'Kamu') ? m.panggil : nama.split(' ')[0]) + ':</span>' +
            '<select class="sel" id="klJabatanSel" aria-label="Pilih jabatan">' +
              JABATAN.map(function(j){ return '<option>' + j + '</option>'; }).join('') +
            '</select>' +
            '<button type="button" class="btn sm" data-angkat-ok="' + lolos(nama) + '">Angkat</button>' +
            '<button type="button" class="btn outline sm" data-angkat-batal>Batal</button>' +
          '</div>';
      }
    });

    wadah.innerHTML = html;
  }

  function baris(m, kanan, aksi){
    const av = '<div class="av ' + 'abc'[(m.nama.length) % 3] + '" aria-hidden="true">' + inisial(m.nama) + '</div>';
    const sub = [m.kerja, m.kota].filter(Boolean).join(' · ');
    /* nomor anggota ditaruh kecil di atas nama, bukan menyamping — baris jadi
       rapi walau nomornya panjang */
    const idAtas = (pakaiNomor() && m && m.id) ? '<div class="mem-id">' + lolos(m.id) + '</div>' : '';
    return '<div class="kl-row">' + av +
      '<div class="t">' + idAtas + '<div class="kl-row-nm">' + lolos(m.nama) + (kanan || '') + '</div>' +
      (sub ? '<div class="kl-row-sub">' + lolos(sub) + '</div>' : '') + '</div>' +
      (aksi || '') + '</div>';
  }

  /* ---------- panel: kepengurusan ---------- */
  function gambarPengurus(){
    if(modeAdvance()) gambarPengurusAdvance();
    else gambarPengurusEsensial();
  }

  /* Advance: susunan pengurus penuh — angkat, ubah jabatan, atur peninjau */
  function gambarPengurusAdvance(){
    const wadah = el('klPengurusList');
    const satuPeninjau = D.peninjau.length <= 1;
    wadah.innerHTML = '<p class="kl-sub">Pengurus bisa saling berbagi tugas. Hak menyetujui pendaftaran dipegang <b>peninjau pendaftaran</b> — boleh beberapa orang sekaligus, dan bisa kamu tambah atau lepas kapan saja. Selalu ada minimal satu peninjau.</p>' + D.pengurus.map(function(p){
      const m = D.mem[p.nama] || { nama: p.nama, kerja: '', kota: '' };
      const ini = adaPeninjau(p.nama);
      const nm = lolos(p.nama) + '<span class="kl-jabatan">' + lolos(p.jabatan) + '</span>' +
                 (p.aku ? '<span class="tag hi">Kamu</span>' : '') +
                 (ini ? '<span class="kl-peninjau">' + IKON_MATA + 'Peninjau pendaftaran</span>' : '');
      const av = '<div class="av ' + 'abc'[(p.nama.length) % 3] + '" aria-hidden="true">' + inisial(p.nama) + '</div>';
      const sub = [m.kerja, m.kota].filter(Boolean).join(' · ');

      let aksi = '';
      /* jabatan siapa pun bisa diubah, termasuk pembuat halaman sendiri */
      if(D.ubahFor !== p.nama) aksi += '<button type="button" class="btn outline sm" data-ubah="' + lolos(p.nama) + '">Ubah jabatan</button>';
      if(ini){
        /* peninjau terakhir tidak boleh dilepas — selalu ada yang meninjau */
        if(!satuPeninjau) aksi += '<button type="button" class="btn outline sm" data-peninjau-off="' + lolos(p.nama) + '">Lepas dari peninjau</button>';
      } else {
        aksi += '<button type="button" class="btn outline sm" data-peninjau-on="' + lolos(p.nama) + '">Jadikan peninjau</button>';
        if(!p.aku) aksi += '<button type="button" class="btn sm tolak" data-copot="' + lolos(p.nama) + '">Copot</button>';
      }

      let html = '<div class="kl-row">' + av +
        '<div class="t"><div class="kl-row-nm">' + nm + '</div>' +
        (sub ? '<div class="kl-row-sub">' + lolos(sub) + '</div>' : '') + '</div>' +
        (aksi ? '<div class="kl-row-aksi">' + aksi + '</div>' : '') + '</div>';

      if(D.ubahFor === p.nama){
        const opsi = JABATAN.map(function(j){ return '<option' + (j === p.jabatan ? ' selected' : '') + '>' + j + '</option>'; }).join('');
        html += '<div class="kl-angkat">' +
            '<span class="kl-angkat-lbl">Jabatan ' + (p.aku ? 'kamu' : lolos(p.nama.split(' ')[0])) + ':</span>' +
            '<select class="sel" id="klUbahSel" aria-label="Pilih jabatan">' + opsi + '</select>' +
            '<button type="button" class="btn sm" data-ubah-ok="' + lolos(p.nama) + '">Simpan</button>' +
            '<button type="button" class="btn outline sm" data-ubah-batal>Batal</button>' +
          '</div>';
      }
      return html;
    }).join('');
  }

  /* Esensial: tanpa susunan jabatan — cuma atur siapa peninjau + ajakan Advance */
  function gambarPengurusEsensial(){
    const wadah = el('klPengurusList');
    const satuPeninjau = D.peninjau.length <= 1;

    const list = D.peninjau.map(function(nama){
      const m = D.mem[nama] || { nama: nama, kerja: '', kota: '' };
      const sub = [m.kerja, m.kota].filter(Boolean).join(' · ');
      const av = '<div class="av ' + 'abc'[(nama.length) % 3] + '" aria-hidden="true">' + inisial(nama) + '</div>';
      const tag = (nama === D.aku) ? '<span class="tag hi">Kamu</span>' : '';
      const lepas = satuPeninjau ? '' : '<button type="button" class="btn outline sm" data-peninjau-off="' + lolos(nama) + '">Lepas</button>';
      return '<div class="kl-row">' + av +
        '<div class="t"><div class="kl-row-nm">' + lolos(nama) + tag +
          '<span class="kl-peninjau">' + IKON_MATA + 'Peninjau</span></div>' +
        (sub ? '<div class="kl-row-sub">' + lolos(sub) + '</div>' : '') + '</div>' +
        (lepas ? '<div class="kl-row-aksi">' + lepas + '</div>' : '') + '</div>';
    }).join('');

    const bisa = [D.aku].concat(D.anggotaBiasa).filter(function(n){ return !adaPeninjau(n); });
    let tambah;
    if(bisa.length){
      tambah = '<div class="kl-angkat">' +
          '<span class="kl-angkat-lbl">Tunjuk peninjau:</span>' +
          '<select class="sel" id="klPeninjauSel" aria-label="Pilih anggota jadi peninjau">' +
            bisa.map(function(n){ return '<option value="' + lolos(n) + '">' + lolos(n === D.aku ? 'Kamu' : n) + '</option>'; }).join('') +
          '</select>' +
          '<button type="button" class="btn sm" data-peninjau-add>Jadikan peninjau</button>' +
        '</div>';
    } else {
      tambah = '<p class="kl-cb-hint">Terima anggota dulu lewat tab Permintaan gabung untuk bisa menunjuk peninjau lain.</p>';
    }

    wadah.innerHTML =
      '<div class="kl-tier"><b>Paket Esensial · Community Builder.</b> Kamu satu-satunya pengurus. Yang bisa diatur di sini: siapa yang meninjau pendaftaran yang masuk.</div>' +
      '<div class="kl-seksi-h">Peninjau pendaftaran</div>' +
      '<p class="kl-cb-hint">Merekalah yang menerima atau menolak pendaftaran. Selalu ada minimal satu.</p>' +
      list + tambah +
      '<div class="kl-upsell">' +
        '<div class="kl-upsell-h">Butuh susunan pengurus?</div>' +
        '<p>Ketua, wakil ketua, sekretaris, bendahara — dengan menu kepengurusan sendiri untuk mengangkat anggota jadi pengurus dan mengatur jabatan. Ada di paket <b>Advance</b>.</p>' +
        '<button type="button" class="btn outline sm" data-mode="advance">' + (D.sekAktif ? 'Buka Advance' : 'Lihat Advance') + '</button>' +
      '</div>';
  }

  /* ---------- panel: riwayat keputusan ---------- */
  function gambarRiwayat(){
    el('klRiwayatN').textContent = D.riwayat.length;
    const wadah = el('klRiwayatList');
    if(!D.riwayat.length){
      wadah.innerHTML =
        '<div class="empty">' +
          '<div class="empty-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>' +
          '<h3>Belum ada keputusan</h3>' +
          '<p>Setiap pendaftaran yang kamu atau pengurus lain terima atau tolak tercatat di sini, supaya semua pengurus tahu siapa yang sudah ditinjau.</p>' +
        '</div>';
      return;
    }
    wadah.innerHTML = D.riwayat.map(function(r, i){
      const av = '<div class="av ' + 'abc'[i % 3] + '" aria-hidden="true">' + inisial(r.nama) + '</div>';
      const diterima = r.status === 'diterima';
      const oleh = r.otomatis ? 'diterima otomatis' : 'oleh ' + (r.oleh === D.aku ? 'kamu' : lolos(r.oleh.split(' ')[0]));
      /* nomor anggota dibaca dari data anggota (bukan snapshot) supaya kalau
         diperbaiki di tab Anggota, riwayatnya ikut betul */
      const mem = D.mem[r.nama];
      const idAtas = (diterima && pakaiNomor() && mem && mem.id) ? '<div class="mem-id">' + lolos(mem.id) + '</div>' : '';
      return '<div class="kl-riwayat">' + av +
          '<div class="t">' + idAtas + '<div class="kl-riwayat-nm">' + lolos(r.nama) + '</div>' +
          '<div class="kl-riwayat-sub">' + lolos(r.kerja) + ' · ' + lolos(r.kota) + ' · ' + oleh + ' · ' + lolos(r.waktu) + '</div>' +
          (r.catatan ? '<div class="kl-riwayat-catatan">“' + lolos(r.catatan) + '”</div>' : '') + '</div>' +
          '<span class="kl-hasil ' + (diterima ? 'diterima' : 'ditolak') + '">' + (diterima ? IKON_CEK : IKON_X) + (diterima ? 'Diterima' : 'Ditolak') + '</span>' +
        '</div>';
    }).join('');
  }

  /* ---------- ganti tab ---------- */
  /* tab Advance (data-sek) hanya ada di tampilan Advance — di Esensial, yang
     tersisa dari tab itu jatuh kembali ke Permintaan gabung */
  function pilihTab(nama){
    const tombol = scr.querySelector('.kl-tab[data-tab="' + nama + '"]');
    if(tombol && tombol.hasAttribute('data-sek') && D.mode !== 'advance') nama = 'minta';
    D.tab = nama;
    const tampil = nama;
    scr.querySelectorAll('.kl-tab').forEach(function(b){
      const on = b.dataset.tab === nama;
      b.classList.toggle('on', on);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    scr.querySelectorAll('.kl-panel').forEach(function(p){ p.hidden = p.dataset.panel !== tampil; });
    /* sub-menu: grup yang memuat tab aktif terbuka, induknya ditandai */
    scr.querySelectorAll('.kl-subnav').forEach(function(g){
      const aktif = !!g.querySelector('.kl-tab.on');
      const induk = scr.querySelector('.kl-induk[data-induk="' + g.dataset.grup + '"]');
      g.classList.toggle('buka', aktif);
      if(induk){
        induk.classList.toggle('aktif', aktif);
        induk.setAttribute('aria-expanded', g.classList.contains('buka') ? 'true' : 'false');
      }
    });
  }
  /* sub-menu pertama yang terlihat di paket yang sedang dipakai */
  function subPertama(grup){
    const t = [].filter.call(scr.querySelectorAll('.kl-subnav[data-grup="' + grup + '"] .kl-tab'), function(b){
      return !b.hasAttribute('data-sek') || D.mode === 'advance';
    })[0];
    return t ? t.dataset.tab : 'minta';
  }

  function gambar(){
    gambarKepala();
    gambarMinta();
    gambarAnggota();
    gambarPengurus();
    gambarRiwayat();
    D.onGambar.forEach(function(f){ f(); });
    pilihTab(D.tab);
  }

  /* ---------- menerima / menolak — satu jalur, dipakai kartu permintaan dan
     penerimaan massal di Sekretariat ---------- */
  function terima(r, o){
    o = o || {};
    let id = '';
    if(pakaiNomor()){
      D.urut++;
      id = (D.nomorMode === 'manual' && o.id) ? o.id : fmtId(D.urut);
    }
    D.minta = D.minta.filter(function(x){ return x.id !== r.id; });
    /* tags jawaban ikut disimpan supaya muncul di daftar anggota halaman pemilik */
    D.mem[r.nama] = { nama: r.nama, kerja: r.kerja, kota: r.kota, panggil: r.panggil, tags: (r.tags || []).slice(), id: id };
    D.anggotaBiasa.push(r.nama);
    D.riwayat.unshift({ nama: r.nama, panggil: r.panggil, kerja: r.kerja, kota: r.kota, status: 'diterima', oleh: D.aku, otomatis: !!o.otomatis, waktu: 'baru saja', catatan: o.catatan || '' });
    return id;
  }
  function tolakR(r, catatan){
    D.minta = D.minta.filter(function(x){ return x.id !== r.id; });
    D.riwayat.unshift({ nama: r.nama, panggil: r.panggil, kerja: r.kerja, kota: r.kota, status: 'ditolak', oleh: D.aku, waktu: 'baru saja', catatan: catatan || '' });
  }
  D.terima = terima;
  D.gambar = function(){ gambar(); };
  D.pilihTab = pilihTab;
  D.jumlahAnggota = jumlahAnggota;
  D.inisial = inisial;
  D.lolos = lolos;
  D.akuPeninjau = akuPeninjau;

  /* membangun keadaan tanpa berpindah layar — dipakai halaman komunitas versi
     pemilik supaya daftar anggota & pengurusnya sudah ada saat halaman dibuka */
  window.KolavoSiapkanDashboard = function(){ return bangun(); };

  /* dipanggil dari halaman komunitas versi pemilik (tombol "Dashboard pengurus")
     dan dari tombol di layar buat. Argumen tab opsional: 'minta' langsung ke
     panel permintaan (dipakai notifikasi "N orang menunggu"). */
  window.KolavoBukaDashboard = function(tab){
    if(!bangun()){
      if(window.KolavoToast) window.KolavoToast('Bikin dulu halaman komunitasmu.');
      window.KolavoKe('scrBuat');
      return;
    }
    if(tab) D.tab = tab;
    gambar();
    window.KolavoKe('scrKelola');
  };

  const toast = function(t){ if(window.KolavoToast) window.KolavoToast(t); };

  /* pemicu dari luar layar ini (halaman komunitas pemilik, layar buat).
     Ditaruh di document karena elemennya bukan bagian scrKelola. Nilai
     atribut, kalau ada, jadi tab awal. */
  document.addEventListener('click', function(e){
    const b = e.target.closest('[data-dashboard]');
    if(b){ e.preventDefault(); window.KolavoBukaDashboard(b.getAttribute('data-dashboard') || null); }
  });
  document.addEventListener('keydown', function(e){
    if(e.key !== 'Enter' && e.key !== ' ') return;
    const b = e.target.closest && e.target.closest('[data-dashboard]');
    if(b){ e.preventDefault(); window.KolavoBukaDashboard(b.getAttribute('data-dashboard') || null); }
  });

  /* ---------- aksi ---------- */
  scr.addEventListener('click', function(e){
    /* induk: di Esensial langsung ke sub-menu pertama; di kolom samping Advance
       membuka-tutup grupnya; kalau belum ada yang aktif di dalamnya, memilih yang pertama */
    const induk = e.target.closest('.kl-induk');
    if(induk){
      const g = scr.querySelector('.kl-subnav[data-grup="' + induk.dataset.induk + '"]');
      if(D.mode === 'advance' && g && g.querySelector('.kl-tab.on')){
        g.classList.toggle('buka');
        induk.setAttribute('aria-expanded', g.classList.contains('buka') ? 'true' : 'false');
        return;
      }
      pilihTab(subPertama(induk.dataset.induk));
      return;
    }
    const tab = e.target.closest('.kl-tab');
    if(tab){ pilihTab(tab.dataset.tab); return; }

    /* approval: setujui / tolak */
    const setuju = e.target.closest('[data-setuju]');
    if(setuju){
      const r = D.minta.filter(function(x){ return x.id === setuju.dataset.setuju; })[0];
      if(!r) return;
      const kartu = setuju.closest('.kl-req');
      /* nomor anggota ditetapkan saat diterima: otomatis ikut urutan, atau
         diambil dari kolom manual yang diisi peninjau */
      const f = kartu && kartu.querySelector('[data-idinput]');
      const id = terima(r, { catatan: bacaCatatan(kartu), id: f ? f.value.trim() : '' });
      gambar();
      toast(r.panggil + ' disetujui.' + (id ? ' Nomor anggota ' + id + '.' : ' Daftar anggota kebuka buat dia.'));
      return;
    }
    const tolak = e.target.closest('[data-tolak]');
    if(tolak){
      const r = D.minta.filter(function(x){ return x.id === tolak.dataset.tolak; })[0];
      if(!r) return;
      tolakR(r, bacaCatatan(tolak.closest('.kl-req')));
      gambar();
      toast('Permintaan ' + r.panggil + ' ditolak.');
      return;
    }

    /* nomor anggota: buka / simpan / batal edit (auto maupun manual bisa diperbaiki) */
    const idubah = e.target.closest('[data-idubah]');
    if(idubah){ D.idUbahFor = idubah.dataset.idubah; D.angkatFor = null; gambarAnggota(); return; }
    if(e.target.closest('[data-idubah-batal]')){ D.idUbahFor = null; gambarAnggota(); return; }
    const idok = e.target.closest('[data-idubah-ok]');
    if(idok){
      const nama = idok.dataset.idubahOk;
      const f = el('klIdSel');
      const nilai = f ? f.value.trim() : '';
      if(D.mem[nama]) D.mem[nama].id = nilai;
      D.idUbahFor = null;
      gambar();
      toast('Nomor anggota ' + (nama === D.aku ? 'kamu' : nama.split(' ')[0]) + (nilai ? ' jadi ' + nilai : ' dikosongkan') + '.');
      return;
    }

    /* kepengurusan: buka pemilih jabatan */
    const angkat = e.target.closest('[data-angkat]');
    if(angkat){ D.angkatFor = angkat.dataset.angkat; D.idUbahFor = null; gambarAnggota(); return; }
    if(e.target.closest('[data-angkat-batal]')){ D.angkatFor = null; gambarAnggota(); return; }
    const ok = e.target.closest('[data-angkat-ok]');
    if(ok){
      const nama = ok.dataset.angkatOk;
      const sel = el('klJabatanSel');
      const jabatan = sel ? sel.value : 'Pengurus';
      D.anggotaBiasa = D.anggotaBiasa.filter(function(n){ return n !== nama; });
      D.pengurus.push({ nama: nama, jabatan: jabatan });
      D.angkatFor = null;
      gambar();
      toast(nama.split(' ')[0] + ' sekarang ' + jabatan + '. Dia bisa ikut mengurus komunitas.');
      return;
    }

    /* tambahkan seorang pengurus jadi peninjau (boleh banyak sekaligus) */
    const tambah = e.target.closest('[data-peninjau-on]');
    if(tambah){
      const nama = tambah.dataset.peninjauOn;
      if(!adaPeninjau(nama)) D.peninjau.push(nama);
      gambar();
      toast((nama === D.aku ? 'Kamu' : nama.split(' ')[0]) + ' sekarang ikut meninjau pendaftaran.');
      return;
    }

    /* Esensial: tunjuk anggota jadi peninjau lewat dropdown */
    const padd = e.target.closest('[data-peninjau-add]');
    if(padd){
      const sel = el('klPeninjauSel');
      const nama = sel ? sel.value : '';
      if(nama && !adaPeninjau(nama)) D.peninjau.push(nama);
      gambar();
      if(nama) toast((nama === D.aku ? 'Kamu' : nama.split(' ')[0]) + ' sekarang ikut meninjau pendaftaran.');
      return;
    }

    /* lepas seorang pengurus dari peninjau — selalu sisakan minimal satu */
    const lepas = e.target.closest('[data-peninjau-off]');
    if(lepas){
      const nama = lepas.dataset.peninjauOff;
      if(D.peninjau.length <= 1){ toast('Harus ada minimal satu peninjau. Tambahkan orang lain dulu.'); return; }
      D.peninjau = D.peninjau.filter(function(n){ return n !== nama; });
      gambar();
      toast((nama === D.aku ? 'Kamu' : nama.split(' ')[0]) + ' tidak lagi meninjau pendaftaran.');
      return;
    }

    /* kepengurusan: ubah jabatan (termasuk jabatan pembuat sendiri) */
    const ubah = e.target.closest('[data-ubah]');
    if(ubah){ D.ubahFor = ubah.dataset.ubah; D.angkatFor = null; gambarPengurus(); return; }
    if(e.target.closest('[data-ubah-batal]')){ D.ubahFor = null; gambarPengurus(); return; }
    const ubahOk = e.target.closest('[data-ubah-ok]');
    if(ubahOk){
      const nama = ubahOk.dataset.ubahOk;
      const sel = el('klUbahSel');
      const jabatan = sel ? sel.value : 'Pengurus';
      const p = D.pengurus.filter(function(x){ return x.nama === nama; })[0];
      if(p) p.jabatan = jabatan;
      D.ubahFor = null;
      gambar();
      toast((nama === D.aku ? 'Jabatanmu sekarang ' : nama.split(' ')[0] + ' sekarang ') + jabatan + '.');
      return;
    }

    /* copot dari kepengurusan */
    const copot = e.target.closest('[data-copot]');
    if(copot){
      const nama = copot.dataset.copot;
      if(adaPeninjau(nama) && D.peninjau.length <= 1){ toast('Dia satu-satunya peninjau. Tambah peninjau lain dulu sebelum mencopotnya.'); return; }
      D.peninjau = D.peninjau.filter(function(n){ return n !== nama; });
      D.pengurus = D.pengurus.filter(function(p){ return p.nama !== nama; });
      if(D.mem[nama]) D.anggotaBiasa.push(nama);
      gambar();
      toast(nama.split(' ')[0] + ' dikembalikan jadi anggota biasa.');
      return;
    }
  });
})();
</script>
