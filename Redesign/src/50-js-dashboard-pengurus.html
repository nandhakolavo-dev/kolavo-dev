<script>
/* ============================================================
   Dashboard pengurus (scrKelola).
   Sisi lain dari layar komunitas: di sana penggunanya calon anggota yang
   minta gabung; di sini dia pengurus komunitas yang baru dibuatnya sendiri,
   dan yang dikerjakannya persis tiga hal yang belum ada padanannya di produk:

     1. Menyetujui pendaftaran   — approval yang selama ini disimulasikan
        tombol demo, di sini jadi tindakan sungguhan di panel Permintaan.
     2. Mengangkat kepengurusan  — anggota biasa diberi jabatan, jadi pengurus.
     3. Memindahkan hak setuju   — satu orang memegang "peninjau pendaftaran",
        dan haknya bisa dipindahkan ke pengurus lain. Begitu dipindah, panel
        Permintaan di sisi pengurus lama terkunci — supaya pemindahan itu
        terasa nyata, bukan sekadar label.

   Datanya tumbuh saat prototipe dipakai (seperti keanggotaan pengguna di
   layar komunitas), jadi tanpa penyimpanan — muat ulang mengulang dari awal.
   ============================================================ */
(function(){
  const el = function(id){ return document.getElementById(id); };
  const scr = el('scrKelola');
  if(!scr) return;

  const JABATAN = ['Ketua', 'Wakil Ketua', 'Sekretaris', 'Bendahara', 'Humas', 'Pengurus'];
  /* jabatan bawaan; yang ditambah pengurus lewat "+ Jabatan kustom" masuk ke
     JABATAN yang sama (D.jabatan) dan dikembalikan ke ini saat komunitas lain dibangun */
  const JABATAN_AWAL = JABATAN.slice();

  /* pendaftar contoh. Sengaja bukan salah satu dari empat wajah ber-foto AI —
     pendaftar pakai inisial, jadi tidak ada foto orang yang dipakai tanpa izin */
  /* hari = umur permintaan ("yang paling lama menunggu"). Tiga yang terakhir
     ditambahkan supaya antreannya terasa menumpuk, seperti keluhan pengurus di
     laporan feedback 7 Agustus 2026 ("kewalahan approve satu-satu"). */
  const SEED = [
    { nama: 'Putri Maharani',  panggil: 'Putri', full: 'Putri Maharani Lestari', jk: 'Perempuan', kerja: 'Guru SD',         kota: 'Bekasi',        wa: '0812-••••-4417', email: 'putri••••@gmail.com', lengkap: true,  waktu: '2 hari lalu', hari: 2, tahun: 2014, teks: ['Diajak teman seangkatan', 'Ingin ikut kegiatan alumni'], alasan: 'Saya ingin ikut kegiatan mengajar sukarela yang sering diadakan alumni. Sebagai guru, rasanya pas kalau bisa berbagi ke adik-adik tingkat.' },
    { nama: 'Andi Firmansyah', panggil: 'Andi',  full: 'Andi Firmansyah',        jk: 'Laki-laki', kerja: 'Karyawan swasta', kota: 'Jakarta Timur', wa: '0813-••••-2210', email: 'andi.f••••@gmail.com', lengkap: true,  waktu: 'kemarin',     hari: 1, tahun: 2010, teks: ['Ketemu di grup WhatsApp', 'Cari koneksi seprofesi'], alasan: 'Cari koneksi seprofesi. Saya lagi menimbang pindah kerja ke bidang logistik, siapa tahu ada alumni yang bisa kasih gambaran dunia kerjanya.' },
    { nama: 'Sinta Dewi',      panggil: 'Sinta', full: 'Sinta Dewi Anggraini',   jk: 'Perempuan', kerja: 'Wiraswasta',      kota: 'Depok',         wa: '0857-••••-3390', email: 'sinta••••@gmail.com',  lengkap: false, kurang: ['Pendidikan', 'Yang dicari'], waktu: '3 jam lalu',  hari: 0, tahun: 2016, teks: ['Nemu halaman ini di Kolavo', 'Mau kenal alumni lain'], alasan: 'Mau kenal alumni lain, sekalian mengenalkan usaha katering saya. Kalau ada acara komunitas, saya siap bantu urusan konsumsi.' },
    { nama: 'Rina Kartika',    panggil: 'Rina',  full: 'Rina Kartika Sari',      jk: 'Perempuan', kerja: 'Perawat',         kota: 'Jakarta Utara', wa: '0821-••••-7702', email: 'rinaks••••@gmail.com', lengkap: true,  waktu: '5 hari lalu', hari: 5, tahun: 2012, teks: ['Diajak ketua angkatan', 'Mau bantu kegiatan sosial'], alasan: 'Diajak ketua angkatan untuk bantu penggalangan dana beasiswa. Dulu saya sendiri terbantu beasiswa alumni, sekarang giliran saya membalas.' },
    { nama: 'Bayu Setiawan',   panggil: 'Bayu',  full: 'Bayu Setiawan',          jk: 'Laki-laki', kerja: 'Teknisi jaringan', kota: 'Bekasi',       wa: '0838-••••-1185', email: 'bayu.s••••@gmail.com', lengkap: true,  waktu: '8 hari lalu', hari: 8, tahun: 2010, teks: ['Dari grup WhatsApp angkatan', 'Cari info lowongan'], alasan: 'Info lowongan.' },
    { nama: 'Galih Pramudya',  panggil: 'Galih', full: 'Galih Pramudya',         jk: 'Laki-laki', kerja: 'Desainer grafis', kota: 'Tangerang',     wa: '0877-••••-5543', email: 'galihp••••@gmail.com', lengkap: false, kurang: ['Foto profil', 'Pendidikan', 'Kontribusi'], waktu: '6 hari lalu', hari: 6, tahun: 2015, teks: ['Lihat unggahan di Instagram', 'Ingin ikut reuni'], alasan: 'Kangen teman-teman lama. Lihat foto reuni tahun lalu di Instagram dan menyesal tidak ikut, jadi tahun ini tidak mau ketinggalan lagi.' },
    { nama: 'Dimas Aryo',      panggil: 'Dimas', full: 'Dimas Aryo Nugroho',     jk: 'Laki-laki', kerja: 'Mahasiswa S2',    kota: 'Bandung',       wa: '0896-••••-2051', email: 'dimasa••••@gmail.com', lengkap: true,  waktu: '4 hari lalu', hari: 4, tahun: 2016, teks: ['Disarankan dosen pembimbing', 'Cari narasumber riset'], alasan: 'Saya sedang riset tentang UMKM di Jawa Barat dan butuh narasumber. Berharap bisa belajar langsung dari alumni yang sudah menjalankan usaha.' },
    { nama: 'Yoga Saputra',    panggil: 'Yoga',  full: 'Yoga Saputra',           jk: 'Laki-laki', kerja: 'PNS',             kota: 'Bogor',         wa: '0819-••••-6634', email: 'yogas••••@gmail.com',  lengkap: false, kurang: ['Media sosial', 'Kontribusi', 'Yang dicari'], waktu: '7 hari lalu', hari: 7, tahun: 2011, teks: ['Dari teman', 'Ikut saja'], alasan: 'ikut aja' }
  ];

  const D = {
    built: false, kom: null, aku: 'Kamu', akuKerja: '', akuKota: '',
    mem: {}, minta: [], anggotaBiasa: [], pengurus: [], peninjau: 'Kamu',
    tab: 'minta', angkatFor: null, ubahFor: null, riwayat: [],
    /* daftar jabatan — satu sumber untuk pemilih jabatan dan tabel Siapa boleh apa */
    jabatan: JABATAN,
    /* penomoran anggota */
    nomorMode: 'manual', kode: 'KOMU', tahun: new Date().getFullYear(), urut: 0, idUbahFor: null
  };
  window.KolavoDashboard = D;
  /* kait buat modul yang menempel ke dashboard (50-js-sekretariat) */
  D.onBangun = [];
  /* keadaan per komunitas (dashboard >1 komunitas): modul lain menitipkan keadaannya
     lewat onSimpan (kembalikan salinan) & onPulih (terima salinan itu lagi) */
  D.onSimpan = []; D.onPulih = [];
  /* dipanggil (lama, baru) saat jabatan diganti nama; baru = null kalau dihapus */
  D.onJabatanGanti = [];
  D.onGambar = [];

  function inisial(n){
    return n.trim().split(/\s+/).slice(0, 2).map(function(k){ return k[0]; }).join('').toUpperCase();
  }
  function lolos(s){
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function nilaiProfil(id){ const e = el(id); return e ? (e.value || '').trim() : ''; }

  /* tag jawaban pendaftar, disusun dari pertanyaan yang tadi dirancang pengurus —
     nama panggilan tidak jadi tag (itu cara menyapa, bukan cara mengenali) */
  /* jawaban pendaftar disusun dari pertanyaan yang dirancang pengurus saat buat
     halaman (kom.tanya) — bukan field tetap. Nama panggilan tidak diulang di sini
     karena sudah tampil di sebelah nama. */
  function jawabanFor(s){
    const tanya = (D.kom && D.kom.tanya) || [];
    const teks = Array.isArray(s.teks) ? s.teks : (s.teks ? [s.teks] : []);
    let ti = 0;
    /* pertanyaan soal alasan bergabung dapat jawaban panjang yang sengaja beragam
       (kontribusi, karier, usaha, nostalgia, riset, jawaban asal) supaya bedanya
       terlihat di Tinjau jawaban dan Kelompokkan */
    const soalAlasan = /gabung|alasan|kenapa|mengapa|motivasi/i;
    return tanya.filter(function(t){ return t.id !== 'nickname'; }).map(function(t){
      const nilai = t.tipe === 'tahun' ? String(s.tahun)
        : (s.alasan && soalAlasan.test((t.judul || '') + ' ' + (t.tanya || ''))) ? s.alasan
        : (teks[ti++] || '—');
      return { id: t.id, judul: t.judul || 'Pertanyaan', nilai: nilai };
    });
  }

  /* Pertanyaan pengurus yang BERLAKU sekarang (tanpa nama panggilan). Satu pintu
     untuk kartu peninjau, Tinjau jawaban, dan pemilih sumbu persebaran. */
  function pertanyaanPengurus(){
    return ((D.kom && D.kom.tanya) || []).filter(function(t){ return t.id !== 'nickname'; });
  }
  window.KolavoPertanyaanPengurus = pertanyaanPengurus;

  /* Jawaban disimpan per id pertanyaan (r.jwb), lalu dirakit ulang dari
     pertanyaanPengurus() tiap kali dibaca — pertanyaan diganti, dihapus, atau
     diurutkan ulang di layar Buat → kartu peninjau ikut. Pertanyaan yang ditambah
     setelah orangnya mendaftar belum punya jawaban → '—' (kosong: true). */
  function jawabPerId(s){
    const m = {};
    jawabanFor(s).forEach(function(j){ m[j.id] = j.nilai; });
    return m;
  }
  function denganJawaban(r){
    Object.defineProperty(r, 'jawaban', { enumerable: true, get: function(){
      return pertanyaanPengurus().map(function(t){
        const ada = Object.prototype.hasOwnProperty.call(r.jwb, t.id);
        return { id: t.id, judul: t.judul || 'Pertanyaan', nilai: ada ? r.jwb[t.id] : '—', kosong: !ada };
      });
    }});
    /* versi ringkas (tag) untuk daftar anggota */
    Object.defineProperty(r, 'tags', { enumerable: true, get: function(){
      return r.jawaban.filter(function(j){ return !j.kosong; }).map(function(j){
        return /^\d{4}$/.test(j.nilai) ? j.judul + ' ' + j.nilai : j.nilai;
      });
    }});
    return r;
  }

  /* akun media sosial pendaftar — dari profil Kolavo (bentuk sama dengan
     KolavoSosmed() di lengkapi profil). Bayu dan Yoga sengaja tanpa akun. */
  const SOSMED_SEED = {
    'Putri Maharani':  [{ platform: 'Instagram', akun: '@putri.maharani' }, { platform: 'LinkedIn', akun: 'linkedin.com/in/putrimaharani' }],
    'Andi Firmansyah': [{ platform: 'LinkedIn', akun: 'linkedin.com/in/andifirmansyah' }],
    'Sinta Dewi':      [{ platform: 'Instagram', akun: '@sinta.kue' }, { platform: 'TikTok', akun: '@sintabakery' }],
    'Rina Kartika':    [{ platform: 'Instagram', akun: '@rinaks' }],
    'Galih Pramudya':  [{ platform: 'Instagram', akun: '@galihpramudya' }],
    'Dimas Aryo':      [{ platform: 'LinkedIn', akun: 'linkedin.com/in/dimas-aryo' }, { platform: 'X (Twitter)', akun: '@dimasriset' }]
  };
  const SOSMED_URL = { 'Instagram': 'https://instagram.com/', 'TikTok': 'https://tiktok.com/@', 'X (Twitter)': 'https://x.com/', 'YouTube': 'https://youtube.com/@' };
  function sosmedHtml(daftar){
    return '<span class="kl-sosmed">' + daftar.map(function(s){
      const url = SOSMED_URL[s.platform]
        ? SOSMED_URL[s.platform] + s.akun.replace(/^@/, '')
        : 'https://' + s.akun.replace(/^https?:\/\//, '');
      return '<a class="kl-sosmed-i" href="' + lolos(url) + '" target="_blank" rel="noopener noreferrer"><b>' + lolos(s.platform) + '</b>' + lolos(s.akun) + '</a>';
    }).join('') + '</span>';
  }

  const IKON_CEK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg>';
  const IKON_X   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>';
  const IKON_MATA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="2.6"/></svg>';
  const IKON_KUNCI = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>';
  const IKON_CEK_KECIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg>';

  /* ---------- membangun dari komunitas yang baru dibuat ---------- */
  /* ---------- konteks per komunitas ----------
     Mesin ini dulu hanya memegang komunitas buatan sendiri. Kini pengguna bisa
     mengelola beberapa (buatan sendiri + yang mengangkatnya jadi pengurus): keadaan
     komunitas yang ditinggal disimpan, lalu dipulihkan saat dibuka lagi. */
  const KONTEKS = {};
  function simpanKonteks(){
    if(!D.built || !D.kom) return;
    const d = {};
    Object.keys(D).forEach(function(k){ if(typeof D[k] !== 'function' && !/^on[A-Z]/.test(k)) d[k] = D[k]; });
    KONTEKS[D.kom.slug] = { kom: D.kom, d: d, jab: JABATAN.slice(), lain: D.onSimpan.map(function(f){ return f(); }) };
  }
  function pulihKonteks(k){
    Object.assign(D, k.d);
    JABATAN.length = 0; Array.prototype.push.apply(JABATAN, k.jab);
    D.onPulih.forEach(function(f, i){ f(k.lain[i]); });
  }

  function bangun(komMinta){
    const kom = komMinta || (window.KolavoApp || {}).dibuat;
    if(!kom) return false;

    /* dibangun ulang tiap komunitas baru; kalau komunitas sama, keadaan dijaga */
    if(D.built && D.kom && D.kom.slug === kom.slug){ D.kom = kom; return true; }
    simpanKonteks();
    /* komunitas yang pernah dibuka: pulihkan (objek komunitas yang sama — komunitas
       buatan yang dihapus lalu dibuat ulang dengan slug sama tetap mulai dari nol) */
    const lama = KONTEKS[kom.slug];
    if(lama && lama.kom === kom){ pulihKonteks(lama); return true; }

    D.kom = kom;
    D.aku = nilaiProfil('pfNm') || (el('pfNm') && el('pfNm').textContent.trim()) || 'Kamu';
    D.akuKerja = nilaiProfil('kerja') || 'Pengurus';
    D.akuKota = nilaiProfil('kota') || kom.kota || '';
    /* penomoran anggota: mode + kode awalan ditetapkan saat halaman dibuat */
    D.nomorMode = kom.nomorMode || 'manual';
    D.kode = (kom.kode || (kom.slug || '').toUpperCase().replace(/[^0-9A-Z]/g, '') || 'KOMU');
    D.tahun = new Date().getFullYear();
    D.urut = 0;
    D.idUbahFor = null;

    D.mem = {};
    D.mem[D.aku] = { nama: D.aku, kerja: D.akuKerja, kota: D.akuKota, panggil: 'Kamu', aku: true };
    /* pembuat halaman anggota pertama — dapat nomor 001 kalau penomoran otomatis */
    if(D.nomorMode === 'auto'){ D.urut = 1; D.mem[D.aku].id = fmtId(1); }
    /* pembuat halaman belum tentu ketua — defaultnya Community Creator
       sampai diberi jabatan sungguhan lewat menu Struktur Kepengurusan */
    D.pengurus = [{ nama: D.aku, jabatan: 'Community Creator', aku: true }];
    JABATAN.length = 0; Array.prototype.push.apply(JABATAN, JABATAN_AWAL);
    D.jabatanTeks = ''; D.jabEdit = null; D.jabEditTeks = ''; D.jabHapus = null;
    /* peninjau pendaftaran boleh lebih dari satu — daftar nama, bukan satu orang.
       Awalnya cuma pembuatnya; pengurus lain bisa ditambahkan kapan saja. */
    D.peninjau = [D.aku];
    D.anggotaBiasa = [];
    /* contoh demo: komunitas baru langsung berisi 18 anggota (+ pembuatnya = 19),
       supaya batas 20 anggota Esensial kelihatan setelah satu pendaftar diterima */
    ANGGOTA_CONTOH.forEach(function(a, i){
      const id = D.nomorMode === 'auto' ? fmtId(++D.urut) : '';
      /* isian yang sama dengan profil acuan: Lengkapi Profil (beri, cari) + formulir gabung (alasan) */
      D.mem[a[0]] = { nama: a[0], full: a[0], panggil: a[0].split(' ')[0], kerja: a[1], kota: a[2], tahun: a[3], tags: [], id: id,
        beri: a[4], cari: CARI_CONTOH[i % CARI_CONTOH.length], alasan: GABUNG_CONTOH[i % GABUNG_CONTOH.length],
        sejak: bulanLalu(2 + Math.floor(i / 3)) };
      D.anggotaBiasa.push(a[0]);
    });
    D.minta = SEED.map(function(s, i){
      return denganJawaban({
        id: 'r' + i, nama: s.nama, panggil: s.panggil, full: s.full, jk: s.jk,
        kerja: s.kerja, kota: s.kota, wa: s.wa, email: s.email, lengkap: s.lengkap, kurang: (s.kurang || []).slice(),
        waktu: s.waktu, hari: s.hari, tahun: s.tahun,
        jwb: jawabPerId(s), sosmed: SOSMED_SEED[s.nama] || []
      });
    });
    D.tab = 'minta';
    D.angkatFor = null;
    D.ubahFor = null; D.kenalFor = null;
    /* dua keputusan contoh, supaya kotak catatan keputusan di Riwayat langsung terlihat */
    D.riwayat = [
      { nama: 'Bima Prasetyo', panggil: 'Bima', kerja: 'Arsitek', kota: 'Surabaya', status: 'diterima', oleh: D.aku, waktu: '2 hari lalu',
        catatan: 'Alumni angkatan 2015, dikenal langsung oleh Sekretaris. Jawaban pendaftarannya jelas soal ingin bantu program mentoring.' },
      { nama: 'Andre Wijaya', panggil: 'Andre', kerja: 'Sales properti', kota: 'Jakarta Barat', status: 'ditolak', oleh: D.aku, waktu: '3 hari lalu',
        catatan: 'Bukan alumni, dan jawabannya menyebut ingin menawarkan produk ke anggota. Disarankan ikut acara terbuka dulu.' }
    ];
    /* tiap anggota contoh punya catatan keputusan — semua yang diterima wajib beralasan */
    const ALASAN_CONTOH = [
      'Alumni angkatan yang sama dengan Ketua, dikenal langsung oleh pengurus.',
      'Direkomendasikan anggota lain. Jawaban pendaftarannya lengkap dan jelas.',
      'Pernah ikut kegiatan bakti sosial komunitas tahun lalu.',
      'Rekan seprofesi pengurus, ingin aktif di program mentoring.',
      'Data angkatan cocok dengan arsip alumni.',
      'Pernah jadi panitia acara reuni, ingin bantu kegiatan berikutnya.'
    ];
    ANGGOTA_CONTOH.forEach(function(a, i){
      if(D.riwayat.some(function(r){ return r.nama === a[0]; })) return;
      D.riwayat.push({ nama: a[0], panggil: a[0].split(' ')[0], kerja: a[1], kota: a[2], status: 'diterima', oleh: D.aku,
        waktu: (2 + Math.floor(i / 3)) + ' minggu lalu', catatan: ALASAN_CONTOH[i % ALASAN_CONTOH.length] });
    });
    D.built = true;
    /* modul lain (Sekretariat) mengosongkan keadaannya sendiri di sini */
    D.onBangun.forEach(function(f){ f(); });
    if(kom.diangkat) terapkanDiangkat(kom);
    return true;
  }

  /* komunitas orang lain yang mengangkatmu jadi pengurus (contoh: IA SMAN 52).
     Bedanya dengan komunitas buatan sendiri: kamu bukan pembuat — jabatanmu dari
     Ketua, Advance sudah dilanggan Ketua, dan Tagihan/Akses pengurus tidak terbuka. */
  function terapkanDiangkat(kom){
    const lain = kom.pengurusLain || [];
    D.pengurus = lain.slice(0, 1).map(function(p){ return { nama: p.nama, jabatan: p.jabatan }; })
      .concat([{ nama: D.aku, jabatan: kom.jabatan || 'Pengurus', aku: true }])
      .concat(lain.slice(1).map(function(p){ return { nama: p.nama, jabatan: p.jabatan }; }));
    lain.concat(kom.anggota || []).forEach(function(o){ D.mem[o.nama] = { nama: o.nama, kerja: o.kerja || '', kota: o.kota || '' }; });
    D.anggotaBiasa = (kom.anggota || []).map(function(o){ return o.nama; });
    D.peninjau = lain.length ? [lain[0].nama, D.aku] : [D.aku];
    if(lain.length) D.riwayat[1].oleh = lain[0].nama;
    D.sekAktif = true;
    D.mode = 'advance';
    D.tab = 'dasbor';
  }

  /* nomor anggota: KODE-TAHUN MASUK-URUTAN (3 digit). urut = jumlah yang sudah
     masuk tahun itu; di prototipe satu tahun berjalan saja. */
  function fmtId(n){ return D.kode + '-' + D.tahun + '-' + String(n).padStart(3, '0'); }
  function idBerikut(){ return fmtId(D.urut + 1); }   /* nomor untuk yang diterima berikutnya */
  function pakaiNomor(){ return D.nomorMode !== 'off'; }

  function jumlahAnggota(){ return D.pengurus.length + D.anggotaBiasa.length; }
  /* Esensial (belum berlangganan) dibatasi 20 anggota dan 1 peninjau — lebih dari itu lewat Advance */
  const BATAS_ESENSIAL = 20;
  function esensialSaja(){ return !D.sekAktif; }
  function penuhEsensial(){ return esensialSaja() && jumlahAnggota() >= BATAS_ESENSIAL; }
  /* [nama, pekerjaan (pilihan Lengkapi), domisili, jawaban tahun, "bisa dibagikan"] */
  const ANGGOTA_CONTOH = [
    ['Bima Prasetyo', 'Arsitek', 'Surabaya', 2015, 'Bisa bantu desain tata letak venue kalau komunitas bikin acara.'],
    ['Dewi Lestari', 'Dokter', 'Bandung', 2012, 'Siap jadi narasumber kesehatan di acara alumni.'],
    ['Rizky Ramadhan', 'Software engineer', 'Jakarta Selatan', 2018, 'Bisa bantu bikin formulir atau situs kegiatan.'],
    ['Fitri Handayani', 'Akuntan', 'Bekasi', 2014, 'Bisa bantu rapikan laporan keuangan acara.'],

    ['Agus Setiawan', 'PNS', 'Jakarta Timur', 2009, 'Paham alur perizinan kegiatan di kelurahan.'],
    ['Rina Wulandari', 'Desainer grafis', 'Jakarta Barat', 2017, 'Bisa bantu bikin poster dan materi publikasi.'],
    ['Dimas Saputra', 'Konsultan', 'Jakarta Pusat', 2011, 'Bisa berbagi soal pajak untuk usaha kecil.'],
    ['Nurul Hidayah', 'Apoteker', 'Semarang', 2016, 'Bisa bantu sediakan kotak P3K untuk kegiatan.'],
    ['Teguh Santoso', 'Teknisi', 'Bekasi', 2008, 'Bisa bantu urusan listrik dan lampu acara.'],
    ['Indah Permata', 'Content creator', 'Jakarta Selatan', 2020, 'Bisa bantu urus media sosial komunitas.'],
    ['Wahyu Hidayat', 'Dosen', 'Bandung', 2007, 'Bisa jadi pembicara soal studi lanjut.'],
    ['Sari Rahmawati', 'Bidan', 'Tangerang Selatan', 2014, 'Bisa berbagi soal kesehatan ibu dan anak.'],
    ['Eko Purnomo', 'Wiraswasta', 'Malang', 2012, 'Bisa urus konsumsi acara dari usaha kuliner saya.'],
    ['Citra Anggraini', 'Karyawan swasta', 'Jakarta Utara', 2018, 'Bisa berbagi tips melamar kerja dan wawancara.']
  ];
  const CARI_CONTOH = ['Teman diskusi seprofesi.', 'Info lowongan dan peluang kolaborasi.', 'Kegiatan sosial yang rutin.',
    'Mentor untuk pengembangan karier.', 'Teman olahraga akhir pekan.', 'Relasi untuk usaha.'];
  const GABUNG_CONTOH = ['Ingin kenal lagi teman-teman seangkatan.', 'Mau ikut program mentoring adik kelas.',
    'Cari relasi seprofesi di komunitas ini.', 'Ingin bantu kegiatan sosial komunitas.',
    'Kangen kumpul dengan teman lama.', 'Ingin berbagi pengalaman kerja.'];
  const NAMA_BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
  /* "Anggota sejak" — bulan dan tahun diterima, n minggu lalu */
  function bulanLalu(minggu){
    const d = new Date(); d.setDate(d.getDate() - 7 * (minggu || 0));
    return NAMA_BULAN[d.getMonth()] + ' ' + d.getFullYear();
  }
  function modeAdvance(){ return D.mode === 'advance'; }
  function akuPeninjau(){ return D.peninjau.indexOf(D.aku) >= 0; }
  function adaPeninjau(nama){ return D.peninjau.indexOf(nama) >= 0; }
  function jabatanDari(nama){
    const p = D.pengurus.filter(function(x){ return x.nama === nama; })[0];
    return p ? p.jabatan : null;
  }
  /* nama peninjau selain diri sendiri, buat kalimat kunci di panel permintaan */
  function peninjauLain(){ return D.peninjau.filter(function(n){ return n !== D.aku; }); }
  function sebutNama(daftar){
    const p = daftar.map(function(n){ return n.split(' ')[0]; });
    if(p.length <= 1) return p[0] || '';
    if(p.length === 2) return p[0] + ' dan ' + p[1];
    return p.slice(0, -1).join(', ') + ', dan ' + p[p.length - 1];
  }
  D.jabatanAku = function(){ return jabatanDari(D.aku) || 'Pengurus'; };

  /* ---------- kepala halaman ---------- */
  function gambarKepala(){
    const kom = D.kom;
    const jk = el('klJalurKom');
    if(jk){
      jk.textContent = kom.nama;
      /* remah ke halaman komunitasnya: buatan sendiri vs komunitas yang mengangkatmu */
      jk.toggleAttribute('data-komunitas-dibuat', !kom.diangkat);
      if(kom.diangkat) jk.setAttribute('data-buka-diangkat', kom.kelas); else jk.removeAttribute('data-buka-diangkat');
    }
    scr.classList.toggle('kl-diangkat', !!kom.diangkat);
    el('klNm').textContent = kom.nama;
    const logo = el('klLogo');
    logo.textContent = kom.logo ? '' : (kom.inisial || inisial(kom.nama));
    logo.style.backgroundImage = kom.logo ? 'url("' + kom.logo + '")' : '';

    el('klMeta').innerHTML = '';
    [kom.bentuk, kom.kota, jumlahAnggota() + ' anggota'].filter(Boolean).forEach(function(v, i){
      if(i){ const t = document.createElement('span'); t.className = 'titik'; t.textContent = '·'; el('klMeta').appendChild(t); }
      const s = document.createElement('span'); s.textContent = v; el('klMeta').appendChild(s);
    });

    el('klRole').lastChild.textContent = 'Kamu ' + D.jabatanAku() + ' di sini';
    if(window.KolavoWarnai) window.KolavoWarnai(scr, kom.warna);
  }

  /* ---------- panel: permintaan gabung (approval) ---------- */
  function gambarMinta(){
    el('klMintaN').textContent = D.minta.length;

    const lock = el('klLock');
    if(akuPeninjau()){
      lock.hidden = true;
    } else {
      lock.hidden = false;
      const nm = D.peninjau.map(function(n){ return '<b>' + lolos(n) + '</b>'; }).join(', ');
      el('klLockTeks').innerHTML = 'Hak menyetujui pendaftaran dipegang ' + nm +
        '. Kamu masih bisa melihat yang mendaftar, tapi keputusannya ada di mereka. ' +
        'Tambahkan dirimu lagi lewat menu Struktur Kepengurusan kalau perlu.';
    }

    const wadah = el('klMintaList');
    if(!D.minta.length){
      wadah.innerHTML =
        '<div class="empty">' +
          '<div class="empty-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg></div>' +
          '<h3>Belum ada permintaan gabung</h3>' +
          '<p>Sebar lagi link halamanmu ke grup. Setiap yang mendaftar muncul di sini untuk kamu setujui.</p>' +
        '</div>';
      return;
    }

    const bisa = akuPeninjau();
    /* Esensial: meter kuota anggota; penuh = ajakan naik ke Advance di atas daftar */
    let batas = '';
    if(esensialSaja()){
      const n = jumlahAnggota(), penuh = n >= BATAS_ESENSIAL;
      batas = '<div class="kl-kuota' + (penuh ? ' penuh' : '') + '">' +
        '<div class="kl-kuota-t"><span><b>' + Math.min(n, BATAS_ESENSIAL) + ' dari ' + BATAS_ESENSIAL + '</b> anggota · paket Esensial</span>' +
          (penuh ? '' : '<span class="kl-kuota-sisa">sisa ' + (BATAS_ESENSIAL - n) + '</span>') + '</div>' +
        '<div class="kl-kuota-bar"><i style="width:' + Math.min(100, Math.round(n / BATAS_ESENSIAL * 100)) + '%"></i></div>' +
        (penuh
          ? '<div class="kl-kuota-ajak">' + IKON_KUNCI + '<p><b>Kuota Esensial sudah penuh.</b> ' + D.minta.length + ' pendaftar belum bisa diterima. Naik ke Advance untuk menampung hingga 1.000 anggota.</p>' +
              '<button type="button" class="btn sm" data-upgrade="anggota">Naik ke Advance</button></div>'
          : '') +
      '</div>';
    }
    wadah.innerHTML = batas + D.minta.map(function(r, i){
      const av = '<div class="av ' + 'abc'[i % 3] + '" aria-hidden="true">' + inisial(r.nama) + '</div>';

      /* Jawaban pertanyaan pendaftaran — pertanyaan yang disusun pengurus saat
         buat halaman. Ini sinyal utama buat memutuskan, jadi ditaruh menonjol. */
      const jawab = (r.jawaban && r.jawaban.length)
        ? '<div class="kl-req-jawab"><span class="kl-jawab-h">Jawaban pertanyaan pendaftaran</span>' +
            r.jawaban.map(function(j){
              /* jawaban panjang (mis. alasan bergabung) ditaruh di bawah pertanyaannya, rata kiri */
              return '<div class="kl-jawab-row' + (j.nilai.length > 40 ? ' panjang' : '') + '"><span class="kl-jawab-q">' + lolos(j.judul) + '</span>' +
                     (j.kosong
                       ? '<span class="kl-jawab-a kl-jawab-kosong" title="Pertanyaan ini ditambahkan setelah orangnya mendaftar">— <small>pertanyaan baru, belum dijawab</small></span>'
                       : '<span class="kl-jawab-a">' + lolos(j.nilai) + '</span>') + '</div>';
            }).join('') +
          '</div>'
        : '';

      /* data profil dari Kolavo — melekat ke orangnya, sama di komunitas mana pun */
      const info =
        '<div class="kl-req-info"><span class="kl-info-h">Data profil</span>' +
          baris2('WhatsApp', lolos(r.wa) + ' <span class="kl-verif">' + IKON_CEK_KECIL + 'terverifikasi</span>') +
          baris2('Email', lolos(r.email)) +
          (r.sosmed && r.sosmed.length ? baris2('Media sosial', sosmedHtml(r.sosmed)) : '') +
          baris2('Jenis kelamin', lolos(r.jk)) +
          baris2('Kelengkapan profil', kelengkapan(r)) +
        '</div>';

      /* nomor anggota: otomatis (pratinjau format) atau manual (isi/ubah saat menerima) */
      let nomor = '';
      if(pakaiNomor()){
        nomor = '<div class="kl-req-nomor"><span class="kl-info-k">Nomor anggota</span>' +
          (D.nomorMode === 'auto'
            ? '<span class="kl-idbadge">' + lolos(D.kode + '-' + D.tahun + '-•••') + '</span><span class="kl-id-note">dibuat otomatis saat diterima</span>'
            : '<input class="inp kl-idfield" type="text" data-idinput value="' + lolos(idBerikut()) + '" placeholder="Nomor anggota" ' + (bisa ? '' : 'disabled') + '>') +
          '</div>';
      }

      const catatan = bisa
        ? '<div class="kl-req-catatan"><label class="kl-info-k" for="kat-' + r.id + '">Catatan keputusan<span class="kl-wajib" aria-hidden="true">*</span></label>' +
          '<input class="inp" id="kat-' + r.id + '" type="text" data-catatan maxlength="140" required aria-required="true" aria-describedby="katn-' + r.id + '" placeholder="Mis. alumni angkatan 2014, dikenal pengurus">' +
          '<p class="kl-req-catatan-note" id="katn-' + r.id + '">Tulis alasannya dulu, baru bisa setujui atau tolak. Catatan ini tersimpan di tab Anggota supaya pengurus lain paham.</p></div>'
        : '';

      const aksi = bisa
        ? '<div class="kl-req-aksi">' +
            '<button type="button" class="btn sm" data-setuju="' + r.id + '" disabled>' + IKON_CEK + 'Setujui</button>' +
            '<button type="button" class="btn sm tolak" data-tolak="' + r.id + '" disabled>' + IKON_X + 'Tolak</button>' +
          '</div>'
        : '<div class="kl-req-aksi"><span class="tag">Menunggu ditinjau ' + lolos(sebutNama(D.peninjau)) + '</span></div>';

      return '<div class="kl-req" data-req="' + r.id + '">' +
          '<div class="kl-req-top">' + av +
            '<div class="t"><div class="kl-req-nm">' + lolos(r.full || r.nama) +
              ' <span class="kl-req-panggil">“' + lolos(r.panggil) + '”</span></div>' +
            '<div class="kl-req-sub">' + lolos(r.kerja) + ' · ' + lolos(r.kota) + '</div></div>' +
            '<span class="kl-req-when">Minta gabung ' + lolos(r.waktu) + '</span>' +
          '</div>' +
          info + jawab + nomor + catatan + aksi +
        '</div>';
    }).join('');
  }

  /* kelengkapan profil pendaftar: isian Lengkapi Profil yang belum diisi disebut satu per satu,
     supaya peninjau tahu persis apa yang kurang (bukan cuma "sebagian belum diisi") */
  const ISIAN_PROFIL = ['Foto profil', 'Domisili', 'Pekerjaan', 'Pendidikan', 'Kontribusi', 'Yang dicari', 'Media sosial'];
  function kelengkapan(r){
    const kurang = r.lengkap ? [] : (r.kurang && r.kurang.length ? r.kurang : ['Sebagian isian']);
    const terisi = ISIAN_PROFIL.length - kurang.length;
    if(!kurang.length) return '<span class="kl-ok">' + IKON_CEK_KECIL + 'Profil lengkap · ' + ISIAN_PROFIL.length + ' dari ' + ISIAN_PROFIL.length + ' terisi</span>';
    return '<span class="kl-lengkap">' +
      '<span class="kl-lengkap-t"><span class="kl-warn">' + terisi + ' dari ' + ISIAN_PROFIL.length + ' terisi</span>' +
        '<span class="kl-lengkap-bar" aria-hidden="true"><i style="width:' + Math.round(terisi / ISIAN_PROFIL.length * 100) + '%"></i></span></span>' +
      '<span class="kl-kurang"><span class="kl-kurang-l">Belum diisi:</span>' +
        kurang.map(function(k){ return '<span class="kl-kurang-i">' + lolos(k) + '</span>'; }).join('') + '</span>' +
    '</span>';
  }

  /* satu baris "label : nilai" di kartu permintaan */
  function baris2(k, v){
    return '<div class="kl-info-row"><span class="kl-info-k">' + k + '</span><span class="kl-info-v">' + v + '</span></div>';
  }
  function bacaCatatan(kartu){
    const c = kartu && kartu.querySelector('[data-catatan]');
    return c ? c.value.trim() : '';
  }

  /* ---------- panel: anggota (angkat kepengurusan + nomor anggota) ---------- */
  function editNomor(nama, m){
    if(D.idUbahFor !== nama) return '';
    const siapa = (m.panggil && m.panggil !== 'Kamu') ? lolos(m.panggil) : (m.aku ? 'kamu' : lolos(nama.split(' ')[0]));
    return '<div class="kl-angkat">' +
        '<span class="kl-angkat-lbl">Nomor anggota ' + siapa + ':</span>' +
        '<input class="inp kl-idfield" id="klIdSel" type="text" value="' + lolos(m.id || idBerikut()) + '" placeholder="Nomor anggota">' +
        '<button type="button" class="btn sm" data-idubah-ok="' + lolos(nama) + '">Simpan</button>' +
        '<button type="button" class="btn outline sm" data-idubah-batal>Batal</button>' +
      '</div>';
  }
  function tombolNomor(nama, m){
    if(!pakaiNomor() || D.idUbahFor === nama) return '';
    return '<button type="button" class="btn outline sm" data-idubah="' + lolos(nama) + '">' + (m && m.id ? 'Ubah nomor' : 'Beri nomor') + '</button>';
  }

  /* tab Anggota: tampilan Diterima | Ditolak, daftar dipotong per 10 */
  const PER_HAL = 10;
  function pagerHtml(hal, kini, awal, tampil, total){
    if(hal <= 1) return '';
    let b = '<button type="button" class="pager-b" data-ahal="' + (kini - 1) + '"' + (kini ? '' : ' disabled') + ' aria-label="Halaman sebelumnya">‹</button>';
    for(let i = 0; i < hal; i++) b += '<button type="button" class="pager-b' + (i === kini ? ' on' : '') + '" data-ahal="' + i + '"' + (i === kini ? ' aria-current="page"' : '') + '>' + (i + 1) + '</button>';
    b += '<button type="button" class="pager-b" data-ahal="' + (kini + 1) + '"' + (kini < hal - 1 ? '' : ' disabled') + ' aria-label="Halaman berikutnya">›</button>';
    return '<nav class="pager" aria-label="Halaman anggota"><span class="pager-info">' + (awal + 1) + '–' + (awal + tampil) + ' dari ' + total + '</span><div class="pager-n">' + b + '</div></nav>';
  }
  function gambarAnggota(){
    el('klAnggotaN').textContent = jumlahAnggota();
    const ditolak = D.riwayat.filter(function(r){ return r.status !== 'diterima'; }).length;
    if(!ditolak) D.anggotaLihat = 'diterima';
    const lihat = D.anggotaLihat || 'diterima';
    const seg = ditolak
      ? '<div class="kl-seg" role="tablist" aria-label="Tampilkan">' +
          '<button type="button" role="tab" data-alihat="diterima" aria-selected="' + (lihat === 'diterima') + '">Diterima <span>' + jumlahAnggota() + '</span></button>' +
          '<button type="button" role="tab" data-alihat="ditolak" aria-selected="' + (lihat === 'ditolak') + '">Ditolak <span>' + ditolak + '</span></button>' +
        '</div>'
      : '';
    const wadah = el('klAnggotaList');
    wadah.hidden = lihat !== 'diterima';
    el('klRiwayatList').hidden = lihat !== 'ditolak';
    const potong = [];
    let html = '';

    /* pengurus dulu, dengan jabatannya — lalu anggota biasa yang bisa diangkat */
    D.pengurus.forEach(function(p){
      const m = D.mem[p.nama] || { nama: p.nama, kerja: '', kota: '' };
      const kanan = '<span class="kl-jabatan">' + lolos(p.jabatan) + '</span>' + (p.aku ? '<span class="tag hi">Kamu</span>' : '');
      const t = tombolNomor(p.nama, m);
      potong.push(baris(m, kanan, t ? '<div class="kl-row-aksi">' + t + '</div>' : '', putusan(p.nama)) + editNomor(p.nama, m));
    });

    D.anggotaBiasa.forEach(function(nama){
      const m = D.mem[nama];
      let aksi = '';
      if(D.angkatFor !== nama && D.idUbahFor !== nama){
        aksi = '<div class="kl-row-aksi">' + tombolNomor(nama, m) +
          (modeAdvance() ? '<button type="button" class="btn outline sm" data-angkat="' + lolos(nama) + '">Angkat jadi pengurus</button>' : '') + '</div>';
      }
      html = baris(m, '', aksi, putusan(nama)) + editNomor(nama, m);
      if(D.angkatFor === nama){
        html += '<div class="kl-angkat">' +
            '<span class="kl-angkat-lbl">Jadikan ' + lolos((m.panggil && m.panggil !== 'Kamu') ? m.panggil : nama.split(' ')[0]) + ':</span>' +
            '<select class="sel" id="klJabatanSel" aria-label="Pilih jabatan">' +
              JABATAN.map(function(j){ return '<option>' + j + '</option>'; }).join('') +
            '</select>' +
            '<button type="button" class="btn sm" data-angkat-ok="' + lolos(nama) + '">Angkat</button>' +
            '<button type="button" class="btn outline sm" data-angkat-batal>Batal</button>' +
          '</div>';
      }
      potong.push(html);
    });

    const hal = Math.ceil(potong.length / PER_HAL);
    D.halAnggota = Math.min(D.halAnggota || 0, Math.max(0, hal - 1));
    const awal = D.halAnggota * PER_HAL, isi = potong.slice(awal, awal + PER_HAL);
    wadah.innerHTML = isi.join('');
    el('klAnggotaSeg').innerHTML = seg;
    /* paginasi di bawah daftar, ujung kanan; tinggi daftar dikunci setinggi halaman penuh
       supaya tombolnya tidak naik-turun di halaman terakhir */
    const pg = el('klAnggotaPager');
    pg.hidden = lihat !== 'diterima';
    pg.innerHTML = pagerHtml(hal, D.halAnggota, awal, isi.length, potong.length);
    if(hal <= 1) wadah.style.minHeight = '';
    else {
      if(isi.length === PER_HAL){ wadah.style.minHeight = ''; wadah.dataset.penuh = wadah.offsetHeight; }
      if(wadah.dataset.penuh) wadah.style.minHeight = wadah.dataset.penuh + 'px';
    }
  }

  function baris(m, kanan, aksi, bawah){
    const av = '<div class="av ' + 'abc'[(m.nama.length) % 3] + '" aria-hidden="true">' + inisial(m.nama) + '</div>';
    const sub = [m.kerja, m.kota].filter(Boolean).join(' · ');
    /* nomor anggota ditaruh kecil di atas nama, bukan menyamping — baris jadi
       rapi walau nomornya panjang */
    const idAtas = (pakaiNomor() && m && m.id) ? '<div class="mem-id">' + lolos(m.id) + '</div>' : '';
    return '<div class="kl-row">' + av +
      '<div class="t">' + idAtas + '<div class="kl-row-nm">' + lolos(m.nama) + (kanan || '') + '</div>' +
      (sub ? '<div class="kl-row-sub">' + lolos(sub) + '</div>' : '') + (bawah || '') + '</div>' +
      (aksi || '') + '</div>';
  }
  /* V4: tab Riwayat dilebur ke tab Anggota — keputusan penerimaan ikut di baris
     anggotanya, terlipat supaya daftar tetap ringkas */
  function olehSiapa(r){
    return r.otomatis ? 'diterima otomatis' : 'oleh ' + (r.oleh === D.aku ? 'kamu' : lolos(r.oleh.split(' ')[0]));
  }
  function putusan(nama){
    const r = D.riwayat.filter(function(x){ return x.nama === nama && x.status === 'diterima'; })[0];
    if(!r) return '';
    return '<details class="kl-putus"><summary><span class="kl-putus-t">Diterima ' + olehSiapa(r) + ' · ' + lolos(r.waktu) + '</span>' +
      '<span class="kl-putus-lihat">Lihat alasan<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span></summary>' +
      '<p>' + (r.catatan ? lolos(r.catatan) : (r.otomatis ? 'Diterima otomatis sesuai aturan penerimaan otomatis.' : 'Tidak ada catatan.')) + '</p></details>';
  }

  /* ---------- panel: kepengurusan ---------- */
  function gambarPengurus(){
    if(modeAdvance()) gambarPengurusAdvance();
    else gambarPengurusEsensial();
  }

  /* perkenalan singkat pengurus — ditulis di sini, dibaca di pop up profil
     pengurus halaman komunitas (field `perkenalan` → `kenal` di agregat) */
  const KENAL_MAKS = 280;
  function pengurusBernama(nama){ return D.pengurus.filter(function(x){ return x.nama === nama; })[0] || null; }
  function kenalTombol(p){
    if(!p || D.kenalFor === p.nama) return '';
    return '<button type="button" class="btn outline sm" data-kenal="' + lolos(p.nama) + '">' + (p.perkenalan ? 'Ubah perkenalan' : 'Tulis perkenalan') + '</button>';
  }
  function kenalCuplik(p){
    if(!p || !p.perkenalan || D.kenalFor === p.nama) return '';
    return '<div class="kl-kenal-cuplik">“' + lolos(p.perkenalan) + '”</div>';
  }
  function kenalEditor(p){
    if(!p || D.kenalFor !== p.nama) return '';
    const isi = p.perkenalan || '';
    return '<div class="kl-kenal-ed">' +
        '<label class="kl-angkat-lbl" for="klKenalTa">Perkenalan singkat ' + (p.aku ? 'kamu' : lolos(p.nama.split(' ')[0])) + '</label>' +
        '<textarea class="ta" id="klKenalTa" maxlength="' + KENAL_MAKS + '" placeholder="Contoh: Angkatan 2015, sekarang di bidang logistik. Hubungi aku soal acara reuni dan kerja sama.">' + lolos(isi) + '</textarea>' +
        '<div class="kl-kenal-kaki"><span class="kl-cb-hint">Tampil saat anggota mengklik profil pengurus di halaman komunitas.</span>' +
          '<span class="hitung"><span id="klKenalN">' + isi.length + '</span>/' + KENAL_MAKS + '</span></div>' +
        '<div class="kl-kenal-aksi"><button type="button" class="btn sm" data-kenal-ok="' + lolos(p.nama) + '">Simpan</button>' +
          '<button type="button" class="btn outline sm" data-kenal-batal>Batal</button></div>' +
      '</div>';
  }
  el('klPengurusList').addEventListener('input', function(e){
    if(e.target.id !== 'klKenalTa') return;
    const n = el('klKenalN'); if(n) n.textContent = e.target.value.length;
  });

  /* Advance: susunan pengurus penuh — angkat, ubah jabatan, atur peninjau */
  function gambarPengurusAdvance(){
    const wadah = el('klPengurusList');
    const satuPeninjau = D.peninjau.length <= 1;
    wadah.innerHTML = '<p class="kl-sub">Semua pengurus bisa melihat struktur ini dan menyunting perkenalannya sendiri. Hak menyetujui pendaftaran dipegang <b>peninjau pendaftaran</b> — boleh beberapa orang sekaligus, dan bisa kamu tambah atau lepas kapan saja. Selalu ada minimal satu peninjau.</p>' + D.pengurus.map(function(p){
      const m = D.mem[p.nama] || { nama: p.nama, kerja: '', kota: '' };
      const ini = adaPeninjau(p.nama);
      const nm = lolos(p.nama) + '<span class="kl-jabatan">' + lolos(p.jabatan) + '</span>' +
                 (p.aku ? '<span class="tag hi">Kamu</span>' : '') +
                 (ini ? '<span class="kl-peninjau">' + IKON_MATA + 'Peninjau pendaftaran</span>' : '');
      const av = '<div class="av ' + 'abc'[(p.nama.length) % 3] + '" aria-hidden="true">' + inisial(p.nama) + '</div>';
      const sub = [m.kerja, m.kota].filter(Boolean).join(' · ');

      let aksi = '';
      /* jabatan siapa pun bisa diubah, termasuk pembuat halaman sendiri */
      if(D.ubahFor !== p.nama) aksi += '<button type="button" class="btn outline sm" data-ubah="' + lolos(p.nama) + '">Ubah jabatan</button>';
      aksi += kenalTombol(p);
      if(ini){
        /* peninjau terakhir tidak boleh dilepas — selalu ada yang meninjau */
        if(!satuPeninjau) aksi += '<button type="button" class="btn outline sm" data-peninjau-off="' + lolos(p.nama) + '">Lepas dari peninjau</button>';
      } else {
        aksi += '<button type="button" class="btn outline sm" data-peninjau-on="' + lolos(p.nama) + '">Jadikan peninjau</button>';
        if(!p.aku) aksi += '<button type="button" class="btn sm tolak" data-copot="' + lolos(p.nama) + '">Copot</button>';
      }

      let html = '<div class="kl-row">' + av +
        '<div class="t"><div class="kl-row-nm">' + nm + '</div>' +
        (sub ? '<div class="kl-row-sub">' + lolos(sub) + '</div>' : '') + kenalCuplik(p) + '</div>' +
        (aksi ? '<div class="kl-row-aksi">' + aksi + '</div>' : '') + '</div>';
      html += kenalEditor(p);

      if(D.ubahFor === p.nama){
        const opsi = JABATAN.map(function(j){ return '<option' + (j === p.jabatan ? ' selected' : '') + '>' + j + '</option>'; }).join('');
        html += '<div class="kl-angkat">' +
            '<span class="kl-angkat-lbl">Jabatan ' + (p.aku ? 'kamu' : lolos(p.nama.split(' ')[0])) + ':</span>' +
            '<select class="sel" id="klUbahSel" aria-label="Pilih jabatan">' + opsi + '</select>' +
            '<button type="button" class="btn sm" data-ubah-ok="' + lolos(p.nama) + '">Simpan</button>' +
            '<button type="button" class="btn outline sm" data-ubah-batal>Batal</button>' +
          '</div>';
      }
      return html;
    }).join('') + gambarJabatan();
  }

  /* daftar jabatan: SEMUA bisa diganti nama dan dihapus, termasuk bawaan (Ketua,
     Wakil Ketua, ...) — tiap komunitas punya sebutan sendiri. Menghapus jabatan
     yang ada pemegangnya minta konfirmasi dulu; pemegangnya pindah ke jabatan
     pertama yang tersisa. Minimal satu jabatan harus tersisa. */
  function pemegang(j){ return D.pengurus.filter(function(p){ return p.jabatan === j; }); }
  function gambarJabatan(){
    const satu = JABATAN.length <= 1;
    return '<div class="kl-jab">' +
      '<div class="kl-jab-h">Jabatan di komunitas ini</div>' +
      '<p class="kl-sub">Semua jabatan bisa diganti namanya atau dihapus, termasuk Ketua dan Wakil Ketua — sesuaikan dengan sebutan di komunitasmu, misalnya Ketua Umum atau Koordinator Wilayah. Perubahan langsung berlaku di pilihan jabatan dan di tabel Siapa boleh apa.</p>' +
      '<ul class="kl-jab-list">' + JABATAN.map(function(j){
        const ada = pemegang(j).length;
        if(D.jabEdit === j){
          return '<li class="kl-jab-i ubah"><input class="inp" id="klJabUbah" maxlength="30" value="' + lolos(D.jabEditTeks) + '" aria-label="Nama baru untuk jabatan ' + lolos(j) + '">' +
            '<button type="button" class="btn xs" data-jab-simpan>Simpan</button>' +
            '<button type="button" class="btn xs outline" data-jab-batal>Batal</button></li>';
        }
        if(D.jabHapus === j){
          const pindah = JABATAN.filter(function(x){ return x !== j; })[0];
          return '<li class="kl-jab-i konfirm"><span>Hapus “' + lolos(j) + '”? ' + ada + ' pengurus memegangnya dan akan dipindah ke “' + lolos(pindah) + '”.</span>' +
            '<button type="button" class="btn xs hapus" data-jab-hapus-ok>Hapus</button>' +
            '<button type="button" class="btn xs outline" data-jab-batal>Batal</button></li>';
        }
        return '<li class="kl-jab-i">' + lolos(j) + (ada ? '<span class="kl-jab-n" title="' + ada + ' pemegang">' + ada + '</span>' : '') +
          '<button type="button" class="kl-jab-x" data-jab-ubah="' + lolos(j) + '" aria-label="Ganti nama jabatan ' + lolos(j) + '" title="Ganti nama">' + window.KolavoIkon('pensil') + '</button>' +
          (satu ? '' : '<button type="button" class="kl-jab-x hapus" data-jab-hapus="' + lolos(j) + '" aria-label="Hapus jabatan ' + lolos(j) + '" title="Hapus">' + window.KolavoIkon('sampah') + '</button>') + '</li>';
      }).join('') + '</ul>' +
      '<div class="kl-angkat"><input class="inp" id="klJabBaru" maxlength="30" placeholder="Nama jabatan baru" value="' + lolos(D.jabatanTeks) + '" aria-label="Nama jabatan baru">' +
        '<button type="button" class="btn sm" data-jab-tambah>+ Tambah jabatan</button></div>' +
    '</div>';
  }

  /* Esensial: tanpa susunan jabatan — cuma atur siapa peninjau + ajakan Advance */
  function gambarPengurusEsensial(){
    const wadah = el('klPengurusList');
    const satuPeninjau = D.peninjau.length <= 1;

    const list = D.peninjau.map(function(nama){
      const m = D.mem[nama] || { nama: nama, kerja: '', kota: '' };
      const sub = [m.kerja, m.kota].filter(Boolean).join(' · ');
      const av = '<div class="av ' + 'abc'[(nama.length) % 3] + '" aria-hidden="true">' + inisial(nama) + '</div>';
      const tag = (nama === D.aku) ? '<span class="tag hi">Kamu</span>' : '';
      const lepas = satuPeninjau ? '' : '<button type="button" class="btn outline sm" data-peninjau-off="' + lolos(nama) + '">Lepas</button>';
      /* peninjau yang juga pengurus bisa menulis perkenalan — tampil di halaman komunitas */
      const p = pengurusBernama(nama);
      const aksiE = kenalTombol(p) + lepas;
      return '<div class="kl-row">' + av +
        '<div class="t"><div class="kl-row-nm">' + lolos(nama) + tag +
          '<span class="kl-peninjau">' + IKON_MATA + 'Peninjau</span></div>' +
        (sub ? '<div class="kl-row-sub">' + lolos(sub) + '</div>' : '') + kenalCuplik(p) + '</div>' +
        (aksiE ? '<div class="kl-row-aksi">' + aksiE + '</div>' : '') + '</div>' + kenalEditor(p);
    }).join('');

    const bisa = [D.aku].concat(D.anggotaBiasa).filter(function(n){ return !adaPeninjau(n); });
    let tambah;
    if(esensialSaja()){
      /* Esensial cukup satu peninjau — tambahannya jalan halus menuju Advance */
      tambah = '<button type="button" class="kl-tambah-kunci" data-upgrade="peninjau">' +
          '<span class="kl-tambah-plus" aria-hidden="true">+</span>' +
          '<span class="t"><b>Tambah peninjau</b><small>Bagi tugas meninjau pendaftaran dengan pengurus lain</small></span>' +
          '<span class="kl-tambah-tag">' + IKON_KUNCI + 'Advance</span>' +
        '</button>';
    } else if(bisa.length){
      tambah = '<div class="kl-angkat">' +
          '<span class="kl-angkat-lbl">Tunjuk peninjau:</span>' +
          '<select class="sel" id="klPeninjauSel" aria-label="Pilih anggota jadi peninjau">' +
            bisa.map(function(n){ return '<option value="' + lolos(n) + '">' + lolos(n === D.aku ? 'Kamu' : n) + '</option>'; }).join('') +
          '</select>' +
          '<button type="button" class="btn sm" data-peninjau-add>Jadikan peninjau</button>' +
        '</div>';
    } else {
      tambah = '<p class="kl-cb-hint">Terima anggota dulu lewat tab Permintaan gabung untuk bisa menunjuk peninjau lain.</p>';
    }

    wadah.innerHTML =
      '<div class="kl-tier"><b>Paket Esensial.</b> ' + (esensialSaja()
        ? 'Pendaftaran anggota ditinjau oleh satu peninjau, untuk komunitas hingga 20 anggota.'
        : 'Atur siapa saja yang menerima atau menolak pendaftaran anggota.') + '</div>' +
      '<div class="kl-seksi-h">Peninjau pendaftaran</div>' +
      '<p class="kl-cb-hint">Merekalah yang menerima atau menolak pendaftaran. Selalu ada minimal satu.</p>' +
      list + tambah +
      '<div class="kl-upsell">' +
        '<div class="kl-upsell-h">Butuh susunan pengurus?</div>' +
        '<p>Ketua, wakil ketua, sekretaris, bendahara, dengan nama jabatan yang bisa kamu atur sendiri dan tampil di halaman komunitas — dengan menu kepengurusan sendiri untuk mengangkat anggota jadi pengurus dan mengatur jabatan. Ada di paket <b>Advance</b>.</p>' +
        '<button type="button" class="btn outline sm" data-mode="advance">' + (D.sekAktif ? 'Buka Advance' : 'Lihat Advance') + '</button>' +
      '</div>';
  }

  /* ---------- panel: riwayat keputusan ---------- */
  function gambarRiwayat(){
    /* hanya yang ditolak — keputusan diterima sudah ikut di baris anggotanya */
    const wadah = el('klRiwayatList');
    const lain = D.riwayat.filter(function(r){ return r.status !== 'diterima'; });
    if(!lain.length){ wadah.innerHTML = ''; return; }
    wadah.innerHTML = '<p class="kl-cb-hint">Pendaftar yang tidak jadi anggota. Catatan keputusannya bisa dilihat semua peninjau.</p>' +
      lain.map(function(r, i){
      const av = '<div class="av ' + 'abc'[i % 3] + '" aria-hidden="true">' + inisial(r.nama) + '</div>';
      const diterima = r.status === 'diterima';
      const oleh = olehSiapa(r);
      /* nomor anggota dibaca dari data anggota (bukan snapshot) supaya kalau
         diperbaiki di tab Anggota, riwayatnya ikut betul */
      const mem = D.mem[r.nama];
      const idAtas = (diterima && pakaiNomor() && mem && mem.id) ? '<div class="mem-id">' + lolos(mem.id) + '</div>' : '';
      return '<div class="kl-riwayat">' + av +
          '<div class="t">' + idAtas + '<div class="kl-riwayat-nm">' + lolos(r.nama) + '</div>' +
          '<div class="kl-riwayat-sub">' + lolos(r.kerja) + ' · ' + lolos(r.kota) + ' · ' + oleh + ' · ' + lolos(r.waktu) + '</div>' +
          '<div class="kl-riwayat-catatan ' + (diterima ? 'diterima' : 'ditolak') + '"><div class="kl-riwayat-catatan-h">' + window.KolavoIkon('dokumen') + 'Catatan keputusan</div>' +
            '<p>' + (r.catatan ? lolos(r.catatan) : (r.otomatis ? 'Diterima otomatis sesuai aturan penerimaan otomatis.' : 'Tidak ada catatan.')) + '</p></div>' + '</div>' +
          '<span class="kl-hasil ' + (diterima ? 'diterima' : 'ditolak') + '">' + (diterima ? IKON_CEK : IKON_X) + (diterima ? 'Diterima' : 'Ditolak') + '</span>' +
        '</div>';
    }).join('');
  }

  /* ---------- ganti tab ---------- */
  /* tab Advance (data-sek) hanya ada di tampilan Advance — di Esensial, yang
     tersisa dari tab itu jatuh kembali ke Permintaan gabung */
  /* menu yang hanya milik pembuat/pemegang langganan — tertutup di komunitas yang mengangkatmu */
  const KHUSUS_PEMBUAT = ['tagihan', 'akses'];
  function pilihTab(nama){
    const tombol = scr.querySelector('.kl-tab[data-tab="' + nama + '"]');
    if(tombol && tombol.hasAttribute('data-sek') && D.mode !== 'advance') nama = 'minta';
    if(D.kom && D.kom.diangkat && KHUSUS_PEMBUAT.indexOf(nama) >= 0) nama = 'dasbor';
    D.tab = nama;
    const tampil = nama;
    scr.querySelectorAll('.kl-tab').forEach(function(b){
      const on = b.dataset.tab === nama;
      b.classList.toggle('on', on);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    scr.querySelectorAll('.kl-panel').forEach(function(p){ p.hidden = p.dataset.panel !== tampil; });
    /* sub-menu: grup yang memuat tab aktif terbuka, induknya ditandai */
    scr.querySelectorAll('.kl-subnav').forEach(function(g){
      const aktif = !!g.querySelector('.kl-tab.on');
      const induk = scr.querySelector('.kl-induk[data-induk="' + g.dataset.grup + '"]');
      g.classList.toggle('buka', aktif);
      if(induk){
        induk.classList.toggle('aktif', aktif);
        induk.setAttribute('aria-expanded', g.classList.contains('buka') ? 'true' : 'false');
      }
    });
  }
  /* sub-menu pertama yang terlihat di paket yang sedang dipakai */
  function subPertama(grup){
    const t = [].filter.call(scr.querySelectorAll('.kl-subnav[data-grup="' + grup + '"] .kl-tab'), function(b){
      return !b.hasAttribute('data-sek') || D.mode === 'advance';
    })[0];
    return t ? t.dataset.tab : 'minta';
  }

  function gambar(){
    gambarKepala();
    gambarMinta();
    gambarAnggota();
    gambarPengurus();
    gambarRiwayat();
    D.onGambar.forEach(function(f){ f(); });
    const lp = el('klTabPengurusL'); if(lp) lp.textContent = modeAdvance() ? 'Struktur Kepengurusan' : 'Peninjau';
    if(D.tab === 'riwayat') D.tab = 'anggota';
    pilihTab(D.tab);
  }

  /* ---------- menerima / menolak — satu jalur, dipakai kartu permintaan dan
     penerimaan massal di Sekretariat ---------- */
  function terima(r, o){
    o = o || {};
    let id = '';
    if(pakaiNomor()){
      D.urut++;
      id = (D.nomorMode === 'manual' && o.id) ? o.id : fmtId(D.urut);
    }
    D.minta = D.minta.filter(function(x){ return x.id !== r.id; });
    /* tags jawaban ikut disimpan supaya muncul di daftar anggota halaman pemilik */
    D.mem[r.nama] = { nama: r.nama, full: r.full || r.nama, kerja: r.kerja, kota: r.kota, tahun: r.tahun || '', sosmed: (r.sosmed || []).slice(), sejak: bulanLalu(0), beri: r.beri || '', cari: r.cari || '', panggil: r.panggil, tags: (r.tags || []).slice(), jawaban: (r.jawaban || []).slice(), id: id };
    D.anggotaBiasa.push(r.nama);
    D.riwayat.unshift({ nama: r.nama, panggil: r.panggil, kerja: r.kerja, kota: r.kota, status: 'diterima', oleh: D.aku, otomatis: !!o.otomatis, waktu: 'baru saja', catatan: o.catatan || '' });
    /* sambutan otomatis di feed halaman komunitas — ditolak sendiri kalau belum Advance */
    if(window.KolavoFeedTambah) window.KolavoFeedTambah('l-dibuat', { jenis: 'sambutan', anggota: r.nama, panggil: r.panggil, kerja: r.kerja, kota: r.kota });
    return id;
  }
  function tolakR(r, catatan){
    D.minta = D.minta.filter(function(x){ return x.id !== r.id; });
    D.riwayat.unshift({ nama: r.nama, panggil: r.panggil, kerja: r.kerja, kota: r.kota, status: 'ditolak', oleh: D.aku, waktu: 'baru saja', catatan: catatan || '' });
  }
  D.terima = terima;
  D.gambar = function(){ gambar(); };
  D.pilihTab = pilihTab;
  D.jumlahAnggota = jumlahAnggota;
  D.inisial = inisial;
  D.lolos = lolos;
  D.akuPeninjau = akuPeninjau;

  /* membangun keadaan tanpa berpindah layar — dipakai halaman komunitas versi
     pemilik supaya daftar anggota & pengurusnya sudah ada saat halaman dibuka */
  window.KolavoSiapkanDashboard = function(){ return bangun(); };

  /* dipanggil dari halaman komunitas versi pemilik (tombol "Dashboard pengurus")
     dan dari tombol di layar buat. Argumen tab opsional: 'minta' langsung ke
     panel permintaan (dipakai notifikasi "N orang menunggu"). */
  /* ringkasan permintaan gabung tanpa berpindah konteks — dipakai Home (PROMPT-HOME H2).
     kom kosong = komunitas buatan sendiri. bisa = kamu termasuk peninjau. */
  window.KolavoRingkasMinta = function(kom){
    kom = kom || (window.KolavoApp || {}).dibuat;
    if(!kom) return null;
    if(D.built && D.kom && D.kom.slug === kom.slug) return { n: D.minta.length, bisa: akuPeninjau() };
    const k = KONTEKS[kom.slug];
    if(k && k.kom === kom) return { n: k.d.minta.length, bisa: k.d.peninjau.indexOf(k.d.aku) >= 0 };
    return { n: SEED.length, bisa: true };   /* belum pernah dibuka: dibangun dari contoh pendaftar */
  };

  window.KolavoBukaDashboard = function(tab, kom){
    if(!bangun(kom)){
      if(window.KolavoToast) window.KolavoToast('Bikin dulu halaman komunitasmu.');
      window.KolavoKe('scrBuat');
      return;
    }
    if(tab) D.tab = tab;
    gambar();
    window.KolavoKe('scrKelola');
  };

  const toast = function(t){ if(window.KolavoToast) window.KolavoToast(t); };

  /* pemicu dari luar layar ini (halaman komunitas pemilik, layar buat).
     Ditaruh di document karena elemennya bukan bagian scrKelola. Nilai
     atribut, kalau ada, jadi tab awal. */
  document.addEventListener('click', function(e){
    const b = e.target.closest('[data-dashboard]');
    if(b){ e.preventDefault(); window.KolavoBukaDashboard(b.getAttribute('data-dashboard') || null); }
  });
  document.addEventListener('keydown', function(e){
    if(e.key !== 'Enter' && e.key !== ' ') return;
    const b = e.target.closest && e.target.closest('[data-dashboard]');
    if(b){ e.preventDefault(); window.KolavoBukaDashboard(b.getAttribute('data-dashboard') || null); }
  });

  /* kolom jabatan kustom: disimpan per ketikan supaya tidak hilang saat panel digambar ulang; Enter = tambah */
  scr.addEventListener('input', function(e){
    if(e.target.id === 'klJabBaru') D.jabatanTeks = e.target.value;
    if(e.target.id === 'klJabUbah') D.jabEditTeks = e.target.value;
    /* catatan keputusan wajib: tombol Setujui/Tolak hidup setelah ada isinya */
    if(e.target.matches('[data-catatan]')){
      const kosong = !e.target.value.trim();
      e.target.closest('.kl-req').querySelectorAll('[data-setuju],[data-tolak]').forEach(function(b){ b.disabled = kosong; });
    }
  });
  scr.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && e.target.id === 'klJabBaru'){ e.preventDefault(); const b = scr.querySelector('[data-jab-tambah]'); if(b) b.click(); }
    if(e.target.id === 'klJabUbah' && (e.key === 'Enter' || e.key === 'Escape')){
      e.preventDefault(); const b = scr.querySelector(e.key === 'Enter' ? '[data-jab-simpan]' : '[data-jab-batal]'); if(b) b.click();
    }
  });

  function hapusJabatan(j){
    const i = JABATAN.indexOf(j);
    if(i < 0 || JABATAN.length <= 1) return;
    const n = pemegang(j).length;
    JABATAN.splice(i, 1);
    D.pengurus.forEach(function(p){ if(p.jabatan === j) p.jabatan = JABATAN[0]; });
    D.onJabatanGanti.forEach(function(f){ f(j, null); });
    D.jabHapus = null;
    gambar();
    toast('Jabatan “' + j + '” dihapus.' + (n ? ' ' + n + ' pemegangnya pindah ke “' + JABATAN[0] + '”.' : ''));
  }

  /* ---------- aksi ---------- */
  scr.addEventListener('click', function(e){
    /* induk: di Esensial langsung ke sub-menu pertama; di kolom samping Advance
       membuka-tutup grupnya; kalau belum ada yang aktif di dalamnya, memilih yang pertama */
    const induk = e.target.closest('.kl-induk');
    if(induk){
      const g = scr.querySelector('.kl-subnav[data-grup="' + induk.dataset.induk + '"]');
      if(D.mode === 'advance' && g && g.querySelector('.kl-tab.on')){
        g.classList.toggle('buka');
        induk.setAttribute('aria-expanded', g.classList.contains('buka') ? 'true' : 'false');
        return;
      }
      pilihTab(subPertama(induk.dataset.induk));
      return;
    }
    const tab = e.target.closest('.kl-tab');
    if(tab){ pilihTab(tab.dataset.tab); return; }

    /* jabatan kustom */
    if(e.target.closest('[data-jab-tambah]')){
      const nama = D.jabatanTeks.trim().replace(/\s+/g, ' ');
      if(!nama){ toast('Tulis nama jabatannya dulu.'); return; }
      const sama = JABATAN.concat(['Community Creator']).filter(function(j){ return j.toLowerCase() === nama.toLowerCase(); })[0];
      if(sama){ toast('Jabatan “' + sama + '” sudah ada.'); return; }
      JABATAN.push(nama); D.jabatanTeks = '';
      gambar();
      const f = el('klJabBaru'); if(f) f.focus();
      toast('Jabatan “' + nama + '” ditambahkan. Atur haknya di Setting › Akses pengurus.');
      return;
    }
    const ubahJab = e.target.closest('[data-jab-ubah]');
    if(ubahJab){
      D.jabEdit = ubahJab.dataset.jabUbah; D.jabEditTeks = D.jabEdit; D.jabHapus = null;
      gambar();
      const f = el('klJabUbah'); if(f){ f.focus(); f.select(); }
      return;
    }
    if(e.target.closest('[data-jab-batal]')){ D.jabEdit = null; D.jabHapus = null; gambar(); return; }
    if(e.target.closest('[data-jab-simpan]')){
      const lama = D.jabEdit, baru = D.jabEditTeks.trim().replace(/\s+/g, ' ');
      if(!baru){ toast('Nama jabatan tidak boleh kosong.'); return; }
      if(baru !== lama){
        const sama = JABATAN.concat(['Community Creator']).filter(function(j){ return j !== lama && j.toLowerCase() === baru.toLowerCase(); })[0];
        if(sama){ toast('Jabatan “' + sama + '” sudah ada.'); return; }
        JABATAN[JABATAN.indexOf(lama)] = baru;
        D.pengurus.forEach(function(p){ if(p.jabatan === lama) p.jabatan = baru; });
        D.onJabatanGanti.forEach(function(f){ f(lama, baru); });
        toast('“' + lama + '” diganti jadi “' + baru + '”.');
      }
      D.jabEdit = null;
      gambar();
      return;
    }
    const hapusJab = e.target.closest('[data-jab-hapus]');
    if(hapusJab){
      const j = hapusJab.dataset.jabHapus;
      if(pemegang(j).length){ D.jabHapus = j; D.jabEdit = null; gambar(); return; }
      hapusJabatan(j);
      return;
    }
    if(e.target.closest('[data-jab-hapus-ok]')){ hapusJabatan(D.jabHapus); return; }

    /* approval: setujui / tolak */
    const setuju = e.target.closest('[data-setuju]');
    if(setuju){
      const r = D.minta.filter(function(x){ return x.id === setuju.dataset.setuju; })[0];
      if(!r) return;
      if(penuhEsensial()){ D.bukaAdvance('anggota'); return; }
      const kartu = setuju.closest('.kl-req');
      /* nomor anggota ditetapkan saat diterima: otomatis ikut urutan, atau
         diambil dari kolom manual yang diisi peninjau */
      const f = kartu && kartu.querySelector('[data-idinput]');
      if(!bacaCatatan(kartu)){ toast('Tulis catatan keputusannya dulu.'); const c = kartu.querySelector('[data-catatan]'); if(c) c.focus(); return; }
      const id = terima(r, { catatan: bacaCatatan(kartu), id: f ? f.value.trim() : '' });
      gambar();
      toast(r.panggil + ' disetujui.' + (id ? ' Nomor anggota ' + id + '.' : ' Daftar anggota kebuka buat dia.'));
      return;
    }
    const tolak = e.target.closest('[data-tolak]');
    if(tolak){
      const r = D.minta.filter(function(x){ return x.id === tolak.dataset.tolak; })[0];
      if(!r) return;
      const kartuT = tolak.closest('.kl-req');
      if(!bacaCatatan(kartuT)){ toast('Tulis catatan keputusannya dulu.'); const c = kartuT.querySelector('[data-catatan]'); if(c) c.focus(); return; }
      tolakR(r, bacaCatatan(kartuT));
      gambar();
      toast('Permintaan ' + r.panggil + ' ditolak.');
      return;
    }

    /* nomor anggota: buka / simpan / batal edit (auto maupun manual bisa diperbaiki) */
    const idubah = e.target.closest('[data-idubah]');
    if(idubah){ D.idUbahFor = idubah.dataset.idubah; D.angkatFor = null; gambarAnggota(); return; }
    if(e.target.closest('[data-idubah-batal]')){ D.idUbahFor = null; gambarAnggota(); return; }
    const idok = e.target.closest('[data-idubah-ok]');
    if(idok){
      const nama = idok.dataset.idubahOk;
      const f = el('klIdSel');
      const nilai = f ? f.value.trim() : '';
      if(D.mem[nama]) D.mem[nama].id = nilai;
      D.idUbahFor = null;
      gambar();
      toast('Nomor anggota ' + (nama === D.aku ? 'kamu' : nama.split(' ')[0]) + (nilai ? ' jadi ' + nilai : ' dikosongkan') + '.');
      return;
    }

    /* kepengurusan: buka pemilih jabatan */
    const angkat = e.target.closest('[data-angkat]');
    if(angkat){ D.angkatFor = angkat.dataset.angkat; D.idUbahFor = null; gambarAnggota(); return; }
    if(e.target.closest('[data-angkat-batal]')){ D.angkatFor = null; gambarAnggota(); return; }
    const ok = e.target.closest('[data-angkat-ok]');
    if(ok){
      const nama = ok.dataset.angkatOk;
      const sel = el('klJabatanSel');
      const jabatan = sel ? sel.value : 'Pengurus';
      D.anggotaBiasa = D.anggotaBiasa.filter(function(n){ return n !== nama; });
      D.pengurus.push({ nama: nama, jabatan: jabatan });
      D.angkatFor = null;
      gambar();
      toast(nama.split(' ')[0] + ' sekarang ' + jabatan + '. Dia bisa ikut mengurus komunitas.');
      return;
    }

    /* tambahkan seorang pengurus jadi peninjau (boleh banyak sekaligus) */
    const tambah = e.target.closest('[data-peninjau-on]');
    if(tambah){
      const nama = tambah.dataset.peninjauOn;
      if(!adaPeninjau(nama)) D.peninjau.push(nama);
      gambar();
      toast((nama === D.aku ? 'Kamu' : nama.split(' ')[0]) + ' sekarang ikut meninjau pendaftaran.');
      return;
    }

    const al = e.target.closest('[data-alihat]');
    if(al){ D.anggotaLihat = al.dataset.alihat; gambarAnggota(); return; }
    const ah = e.target.closest('[data-ahal]');
    if(ah){
      const w = el('klAnggotaList');
      if(w.querySelectorAll(':scope > .kl-row').length >= PER_HAL){ w.style.minHeight = ''; w.dataset.penuh = w.offsetHeight; }
      D.halAnggota = +ah.dataset.ahal; gambarAnggota();
      return;
    }
    const upg = e.target.closest('[data-upgrade]');
    if(upg){ D.bukaAdvance(upg.dataset.upgrade); return; }

    /* Esensial: tunjuk anggota jadi peninjau lewat dropdown */
    const padd = e.target.closest('[data-peninjau-add]');
    if(padd){
      const sel = el('klPeninjauSel');
      const nama = sel ? sel.value : '';
      if(nama && !adaPeninjau(nama)) D.peninjau.push(nama);
      gambar();
      if(nama) toast((nama === D.aku ? 'Kamu' : nama.split(' ')[0]) + ' sekarang ikut meninjau pendaftaran.');
      return;
    }

    /* lepas seorang pengurus dari peninjau — selalu sisakan minimal satu */
    const lepas = e.target.closest('[data-peninjau-off]');
    if(lepas){
      const nama = lepas.dataset.peninjauOff;
      if(D.peninjau.length <= 1){ toast('Harus ada minimal satu peninjau. Tambahkan orang lain dulu.'); return; }
      D.peninjau = D.peninjau.filter(function(n){ return n !== nama; });
      gambar();
      toast((nama === D.aku ? 'Kamu' : nama.split(' ')[0]) + ' tidak lagi meninjau pendaftaran.');
      return;
    }

    /* kepengurusan: perkenalan singkat */
    const kenal = e.target.closest('[data-kenal]');
    if(kenal){
      D.kenalFor = kenal.dataset.kenal; D.ubahFor = null; gambarPengurus();
      const ta = el('klKenalTa'); if(ta){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
      return;
    }
    if(e.target.closest('[data-kenal-batal]')){ D.kenalFor = null; gambarPengurus(); return; }
    const kenalOk = e.target.closest('[data-kenal-ok]');
    if(kenalOk){
      const p = pengurusBernama(kenalOk.dataset.kenalOk);
      const ta = el('klKenalTa');
      if(p && ta) p.perkenalan = ta.value.trim().slice(0, KENAL_MAKS);
      D.kenalFor = null;
      gambar();
      toast(p && p.perkenalan ? 'Perkenalan tersimpan — tampil di halaman komunitas.' : 'Perkenalan dikosongkan.');
      return;
    }

    /* kepengurusan: ubah jabatan (termasuk jabatan pembuat sendiri) */
    const ubah = e.target.closest('[data-ubah]');
    if(ubah){ D.ubahFor = ubah.dataset.ubah; D.angkatFor = null; D.kenalFor = null; gambarPengurus(); return; }
    if(e.target.closest('[data-ubah-batal]')){ D.ubahFor = null; gambarPengurus(); return; }
    const ubahOk = e.target.closest('[data-ubah-ok]');
    if(ubahOk){
      const nama = ubahOk.dataset.ubahOk;
      const sel = el('klUbahSel');
      const jabatan = sel ? sel.value : 'Pengurus';
      const p = D.pengurus.filter(function(x){ return x.nama === nama; })[0];
      if(p) p.jabatan = jabatan;
      D.ubahFor = null;
      gambar();
      toast((nama === D.aku ? 'Jabatanmu sekarang ' : nama.split(' ')[0] + ' sekarang ') + jabatan + '.');
      return;
    }

    /* copot dari kepengurusan */
    const copot = e.target.closest('[data-copot]');
    if(copot){
      const nama = copot.dataset.copot;
      if(adaPeninjau(nama) && D.peninjau.length <= 1){ toast('Dia satu-satunya peninjau. Tambah peninjau lain dulu sebelum mencopotnya.'); return; }
      D.peninjau = D.peninjau.filter(function(n){ return n !== nama; });
      D.pengurus = D.pengurus.filter(function(p){ return p.nama !== nama; });
      if(D.mem[nama]) D.anggotaBiasa.push(nama);
      gambar();
      toast(nama.split(' ')[0] + ' dikembalikan jadi anggota biasa.');
      return;
    }
  });
})();
</script>
