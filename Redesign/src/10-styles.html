/* ---------- pemilih lokasi ---------- */
.locwrap{position:relative;display:flex;align-items:center;gap:6px}
.locbtn{display:inline-flex;align-items:center;gap:8px;font-family:inherit;font-size:13px;font-weight:500;
  height:38px;padding:0 14px;border-radius:100px;border:1px solid var(--line);background:var(--card);
  color:var(--ink-2);cursor:pointer;transition:border-color .15s ease,background .15s ease}
.locbtn:hover{border-color:var(--ink-3)}
.locbtn:focus-visible,.locopt:focus-visible,.lnk:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.locbtn svg{width:15px;height:15px;flex:none;min-width:15px}
.locbtn > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;max-width:230px}
.locbtn .pin{color:var(--blue)}
.locbtn .chev{transition:transform .18s ease;opacity:.6}
.locbtn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.locbtn.active{background:var(--blue-wash);border-color:var(--blue);color:var(--blue-ink);font-weight:600}
.locclear{width:26px;height:26px;border-radius:100px;border:0;background:var(--blue-wash);color:var(--blue-ink);
  display:grid;place-items:center;cursor:pointer;flex:none}
.locclear[hidden]{display:none}
.locclear svg{width:12px;height:12px}
.locclear:hover{background:var(--blue);color:var(--btn-ink)}

.locpanel{position:absolute;top:calc(100% + 14px);right:0;width:min(330px,calc(100vw - 44px));
  background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--sh-lg);
  padding:10px;z-index:30;display:none}
.locpanel.open{display:block}
@media(max-width:680px){
  /* di layar sempit isi kotak pencarian menumpuk, lokasi turun ke bawah kolom cari */
  .search{flex-direction:column;align-items:stretch;border-radius:22px}
  .search .q{height:52px;padding:0 20px}
  .search .sep{width:auto;height:1px;margin:0 18px}
  .search .locwrap{width:100%;padding:6px 10px 8px}
  .search .locbtn{width:100%;justify-content:flex-start;height:44px}
  .locbtn > span{max-width:none;flex:1;text-align:left}
  .locpanel{width:auto;left:10px;right:10px}
}
.locopt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 12px;
  border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer;font-family:inherit}
.locopt:hover{background:var(--bg-alt)}
.locopt.on{background:var(--blue-wash);border-color:var(--blue)}
.locopt .ic{width:34px;height:34px;border-radius:10px;background:var(--blue-wash);color:var(--blue-ink);
  display:grid;place-items:center;flex:none}
.locopt .ic svg{width:17px;height:17px}
.locopt b{display:block;font-size:14px;font-weight:600;color:var(--ink);line-height:1.35}
.locopt em{display:block;font-style:normal;font-size:11.5px;color:var(--ink-3);line-height:1.4;margin-top:1px}

.locdiv{display:flex;align-items:center;gap:10px;margin:12px 2px 4px;color:var(--ink-3);font-size:11px}
.locdiv::before,.locdiv::after{content:"";height:1px;background:var(--line);flex:1}

.locfield{padding:8px 2px 0}
.locfield label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.locfield select{width:100%;height:40px;padding:0 32px 0 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%236B7280' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>") no-repeat right 11px center;
  font-family:inherit;font-size:13.5px;color:var(--ink);appearance:none;cursor:pointer}
.locfield select:disabled{opacity:.45;cursor:not-allowed}
.locfield select:focus-visible{outline:3px solid var(--ring);outline-offset:1px}
.locfield .hint{display:block;font-style:normal;font-size:11px;color:var(--ink-3);margin-top:5px}
.locfield .hint[hidden]{display:none}

.locfoot{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.lnk{background:none;border:0;font-family:inherit;font-size:13px;font-weight:500;color:var(--ink-3);
  cursor:pointer;padding:6px 2px}
.lnk:hover{color:var(--ink)}
.locfoot .btn{margin-left:auto}
.locfoot .btn:disabled{background:var(--disabled);color:var(--ink-3);cursor:not-allowed;transform:none}

@media(prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

/* ============================================================
   MODAL MASUK — lihat archive/ReDesign_Kolavo_Masuk.html untuk versi
   pembanding (sebelum/sesudah) dan catatan tiap perubahan.
   ============================================================ */
.lgn{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:24px}
.lgn[hidden]{display:none}
/* latar tidak boleh ikut ter-scroll selama modal terbuka */
body.lgn-open{overflow:hidden}
.lgn-scrim{position:absolute;inset:0;background:var(--scrim);backdrop-filter:blur(2px);
  opacity:0;transition:opacity .16s ease}
.lgn.on .lgn-scrim{opacity:1}
.lgn-box{position:relative;width:100%;max-width:440px;max-height:100%;overflow-y:auto;
  background:var(--card);border-radius:32px;box-shadow:var(--sh-lg);padding:26px 26px 22px;text-align:center;
  opacity:0;transform:translateY(8px) scale(.97);transition:opacity .16s ease,transform .16s ease}
.lgn.on .lgn-box{opacity:1;transform:none}
.lgn-x{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:100px;border:0;
  background:transparent;color:var(--ink-3);cursor:pointer;display:flex;align-items:center;justify-content:center}
.lgn-x:hover{background:var(--line-2);color:var(--ink)}
.lgn-x:focus-visible{outline:3px solid var(--ring);outline-offset:1px}
.lgn-x svg{width:18px;height:18px}

.lgn-proof{display:flex;flex-direction:column;align-items:center;gap:10px;margin:6px 0 16px}
.lgn-proof .stack{margin-top:0;justify-content:center;gap:7px}
.lgn-proof .stack span{width:46px;height:46px;font-size:14px;border-width:2px;margin-left:0}
.lgn-tiles{display:flex;justify-content:center;gap:9px}
.lgn-tiles .logo-sq{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);
  background-size:cover;display:block}
.lgn-cap{font-size:12.5px;color:var(--ink-3);line-height:1.4}
.lgn-head{font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.lgn-sub{margin-top:9px;font-size:14.5px;color:var(--ink-2);line-height:1.55}
.lgn-cta{margin-top:20px}
.lgn-alt{margin-top:12px;font-size:13px;color:var(--ink-2)}
.lgn-alt b{color:var(--ink);font-weight:500}
.lgn-trust{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--ink-3);line-height:1.55;display:flex;gap:8px;text-align:left;align-items:flex-start}
.lgn-trust svg{width:14px;height:14px;flex:none;margin-top:3px;color:var(--green)}
.lgn-trust a{color:var(--ink-2)}
.lgn-trust button{font:inherit;color:var(--ink-2);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.lgn-trust button:hover{color:var(--ink)}
.lgn-trust button:focus-visible{outline:3px solid var(--ring);border-radius:4px}

.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;height:52px;
  border-radius:100px;border:1px solid var(--g-line);background:var(--g-bg);color:var(--g-ink);
  font-family:"Roboto","Poppins",system-ui,sans-serif;font-size:15px;font-weight:500;cursor:pointer;
  transition:box-shadow .15s ease,transform .12s ease}
.gbtn:hover{box-shadow:var(--sh-sm);transform:translateY(-1px)}
.gbtn:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.gbtn[disabled]{opacity:.6;cursor:progress;transform:none}
.gbtn .gmark{width:20px;height:20px;flex:none}
.gspin{width:18px;height:18px;border-radius:100px;border:2.5px solid var(--ink-3);
  border-top-color:transparent;animation:gsp .7s linear infinite;flex:none}
@keyframes gsp{to{transform:rotate(360deg)}}
@media(max-width:560px){
  .lgn{align-items:flex-end;padding:0}
  .lgn-box{max-width:none;border-radius:28px 28px 0 0;padding:22px 20px 20px;transform:translateY(18px)}
  .lgn.on .lgn-box{transform:none}
  .lgn-head{font-size:19px}
}
/* ============================================================
   Layar "Lengkapi Profil" — hanya gaya khusus halaman ini.
   Semua warna lewat token; tidak ada warna harfiah di blok tema.
   ============================================================ */

/* ---------- menu akun di nav (keadaan sudah masuk) ---------- */
.acct{position:relative}
.acct-btn{display:flex;align-items:center;gap:9px;height:48px;padding:0 12px 0 6px;
  border:1px solid var(--line);border-radius:100px;background:var(--card);color:var(--ink);
  font:500 14px/1 "Poppins",system-ui,sans-serif;cursor:pointer;
  transition:border-color .15s ease,background .15s ease}
.acct-btn:hover{border-color:var(--blue);background:var(--blue-wash)}
.acct-btn:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.acct-btn .av{width:36px;height:36px}
.acct-btn .chev{width:16px;height:16px;color:var(--ink-3);transition:transform .18s ease}
.acct-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.acct-warn{position:absolute;top:2px;right:32px;width:10px;height:10px;border-radius:100px;
  background:var(--orange);border:2px solid var(--bg)}

.acct-menu{position:absolute;top:calc(100% + 10px);right:0;width:286px;z-index:40;
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--sh-lg);padding:8px;
  transform-origin:top right;animation:acctIn .16s ease}
@keyframes acctIn{from{opacity:0;transform:translateY(-6px) scale(.98)}}
@media (prefers-reduced-motion:reduce){.acct-menu{animation:none}}
.acct-menu[hidden]{display:none}
.acct-head{display:flex;gap:11px;align-items:center;padding:10px 10px 12px}
.acct-head .av{width:42px;height:42px;flex:none}
.acct-nm{font-weight:600;font-size:14px;line-height:1.3}
.acct-em{font-size:12px;color:var(--ink-3);line-height:1.4;word-break:break-all}
.acct-g{display:flex;align-items:center;gap:7px;margin:0 10px 8px;padding:7px 10px;
  border-radius:9px;background:var(--bg-alt);font-size:11.5px;color:var(--ink-2)}
.acct-g svg{width:13px;height:13px;flex:none}
.acct-sep{height:1px;background:var(--line);margin:6px 4px}
.acct-i{display:flex;align-items:center;gap:11px;padding:10px;border-radius:11px;
  font-size:14px;color:var(--ink);text-decoration:none;cursor:pointer}
.acct-i:hover{background:var(--bg-alt)}
.acct-i svg{width:17px;height:17px;color:var(--ink-3);flex:none}
.acct-i .pill{margin-left:auto;font-size:10.5px;font-weight:600;letter-spacing:.04em;
  text-transform:uppercase;padding:3px 9px;border-radius:100px;
  background:var(--orange-wash);color:var(--orange-ink)}
.acct-i .num{margin-left:auto;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.acct-i.keluar{color:var(--red)}
.acct-i.keluar svg{color:var(--red)}

/* ---------- kerangka halaman ---------- */
.page{padding:34px 0 96px;background:linear-gradient(180deg,var(--blue-tint) 0%,rgba(0,0,0,0) 340px)}
/* Satu kolom sejak panel pratinjau dilepas, dibatasi 720px supaya kolom isian
   tidak melar ke lebar penuh shell. Lebarnya diatur lewat grid, bukan max-width:
   .wrap satu elemen dengan .shell yang sudah menyetel max-width sendiri, dan dua
   kelas berebut properti yang sama persis jenis tabrakan yang dilarang di sini. */
.wrap{display:grid;gap:34px;justify-content:center;grid-template-columns:minmax(0,720px)}

.ph-kicker{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--orange);margin-bottom:12px}
.ph-h1{font-size:clamp(26px,3.2vw,36px);font-weight:600;letter-spacing:-.025em;line-height:1.16}
.ph-lede{margin-top:12px;font-size:16px;color:var(--ink-2);max-width:56ch}
.ph-lede b{color:var(--ink);font-weight:600}

/* ---------- progres ---------- */
.prog{margin-top:26px;display:flex;align-items:center;gap:14px}
.prog-bar{flex:1;height:7px;border-radius:100px;background:var(--line);overflow:hidden}
.prog-bar i{display:block;height:100%;border-radius:100px;background:var(--blue);
  transition:width .35s cubic-bezier(.4,0,.2,1)}
.prog-txt{font-size:12.5px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.prog-txt b{color:var(--ink);font-weight:600}

/* ---------- blok ---------- */
.blk{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:22px;display:flex;flex-direction:column;gap:18px;box-shadow:var(--sh-sm)}
.blk-h{display:flex;gap:13px;align-items:flex-start}
.blk-ic{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center}
.blk-ic svg{width:17px;height:17px}
.blk-ic.ok{background:var(--green-wash);color:var(--green)}
.blk-ic.lock{background:var(--bg-alt);color:var(--ink-2)}
.blk-ic.eye{background:var(--blue-wash);color:var(--blue-ink)}
.blk-ic.tanya{background:var(--orange-wash);color:var(--orange-ink)}
/* di layar buat, ikon pertanyaan ikut warna tema yang sedang dipilih */
#scrBuat .blk-ic.tanya{background:var(--blue-wash);color:var(--blue-ink)}
.blk-h h2{font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.35}
.blk-sub{margin-top:3px;font-size:13px;color:var(--ink-3);line-height:1.55;max-width:62ch}
.blk-sub b{color:var(--ink-2);font-weight:600}

/* kartu identitas dari Google */
.idcard{display:flex;align-items:center;gap:13px;padding:13px;border-radius:13px;
  background:var(--bg-alt);border:1px solid var(--line)}
.idcard .av{width:52px;height:52px;flex:none}
.idcard-t{min-width:0;flex:1}
.idcard-nm{font-weight:600;font-size:14.5px;line-height:1.35}
.idcard-em{font-size:12.5px;color:var(--ink-3);line-height:1.4;word-break:break-all}

/* keadaan sunting kartu identitas */
/* align-items:flex-start wajib: tanpa itu .idedit-foto ikut meregang setinggi
   kolom, dan badge kameranya yang position:absolute jatuh ke baris tombol */
.idedit{display:flex;align-items:flex-start;gap:16px;padding:16px;border-radius:13px;
  background:var(--bg-alt);border:1px solid var(--blue)}
.idedit-foto{position:relative;flex:none}
.idedit-foto .av{width:72px;height:72px}
.idedit-cam{position:absolute;right:-4px;bottom:-4px;width:30px;height:30px;border-radius:100px;
  display:grid;place-items:center;cursor:pointer;
  border:2px solid var(--bg-alt);background:var(--blue);color:var(--btn-ink)}
.idedit-cam:hover{background:var(--blue-hover)}
.idedit-cam:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.idedit-cam svg{width:15px;height:15px}
.idedit-kolom{flex:1;min-width:0;display:flex;flex-direction:column;gap:13px}
.idedit-em{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--ink-3);line-height:1.5}
.idedit-em svg{width:14px;height:14px;flex:none;margin-top:2px}
.idedit-em b{color:var(--ink-2);font-weight:500;word-break:break-all}
.idedit-aksi{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
@media(max-width:520px){
  .idedit{flex-direction:column;align-items:flex-start}
}

/* ---------- kolom isian ---------- */
.f{display:flex;flex-direction:column;gap:7px}
.f-grid{display:grid;gap:16px}
@media(min-width:620px){.f-grid.dua{grid-template-columns:1fr 1fr}
  .f-grid.tiga{grid-template-columns:repeat(3,1fr)}}
.f-lbl{font-size:13.5px;font-weight:500;color:var(--ink)}
.f-lbl .opt{margin-left:7px;font-size:10.5px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-3);background:var(--bg-alt);
  border-radius:100px;padding:2px 8px;vertical-align:1px}
.f-lbl .must{margin-left:5px;color:var(--orange)}
.f-why{font-size:12px;color:var(--ink-3);line-height:1.5}

.inp,.sel{width:100%;height:48px;padding:0 14px;border-radius:11px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  font:400 14.5px/1 "Poppins",system-ui,sans-serif;
  transition:border-color .15s ease,box-shadow .15s ease}
/* tanggal lahir: bulan butuh ruang lebih, "September" tidak boleh terpotong.
   Kelasnya berdiri sendiri, bukan menimpa .f-grid, supaya tak ada dua kelas
   berebut grid-template-columns di elemen yang sama. */
/* ---------- pemilih tanggal lahir ----------
   Satu kolom isian + kalender pop-up. Kepalanya pakai menu bulan dan tahun,
   bukan panah bulan-per-bulan: tanggal lahir jaraknya puluhan tahun, dan
   menyusurinya satu bulan sekali butuh ratusan ketukan. */
.dp{position:relative}
.dp-btn{display:flex;align-items:center;gap:11px;width:100%;height:48px;padding:0 14px;
  border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  font:400 14.5px/1 "Poppins",system-ui,sans-serif;text-align:left;cursor:pointer;
  transition:border-color .15s ease,box-shadow .15s ease}
.dp-btn:hover{border-color:var(--ink-3)}
.dp-btn[aria-expanded="true"]{border-color:var(--blue);box-shadow:0 0 0 4px var(--ring)}
.dp-btn:focus-visible{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px var(--ring)}
.dp-btn svg{width:17px;height:17px;flex:none;color:var(--ink-3)}
.dp-btn .val{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dp-btn.kosong .val{color:var(--ink-3)}
.f.salah .dp-btn{border-color:var(--red)}

.dp-pop{position:absolute;z-index:50;top:calc(100% + 8px);left:0;width:min(310px,100%);
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--sh-lg);padding:12px;animation:dpIn .14s ease}
.dp-pop[hidden]{display:none}
@keyframes dpIn{from{opacity:0;transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.dp-pop{animation:none}}

.dp-head{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.dp-nav{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  border:1px solid var(--line);background:var(--card);color:var(--ink-2);cursor:pointer}
.dp-nav:hover:not(:disabled){border-color:var(--blue);color:var(--blue-ink);background:var(--blue-wash)}
.dp-nav:disabled{opacity:.35;cursor:not-allowed}
.dp-nav svg{width:15px;height:15px}
.dp-sel{flex:1;min-width:0;height:34px;padding:0 26px 0 9px;border-radius:9px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;
  font:500 13px/1 "Poppins",system-ui,sans-serif;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),
    linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 15px) 15px,calc(100% - 11px) 15px;
  background-size:4px 4px,4px 4px;background-repeat:no-repeat}
.dp-sel:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--ring)}
.dp-sel.thn{flex:0 0 78px}

.dp-dow,.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dp-dow{margin-bottom:4px}
.dp-dow span{text-align:center;font-size:10.5px;font-weight:600;letter-spacing:.04em;
  text-transform:uppercase;color:var(--ink-3);padding:4px 0}
.dp-day{height:34px;border-radius:100px;border:1px solid transparent;background:transparent;
  color:var(--ink);font:400 13px/1 "Poppins",system-ui,sans-serif;cursor:pointer;
  display:grid;place-items:center;font-variant-numeric:tabular-nums}
.dp-day:hover{background:var(--bg-alt)}
.dp-day:focus-visible{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--ring)}
.dp-day.on{background:var(--blue);color:var(--btn-ink);font-weight:600}
.dp-day.on:hover{background:var(--blue-hover)}
.dp-kosong{height:34px}

.dp-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.dp-hint{font-size:11.5px;color:var(--ink-3)}
.inp::placeholder{color:var(--ink-3)}
.inp:focus,.sel:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px var(--ring)}
.sel{appearance:none;cursor:pointer;padding-right:38px;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),
    linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 19px) 21px,calc(100% - 14px) 21px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.sel:disabled{background-color:var(--bg-alt);color:var(--ink-3);cursor:not-allowed}
.ta{width:100%;min-height:78px;padding:12px 14px;border-radius:11px;resize:vertical;
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  font:400 15px/1.55 "Poppins",system-ui,sans-serif}
.ta::placeholder{color:var(--ink-3)}
.ta:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px var(--ring)}

/* nomor telepon dengan awalan negara */
.tel{display:flex;align-items:center;height:48px;border-radius:11px;
  border:1px solid var(--line);background:var(--card);
  transition:border-color .15s ease,box-shadow .15s ease}
.tel:focus-within{border-color:var(--blue);box-shadow:0 0 0 4px var(--ring)}
.tel-pfx{display:flex;align-items:center;gap:6px;padding:0 12px;height:100%;
  border-right:1px solid var(--line);font-size:14px;color:var(--ink-2);white-space:nowrap}
.tel input{flex:1;min-width:0;height:100%;border:0;background:transparent;color:var(--ink);
  padding:0 14px;font:400 15px/1 "Poppins",system-ui,sans-serif;letter-spacing:.01em}
.tel input:focus{outline:none}
.tel input::placeholder{color:var(--ink-3)}

/* pilihan pil (jenis kelamin) */
.pills{display:flex;gap:9px;flex-wrap:wrap}
.pill-r{position:relative}
.pill-r input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.pill-r span{display:block;padding:10px 20px;border-radius:100px;border:1px solid var(--line);
  background:var(--card);font-size:14px;color:var(--ink-2);
  transition:border-color .15s ease,background .15s ease,color .15s ease}
.pill-r input:checked + span{border-color:var(--blue);background:var(--blue-wash);
  color:var(--blue-ink);font-weight:500}
.pill-r input:focus-visible + span{outline:3px solid var(--ring);outline-offset:2px}

/* saran cepat */
.sug{display:flex;gap:7px;flex-wrap:wrap;margin-top:2px}
.sug button{font:500 12px/1 "Poppins",system-ui,sans-serif;padding:7px 13px;border-radius:100px;
  border:1px dashed var(--line);background:transparent;color:var(--ink-3);cursor:pointer;
  transition:border-color .15s ease,color .15s ease,background .15s ease}
.sug button:hover{border-style:solid;border-color:var(--blue);color:var(--blue-ink);
  background:var(--blue-wash)}
.kerja-lain{margin-top:10px}
.hitung{font-size:11.5px;color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums}

/* ---------- aksi ---------- */
.act{margin-top:26px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.act .btn.lead{width:100%}
@media(min-width:620px){.act .btn.lead{width:auto}}
.act-sub{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3)}
.act-sub .simpan{display:inline-flex;align-items:center;gap:6px;color:var(--green)}
.act-sub .simpan svg{width:13px;height:13px}
.lnk{color:var(--blue-ink);text-decoration:none;border-bottom:1px solid var(--blue);
  padding-bottom:1px;cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;
  font:inherit;font-size:12.5px}
.lnk:hover{color:var(--blue-hover)}

.tag.kosong{border-style:dashed;background:transparent;color:var(--ink-3)}

/* ============================================================
   Buat halaman komunitas — layar pengurus.
   Komponen barunya cuma empat: pemilih logo, petak warna tema,
   kartu pertanyaan, dan keadaan selesai. Sisanya .blk/.f/.prog/.act
   yang sudah dipakai layar lengkapi profil — yang dijanjikan ke
   pengurus dan yang dijanjikan ke anggota harus satu benda.
   ============================================================ */
.logopick{display:flex;align-items:flex-start;gap:16px}
.logopick-kotak{position:relative;flex:none}
.logopick-kotak .logo-sq{width:76px;height:76px;border-radius:16px}
.logopick-cam{position:absolute;right:-5px;bottom:-5px;width:30px;height:30px;border-radius:100px;
  border:2px solid var(--card);background:var(--blue);color:var(--btn-ink);
  display:grid;place-items:center;cursor:pointer}
.logopick-cam:hover{background:var(--blue-hover)}
.logopick-cam:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.logopick-cam svg{width:15px;height:15px}
.logopick-t{min-width:0;flex:1}
.logopick-t .f-why{margin-top:5px;max-width:44ch}
.logopick-aksi{margin-top:9px}

/* petak sementara: komunitas baru belum punya berkas logo, jadi inisialnya
   dipakai di atas warna tema yang barusan dipilih */
.logo-sq.baru{background-color:var(--blue);border-color:transparent;color:var(--btn-ink);
  display:grid;place-items:center;font-size:21px;font-weight:600;letter-spacing:-.02em}

/* warna tema — ketetapan pengurus, dipilih sekali di sini. Tidak ada
   pemilih warna di tampilan anggota, dan memang tidak boleh ada. */
.tema{display:flex;gap:11px;flex-wrap:wrap}
.tema-r{position:relative;width:32px;height:32px}
.tema-r input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.tema-r span{display:block;width:100%;height:100%;border-radius:100px;
  box-shadow:inset 0 0 0 1px rgba(34,34,34,.1)}
.tema-r input:checked + span{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink)}
.tema-r input:focus-visible + span{outline:3px solid var(--ring);outline-offset:4px}

/* alamat halaman: satu-satunya bagian yang benar-benar disebar ke grup */
.slug{display:flex;align-items:center;height:48px;border-radius:11px;
  border:1px solid var(--line);background:var(--card);
  transition:border-color .15s ease,box-shadow .15s ease}
.slug:focus-within{border-color:var(--blue);box-shadow:0 0 0 4px var(--ring)}
.slug-pfx{padding:0 2px 0 14px;font-size:14.5px;color:var(--ink-3);white-space:nowrap}
.slug input{flex:1;min-width:0;height:100%;border:0;background:transparent;color:var(--ink);
  padding:0 14px 0 0;font:500 14.5px/1 "Poppins",system-ui,sans-serif}
.slug input:focus{outline:none}
.slug input::placeholder{color:var(--ink-3);font-weight:400}

/* kartu pertanyaan pendaftaran */
.qlist{display:flex;flex-direction:column;gap:12px}
.qcard{border:1px solid var(--line);border-radius:13px;padding:14px;background:var(--bg-alt);
  display:flex;flex-direction:column;gap:11px}
.qcard-h{display:flex;align-items:center;gap:10px}
.qcard-no{flex:none;width:24px;height:24px;border-radius:100px;background:var(--blue-wash);
  color:var(--blue-ink);display:grid;place-items:center;font-size:11.5px;font-weight:600}
.qcard-h .inp{height:42px;min-width:0;font-weight:500}
.qcard-x{flex:none;width:32px;height:32px;border-radius:100px;border:1px solid var(--line);
  background:var(--card);color:var(--ink-3);display:grid;place-items:center;cursor:pointer}
.qcard-x:hover{border-color:var(--red);color:var(--red);background:var(--red-wash)}
.qcard-x svg{width:14px;height:14px}
.qcard .inp{background:var(--card)}
.qfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.qfoot .pill-r span{padding:7px 14px;font-size:12.5px}
.qcard.salah .inp{border-color:var(--red)}
.qcard.salah .f-galat{display:block}

/* kartu nama panggilan tidak bisa dihapus — di kolavo.app pun terkunci,
   dan memang itu satu-satunya cara menyapa orang di daftar anggota */
.qcard.kunci{background:var(--card);border-style:dashed}
.qcard.kunci .inp{background:var(--bg-alt);color:var(--ink-2);cursor:not-allowed}
.qcard-kunci{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--ink-3);
  line-height:1.5}
.qcard-kunci svg{width:14px;height:14px;flex:none;margin-top:2px}
.qtambah{width:100%;height:44px;border-radius:11px;border:1px dashed var(--line);
  background:transparent;color:var(--ink-2);cursor:pointer;
  font:500 13.5px/1 "Poppins",system-ui,sans-serif;
  transition:border-color .15s ease,color .15s ease,background .15s ease}
.qtambah:hover:not(:disabled){border-style:solid;border-color:var(--blue);color:var(--blue-ink);
  background:var(--blue-wash)}
.qtambah:disabled{opacity:.5;cursor:not-allowed}

/* sakelar "wajib diisi" */
.sw{display:inline-flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-2);
  cursor:pointer;position:relative}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw i{width:36px;height:21px;border-radius:100px;background:var(--line);position:relative;
  flex:none;transition:background .15s ease}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;
  border-radius:100px;background:var(--card);box-shadow:var(--sh-sm);
  transition:transform .15s ease}
.sw input:checked + i{background:var(--blue)}
.sw input:checked + i::after{transform:translateX(15px)}
.sw input:focus-visible + i{outline:3px solid var(--ring);outline-offset:2px}

/* keadaan selesai — yang dibutuhkan pengurus sesudah ini cuma linknya */
.done{display:flex;flex-direction:column;align-items:center;text-align:center}
.done-ic{width:56px;height:56px;border-radius:100px;background:var(--green-wash);
  color:var(--green);display:grid;place-items:center;margin-bottom:20px}
.done-ic svg{width:26px;height:26px}
.done .ph-lede{margin-bottom:26px}
.done .pf-item{width:100%;text-align:left;background:var(--card);border:1px solid var(--line)}
.done .steps{width:100%;text-align:left;margin-top:26px}
.linkrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;
  width:100%;margin-top:14px;padding:12px 12px 12px 16px;border-radius:13px;
  border:1px dashed var(--line);background:var(--bg-alt)}
.linkrow-url{flex:1;min-width:0;text-align:left;font-size:14.5px;font-weight:500;
  color:var(--ink);word-break:break-all}
.status.pengurus{background:var(--blue-wash);color:var(--blue-ink)}
.blk-ic.cat{background:var(--bg-alt);color:var(--blue-ink)}




/* ============================================================
   Prototipe berjalan — router, keadaan masuk, layar profil.
   Satu berkas, tiga layar. Bukan aplikasi sungguhan: tidak ada
   jaringan, tidak ada penyimpanan, muat ulang mengulang dari awal.
   ============================================================ */
/* [hidden] wajib menang atas display bawaan kelas. Bug yang sudah pernah
   terjadi di halaman ini: tombol tersembunyi tetap tampil karena .btn
   menyetel display:inline-flex, dan [hidden] kalah spesifisitas. */
.btn[hidden],.scr[hidden],.acct[hidden],.blk-galat[hidden],.pill[hidden],
.blk[hidden],.idcard[hidden],.idedit[hidden],.done[hidden]{display:none}

.scr{animation:scrIn .22s ease}
@keyframes scrIn{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){.scr{animation:none}}

/* penanda demo — jujur bahwa ini prototipe, sekaligus jalan mengulang */
.demo{position:fixed;left:16px;bottom:16px;z-index:60;display:flex;align-items:center;gap:9px;
  padding:8px 8px 8px 13px;border-radius:100px;background:var(--card);
  border:1px solid var(--line);box-shadow:var(--sh);font-size:12px;color:var(--ink-3)}
.demo b{font-weight:600;color:var(--ink-2)}
.demo button{font:500 11.5px/1 "Poppins",system-ui,sans-serif;padding:6px 12px;border-radius:100px;
  border:1px solid var(--line);background:var(--bg-alt);color:var(--ink-2);cursor:pointer}
.demo button:hover{border-color:var(--blue);color:var(--blue-ink);background:var(--blue-wash)}
/* tombol yang memerankan pengurus, bukan pengguna — dibedakan warnanya supaya
   tidak terbaca sebagai kendali yang ada di produk sungguhan */
.demo button.setuju{border-color:var(--green);color:var(--green);background:var(--green-wash)}
.demo button.setuju:hover{border-color:var(--green);color:var(--green);background:var(--green-wash);filter:brightness(.97)}
@media(max-width:640px){.demo{left:10px;bottom:10px}}

/* pemberitahuan setelah aksi berhasil */
.toast{position:fixed;left:50%;bottom:26px;z-index:70;transform:translate(-50%,14px);
  display:flex;align-items:center;gap:11px;max-width:min(440px,calc(100vw - 32px));
  padding:13px 18px;border-radius:14px;background:var(--card);border:1px solid var(--green);
  box-shadow:var(--sh-lg);font-size:13.5px;color:var(--ink);
  opacity:0;pointer-events:none;transition:opacity .22s ease,transform .22s ease}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast .ic{flex:none;width:26px;height:26px;border-radius:100px;display:grid;place-items:center;
  background:var(--green-wash);color:var(--green)}
.toast .ic svg{width:14px;height:14px}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

/* kolom yang belum diisi saat tombol simpan ditekan */
.f.salah .inp,.f.salah .sel,.f.salah .tel{border-color:var(--red)}
.f.salah .pill-r span{border-color:var(--red)}
.f-galat{display:none;font-size:12.5px;color:var(--red);line-height:1.5}
.f.salah .f-galat{display:block}
.blk-galat{display:flex;align-items:flex-start;gap:9px;padding:12px 14px;border-radius:11px;
  background:var(--red-wash);border:1px solid var(--red-line);font-size:13px;color:var(--red);
  line-height:1.55}
.blk-galat[hidden]{display:none}
.blk-galat svg{width:16px;height:16px;flex:none;margin-top:2px}

/* ---------- layar profil (sesudah lengkap) ---------- */
.pf{padding:34px 0 96px}
.pf-page{display:flex;align-items:center;gap:9px;padding-bottom:16px;margin-bottom:26px;
  border-bottom:1px solid var(--line);
  font-size:12.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3)}
.pf-page svg{width:15px;height:15px;flex:none}
.pf-top{display:flex;flex-direction:column;align-items:center;gap:15px;text-align:center;
  padding-bottom:32px;border-bottom:1px solid var(--line)}
.pf-foto{width:118px;height:118px;border-radius:26px;background-color:var(--bg-alt);
  background-repeat:no-repeat;background-position:center 42%;background-size:cover}
.pf-nm{font-size:clamp(21px,2.6vw,27px);font-weight:600;letter-spacing:-.02em}
.pf-loc{font-size:14px;color:var(--ink-3)}
.pf-tags{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.pf-h{margin:34px 0 16px;font-size:17px;font-weight:600;letter-spacing:-.01em}
.pf-list{display:grid;gap:12px}
@media(min-width:760px){.pf-list{grid-template-columns:1fr 1fr}}
.pf-item{display:flex;flex-wrap:wrap;align-items:center;gap:13px;padding:16px;border-radius:14px;
  background:var(--card);border:1px solid var(--line);box-shadow:var(--sh-sm)}
.pf-item .logo-sq{width:46px;height:46px;border-radius:13px;border:none;flex:none}
.pf-item .t{min-width:0;flex:1}
.pf-item .n{font-size:14.5px;font-weight:600;line-height:1.35}
.pf-item .s{font-size:12.5px;color:var(--ink-3);line-height:1.4}
.status{flex:none;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  padding:5px 11px;border-radius:100px}
.status.tunggu{background:var(--orange-wash);color:var(--orange-ink)}
.status.anggota{background:var(--green-wash);color:var(--green)}
.status.arsip{background:var(--bg-alt);color:var(--ink-3)}
.pf-open{display:flex;align-items:center;gap:13px;flex:1 1 auto;min-width:0;cursor:pointer}
.pf-open:focus-visible{outline:3px solid var(--ring);outline-offset:2px;border-radius:12px}
.pf-item-aksi{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-left:auto}
.pf-aksi-btn{display:flex;gap:6px;flex-wrap:wrap}
.pf-mini{font-family:inherit;font-size:12px;font-weight:600;height:30px;padding:0 12px;border-radius:100px;border:1px solid var(--line);background:var(--card);color:var(--ink-2);cursor:pointer;transition:background .15s ease,color .15s ease}
.pf-mini:hover{background:var(--bg-alt);color:var(--ink)}
.pf-mini.danger{color:var(--red);border-color:var(--red-line)}
.pf-mini.danger:hover{background:var(--red-wash)}
.pf-item--arsip{opacity:.72}
.pf-konf-t{font-size:12px;font-weight:600;color:var(--red)}
.pf-menu{display:flex;gap:6px;flex-wrap:wrap}
.pf-ic{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink-2);cursor:pointer;transition:background .15s ease,color .15s ease,border-color .15s ease}
.pf-ic:hover{background:var(--bg-alt);color:var(--ink)}
.pf-ic:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.pf-ic svg{width:17px;height:17px}
.pf-ic.danger{color:var(--red);border-color:var(--red-line)}
.pf-ic.danger:hover{background:var(--red-wash);color:var(--red)}

/* ============================================================
   Halaman komunitas.
   Masalah yang dipecahkan: daftar anggotanya terkunci, tapi justru
   isinya itu alasan orang mau gabung. Jawabannya angka agregat —
   profesi, kota, rentang angkatan — yang menjual isinya tanpa
   membuka satu identitas pun.
   ============================================================ */
.kom{padding:34px 0 96px}
.kom-jalur{display:flex;align-items:center;gap:8px;padding-bottom:14px;margin-bottom:22px;
  border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink-3)}
.kom-jalur button{font:inherit;color:var(--blue-ink);background:none;border:0;padding:0;cursor:pointer}
.kom-jalur button:hover{color:var(--blue-hover)}
.kom-jalur svg{width:13px;height:13px;flex:none}
.kom-jalur .kini{font-weight:600;color:var(--ink-2);min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}

/* align-items:center mengikuti situs live (md:items-center) — logo sejajar
   tengah dengan blok teksnya, bukan menempel ke baris judul */
.kom-head{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
/* borderless: .logo-sq dasar menyetel border, di sini tidak dipakai */
.kom-logo{width:96px;height:96px;border-radius:20px;flex:none;border:none;
  background-color:transparent;background-repeat:no-repeat;background-position:center;
  background-size:contain}
.kom-t{flex:1;min-width:min(100%,260px);display:flex;flex-direction:column;gap:9px}
.kom-nm{font-size:clamp(22px,2.9vw,30px);font-weight:600;letter-spacing:-.024em;line-height:1.2}
.kom-alias{font-size:15px;font-weight:500;color:var(--ink-2);line-height:1.4;margin-bottom:2px}
.kom-meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:13px;color:var(--ink-3)}
.kom-meta .titik{opacity:.5}
.kom-desc{font-size:15px;color:var(--ink-2);line-height:1.6;max-width:60ch}

.kom-aksi{display:flex;flex-direction:column;gap:10px;align-items:stretch;min-width:212px}
@media(max-width:640px){.kom-aksi{width:100%}}
.kom-aksi .btn{width:100%}
.kom-aksi .catat{font-size:12px;color:var(--ink-3);line-height:1.5;text-align:center}
/* aksi utama + tombol ikon (edit data pendaftaran, bagikan) dalam satu baris */
.kom-aksi-baris{display:flex;align-items:center;gap:8px}
.kom-aksi-baris>:first-child{flex:1;min-width:0}
.btn-ikon{position:relative;flex:none;display:grid;place-items:center;width:44px;height:44px;padding:0;border-radius:100px;
  border:1px solid var(--blue);background:var(--bg);color:var(--blue-ink);cursor:pointer;transition:background .15s ease}
.btn-ikon:hover{background:var(--blue-wash)}
.btn-ikon:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.btn-ikon svg{width:19px;height:19px}
.btn-ikon::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
  padding:5px 10px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:12px;font-weight:500;white-space:nowrap;
  pointer-events:none;opacity:0;transition:opacity .12s ease;z-index:5}
.btn-ikon:hover::after,.btn-ikon:focus-visible::after{opacity:1}

/* status keanggotaan */
.kom-status{display:flex;align-items:center;gap:9px;padding:12px 16px;border-radius:100px;
  font-size:13.5px;font-weight:500;justify-content:center}
.kom-status svg{width:16px;height:16px;flex:none}
.kom-status.tunggu{background:var(--orange-wash);color:var(--orange-ink)}
.kom-status.anggota{background:var(--green-wash);color:var(--green)}

/* ---------- angka ---------- */
.kom-stat{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;margin-top:18px;
  background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
@media(min-width:700px){.kom-stat{grid-template-columns:repeat(4,1fr)}}
/* kotak angka ikut warna tema komunitasnya — inilah tempat temanya terlihat
   sekarang, setelah pemilih warnanya dilepas dari tampilan anggota */
.kom-stat > div{background:var(--blue-wash);padding:17px 18px;display:flex;flex-direction:column;gap:3px}
.kom-stat .n{font-size:21px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  color:var(--blue-ink)}
.kom-stat .k{font-size:12px;color:var(--ink-3)}

/* ---------- yang ada di dalam ---------- */
.kom-sec{margin-top:18px}
.kom-h{font-size:17px;font-weight:600;letter-spacing:-.01em}
.kom-sub{margin-top:4px;font-size:13.5px;color:var(--ink-3);line-height:1.5;max-width:62ch}
.agg{margin-top:12px;display:grid;gap:12px}
@media(min-width:760px){.agg{grid-template-columns:1fr 1fr;gap:22px}}
.agg-blok{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.agg-lbl{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:13px}
.agg-baris{display:flex;flex-direction:column;gap:9px}
.agg-item{display:flex;align-items:center;gap:11px;font-size:13.5px}
.agg-item .nm{flex:none;min-width:0;max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agg-bar{flex:1;height:7px;border-radius:100px;background:var(--bg-alt);overflow:hidden}
.agg-bar i{display:block;height:100%;border-radius:100px;background:var(--blue)}
.agg-item .n{flex:none;width:22px;text-align:right;color:var(--ink-3);font-size:12.5px;
  font-variant-numeric:tabular-nums}
.agg-item.lain .nm{color:var(--ink-3)}
.agg-item.lain .agg-bar i{background:var(--line)}

/* ---------- daftar anggota terkunci ---------- */
.kunci{margin-top:12px;position:relative;border-radius:14px;overflow:hidden;
  border:1px solid var(--line);background:var(--card)}
.kunci-isi{padding:6px 0}
.kunci-baris{display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:center;
  padding:13px 18px;border-bottom:1px solid var(--line-2)}
.kunci-baris:last-child{border-bottom:0}
.kunci-foto{width:40px;height:40px;border-radius:100px;background-color:var(--bg-alt);
  background-repeat:no-repeat;background-position:center 42%;background-size:cover;
  filter:blur(7px);opacity:.85}
/* display:block wajib — span inline mengabaikan height, dan barisnya
   jadi tak terlihat sama sekali di balik tirai */
.kunci-bar{display:block;height:11px;border-radius:100px;background:var(--line)}
.kunci-bar + .kunci-bar{margin-top:9px;height:9px;background:var(--line-2)}
.kunci-tirai{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:9px;text-align:center;padding:20px;
  background:linear-gradient(180deg,rgb(var(--kabut)/.18) 0%,rgb(var(--kabut)/.86) 55%,rgb(var(--kabut)/.96) 100%)}
.kunci-ic{width:40px;height:40px;border-radius:100px;display:grid;place-items:center;
  background:var(--card);border:1px solid var(--line);color:var(--ink-2)}
.kunci-ic svg{width:18px;height:18px}
.kunci-t{font-size:14.5px;font-weight:600}
.kunci-s{font-size:12.5px;color:var(--ink-2);max-width:38ch;line-height:1.5}

/* ---------- daftar anggota terbuka ----------
   Sengaja memakai .panel/.m/.tags yang sama persis dengan panel di hero:
   yang dijanjikan di beranda dan yang didapat setelah diterima harus satu
   benda, bukan dua desain yang mirip. */
.buka{margin-top:12px}
/* audit membaca ".buka .nm-baris{display:flex}" sebagai .buka menyetel display —
   keliru, tapi penjaganya murah dan kelas bug ini pernah benar-benar terjadi */
.buka[hidden]{display:none}
.buka .panel-filters{overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.buka .panel-filters::-webkit-scrollbar{display:none}
.buka .chip{cursor:pointer;white-space:nowrap;flex:none}
.buka .chip.on{cursor:default}
/* kisi kartu, bukan baris menyambung — biar terasa seperti menjelajah profil
   (medsos), bukan membaca tabel administratif. Satu kolom di layar sempit,
   dua di >=640px. */
#bukaList{display:grid;grid-template-columns:1fr;gap:10px;padding:6px 4px 4px}
@media(min-width:640px){#bukaList{grid-template-columns:1fr 1fr}}
.buka .av{flex:none;width:54px;height:54px;font-size:17px}
.buka .nm-baris{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.buka .aku{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 8px;border-radius:100px;background:var(--green-wash);color:var(--green)}
.buka-kosong{padding:24px 18px;font-size:13px;color:var(--ink-3);text-align:center;grid-column:1/-1}
/* "Lihat berdasarkan" diambil dari kolavo.app — di sana sumbunya jadi pengalih
   di dalam modal. Di sini dinaikkan ke daftarnya, dan diberi label: di live
   nilai semua pertanyaan tercampur dalam satu baris datar tanpa keterangan,
   sehingga "2010" dan "Teknik Informatika" terbaca sebagai hal yang sejenis. */
.buka-sumbu{align-items:center;gap:8px}
.buka-lbl{font-size:11.5px;font-weight:500;color:var(--ink-3);margin-right:2px}
.buka-sumbu .chip{font-size:11.5px;padding:5px 11px}
/* status kenalan per kartu + progres di atas daftar — mendorong mengajak kenalan.
   Hijau untuk "sudah kenal" menyamai blok kenalan di detail anggota. */
.kn-prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:6px 4px 14px}
.kn-prog[hidden]{display:none}
.kn-ring{position:relative;width:64px;height:64px;flex:none}
.kn-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.kn-ring circle{fill:none;stroke-width:5}
.kn-ring .jalur{stroke:var(--line)}
.kn-ring .isi{stroke:var(--green);stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.kn-ring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--green)}
.kn-ring-in svg{width:16px;height:16px;transform:none;stroke-width:1.5}
.kn-ring-in b{font-size:13px;font-weight:600;line-height:1;color:var(--ink)}
.kn-prog-t{display:flex;flex-direction:column;gap:2px;flex:1 1 180px;min-width:0;font-size:12.5px;color:var(--ink-2);line-height:1.45}
.kn-prog-t b{font-size:14px;font-weight:600;color:var(--ink)}
.kn-prog .chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:5px 11px}
.kn-prog .chip svg{width:14px;height:14px;flex:none}
/* ikon status di ujung kanan kartu anggota; labelnya lewat title + aria-label */
.buka .m:has(> .kn-ic){grid-template-columns:auto 1fr auto}
.kn-ic{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:100px;flex:none;border:1px solid transparent}
.kn-ic svg{width:18px;height:18px}
.kn-ic.belum{border:1.5px dashed var(--orange);color:var(--orange-ink);background:var(--orange-wash)}
.kn-ic.menunggu{border-color:var(--line);color:var(--ink-2);background:var(--bg-alt)}
.kn-ic.terhubung{color:var(--green);background:var(--green-wash)}

/* ---------- pengurus ----------
   Section-nya dilepas dari halaman komunitas atas permintaan ("untuk sekarang").
   Aturan ini dan larik `pengurus` di data komunitas sengaja dibiarkan supaya
   memasangnya lagi cukup mengembalikan satu <section> dan satu baris render. */
.peng{margin-top:12px;display:grid;gap:12px}
@media(min-width:620px){.peng{grid-template-columns:1fr 1fr}}
.peng-i{display:flex;align-items:center;gap:13px;padding:14px 16px;border-radius:14px;
  background:var(--card);border:1px solid var(--line)}
.peng-i .av{width:44px;height:44px;flex:none}
.peng-nm{font-size:14.5px;font-weight:600;line-height:1.35}
.peng-j{font-size:12.5px;color:var(--ink-3)}
button.peng-i{width:100%;font:inherit;color:inherit;text-align:left;cursor:pointer;transition:border-color .15s ease,box-shadow .15s ease}
button.peng-i:hover{border-color:var(--blue);box-shadow:var(--sh-sm)}
button.peng-i:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
/* pop up profil pengurus */
.lgn-box.peng-box{max-width:420px;padding:32px 28px 26px}
.peng-pp{display:flex;justify-content:center}
.peng-pp .av{width:88px;height:88px;font-size:28px}
.peng-pp-nm{font-size:21px;margin-top:14px}
.peng-pp-j{font-size:13.5px;color:var(--ink-2);margin-top:4px}
.peng-pp-kenal{margin-top:18px;padding:14px 16px;border-radius:13px;background:var(--bg-alt);border:1px solid var(--line);text-align:left}
.peng-pp-lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.peng-pp-kenal p{font-size:14px;line-height:1.6;color:var(--ink)}
.peng-pp-kenal p.peng-pp-kosong{color:var(--ink-3)}

/* ---------- detail anggota ----------
   Urutannya sengaja dibalik dari kolavo.app. Di sana blok terbesar adalah
   "Riwayat Persetujuan" — arsip administratif yang berguna buat pengurus, bukan
   buat sesama anggota — dan komunitas lain yang dia ikuti ditaruh paling bawah.
   Di sini yang paling atas adalah apa yang orangnya kerjakan sekarang, karena
   itu yang dicari orang waktu membuka profil sesama anggota. */
.ag-head{display:flex;gap:20px;align-items:flex-start;margin-top:20px;flex-wrap:wrap}
.ag-foto{width:104px;height:104px;border-radius:20px;flex:none;
  background-repeat:no-repeat;background-position:center 42%;background-size:cover}
.ag-foto.ini{display:grid;place-items:center;font-size:30px;font-weight:600;letter-spacing:-.02em}
.ag-foto.a{background-color:var(--blue-wash);color:var(--blue-ink)}
.ag-foto.b{background-color:var(--orange-wash);color:var(--orange-ink)}
.ag-foto.c{background-color:var(--green-wash);color:var(--green)}
.ag-t{flex:1;min-width:240px}
.ag-nm{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.25}
@media(min-width:700px){.ag-nm{font-size:30px}}
.ag-kerja{margin-top:6px;font-size:15px;color:var(--ink-2);line-height:1.5}
.ag-head .tags{margin-top:12px}
.ag-bio{margin-top:20px;padding:16px 18px;border-radius:13px;background:var(--bg-alt);
  border:1px solid var(--line);font-size:14px;line-height:1.65;color:var(--ink-2)}
.ag-catat{margin-top:24px;display:flex;gap:9px;align-items:flex-start;font-size:12.5px;
  color:var(--ink-3);line-height:1.55}
.ag-catat svg{width:15px;height:15px;flex:none;margin-top:2px}

/* nama lengkap + baris meta (lokasi, anggota sejak) — dua-duanya ada di
   kolavo.app, sebelumnya belum dibawa ke prototipe */
.ag-full{margin-top:3px;font-size:14px;color:var(--ink-3)}
.ag-meta{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px 18px}
.ag-meta span{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2)}
.ag-meta svg{width:15px;height:15px;flex:none;color:var(--ink-3)}

/* ---------- kenalan ----------
   kolavo.app memajang nomor WhatsApp ke semua sesama anggota, padahal di
   /profile/edit-nya sendiri tertulis "Nomor WhatsApp — hanya ditampilkan ke
   admin komunitas kamu". Janjinya dilanggar halamannya sendiri. Di sini
   nomornya kebuka lewat persetujuan dua arah: satu minta, satu menerima. */
.ag-kenal{margin-top:20px;padding:18px;border-radius:14px;border:1px solid var(--line);
  background:var(--card)}
.ag-kenal.buka{border-color:var(--green);background:var(--green-wash)}
.ag-kenal-h{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
.ag-kenal-h svg{width:17px;height:17px;flex:none}
.ag-kenal.buka .ag-kenal-h{color:var(--green)}
.ag-kenal-s{margin-top:6px;font-size:13px;color:var(--ink-2);line-height:1.6;max-width:56ch}
.ag-kenal .btn{margin-top:14px}
.ag-wa{margin-top:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ag-wa-n{font-size:19px;font-weight:600;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.ag-kenal.buka .ag-wa-n{color:var(--green)}
/* barisnya bisa diklik — tanpa penanda ini tidak ada yang tahu ada isinya.
   Tiap baris jadi kartu sendiri (border + radius selalu tampak, bukan cuma
   garis pemisah) supaya kisinya terbaca sebagai kumpulan profil yang bisa
   dijelajah, bukan tabel administratif. */
.buka .m{cursor:pointer;border:1px solid var(--line);border-radius:13px;
  border-bottom:1px solid var(--line);background:var(--card);
  transition:box-shadow .15s ease,border-color .15s ease,transform .15s ease}
.buka .m:hover{background:var(--card);box-shadow:var(--sh);border-color:var(--blue);transform:translateY(-1px)}
.buka .m:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
/* baris sendiri sedikit ditonjolkan — sapaan "ini kamu", bukan cuma label */
.buka .m:has(.aku){border-color:var(--green)}

/* ---------- tombol contoh halaman di layar buat ---------- */
.buat-pratinjau{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:2px 0 26px}
.buat-pratinjau-note{font-size:12.5px;color:var(--ink-3);line-height:1.5}

/* ---------- lonceng notifikasi pengguna (nav) ---------- */
.notif{position:relative}
.notif-btn{position:relative;width:48px;height:48px;border-radius:100px;border:1px solid var(--line);background:var(--card);color:var(--ink-2);
  display:grid;place-items:center;cursor:pointer;transition:background .15s ease,border-color .15s ease,color .15s ease}
.notif-btn:hover{border-color:var(--blue);background:var(--blue-wash);color:var(--blue-ink)}
.notif-btn:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.notif-btn svg{width:21px;height:21px}
.notif-n{position:absolute;top:3px;right:2px;min-width:19px;height:19px;padding:0 5px;border-radius:100px;border:2px solid var(--card);
  background:var(--orange);color:var(--btn-ink);font-size:10.5px;font-weight:700;display:grid;place-items:center}
.notif-n[hidden]{display:none}
.notif-panel{position:absolute;top:calc(100% + 10px);right:0;width:340px;z-index:40;background:var(--card);border:1px solid var(--line);
  border-radius:16px;box-shadow:var(--sh-lg);padding:8px}
.notif-panel[hidden]{display:none}
@media(max-width:600px){.notif-panel{position:fixed;top:72px;left:16px;right:16px;width:auto}}
.notif-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px 10px;font-size:14px}
.notif-semua{font:inherit;font-size:12px;font-weight:600;color:var(--blue-ink);background:none;border:0;cursor:pointer;padding:4px}
.notif-semua:focus-visible{outline:3px solid var(--ring);border-radius:6px}
.notif-list{display:grid;gap:2px;max-height:360px;overflow-y:auto}
.notif-i{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;font-family:inherit;padding:10px;border:0;border-radius:11px;
  background:none;color:var(--ink);cursor:pointer}
.notif-i:hover{background:var(--bg-alt)}
.notif-i:focus-visible{outline:3px solid var(--ring);outline-offset:-2px}
.notif-i.baru{background:var(--blue-tint)}
.notif-ic{flex:none;width:34px;height:34px;border-radius:100px;display:grid;place-items:center;background:var(--bg-alt);color:var(--ink-2)}
.notif-ic.diterima{background:var(--green-wash);color:var(--green)}
.notif-ic.kenalan{background:var(--blue-wash);color:var(--blue-ink)}
.notif-ic.terkirim{background:var(--orange-wash);color:var(--orange-ink)}
.notif-ic svg{width:17px;height:17px}
.notif-i .t{min-width:0;display:grid;gap:1px}
.notif-i b{font-size:13.5px;font-weight:600;line-height:1.35}
.notif-i .t span{font-size:12.5px;color:var(--ink-2);line-height:1.45}
.notif-i small{font-size:11.5px;color:var(--ink-3)}
.notif-kosong{padding:14px 10px 16px;font-size:13px;color:var(--ink-2);line-height:1.5}

/* ---------- modal onboarding anggota baru ---------- */
.lgn-box.ob-box{max-width:760px;text-align:left;padding:34px 40px 28px}
@media(max-width:640px){.lgn-box.ob-box{padding:26px 20px 20px}}
.ob-pratinjau{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--orange-ink);
  background:var(--orange-wash);padding:3px 9px;border-radius:100px;margin-bottom:10px}
/* stepper berikon: garis progres di belakang ikon, terisi sampai langkah kini */
.ob-step-w{position:relative;margin:4px 36px 0 0}
.ob-step-rel{position:absolute;top:21px;left:calc(50% / var(--n));right:calc(50% / var(--n));height:3px;border-radius:3px;background:var(--line)}
.ob-step-isi{display:block;height:100%;border-radius:3px;background:var(--blue);transition:width .4s cubic-bezier(.4,0,.2,1)}
.ob-step{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);margin:0;padding:0;list-style:none}
.ob-step li{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-size:12px;line-height:1.3;color:var(--ink-3)}
.ob-step span{flex:none;width:44px;height:44px;border-radius:100px;display:grid;place-items:center;background:var(--card);
  border:1.5px solid var(--line);color:var(--ink-3);transition:background .3s ease,border-color .3s ease,color .3s ease,box-shadow .3s ease}
.ob-step span svg{width:20px;height:20px}
.ob-step em{font-style:normal;display:none}
.ob-step li.lewat span{border-color:var(--blue);background:var(--blue-wash);color:var(--blue-ink)}
.ob-step li.lewat em{color:var(--ink-2)}
.ob-step li.kini span{border-color:var(--blue);background:var(--blue);color:var(--btn-ink);box-shadow:0 0 0 5px var(--blue-wash)}
.ob-step li.kini em{display:block;color:var(--ink);font-weight:600}
@media(min-width:620px){.ob-step em{display:block}}
.ob-hitung{margin-top:14px}
/* status ajakan kenalan di kartu orang */
.ob-orang .btn.xs svg{width:14px;height:14px}
.ob-kenal-st{display:inline-flex;align-items:center;gap:5px;flex:none;font-size:12px;font-weight:600;color:var(--ink-2)}
.ob-kenal-st svg{width:14px;height:14px;color:var(--green)}
.ob-kenal-st.ok{color:var(--green)}
.ob-kecil{font-size:12px;color:var(--ink-3);margin-top:4px}
.ob-badan{margin-top:18px;min-height:280px}
.ob-judul{font-size:26px;line-height:1.25;margin-bottom:12px}
.ob-teks{font-size:15.5px;line-height:1.7;color:var(--ink-2);white-space:pre-line}
.ob-ttd{margin-top:16px;display:flex;align-items:center;justify-content:flex-end;gap:11px;color:var(--ink)}
.ob-ttd .av{width:44px;height:44px;flex:none}
.ob-bagian + .ob-bagian{margin-top:14px}
.ob-lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
/* naskah legal: dokumen panjang, jadi judul bagiannya perlu lebih terbaca
   daripada .ob-lbl yang huruf kecil-kapital */
.lgl-sub{margin:-6px 0 4px}
.lgl-bagian + .lgl-bagian{margin-top:18px}
.lgl-h{font-size:15px;font-weight:700;line-height:1.4;color:var(--ink);margin-bottom:4px}
.lgl-p{font-size:14.5px;line-height:1.7;color:var(--ink-2);white-space:pre-line}
/* blok persetujuan di Lengkapi Profil — berdiri sendiri, bukan di dalam .blk,
   jadi jarak atasnya disamakan dengan .blk supaya iramanya tidak putus */
.lgl-baca{margin-top:8px;font-size:12.5px;color:var(--ink-3)}
.lgl-opsi{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
/* pil "Opsional" aslinya cuma hidup di dalam .f-lbl; di sini dipakai di dalam
   teks centang, dan latarnya dibalik jadi --card supaya tidak lebur dengan
   kotak persetujuan yang sudah ber-latar --bg-alt */
.lgl-opsi .opt{margin-left:6px;font-size:10.5px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-3);background:var(--card);
  border-radius:100px;padding:2px 8px;vertical-align:1px}
#fSetuju{margin-top:20px;padding:16px 18px;border:1px solid var(--line);border-radius:13px;background:var(--bg-alt)}
#fSetuju .f-galat{margin-top:8px}
.f.salah#fSetuju{border-color:var(--red)}
.ob-poin{display:grid;gap:8px;margin:4px 0 14px;padding:0;list-style:none}
.ob-poin li{display:flex;gap:10px;font-size:14px;line-height:1.55;color:var(--ink)}
.ob-poin svg{flex:none;width:18px;height:18px;margin-top:2px;color:var(--green)}
.ob-tautan-list{display:grid;gap:8px;margin-top:14px}
.ob-tautan{display:flex;gap:12px;align-items:center;width:100%;text-align:left;font-family:inherit;padding:12px 14px;border-radius:13px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.ob-tautan:hover{border-color:var(--blue);background:var(--blue-tint)}
.ob-tautan:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.ob-tautan > svg{flex:none;width:20px;height:20px;color:var(--blue-ink)}
.ob-tautan b{display:block;font-size:14px;font-weight:600}
.ob-tautan small{display:block;font-size:12px;color:var(--ink-3);word-break:break-all}
.ob-chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.ob-chips .chip{font-family:inherit;cursor:pointer}
.ob-chips .chip i{font-style:normal;opacity:.75;margin-left:2px}
.ob-orang-list{display:grid;gap:8px;margin-top:12px}
.ob-orang{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:13px}
.ob-orang .av{width:40px;height:40px;flex:none}
.ob-orang .t{flex:1;min-width:0}
.ob-orang b{display:block;font-size:14px;font-weight:600}
.ob-orang .t span{display:block;font-size:12.5px;color:var(--ink-2)}
/* peraturan: area bergulir + centang persetujuan (P12) */
.ob-aturan-sub{margin:-6px 0 4px}
.ob-gulir.ob-gulir-baca{max-height:58vh;border-bottom:0}
.ob-gulir{max-height:46vh;overflow-y:auto;overscroll-behavior:contain;margin-top:6px;padding:4px 10px 4px 0;border-bottom:1px solid var(--line)}
.ob-gulir:focus-visible{outline:3px solid var(--ring);border-radius:8px}
.ob-setuju{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:14px;font-weight:500;line-height:1.5;color:var(--ink);cursor:pointer}
.ob-setuju input{flex:none;width:18px;height:18px;margin:2px 0 0;accent-color:var(--blue);cursor:pointer}
.ob-setuju:has(input:disabled){color:var(--ink-3);cursor:not-allowed}
.ob-setuju input:disabled{cursor:not-allowed}
.ob-kaki .btn:disabled{background:var(--disabled);color:var(--ink-3);border-color:transparent;cursor:not-allowed;transform:none}
.ob-kaki{display:flex;gap:8px;align-items:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.ob-sp{flex:1}
.ob-lewati{font:inherit;font-size:13.5px;font-weight:500;color:var(--ink-2);background:none;border:0;cursor:pointer;padding:8px 4px}
.ob-lewati:hover{color:var(--ink)}
.ob-lewati:focus-visible{outline:3px solid var(--ring);border-radius:6px}
.kom-ob-lagi{justify-self:start;font:inherit;font-size:12.5px;font-weight:600;color:var(--blue-ink);background:none;border:0;padding:0;
  cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.kom-ob-lagi:focus-visible{outline:3px solid var(--ring);border-radius:4px}

/* ---------- info komunitas (Advance) + nama lengkap untuk pengurus ---------- */
.kom-info{margin-top:18px;display:grid;gap:12px}
.kom-info[hidden]{display:none}
.kom-umum{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:13px;background:var(--orange-wash)}
.kom-umum-ic{flex:none;width:34px;height:34px;border-radius:100px;display:grid;place-items:center;background:var(--card);color:var(--orange-ink)}
.kom-umum-ic svg{width:18px;height:18px}
.kom-umum-h{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--orange-ink)}
.kom-umum-t{font-size:14.5px;line-height:1.55;color:var(--ink);margin-top:2px;white-space:pre-line;overflow-wrap:anywhere}
.kom-tautan{display:grid;gap:10px}
@media(min-width:640px){.kom-tautan{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kom-tautan-i{display:flex;gap:12px;align-items:center;text-align:left;font-family:inherit;padding:12px 14px;border-radius:13px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;transition:border-color .15s ease,background .15s ease}
.kom-tautan-i:hover{border-color:var(--blue);background:var(--blue-tint)}
.kom-tautan-i:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.kom-tautan-i[data-kunci]{background:var(--bg-alt);border-style:dashed}
.kom-tautan-i[data-kunci]:hover{border-color:var(--line);background:var(--bg-alt)}
.kom-tautan-ic{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--blue-wash);color:var(--blue-ink)}
.kom-tautan-i[data-kunci] .kom-tautan-ic{background:var(--line-2);color:var(--ink-3)}
.kom-tautan-ic svg{width:18px;height:18px}
.kom-tautan-i .t{min-width:0}
.kom-tautan-i b{display:block;font-size:14px;font-weight:600;line-height:1.35}
.kom-tautan-i small{display:block;font-size:12px;color:var(--ink-2);line-height:1.4}
.kom-info-ajak{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:13px;border:1px dashed var(--ink-3);background:var(--bg-alt)}
.kom-info-ajak > svg{flex:none;width:20px;height:20px;color:var(--orange-ink)}
.kom-info-ajak .t{flex:1;min-width:200px}
.kom-info-ajak strong{display:block;font-size:13.5px;font-weight:600;line-height:1.4}
.kom-info-ajak p{font-size:12px;color:var(--ink-2);line-height:1.5}

/* ---------- feed "Kabar komunitas" (Advance) ----------
   Kotak khusus ber-panel (kepala + kaki seperti Daftar Anggota) yang isinya
   bergulir sendiri, bentuk timeline ala Path: satu garis vertikal, simpul
   bulat di garis (foto pengurus / ikon anggota baru), gelembung chat di kanan. */
.kom-feed .kom-info-ajak{margin-top:0}
.fd-box .panel-bar{border-bottom:1px solid var(--line)}
.fd-box-ic{display:grid;place-items:center;width:28px;height:28px;border-radius:100px;background:var(--orange-wash);color:var(--orange-ink);flex:none}
.fd-box-ic svg{width:15px;height:15px}
.fd-gulir{max-height:440px;overflow-y:auto;overscroll-behavior:contain;padding:16px 18px 8px;background:var(--bg-alt)}
.fd-tl{position:relative;list-style:none;margin:0;padding:0}
.fd-tl::before{content:"";position:absolute;left:19px;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--line)}
.fd-i{position:relative;display:grid;grid-template-columns:40px 1fr;gap:12px;padding-bottom:18px}
.fd-node{position:relative;z-index:1;width:40px;height:40px;border-radius:100px;box-shadow:0 0 0 3px var(--bg-alt)}
.fd-node .av{width:40px;height:40px;font-size:14px}
.fd-node.ic{display:grid;place-items:center;background:var(--green);color:var(--btn-ink)}
.fd-node.ic svg{width:19px;height:19px}
.fd-isi-w{min-width:0}
.fd-meta{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;min-height:22px;font-size:13px;color:var(--ink-2);line-height:1.4}
.fd-meta b{font-weight:600;color:var(--ink)}
.fd-jab{font-size:11px;font-weight:600;padding:2px 8px;border-radius:100px;background:var(--blue-wash);color:var(--blue-ink)}
.fd-waktu{font-size:12px;color:var(--ink-3)}
.fd-pin{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:100px;background:var(--orange-wash);color:var(--orange-ink)}
.fd-pin svg{width:12px;height:12px}
.fd-bubble{margin-top:6px;padding:12px 14px;border-radius:4px 16px 16px 16px;border:1px solid var(--line);background:var(--card)}
.fd-bubble.pin{border-color:var(--orange)}
.fd-isi{font-size:14.5px;line-height:1.6;white-space:pre-line;overflow-wrap:anywhere}
.fd-tautan{margin-top:10px;display:inline-flex;align-items:center;gap:6px;max-width:100%;font:inherit;font-size:13px;font-weight:500;padding:6px 12px;border-radius:100px;border:1px solid var(--line);background:var(--blue-tint);color:var(--blue-ink);cursor:pointer}
.fd-tautan span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fd-tautan svg{width:14px;height:14px;flex:none}
.fd-bubble.sambut{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--green-wash);border-color:transparent}
.fd-bubble.sambut .av{width:44px;height:44px;font-size:14px;flex:none}

/* ---------- dashboard pengurus (scrKelola) ---------- */
.kom-status.pengurus{background:var(--blue-wash);color:var(--blue-ink)}
/* navigasi. Esensial: baris tab seperti semula (geser kalau sempit), tab Advance
   disembunyikan. Advance: kolom samping di >=900px, dua kelompok Advance / Kelola.
   Sub-menu: di baris tab, induk (.kl-induk) disembunyikan dan sub-menunya tampil
   sebagai tab biasa — kecuali di Esensial, di mana induknya yang tampil sebagai tab
   (sub-menu Advance-nya tersembunyi). Di kolom samping, induk membuka .kl-subnav. */
.kl-body{margin-top:22px}
.kl-main{min-width:0}
.kl-nav{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);
  margin:0 -22px;padding:0 22px;scrollbar-width:none}
.kl-nav::-webkit-scrollbar{display:none}
.kl-nav-h{flex:none;display:flex;align-items:center;font-size:11px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.kl-nav-h:first-child{display:none}
.kl-nav-h:not(:first-child){border-left:1px solid var(--line);padding-left:12px;margin-left:6px}
.kl-nav-h.sek{color:var(--orange-ink)}
#scrKelola:not(.mode-adv) .kl-nav-h,#scrKelola:not(.mode-adv) .kl-tab[data-sek]{display:none}
.kl-subnav{display:contents}
.kl-nav [data-induk]{display:none}
.kl-induk-ic{width:16px;height:16px;display:none;transition:transform .15s ease}
.kl-tab-ic{flex:none;display:inline-grid;width:18px;height:18px}
.kl-tab-ic svg{width:100%;height:100%}
.kl-tab.sub .kl-tab-ic{width:16px;height:16px}
#scrKelola:not(.mode-adv) .kl-subnav{display:none}
#scrKelola:not(.mode-adv) [data-induk]:not([data-sek]){display:inline-flex}
.kl-induk.aktif{color:var(--blue-ink);border-bottom-color:var(--blue)}
.kl-tab{flex:none;font-family:inherit;font-size:14px;font-weight:600;color:var(--ink-3);background:none;border:0;
  padding:12px 6px;margin-bottom:-1px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;gap:8px;text-align:left}
.kl-tab:hover{color:var(--ink)}
.kl-tab.on{color:var(--blue-ink);border-bottom-color:var(--blue)}
.kl-tab:focus-visible{outline:3px solid var(--ring);outline-offset:2px;border-radius:6px}
.kl-badge{font-size:11px;font-weight:700;min-width:19px;height:19px;padding:0 6px;border-radius:100px;
  display:inline-grid;place-items:center;background:var(--blue-wash);color:var(--blue-ink)}
.kl-tab.on .kl-badge{background:var(--blue);color:var(--btn-ink)}
.kl-panel{margin-top:22px}
.kl-panel[hidden]{display:none}
@media(min-width:900px){
  #scrKelola.mode-adv .kl-body{display:grid;grid-template-columns:212px minmax(0,1fr);gap:36px;align-items:start;margin-top:26px}
  #scrKelola.mode-adv .kl-nav{flex-direction:column;gap:2px;margin:0;padding:0;border:0;overflow:visible;position:sticky;top:96px}
  #scrKelola.mode-adv .kl-nav-h{padding:4px 12px 6px}
  #scrKelola.mode-adv .kl-nav-h:first-child{display:flex}
  #scrKelola.mode-adv .kl-nav-h:not(:first-child){border-left:0;margin:12px 0 0;padding:16px 12px 6px;border-top:1px solid var(--line)}
  #scrKelola.mode-adv .kl-tab{width:100%;padding:10px 12px;margin:0;border:0;border-radius:10px}
  #scrKelola.mode-adv .kl-tab:hover{background:var(--bg-alt)}
  #scrKelola.mode-adv .kl-tab.on{background:var(--blue-wash)}
  #scrKelola.mode-adv .kl-tab .kl-badge{margin-left:auto}
  #scrKelola.mode-adv [data-induk]{display:flex}
  #scrKelola.mode-adv .kl-induk.aktif{color:var(--ink);background:none}
  #scrKelola.mode-adv .kl-induk.aktif:hover{background:var(--bg-alt)}
  #scrKelola.mode-adv .kl-induk-ic{display:block;margin-left:auto}
  #scrKelola.mode-adv .kl-induk[aria-expanded="true"] .kl-induk-ic{transform:rotate(180deg)}
  #scrKelola.mode-adv .kl-subnav{display:none;gap:2px;padding-left:12px}
  #scrKelola.mode-adv .kl-subnav.buka{display:grid}
  #scrKelola.mode-adv .kl-tab.sub{font-size:13.5px;padding:8px 12px}
  #scrKelola.mode-adv .kl-panel{margin-top:0}
}
