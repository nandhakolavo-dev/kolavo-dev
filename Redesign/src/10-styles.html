/* ============================================================
   Token diambil dari file Figma "Kolavo" — page Design System.
   Primary #2D6BE4 · hover #0045CD · disabled #E3E3E3/#9CA3AF

   ============================================================ */
:root{
  --bg:#FFFFFF;
  --bg-alt:#FAFAFA;
  --card:#FFFFFF;
  --ink:#222222;
  --ink-2:#6B7280;
  --ink-3:#9CA3AF;
  --line:#EFEFEF;
  --line-2:#F4F5F7;
  --blue:#2D6BE4;
  --blue-hover:#0045CD;
  --blue-wash:#EBF1FD;
  --blue-ink:#2D6BE4;
  --blue-tint:#F5F8FE;
  --orange:#FF683D;
  --orange-ink:#C64216;
  --orange-wash:#FFF1EC;
  --green:#12855F;
  --green-wash:#E8F5EF;
  --disabled:#E3E3E3;
  --btn-ink:#FFFFFF;
  --red:#C0362C; --red-wash:#FDF0EE; --red-line:#F3CFCA;

  --viz-1:#2D6BE4; --viz-2:#E0562B; --viz-3:#12855F;
  --scrim:rgba(20,26,38,.34);
  --g-bg:#FFFFFF; --g-ink:#1F1F1F; --g-line:#747775;
  --ring:rgba(45,107,228,.4);
  --kabut:255 255 255;
  --sh-sm:0 1px 2px rgba(34,34,34,.05);
  --sh:0 2px 6px rgba(34,34,34,.05), 0 14px 30px -18px rgba(45,107,228,.35);
  --sh-lg:0 4px 10px rgba(34,34,34,.05), 0 30px 64px -30px rgba(45,107,228,.5);
}

    --ink:#F0F2F6;--ink-2:#A9B0BF;--ink-3:#7E8695;

    --green:#4FBF98;--green-wash:#12281F;
    --disabled:#2A303C;--btn-ink:#0D1017;--ring:rgba(111,151,245,.5);
    --red:#FF9A8F;--red-wash:#2B1512;--red-line:#4A241F;
    --viz-1:#5B86EE;--viz-2:#E8683F;--viz-3:#2E9C78;
    --scrim:rgba(0,0,0,.55);
    --g-bg:#131314;--g-ink:#E3E3E3;--g-line:#8E918F;
    --kabut:24 29 40;
    --kabut:24 29 40;
  --sh-sm:0 1px 2px rgba(0,0,0,.45);
    --sh:0 2px 6px rgba(0,0,0,.35), 0 16px 32px -18px rgba(0,0,0,.85);
    --sh-lg:0 4px 10px rgba(0,0,0,.4), 0 34px 68px -32px rgba(0,0,0,.95);
  }
}

  --sh-lg:0 4px 10px rgba(0,0,0,.4), 0 34px 68px -32px rgba(0,0,0,.95);

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Poppins",system-ui,-apple-system,sans-serif;
  font-size:16px;font-weight:400;line-height:1.6;-webkit-font-smoothing:antialiased}
p{margin:0}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.02em;line-height:1.18;text-wrap:balance}
ul{margin:0;padding:0;list-style:none}
.shell{max-width:1160px;margin:0 auto;padding:0 22px}

/* ---------- tombol: pill, spek Figma ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:inherit;font-weight:500;font-size:16px;line-height:1;
  height:52px;padding:0 24px;border-radius:100px;border:1px solid transparent;
  background:var(--blue);color:var(--btn-ink);text-decoration:none;white-space:nowrap;cursor:pointer;
  transition:background .15s ease,border-color .15s ease,transform .12s ease}
.btn:hover{background:var(--blue-hover);transform:translateY(-1px)}
.btn:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.btn.secondary{background:var(--bg-alt);color:var(--blue-ink);border-color:var(--blue)}
.btn.secondary:hover{background:var(--blue-wash)}
.btn.outline{background:transparent;color:var(--blue-ink);border-color:var(--blue)}
.btn.outline:hover{background:var(--blue-wash)}
.btn.md{height:48px}
.btn.sm{height:40px;font-size:14px;padding:0 20px}
.btn.xs{height:32px;font-size:12px;padding:0 16px}
.btn svg{width:17px;height:17px;flex:none}

/* ---------- nav ---------- */
nav{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;gap:12px;padding-top:14px;padding-bottom:14px}

  background:linear-gradient(90deg,var(--blue) 0 93.3%,var(--orange) 93.3%);

.logo.sm{width:110px;height:24px}
.nav-sp{flex:1}
/* layar sempit: sembunyikan tombol sekunder — CTA yang sama sudah ada di hero */
@media(max-width:760px){
  .nav-in .btn.secondary{display:none}
  .logo{width:110px;height:24px}
  .nav-in{gap:8px}
}

/* ---------- hero ---------- */
.hero{padding:66px 0 76px;background:linear-gradient(180deg,var(--blue-tint) 0%,rgba(0,0,0,0) 72%)}
.hero-grid{display:grid;gap:50px;align-items:center}
/* dua kolom baru dinyalakan di 1060, bukan 960: di bawah itu kolom kanan tinggal
   ~370px dan panel daftar anggota jadi sempit — satu kolom lebih baik */
@media(min-width:1060px){.hero-grid{grid-template-columns:1fr 1fr;gap:64px}}
.brandline{font-size:13px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;
  color:var(--orange);margin-bottom:18px}
/* dua kalimat sejajar, masing-masing wajib muat satu baris — ukurannya diturunkan
   dari headline lama yang cuma satu kalimat */
h1{font-size:clamp(28px,3.4vw,40px);font-weight:600;letter-spacing:-.028em;line-height:1.18}


.hero .sub{margin-top:18px;font-size:17px;color:var(--ink-2);max-width:46ch}







.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
/* tombol utama hero: sedikit lebih besar dari ukuran Large standar */
.btn.lead{height:56px;padding:0 34px;font-size:17px;font-weight:600}


/* ---------- panel daftar anggota ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:13px;
  box-shadow:var(--sh-lg);overflow:hidden}
.panel-bar{display:flex;align-items:center;gap:10px;padding:14px 18px;
  border-bottom:1px solid var(--line);background:var(--bg-alt)}
.panel-bar .t{font-weight:600;font-size:14px}
.panel-bar .c{margin-left:auto;font-size:12px;font-weight:500;color:var(--ink-3)}
.panel-filters{display:flex;gap:7px;padding:14px 18px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.chip{font-size:12px;font-weight:500;padding:7px 14px;border-radius:100px;
  border:1px solid var(--line);color:var(--ink-2);background:var(--bg);line-height:1}
.chip.on{background:var(--blue);color:var(--btn-ink);border-color:var(--blue)}
.m{display:grid;grid-template-columns:auto 1fr;gap:13px;padding:14px 18px;
  border-bottom:1px solid var(--line-2);align-items:center}
.m:last-child{border-bottom:0}
.av{width:42px;height:42px;border-radius:100px;display:grid;place-items:center;
  font-weight:600;font-size:14px;letter-spacing:-.01em}
.av.a{background:var(--blue-wash);color:var(--blue-ink)}
.av.b{background:var(--orange-wash);color:var(--orange-ink)}
.av.c{background:var(--green-wash);color:var(--green)}
/* foto profil — gambar AI, bukan anggota asli */

.m .nm{font-weight:600;font-size:14px;line-height:1.4}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.tag{font-size:11px;font-weight:500;padding:4px 10px;border-radius:100px;
  background:var(--bg-alt);color:var(--ink-3);border:1px solid var(--line);line-height:1.3}
.tag.hi{background:var(--orange-wash);color:var(--orange-ink);border-color:transparent}
.panel-foot{padding:13px 18px;font-size:12px;color:var(--ink-3);background:var(--bg-alt);
  display:flex;align-items:center;gap:8px}
.panel-foot svg{width:14px;height:14px;flex:none}

/* ---------- visual hero: tumpukan kartu komunitas ---------- */
.hero-art{display:flex;flex-direction:column;align-items:center;gap:16px}












/* ---------- visual hero: kartu WAG di belakang, daftar anggota di depan ----------
   Argumen "di WAG cuma nomor, di Kolavo ada orangnya" dibawa naik ke hero,
   jadi dua kartu yang dulu bersebelahan kini bertumpuk supaya muat satu kolom. */
.hba{position:relative;width:100%;max-width:480px;margin:0 auto}
.hba-wag{width:78%;transform:rotate(-2.4deg);transform-origin:top left}
.hba-wag .ba-card{padding:16px 16px 14px;border-radius:16px}
.hba-wag .ba-label{margin-bottom:11px}
.hba-wag .bub{font-size:12px;padding:9px 12px;margin-bottom:6px}
/* tumpang-tindih dibatasi setinggi padding bawah kartu WAG — lebih dari itu
   panel memotong teks di tengah baris, bukan menumpuk */
.hba-kolavo{width:92%;margin:-14px 0 0 auto;position:relative;z-index:2}
/* mockup, bukan UI sungguhan — dipadatkan supaya tinggi seluruh visual
   tetap sebanding dengan kolom teks di sebelahnya */
.hba-kolavo .panel{border-color:var(--blue)}
.hba-kolavo .panel-bar{padding:11px 16px}
.hba-kolavo .panel-filters{padding:11px 16px;gap:6px}
.hba-kolavo .m{padding:10px 16px;gap:11px}
.hba-kolavo .av{width:38px;height:38px}
.hba-kolavo .panel-foot{padding:11px 16px}
@media(max-width:560px){
  .hba{max-width:400px}
  .hba-wag{width:88%}
  .hba-kolavo{width:100%;margin-top:-14px}
}

/* panel daftar anggota kini jadi sisi "sesudah" di bagian WAG */
/* indikator mengetik didorong ke kaki kartu, jadi sisa ruang jatuh di atasnya */









/* ---------- section ---------- */
#scrBeranda > section{padding:78px 0}
.sec-alt{background:var(--bg-alt);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kicker{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--orange);margin-bottom:14px}
h2{font-size:clamp(24px,3.3vw,34px)}
.sec-lede{margin-top:14px;font-size:16px;color:var(--ink-2);max-width:56ch}

/* ---------- before/after ---------- */
.ba-card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:22px;box-shadow:var(--sh-sm)}
.ba-label{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:16px}
.bub{background:var(--bg-alt);border-radius:13px 13px 13px 3px;padding:10px 14px;
  font-size:13px;color:var(--ink-2);margin-bottom:8px;max-width:92%;line-height:1.5}
.bub.me{background:var(--blue-wash);border-radius:13px 13px 3px 13px;margin-left:auto}
.bub .who{display:block;font-size:11px;font-weight:500;color:var(--ink-3);margin-bottom:2px}






/* ---------- direktori ---------- */
.search{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);
  border-radius:100px;box-shadow:var(--sh-sm);margin-top:28px}
.search .q{display:flex;align-items:center;gap:12px;flex:1;min-width:0;height:56px;padding:0 10px 0 24px}
.search .q svg{width:19px;height:19px;color:var(--ink-3);flex:none}
.search .q span{color:var(--ink-3);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search .sep{width:1px;height:26px;background:var(--line);flex:none}
.search .locwrap{padding:0 8px 0 6px;flex:none}
/* tombol lokasi menyatu dengan kotak, bukan tombol bertumpuk di dalam tombol */
.search .locbtn{border-color:transparent;background:transparent;height:44px}
.search .locbtn:hover{background:var(--bg-alt);border-color:transparent}
.search .locbtn.active{background:var(--blue-wash);border-color:transparent}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
.filters .lbl{font-size:13px;font-weight:500;color:var(--ink-2);margin-right:4px}
.cnt{margin-left:6px;font-size:11px;font-weight:600;opacity:.75}
.grid{display:grid;gap:18px;margin-top:26px}
@media(min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:980px){.grid{grid-template-columns:repeat(3,1fr)}}

/* kartu komunitas — mengikuti komponen di Figma */
/* aksen kartu diambil dari warna dominan logo komunitasnya,
   mengikuti pola kartu di kolavo.app: gradasi 135deg, aksen 10% di sudut kanan bawah */
.ccard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:13px;
  padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--sh-sm);
  --acc:150 150 150; --acc-a:.10;
  background-image:linear-gradient(135deg,var(--card) 0%,var(--card) 55%,rgb(var(--acc)/var(--acc-a)) 100%);
  transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
.ccard.c-forpastara{--acc:226 103 14}
.ccard.c-iapnj{--acc:21 142 152}
.ccard.c-iasman52{--acc:238 73 60}
.ccard.c-ppiju{--acc:51 151 102}
.ccard:hover{transform:translateY(-3px);box-shadow:var(--sh);border-color:rgb(var(--acc)/.55)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ccard{--acc-a:.20}}
:root[data-theme="dark"] .ccard{--acc-a:.20}
.ccard .loc{align-self:flex-end;font-size:11px;font-weight:400;color:var(--ink-2);
  background:var(--bg-alt);border-radius:100px;padding:5px 12px;line-height:1.3;text-align:right}
/* borderless — cocok dengan tampilan logo di kolavo.app, tanpa bingkai */
.ccard .logo-sq{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;
  font-weight:600;font-size:16px;border:none}
.ccard h3{font-size:16px;font-weight:600;line-height:1.35}
.verif{display:inline-flex;flex:none;vertical-align:-2px}
.verif svg{width:100%;height:100%;display:block}
.ccard h3 .verif{width:15px;height:15px;margin-left:3px}
.kom-nm .verif{width:20px;height:20px;margin-left:6px}
.ccard .desc{font-size:13px;color:var(--ink-3);line-height:1.5;flex:1}
.ccard .row{display:flex;align-items:flex-end;gap:10px;padding-top:12px}
.ccard .mem{font-size:12px;color:var(--ink-3)}
.stack{display:flex;margin-top:6px}
.stack span{width:28px;height:28px;border-radius:100px;border:2px solid var(--card);
  margin-right:-7px;display:grid;place-items:center;font-size:9px;font-weight:600;line-height:1}
.stack span:last-child{background:var(--card);color:var(--ink-3);border-color:var(--line)}
.ccard .row .btn{margin-left:auto}

/* ---------- direktori interaktif ---------- */
.search .q input{flex:1;min-width:0;border:0;background:transparent;font-family:inherit;font-size:15px;
  color:var(--ink);padding:0}
.search .q input::placeholder{color:var(--ink-3)}
.search .q input:focus{outline:none}
.search:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px var(--ring)}
.search .q input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}

button.chip{font-family:inherit;cursor:pointer;transition:border-color .15s ease,background .15s ease,color .15s ease}
button.chip:hover:not(.on){border-color:var(--ink-3);color:var(--ink)}
button.chip:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
button.chip:disabled{opacity:.45;cursor:not-allowed}
button.chip:disabled:hover{border-color:var(--line);color:var(--ink-2)}

.ccard[hidden]{display:none}
.resultbar{margin-top:22px;font-size:13px;color:var(--ink-3)}
.resultbar b{color:var(--ink-2);font-weight:600}
.resultbar[hidden]{display:none}

.empty{margin-top:28px;background:var(--card);border:1px dashed var(--line);border-radius:13px;
  padding:44px 28px;text-align:center;display:flex;flex-direction:column;align-items:center}
.empty[hidden]{display:none}
.empty-ic{width:56px;height:56px;border-radius:100px;background:var(--orange-wash);color:var(--orange-ink);
  display:grid;place-items:center;margin-bottom:20px}
.empty-ic svg{width:26px;height:26px}
.empty h3{font-size:20px;margin-bottom:10px}
.empty p{font-size:15px;color:var(--ink-2);max-width:52ch}
.empty p b{color:var(--ink);font-weight:600}
.empty .empty-lede{margin-top:8px;font-size:14px;color:var(--ink-3)}
.empty-cta{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:26px}
.empty-note{margin-top:18px !important;font-size:12.5px !important;color:var(--ink-3) !important}

/* ---------- band pengurus ---------- */
.band{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:40px;
  box-shadow:var(--sh);display:grid;gap:30px}
@media(min-width:900px){.band{grid-template-columns:1.1fr .9fr;align-items:center;padding:50px}}
.steps{display:grid;gap:16px}
.step{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.step .no{width:28px;height:28px;border-radius:100px;background:var(--blue-wash);color:var(--blue-ink);
  display:grid;place-items:center;font-size:13px;font-weight:600;flex:none}
.step strong{font-size:15px;font-weight:600;display:block}
.step p{font-size:14px;color:var(--ink-3);margin-top:2px}
.privacy{display:flex;gap:11px;align-items:flex-start;margin-top:24px;padding:16px 18px;
  border-radius:13px;background:var(--green-wash);color:var(--ink-2);font-size:14px;line-height:1.55}
.privacy svg{width:18px;height:18px;color:var(--green);flex:none;margin-top:3px}
.privacy strong{font-weight:600;color:var(--ink)}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--line);padding:40px 0 52px;background:var(--bg-alt)}
/* mode app (A1): footer jualan hanya milik landing */
body.m-app footer{display:none}
/* halaman masuk penuh (A2): berdiri sendiri, tanpa nav */
body.m-masuk nav{display:none}
#scrKomunitas[data-publik] #komFeed,#scrKomunitas[data-publik] #komAnggotaSec{display:none}
/* nav Kolavo App (A3): tab ikon di tengah ala Facebook web, tautan jualan disembunyikan */
body.m-app .nav-lnk,body.m-app #navPengurus,body.m-app #btnApp{display:none}
/* tautan jualan rata kiri, diberi jarak dari logo */
.nav-in > .nav-lnk:first-of-type{margin-left:18px}
/* landing = halaman jualan: akun & notifikasi hanya di dalam app (A6) */
body:not(.m-app) #acct,body:not(.m-app) #notif{display:none}
#scrBeranda > #etalase{padding-bottom:30px}
@media(max-width:960px){.nav-in .nav-lnk{display:none}}
body.m-tab .nav-in{position:relative}
.nav-tab[hidden]{display:none}
.nav-tab{position:absolute;left:50%;top:0;bottom:0;transform:translateX(-50%);display:flex;gap:4px}
.nt{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:104px;color:var(--ink-2);text-decoration:none}
.nt::before{content:"";position:absolute;inset:6px 4px;border-radius:13px;background:transparent;transition:background .15s ease}
.nt:hover::before{background:var(--line-2)}
.nt svg{position:relative;width:24px;height:24px}
/* label di bawah ikon, sama dengan bilah bawah versi HP */
.nt b{position:relative;font-size:11.5px;font-weight:500;line-height:1.2;white-space:nowrap}
.nt.on{color:var(--blue)}
/* duotone: tab aktif mengisi bentuknya dengan warna lembut dari currentColor */
.nt.on svg{stroke-width:2}
.nt.on svg :is(path,rect,circle){fill:currentColor;fill-opacity:.16}
.nt.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--blue)}
.nt.on:hover::before{background:transparent}
.nt:focus-visible{outline:3px solid var(--ring);outline-offset:-6px;border-radius:13px}
/* isi tab app (A4): Komunitas & Dashboard */
.app-pg{padding:30px 0 72px;background:var(--bg-alt);min-height:calc(100vh - 77px)}
.app-hd h1{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.app-hd p{margin-top:6px;font-size:15px;color:var(--ink-2);max-width:620px}
.app-sek{margin-top:32px}
.app-sek > h2{font-size:18px;font-weight:600;margin-bottom:12px}
.app-sub{margin:-6px 0 16px;font-size:14px;color:var(--ink-2)}
.app-kosong{padding:18px;border:1px dashed var(--line);border-radius:13px;background:var(--card);font-size:14px;color:var(--ink-2)}
#dasborList{margin-top:24px}
/* dashboard komunitas yang mengangkatmu: tagihan & akses milik pembuat/Ketua */
#scrKelola.kl-diangkat .kl-tab[data-tab="tagihan"],#scrKelola.kl-diangkat .kl-tab[data-tab="akses"]{display:none}
.dsb-buat{margin-top:16px}
/* baris daftar dashboard: kolom tetap supaya lencana & tombol tidak bergeser
   mengikuti panjang nama komunitas — nama yang panjang membungkus di kolomnya */
/* Home: satu kolom selebar halaman lain; ringkasan pribadi memakai kartu statistik
   dashboard pengurus (.sek-stat), di sini bisa diklik */
.home-stat .sek-stat{margin-top:22px}
.hs-i{font:inherit;text-align:left;color:inherit;width:100%;position:relative;overflow:hidden;padding:14px 16px 14px}
/* visual kartu ringkasan: tumpukan logo/foto dari datanya, atau ikon berwarna bila kosong */
/* kekhususan dinaikkan (.hs-i …): .sek-stat-i span{display:block} milik dashboard ikut kena */
.hs-i .hs-vis{display:flex;align-items:center;height:40px;margin:0 0 12px}
.hs-i .hs-tumpuk{display:flex;margin:0}
.hs-i .hs-tumpuk > span{display:grid;place-items:center;flex:none;width:36px;height:36px;margin:0 0 0 -10px;border:2px solid var(--card);box-shadow:var(--sh-sm);font-size:12px;font-weight:600;line-height:1}
.hs-i .hs-tumpuk > span:first-child{margin-left:0}
.hs-tumpuk .av{border-radius:100px}
.hs-i .hs-tumpuk.hs-tkom > .logo-sq{border-radius:11px}
.hs-tumpuk .av.lagi{background:var(--line-2);color:var(--ink-2);font-weight:600}
.hs-ic{display:grid;place-items:center;width:40px;height:40px;border-radius:12px}
.hs-ic svg{width:21px;height:21px}
.hs-biru .hs-ic{background:var(--blue-wash);color:var(--blue-ink)}
.hs-hijau .hs-ic{background:var(--green-wash);color:var(--green)}
.hs-oranye .hs-ic{background:var(--orange-wash);color:var(--orange-ink)}
.hs-ungu .hs-ic{background:var(--blue-tint);color:var(--blue)}
.hs-i > *{position:relative;z-index:1}
/* watermark: ikon kartu dibuat oversize, transparan, sedikit miring, keluar dari tepi
   kanan bawah — warna mengikuti warna khas kartu */
.hs-i > .hs-wm{position:absolute;z-index:0;right:-22px;bottom:-30px;width:128px;height:128px;transform:rotate(-14deg);opacity:.13;pointer-events:none;transition:transform .3s ease,opacity .3s ease}
.hs-wm svg{width:100%;height:100%;stroke-width:1.5}
.hs-biru .hs-wm{color:var(--blue)}
.hs-hijau .hs-wm{color:var(--green)}
.hs-oranye .hs-wm{color:var(--orange)}
.hs-ungu .hs-wm{color:var(--blue-ink)}
button.hs-i:hover > .hs-wm{transform:rotate(-6deg) scale(1.06);opacity:.2}
@media(prefers-reduced-motion:reduce){.hs-i > .hs-wm{transition:none}}
/* latar lembut berwarna khas supaya keempat kartu terbaca sebagai satu set */
.hs-i.hs-biru{background:linear-gradient(135deg,var(--card) 55%,var(--blue-wash))}
.hs-i.hs-hijau{background:linear-gradient(135deg,var(--card) 55%,var(--green-wash))}
.hs-i.hs-oranye{background:linear-gradient(135deg,var(--card) 55%,var(--orange-wash))}
.hs-i.hs-ungu{background:linear-gradient(135deg,var(--card) 55%,var(--blue-tint))}
button.hs-i{cursor:pointer;transition:border-color .15s ease,box-shadow .15s ease}
button.hs-i:hover{border-color:var(--blue);box-shadow:var(--sh-sm)}
button.hs-i:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
#scrHome .app-sek:empty{display:none}
/* Rekomendasi Kenalan: kartu dengan alasan cocok yang jelas + profil bisa dibuka */
.hn-kepala{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hn-kepala .hsek-h{margin-bottom:12px}
.hn-saldo{display:inline-flex;align-items:center;gap:8px;margin-bottom:12px;padding:6px 6px 6px 12px;border:1px solid var(--line);border-radius:100px;background:var(--card);font:inherit;font-size:13px;color:var(--ink-2);cursor:pointer}
.hn-saldo svg{width:16px;height:16px;color:var(--orange)}
.hn-saldo b{color:var(--ink);font-weight:600}
.hn-saldo em{font-style:normal;font-weight:600;font-size:12px;color:var(--blue-ink);background:var(--blue-wash);padding:4px 10px;border-radius:100px}
.hn-saldo:hover{border-color:var(--blue)}
.hn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.hn-i{display:flex;flex-direction:column;gap:14px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:13px}
.hn-orang{display:flex;align-items:center;gap:12px;padding:0;border:0;background:none;font:inherit;text-align:left;color:inherit;cursor:pointer}
.hn-orang .av{width:52px;height:52px;flex:none}
.hn-orang .t{display:flex;flex-direction:column;min-width:0}
.hn-orang b{font-size:15.5px;font-weight:600;color:var(--ink)}
.hn-orang:hover b{color:var(--blue-ink)}
.hn-orang .t > span{font-size:12.5px;color:var(--ink-2);line-height:1.4}
.hn-orang .hn-kom{display:inline-flex;align-items:center;gap:6px;margin-top:3px;font-size:11.5px;color:var(--ink-3)}
.hn-kom .logo-sq{width:16px;height:16px;border-radius:5px;border:0;font-size:8px}
.hn-alasan{padding:10px 12px;border-radius:11px;background:var(--bg-alt)}
.hn-lbl{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.hn-chips{display:flex;flex-wrap:wrap;gap:6px}
.hn-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:4px 10px;border-radius:100px;background:var(--card);border:1px solid var(--line);color:var(--ink-2)}
.hn-chip.cocok{background:var(--green-wash);border-color:transparent;color:var(--green)}
.hn-chip svg{width:13px;height:13px;stroke-width:2.6}
.hn-aksi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto}
.hn-aksi .btn{justify-content:center}
.hn-aksi .btn small{margin-left:6px;font-size:11px;font-weight:500;opacity:.8}
/* daftar kenalan (scrKenalan) — seperti daftar teman */
.kn-hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.kn-cari{display:flex;align-items:center;gap:8px;width:min(320px,100%);height:44px;padding:0 14px;border:1px solid var(--line);border-radius:100px;background:var(--card)}
.kn-cari svg{width:17px;height:17px;color:var(--ink-3);flex:none}
.kn-cari input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:14px;color:var(--ink)}
.kn-cari:focus-within{border-color:var(--blue)}
.kn-tab{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 16px}
.kn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.kn-i{display:flex;flex-direction:column;gap:14px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:13px}
.kn-atas{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.kn-orang{display:flex;align-items:center;gap:12px;min-width:0;padding:0;border:0;background:none;font:inherit;text-align:left;color:inherit}
button.kn-orang{cursor:pointer}
button.kn-orang:hover b{color:var(--blue-ink)}
.kn-orang .av{width:56px;height:56px;flex:none}
.kn-orang .t{display:flex;flex-direction:column;min-width:0}
.kn-orang b{font-size:15.5px;font-weight:600;color:var(--ink)}
.kn-orang .t > span{font-size:12.5px;color:var(--ink-2);line-height:1.4}
.kn-orang .hn-kom{display:inline-flex;align-items:center;gap:6px;margin-top:3px;font-size:11.5px;color:var(--ink-3)}
.kn-orang .kn-nama{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kn-st{flex:none;font-size:11px;font-weight:600;padding:4px 10px;border-radius:100px;white-space:nowrap}
.kn-st.ok{background:var(--green-wash);color:var(--green)}
.kn-st.masuk{background:var(--orange-wash);color:var(--orange-ink)}
.kn-st.tunggu{background:var(--bg-alt);color:var(--ink-2)}
.kn-aksi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto}
.kn-aksi .btn{justify-content:center}
.kn-aksi .btn:only-child{grid-column:1 / -1}
/* saldo kredit di navbar app */
.nav-kredit[hidden]{display:none}
.nav-kredit{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px 0 10px;border:1px solid var(--line);border-radius:100px;background:var(--card);font:inherit;font-size:13px;color:var(--ink-2);cursor:pointer}
.nav-kredit svg{width:18px;height:18px;color:var(--orange)}
.nav-kredit b{font-weight:600;color:var(--ink)}
.nav-kredit:hover{border-color:var(--blue)}
@media(max-width:767px){.nav-kredit span{display:none}.nav-kredit{padding:0 12px 0 9px}}
/* profil anggota: saldo di bawah tombol ajak */
.ag-kenal-kredit{margin-top:8px;font-size:12.5px;color:var(--ink-3)}
.ag-kenal-kredit button{font:inherit;color:var(--blue-ink);background:none;border:0;padding:0;cursor:pointer;font-weight:600}
/* popup top up kredit */
.krd-box{max-width:400px}
.krd-koin{display:grid;place-items:center;width:56px;height:56px;margin:4px auto 12px;border-radius:100px;background:var(--orange-wash);color:var(--orange)}
.krd-koin svg{width:28px;height:28px}
.krd-saldo{margin-top:14px;font-size:13px;color:var(--ink-2)}
.krd-saldo b{color:var(--ink)}
.krd-paket{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding:14px 16px;border:2px solid var(--blue);border-radius:13px;background:var(--blue-wash);text-align:left}
.krd-paket b{display:block;font-size:15px;color:var(--ink)}
.krd-paket span{font-size:12.5px;color:var(--ink-2)}
.krd-paket strong{font-size:17px;color:var(--blue-ink)}
.krd-bayar{width:100%;margin-top:16px;justify-content:center}
.krd-langkah[hidden]{display:none}
/* langkah 1: pilihan cepat + jumlah paket + ringkasan */
.krd-cepat{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:14px}
.krd-cepat .chip{cursor:pointer;font-family:inherit}
.krd-atur{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;text-align:left}
.krd-atur .t{display:flex;flex-direction:column}
.krd-atur b{font-size:14px;color:var(--ink)}
.krd-atur small{font-size:12px;color:var(--ink-3)}
.krd-ringkas{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding:14px 16px;border:2px solid var(--blue);border-radius:13px;background:var(--blue-wash);text-align:left}
.krd-ringkas span{display:flex;flex-direction:column}
.krd-ringkas b{font-size:15px;color:var(--ink)}
.krd-ringkas small{font-size:12.5px;color:var(--ink-2)}
.krd-ringkas strong{font-size:18px;color:var(--blue-ink);white-space:nowrap}
/* langkah 2: kartu QRIS */
.krd-qris{margin:16px auto 0;max-width:260px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--card);box-shadow:var(--sh-sm)}
.krd-qris-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.krd-qris-h b{font-size:16px;font-weight:800;letter-spacing:.04em;color:var(--ink)}
.krd-qris-h span{font-size:11.5px;color:var(--ink-3)}
.krd-qr{margin:12px auto;width:200px;padding:8px;border-radius:10px;background:#FFFFFF}
.krd-qr svg{display:block;width:100%;height:auto}
.krd-qris-n{display:flex;align-items:baseline;justify-content:space-between;padding-top:10px;border-top:1px dashed var(--line)}
.krd-qris-n small{font-size:12px;color:var(--ink-3)}
.krd-qris-n strong{font-size:18px;color:var(--ink)}
.krd-tunggu{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;font-size:12.5px;color:var(--ink-2)}
.krd-tunggu b{font-variant-numeric:tabular-nums;color:var(--ink)}
.krd-ganti{display:block;margin:10px auto 0;border:0;background:none;padding:4px;font:inherit;font-size:13px;font-weight:600;color:var(--blue-ink);cursor:pointer}
/* langkah 3: berhasil */
.krd-ok-ic{display:grid;place-items:center;width:56px;height:56px;margin:4px auto 12px;border-radius:100px;background:var(--green-wash);color:var(--green)}
.krd-ok-ic svg{width:26px;height:26px}
.krd-catat{margin-top:12px;font-size:12px;color:var(--ink-3);line-height:1.5}
/* judul bagian Home: ikon berwarna + teks + jumlah */
.hsek-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hsek-h h2{font-size:18px;font-weight:600;margin:0}
#scrHome .app-sek > .hsek-h + .app-sub{margin-top:-4px}
.hsek-ic{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;flex:none}
.hsek-ic svg{width:17px;height:17px}
.hsek-ic.biru,.ha-biru .ha-ic{background:var(--blue-wash);color:var(--blue-ink)}
.hsek-ic.hijau,.ha-hijau .ha-ic,.ha-beres .ha-ic{background:var(--green-wash);color:var(--green)}
.hsek-ic.oranye,.ha-oranye .ha-ic{background:var(--orange-wash);color:var(--orange-ink)}
.ha-ungu .ha-ic{background:var(--blue-tint);color:var(--blue)}
.hsek-n{min-width:24px;height:24px;padding:0 8px;border-radius:100px;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--orange);color:var(--btn-ink)}
/* Tindak Lanjut: satu panel bergaya kotak masuk, baris dipisah garis tipis */
.ha-panel{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.ha-i{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:16px 18px}
.ha-i + .ha-i{border-top:1px solid var(--line)}
/* garis aksen warna jenis di tepi kiri */
.ha-i::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0}
.ha-biru::before{background:var(--blue)}
.ha-hijau::before{background:var(--green)}
.ha-oranye::before{background:var(--orange)}
.ha-ungu::before{background:var(--blue-ink)}
.ha-ic{display:grid;place-items:center;width:42px;height:42px;border-radius:100px}
.ha-ic svg{width:20px;height:20px}
.ha-i .t,.ha-beres .t{min-width:0}
.ha-jenis{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
.ha-i .n,.ha-beres .n{font-size:14.5px;font-weight:500;color:var(--ink);line-height:1.35}
.ha-i .n b{font-weight:600}
.ha-i .s,.ha-beres .s{font-size:12.5px;color:var(--ink-3);line-height:1.4;margin-top:2px}
.ha-aksi{display:flex;gap:8px}
.ha-beres{display:flex;align-items:center;gap:14px;padding:18px}
@media(max-width:560px){.ha-i{grid-template-columns:auto minmax(0,1fr)}.ha-aksi{grid-column:2}}
/* Kabar dari komunitasmu */
.hk-chips{display:flex;flex-wrap:wrap;gap:8px;margin:-2px 0 14px}
.hk-list{display:grid;gap:12px}
.hk-i{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 16px 6px}
.hk-kepala{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.hk-i.pin{border-color:var(--orange)}
.hk-pin{flex:none;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--orange);background:var(--orange-wash);padding:4px 10px;border-radius:100px}
.hk-kom{display:inline-flex;align-items:center;gap:8px;min-width:0;padding:0;border:0;background:none;font:inherit;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}
.hk-kom:hover{color:var(--blue-ink)}
.hk-kom .logo-sq{width:24px;height:24px;border-radius:7px;border:1px solid var(--line);font-size:10px}
.hk-lagi{margin-top:14px}
#dasborList .pf-list{grid-template-columns:1fr}
.pf-item.dsb-i{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:16px}
/* kuota anggota & peninjau di kartu tab Dashboard */
.dsb-kuota{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.dsb-q{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:100px;background:var(--bg-alt);font-size:12px;color:var(--ink-2)}
.dsb-q svg{width:13px;height:13px;color:var(--ink-3)}
.dsb-q b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.dsb-q.penuh{background:var(--orange-wash);color:var(--orange-ink)}
.dsb-q.penuh b,.dsb-q.penuh svg{color:var(--orange-ink)}
.dsb-paket{display:inline-flex;align-items:center;padding:3px 9px;border-radius:100px;background:var(--green-wash);color:var(--green);font-size:11.5px;font-weight:600}
.dsb-paket.adv{background:var(--blue-wash);color:var(--blue-ink)}
.dsb-btn svg{width:16px;height:16px}
/* tombol aksi ikon di baris anggota / struktur kepengurusan */
.kl-ib{position:relative;width:36px;height:36px;flex:none;border-radius:100px;border:1px solid var(--line);background:var(--card);color:var(--ink-2);display:inline-grid;place-items:center;cursor:pointer;transition:border-color .15s ease,color .15s ease,background .15s ease}
.kl-ib svg{width:17px;height:17px}
.kl-ib:hover{border-color:var(--blue);color:var(--blue-ink);background:var(--blue-tint)}
.kl-ib.bahaya{color:var(--red);border-color:var(--red-line)}
.kl-ib.bahaya:hover{background:var(--red-wash);border-color:var(--red)}
.kl-ib:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.kl-ib::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);z-index:5;padding:4px 8px;border-radius:7px;background:var(--ink);color:var(--bg);font-size:11.5px;font-weight:500;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s ease}
.kl-ib:hover::after,.kl-ib:focus-visible::after{opacity:1}
.dsb-i .status{justify-self:end}
.dsb-i .n{overflow-wrap:anywhere}
@media(max-width:560px){
  .pf-item.dsb-i{grid-template-columns:minmax(0,1fr) auto;row-gap:12px}
  .dsb-i .pf-open{grid-column:1 / -1}
  .dsb-i .status{justify-self:start}
}
/* popup Bagikan + QR (A5a). Kotak QR tetap putih di kedua tema — kamera butuh
   gelap di atas terang; warnanya ada di SVG, bukan di CSS tema */
.bgk-box{max-width:420px}
.bgk-qr{width:220px;margin:18px auto 0;border-radius:13px;overflow:hidden;border:1px solid var(--line)}
.bgk-qr svg{display:block;width:100%;height:auto}
.bgk-nm{margin:10px 0 16px;font-size:14px;font-weight:600;color:var(--ink)}
.bgk-aksi{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
/* tombol demo pengurus hanya relevan di tab Dashboard */
body:not([data-layar="scrDasbor"]) #demoAngkat{display:none}
/* simulasi tautan/QR undangan: dari luar app (landing) atau di halaman masuk */
body:not([data-layar="scrBeranda"]):not([data-layar="scrMasuk"]) #demoTautan{display:none}
/* layar sempit: tab pindah ke bilah bawah, label kecil tampil */
@media(max-width:767px){
  .nav-tab{position:fixed;top:auto;left:0;right:0;bottom:0;transform:none;z-index:40;gap:0;height:calc(60px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--bg);border-top:1px solid var(--line)}
  .nt{flex:1;width:auto}
  .nt::before{inset:5px 10px}
  .nt svg{width:24px;height:24px}
  .nt b{font-size:11px}
  .nt.on::after{top:-1px;bottom:auto;left:28%;right:28%;border-radius:0 0 3px 3px}
  body.m-tab{padding-bottom:calc(60px + env(safe-area-inset-bottom))}
  body.m-tab .demo{bottom:76px}
  body.m-tab .toast{bottom:86px}
  /* bar atas cukup logo + lonceng + avatar; cari ada di tab Komunitas */
  body.m-tab #acctChip,body.m-tab .acct-btn .chev{display:none}
}
.msk{position:relative;isolation:isolate;overflow:hidden;min-height:100vh;padding:clamp(32px,10vh,96px) 16px 64px;
  background:radial-gradient(55% 45% at 12% 8%,var(--blue-wash) 0%,transparent 72%),
             radial-gradient(45% 40% at 92% 92%,var(--orange-wash) 0%,transparent 72%),
             linear-gradient(180deg,var(--blue-tint) 0%,var(--bg-alt) 60%)}
/* pola titik halus, memudar ke tepi */
.msk::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background-image:radial-gradient(var(--line) 1.2px,transparent 1.3px);background-size:22px 22px;
  -webkit-mask-image:radial-gradient(70% 60% at 50% 42%,#000 0%,transparent 78%);mask-image:radial-gradient(70% 60% at 50% 42%,#000 0%,transparent 78%)}
.msk-in{position:relative;z-index:1}
/* bentuk geometris brand: cincin & lingkaran samar dari token, sebagian keluar tepi.
   Ukuran pakai vmin supaya proporsinya sama di HP dan desktop. */
.msk-deko{position:absolute;inset:0;z-index:0;pointer-events:none}
.msk-g{position:absolute;border-radius:50%}
.msk-g.g1{width:46vmin;height:46vmin;left:-16vmin;top:-14vmin;border:2px solid var(--blue);opacity:.28}
.msk-g.g2{width:22vmin;height:22vmin;left:9vmin;top:18vmin;border:2px dashed var(--blue);opacity:.35}
.msk-g.g3{width:30vmin;height:30vmin;right:-8vmin;top:-6vmin;background:var(--blue-wash);opacity:.9}
.msk-g.g4{width:52vmin;height:52vmin;right:-20vmin;bottom:-22vmin;border:2px solid var(--orange);opacity:.32}
.msk-g.g5{width:14vmin;height:14vmin;right:14vmin;bottom:16vmin;background:var(--orange-wash)}
.msk-g.g6{width:26vmin;height:26vmin;left:-6vmin;bottom:-8vmin;background:var(--blue-wash);opacity:.8}
/* gerak sangat pelan di bentuk kecil saja */
.msk-g.g2,.msk-g.g5{animation:mskApung 9s ease-in-out infinite}
.msk-g.g5{animation-delay:-3s}
@keyframes mskApung{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@media(prefers-reduced-motion:reduce){.msk-g{animation:none}}
.msk-in{max-width:440px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:22px}
/* kartu masuk (alternatif 2): kartu padat, panel kepala bergradasi berisi bukti
   komunitas, badan rata tengah, privasi sebagai catatan kaki kartu */
.msk-box{width:100%;overflow:hidden;text-align:center;border-radius:28px;background:var(--card);
  border:1px solid var(--line);box-shadow:var(--sh-lg)}
.msk-atas{padding:26px 24px 18px;background:linear-gradient(180deg,var(--blue-wash) 0%,var(--card) 100%);border-bottom:1px solid var(--line)}
.msk-atas .lgn-tiles{gap:0}
.msk-atas .lgn-tiles .logo-sq{width:48px;height:48px;border-radius:14px;border:3px solid var(--card);margin-left:-10px;box-shadow:var(--sh-sm)}
.msk-atas .lgn-tiles .logo-sq:first-child{margin-left:0}
.msk-atas .lgn-cap{margin-top:10px;font-size:12.5px;color:var(--ink-2)}
.msk-atas.undang{padding:20px 22px 16px}
.msk-atas.undang .msk-kom{background:var(--card)}
.msk-badan{padding:24px 32px 24px}
.msk-h{font-size:25px;font-weight:600;letter-spacing:-.02em;line-height:1.2;color:var(--ink)}
.msk-sub{margin-top:8px;font-size:14.5px;line-height:1.55;color:var(--ink-2)}
.msk-gbtn{margin-top:22px}
.msk-alt{margin-top:10px;font-size:12.5px;color:var(--ink-3)}
.msk-trust{margin-top:20px;padding-top:16px;text-align:left}
@media(max-width:480px){
  .msk-badan{padding:22px 20px 20px}
  .msk-h{font-size:22px}
}

.msk-foot{font-size:13.5px;color:var(--ink-2);text-align:center}
.msk-foot a{color:var(--blue);font-weight:500}
.msk-kom{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:13px;text-align:left}
.msk-kom .logo-sq{width:44px;height:44px;border-radius:12px;flex:none}
.msk-kom b{display:block;font-size:15px;font-weight:600;color:var(--ink);line-height:1.3}
.msk-kom span{font-size:12.5px;color:var(--ink-3)}
.foot{display:flex;flex-wrap:wrap;gap:20px;align-items:center}
.foot .tag-line{font-size:15px;font-weight:500;color:var(--orange)}
.foot .links{margin-left:auto;display:flex;gap:20px;font-size:14px;color:var(--ink-3);flex-wrap:wrap}
.foot .links button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.foot .links button:hover{color:var(--ink)}
.foot .links button:focus-visible{outline:3px solid var(--ring);border-radius:4px}
