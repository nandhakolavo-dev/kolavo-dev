.ob-pratinjau{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--orange-ink);
  background:var(--orange-wash);padding:3px 9px;border-radius:100px;margin-bottom:10px}
/* stepper berikon: garis progres di belakang ikon, terisi sampai langkah kini */
.ob-step-w{position:relative;margin:4px 36px 0 0}
.ob-step-rel{position:absolute;top:21px;left:calc(50% / var(--n));right:calc(50% / var(--n));height:3px;border-radius:3px;background:var(--line)}
.ob-step-isi{display:block;height:100%;border-radius:3px;background:var(--blue);transition:width .4s cubic-bezier(.4,0,.2,1)}
.ob-step{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);margin:0;padding:0;list-style:none}
.ob-step li{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-size:12px;line-height:1.3;color:var(--ink-3)}
.ob-step span{flex:none;width:44px;height:44px;border-radius:100px;display:grid;place-items:center;background:var(--card);
  border:1.5px solid var(--line);color:var(--ink-3);transition:background .3s ease,border-color .3s ease,color .3s ease,box-shadow .3s ease}
.ob-step span svg{width:20px;height:20px}
.ob-step em{font-style:normal;display:none}
.ob-step li.lewat span{border-color:var(--blue);background:var(--blue-wash);color:var(--blue-ink)}
.ob-step li.lewat em{color:var(--ink-2)}
.ob-step li.kini span{border-color:var(--blue);background:var(--blue);color:var(--btn-ink);box-shadow:0 0 0 5px var(--blue-wash)}
.ob-step li.kini em{display:block;color:var(--ink);font-weight:600}
@media(min-width:620px){.ob-step em{display:block}}
.ob-hitung{margin-top:14px}
/* status ajakan kenalan di kartu orang */
.ob-orang .btn.xs svg{width:14px;height:14px}
.ob-kenal-st{display:inline-flex;align-items:center;gap:5px;flex:none;font-size:12px;font-weight:600;color:var(--ink-2)}
.ob-kenal-st svg{width:14px;height:14px;color:var(--green)}
.ob-kenal-st.ok{color:var(--green)}
.ob-kecil{font-size:12px;color:var(--ink-3);margin-top:4px}
.ob-badan{margin-top:18px;min-height:280px}
.ob-judul{font-size:26px;line-height:1.25;margin-bottom:12px}
.ob-teks{font-size:15.5px;line-height:1.7;color:var(--ink-2);white-space:pre-line}
.ob-ttd{margin-top:16px;display:flex;align-items:center;justify-content:flex-end;gap:11px;color:var(--ink)}
.ob-ttd .av{width:44px;height:44px;flex:none}
.ob-bagian + .ob-bagian{margin-top:14px}
.ob-lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
/* naskah legal: dokumen panjang, jadi judul bagiannya perlu lebih terbaca
   daripada .ob-lbl yang huruf kecil-kapital */
.lgl-sub{margin:-6px 0 4px}
.lgl-bagian + .lgl-bagian{margin-top:18px}
.lgl-h{font-size:15px;font-weight:700;line-height:1.4;color:var(--ink);margin-bottom:4px}
.lgl-p{font-size:14.5px;line-height:1.7;color:var(--ink-2);white-space:pre-line}
/* blok persetujuan di Lengkapi Profil — berdiri sendiri, bukan di dalam .blk,
   jadi jarak atasnya disamakan dengan .blk supaya iramanya tidak putus */
/* tautan legal di dalam kalimat persetujuan (Lengkapi Profil) */
.lnk-teks{display:inline;padding:0;border:0;background:none;font:inherit;font-weight:600;color:var(--blue-ink);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.lnk-teks:hover{color:var(--blue-hover)}
.lnk-teks:focus-visible{outline:3px solid var(--ring);outline-offset:1px;border-radius:4px}
.lgl-opsi{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
/* pil "Opsional" aslinya cuma hidup di dalam .f-lbl; di sini dipakai di dalam
   teks centang, dan latarnya dibalik jadi --card supaya tidak lebur dengan
   kotak persetujuan yang sudah ber-latar --bg-alt */
.lgl-opsi .opt{margin-left:6px;font-size:10.5px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-3);background:var(--card);
  border-radius:100px;padding:2px 8px;vertical-align:1px}
#fSetuju{margin-top:20px;padding:16px 18px;border:1px solid var(--line);border-radius:13px;background:var(--bg-alt)}
#fSetuju .f-galat{margin-top:8px}
.f.salah#fSetuju{border-color:var(--red)}
.ob-poin{display:grid;gap:8px;margin:4px 0 14px;padding:0;list-style:none}
.ob-poin li{display:flex;gap:10px;font-size:14px;line-height:1.55;color:var(--ink)}
.ob-poin svg{flex:none;width:18px;height:18px;margin-top:2px;color:var(--green)}
.ob-tautan-list{display:grid;gap:8px;margin-top:14px}
.ob-tautan{display:flex;gap:12px;align-items:center;width:100%;text-align:left;font-family:inherit;padding:12px 14px;border-radius:13px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.ob-tautan:hover{border-color:var(--blue);background:var(--blue-tint)}
.ob-tautan:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.ob-tautan > svg{flex:none;width:20px;height:20px;color:var(--blue-ink)}
.ob-tautan b{display:block;font-size:14px;font-weight:600}
.ob-tautan small{display:block;font-size:12px;color:var(--ink-3);word-break:break-all}
.ob-chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.ob-chips .chip{font-family:inherit;cursor:pointer}
.ob-chips .chip i{font-style:normal;opacity:.75;margin-left:2px}
.ob-orang-list{display:grid;gap:8px;margin-top:12px}
.ob-orang{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:13px}
.ob-orang .av{width:40px;height:40px;flex:none}
.ob-orang .t{flex:1;min-width:0}
.ob-orang b{display:block;font-size:14px;font-weight:600}
.ob-orang .t span{display:block;font-size:12.5px;color:var(--ink-2)}
/* peraturan: area bergulir + centang persetujuan (P12) */
.ob-aturan-sub{margin:-6px 0 4px}
.ob-gulir.ob-gulir-baca{max-height:58vh;border-bottom:0}
.ob-gulir{max-height:46vh;overflow-y:auto;overscroll-behavior:contain;margin-top:6px;padding:4px 10px 4px 0;border-bottom:1px solid var(--line)}
.ob-gulir:focus-visible{outline:3px solid var(--ring);border-radius:8px}
.ob-setuju{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:14px;font-weight:500;line-height:1.5;color:var(--ink);cursor:pointer}
.ob-setuju input{flex:none;width:18px;height:18px;margin:2px 0 0;accent-color:var(--blue);cursor:pointer}
.ob-setuju:has(input:disabled){color:var(--ink-3);cursor:not-allowed}
.ob-setuju input:disabled{cursor:not-allowed}
.ob-kaki .btn:disabled{background:var(--disabled);color:var(--ink-3);border-color:transparent;cursor:not-allowed;transform:none}
.ob-kaki{display:flex;gap:8px;align-items:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.ob-sp{flex:1}
.ob-lewati{font:inherit;font-size:13.5px;font-weight:500;color:var(--ink-2);background:none;border:0;cursor:pointer;padding:8px 4px}
.ob-lewati:hover{color:var(--ink)}
.ob-lewati:focus-visible{outline:3px solid var(--ring);border-radius:6px}
.kom-ob-lagi{justify-self:start;font:inherit;font-size:12.5px;font-weight:600;color:var(--blue-ink);background:none;border:0;padding:0;
  cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.kom-ob-lagi:focus-visible{outline:3px solid var(--ring);border-radius:4px}

/* ---------- info komunitas (Advance) + nama lengkap untuk pengurus ---------- */
.kom-info{margin-top:18px;display:grid;gap:12px}
.kom-info[hidden]{display:none}
.kom-umum{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:13px;background:var(--orange-wash)}
.kom-umum-ic{flex:none;width:34px;height:34px;border-radius:100px;display:grid;place-items:center;background:var(--card);color:var(--orange-ink)}
.kom-umum-ic svg{width:18px;height:18px}
.kom-umum-h{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--orange-ink)}
.kom-umum-t{font-size:14.5px;line-height:1.55;color:var(--ink);margin-top:2px;white-space:pre-line;overflow-wrap:anywhere}
.kom-tautan{display:grid;gap:10px}
@media(min-width:640px){.kom-tautan{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kom-tautan-i{display:flex;gap:12px;align-items:center;text-align:left;font-family:inherit;padding:12px 14px;border-radius:13px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;transition:border-color .15s ease,background .15s ease}
.kom-tautan-i:hover{border-color:var(--blue);background:var(--blue-tint)}
.kom-tautan-i:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.kom-tautan-i[data-kunci]{background:var(--bg-alt);border-style:dashed}
.kom-tautan-i[data-kunci]:hover{border-color:var(--line);background:var(--bg-alt)}
.kom-tautan-ic{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--blue-wash);color:var(--blue-ink)}
.kom-tautan-i[data-kunci] .kom-tautan-ic{background:var(--line-2);color:var(--ink-3)}
.kom-tautan-ic svg{width:18px;height:18px}
.kom-tautan-i .t{min-width:0}
.kom-tautan-i b{display:block;font-size:14px;font-weight:600;line-height:1.35}
.kom-tautan-i small{display:block;font-size:12px;color:var(--ink-2);line-height:1.4}
.kom-info-ajak{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:13px;border:1px dashed var(--ink-3);background:var(--bg-alt)}
.kom-info-ajak > svg{flex:none;width:20px;height:20px;color:var(--orange-ink)}
.kom-info-ajak .t{flex:1;min-width:200px}
.kom-info-ajak strong{display:block;font-size:13.5px;font-weight:600;line-height:1.4}
.kom-info-ajak p{font-size:12px;color:var(--ink-2);line-height:1.5}

/* ---------- feed "Kabar komunitas" (Advance) ----------
   Kotak khusus ber-panel (kepala + kaki seperti Daftar Anggota) yang isinya
   bergulir sendiri, bentuk timeline ala Path: satu garis vertikal, simpul
   bulat di garis (foto pengurus / ikon anggota baru), gelembung chat di kanan. */
.kom-feed .kom-info-ajak{margin-top:0}
.fd-box .panel-bar{border-bottom:1px solid var(--line)}
.fd-box-ic{display:grid;place-items:center;width:28px;height:28px;border-radius:100px;background:var(--orange-wash);color:var(--orange-ink);flex:none}
.fd-box-ic svg{width:15px;height:15px}
.fd-gulir{max-height:440px;overflow-y:auto;overscroll-behavior:contain;padding:16px 18px 8px;background:var(--bg-alt)}
.fd-tl{position:relative;list-style:none;margin:0;padding:0}
/* timeline Kabar Komunitas ikut warna tema komunitas (--blue diwarnai 50-js-tema-komunitas) */
.fd-tl::before{content:"";position:absolute;left:19px;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--blue-wash)}
.fd-i{position:relative;display:grid;grid-template-columns:40px 1fr;gap:12px;padding-bottom:18px}
.fd-node{position:relative;z-index:1;width:40px;height:40px;border-radius:100px;box-shadow:0 0 0 3px var(--bg-alt)}
.fd-node .av{width:40px;height:40px;font-size:14px}
.fd-node.ic{display:grid;place-items:center;background:var(--blue);color:var(--btn-ink)}
.fd-node.ic svg{width:19px;height:19px}
.fd-isi-w{min-width:0}
.fd-meta{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;min-height:22px;font-size:13px;color:var(--ink-2);line-height:1.4}
.fd-meta b{font-weight:600;color:var(--ink)}
.fd-jab{font-size:11px;font-weight:600;padding:2px 8px;border-radius:100px;background:var(--blue-wash);color:var(--blue-ink)}
.fd-waktu{font-size:12px;color:var(--ink-3)}
.fd-pin{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:100px;background:var(--orange-wash);color:var(--orange-ink)}
.fd-pin svg{width:12px;height:12px}
.fd-bubble{margin-top:6px;padding:12px 14px;border-radius:4px 16px 16px 16px;border:1px solid var(--line);background:var(--card)}
.fd-bubble.pin{border-color:var(--orange)}
.fd-isi{font-size:14.5px;line-height:1.6;white-space:pre-line;overflow-wrap:anywhere}
.fd-tautan{margin-top:10px;display:inline-flex;align-items:center;gap:6px;max-width:100%;font:inherit;font-size:13px;font-weight:500;padding:6px 12px;border-radius:100px;border:1px solid var(--line);background:var(--blue-tint);color:var(--blue-ink);cursor:pointer}
.fd-tautan span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fd-tautan svg{width:14px;height:14px;flex:none}
.fd-bubble.sambut{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--blue-wash);border-color:transparent}
.fd-bubble{border-color:var(--blue-wash)}
.fd-bubble.pin{border-color:var(--blue)}
.fd-pin{background:var(--blue-wash);color:var(--blue-ink)}
.fd-bubble.sambut .av{width:44px;height:44px;font-size:14px;flex:none}
.fd-bubble.sambut .t{flex:1 1 140px;min-width:0}
.fd-bubble.sambut b{display:block;font-size:14.5px;font-weight:600;line-height:1.35}
.fd-bubble.sambut small{display:block;margin-top:2px;font-size:12.5px;color:var(--ink-2);line-height:1.45}
[data-feed-orang]{cursor:pointer}
[data-feed-orang]:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
.fd-orang{flex:none}
.fd-kenal{flex:none;background:var(--card)}
.fd-kenal svg{width:16px;height:16px}
.fd-kenal-st{display:inline-flex;align-items:center;gap:6px;flex:none;font-size:12px;font-weight:600;padding:6px 12px;border-radius:100px;background:var(--card)}
.fd-kenal-st svg{width:16px;height:16px}
.fd-kenal-st.menunggu{color:var(--ink-2)}
.fd-kenal-st.terhubung{color:var(--green)}
.fd-tumpuk{display:flex;flex:none}
.fd-bubble.sambut .fd-tumpuk .av{width:36px;height:36px;font-size:12px;margin-left:-10px;box-shadow:0 0 0 2px var(--green-wash)}
.fd-bubble.sambut .fd-tumpuk .av:first-child{margin-left:0}
.fd-lagi{display:block;width:100%;margin:0 0 10px;padding:8px;font:inherit;font-size:13px;font-weight:500;color:var(--blue-ink);background:none;border:0;cursor:pointer}
.fd-lagi:hover{text-decoration:underline}
.fd-kosong{margin:4px 0 10px;padding:22px 16px;border:1px dashed var(--line);border-radius:13px;text-align:center;font-size:13px;color:var(--ink-3);background:var(--card)}
.fd-kunci{display:flex;align-items:center;gap:12px;margin:4px 0 10px;padding:14px 16px;border-radius:13px;border:1px dashed var(--ink-3);background:var(--card)}
.fd-kunci svg{width:20px;height:20px;flex:none;color:var(--ink-2)}
.fd-kunci b{display:block;font-size:13.5px;font-weight:600}
.fd-kunci p{font-size:12px;color:var(--ink-2);line-height:1.5}
.fd-kosong .btn{margin-top:10px}

.sek-peringatan{margin-top:10px;font-size:12.5px;line-height:1.5;color:var(--orange-ink);background:var(--orange-wash);padding:8px 12px;border-radius:10px}

/* dashboard: form Info komunitas */

.sek-f{display:grid;gap:6px}

/* ---------- bar founder di halaman komunitas ---------- */
.kom-founder{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between;

/* ---------- dashboard pengurus (scrKelola) ---------- */
.kom-status.pengurus{background:var(--blue-wash);color:var(--blue-ink)}
/* navigasi. Esensial: baris tab seperti semula (geser kalau sempit), tab Advance
   disembunyikan. Advance: kolom samping di >=900px, dua kelompok Advance / Kelola.
   Sub-menu: di baris tab, induk (.kl-induk) disembunyikan dan sub-menunya tampil
   sebagai tab biasa — kecuali di Esensial, di mana induknya yang tampil sebagai tab
   (sub-menu Advance-nya tersembunyi). Di kolom samping, induk membuka .kl-subnav. */
.kl-body{margin-top:22px}
.kl-main{min-width:0}
.kl-nav{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);
  margin:0 -22px;padding:0 22px;scrollbar-width:none}
.kl-nav::-webkit-scrollbar{display:none}
.kl-nav-h{flex:none;display:flex;align-items:center;font-size:11px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.kl-nav-h:first-child{display:none}
.kl-nav-h:not(:first-child){border-left:1px solid var(--line);padding-left:12px;margin-left:6px}
.kl-nav-h.sek{color:var(--orange-ink)}
#scrKelola:not(.mode-adv) .kl-nav-h,#scrKelola:not(.mode-adv) .kl-tab[data-sek]{display:none}
.kl-subnav{display:contents}
.kl-nav [data-induk]{display:none}
.kl-induk-ic{width:16px;height:16px;display:none;transition:transform .15s ease}
.kl-tab-ic{flex:none;display:inline-grid;width:18px;height:18px}
.kl-tab-ic svg{width:100%;height:100%}
.kl-tab.sub .kl-tab-ic{width:16px;height:16px}
#scrKelola:not(.mode-adv) .kl-subnav{display:none}
#scrKelola:not(.mode-adv) [data-induk]:not([data-sek]){display:inline-flex}
.kl-induk.aktif{color:var(--blue-ink);border-bottom-color:var(--blue)}
.kl-tab{flex:none;font-family:inherit;font-size:14px;font-weight:600;color:var(--ink-3);background:none;border:0;
  padding:12px 6px;margin-bottom:-1px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;gap:8px;text-align:left}
.kl-tab:hover{color:var(--ink)}
.kl-tab.on{color:var(--blue-ink);border-bottom-color:var(--blue)}
.kl-tab:focus-visible{outline:3px solid var(--ring);outline-offset:2px;border-radius:6px}
.kl-badge{font-size:11px;font-weight:700;min-width:19px;height:19px;padding:0 6px;border-radius:100px;
  display:inline-grid;place-items:center;background:var(--blue-wash);color:var(--blue-ink)}
.kl-tab.on .kl-badge{background:var(--blue);color:var(--btn-ink)}
.kl-panel{margin-top:22px}
.kl-panel[hidden]{display:none}
@media(min-width:900px){
  #scrKelola.mode-adv .kl-body{display:grid;grid-template-columns:212px minmax(0,1fr);gap:36px;align-items:start;margin-top:26px}
  #scrKelola.mode-adv .kl-nav{flex-direction:column;gap:2px;margin:0;padding:0;border:0;overflow:visible;position:sticky;top:96px}
  #scrKelola.mode-adv .kl-nav-h{padding:4px 12px 6px}
  #scrKelola.mode-adv .kl-nav-h:first-child{display:flex}
  #scrKelola.mode-adv .kl-nav-h:not(:first-child){border-left:0;margin:12px 0 0;padding:16px 12px 6px;border-top:1px solid var(--line)}
  #scrKelola.mode-adv .kl-tab{width:100%;padding:10px 12px;margin:0;border:0;border-radius:10px}
  #scrKelola.mode-adv .kl-tab:hover{background:var(--bg-alt)}
  #scrKelola.mode-adv .kl-tab.on{background:var(--blue-wash)}
  #scrKelola.mode-adv .kl-tab .kl-badge{margin-left:auto}
  #scrKelola.mode-adv [data-induk]{display:flex}
  #scrKelola.mode-adv .kl-induk.aktif{color:var(--ink);background:none}
  #scrKelola.mode-adv .kl-induk.aktif:hover{background:var(--bg-alt)}
  #scrKelola.mode-adv .kl-induk-ic{display:block;margin-left:auto}
  #scrKelola.mode-adv .kl-induk[aria-expanded="true"] .kl-induk-ic{transform:rotate(180deg)}
  #scrKelola.mode-adv .kl-subnav{display:none;gap:2px;padding-left:12px}
  #scrKelola.mode-adv .kl-subnav.buka{display:grid}
  #scrKelola.mode-adv .kl-tab.sub{font-size:13.5px;padding:8px 12px}
  #scrKelola.mode-adv .kl-panel{margin-top:0}
}

/* ---------- atur posisi gambar (logo kotak / foto bulat) sebelum dipasang ---------- */
.lgn-box.agb-box{max-width:400px;text-align:left;padding:28px 28px 22px}

.agb-panggung{position:relative;width:280px;height:280px;margin:18px auto 0;overflow:hidden;border-radius:20px;
  background:repeating-conic-gradient(var(--bg-alt) 0 25%, var(--card) 0 50%) 0 0/20px 20px;
  cursor:grab;touch-action:none;user-select:none;box-shadow:0 0 0 1px var(--line)}
.agb-box.bulat .agb-panggung{border-radius:50%}
.agb-panggung.seret{cursor:grabbing}

.agb-panggung img{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0;pointer-events:none}
/* garis sepertiga tipis, hanya saat digeser, untuk membantu menengahkan */
.agb-kisi{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .15s ease;
  background:linear-gradient(90deg,transparent calc(33.33% - .5px),rgb(255 255 255 / .7) calc(33.33% - .5px) calc(33.33% + .5px),transparent calc(33.33% + .5px) calc(66.66% - .5px),rgb(255 255 255 / .7) calc(66.66% - .5px) calc(66.66% + .5px),transparent calc(66.66% + .5px)),
             linear-gradient(transparent calc(33.33% - .5px),rgb(255 255 255 / .7) calc(33.33% - .5px) calc(33.33% + .5px),transparent calc(33.33% + .5px) calc(66.66% - .5px),rgb(255 255 255 / .7) calc(66.66% - .5px) calc(66.66% + .5px),transparent calc(66.66% + .5px))}
.agb-panggung.seret .agb-kisi{opacity:1}
.agb-zoom{display:flex;align-items:center;gap:10px;width:280px;margin:16px auto 0}
.agb-zoom input{flex:1;accent-color:var(--blue)}
.agb-zb{flex:none;width:32px;height:32px;border-radius:100px;border:1px solid var(--line);background:var(--card);color:var(--ink-2);display:grid;place-items:center;cursor:pointer}
.agb-zb:hover{background:var(--bg-alt);color:var(--ink)}
.agb-zb:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.agb-zb svg{width:15px;height:15px}
.agb-reset-w{display:flex;justify-content:center;margin-top:8px}
.agb-aksi{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.agb-reset{font:inherit;font-size:12.5px;font-weight:500;color:var(--ink-3);background:none;border:0;padding:4px 2px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.agb-reset:hover{color:var(--ink)}
.agb-reset:focus-visible{outline:3px solid var(--ring);border-radius:4px}
/* keluar dari komunitas (anggota sendiri): tautan tenang di bawah status, dialog beralasan opsional */
.kom-keluar{align-self:center;display:inline-flex;align-items:center;gap:6px;margin-top:8px;font:inherit;font-size:12.5px;font-weight:500;color:var(--ink-3);background:none;border:0;padding:4px 6px;cursor:pointer;border-radius:6px}
.kom-keluar svg,.pf-mini svg,.ag-kelola .btn svg{width:15px;height:15px;flex:none}
.pf-mini:has(svg){display:inline-flex;align-items:center;gap:6px}
.kom-keluar:hover{color:var(--red);text-decoration:underline;text-underline-offset:2px}
.kom-keluar:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.lgn-box.klr-box{max-width:480px;text-align:left;padding:30px 28px 24px}
.klr-l{margin:14px 0 0;padding-left:18px;display:grid;gap:6px;font-size:13.5px;line-height:1.5;color:var(--ink-2)}
.klr-alasan{margin:18px 0 0;padding:0;border:0;display:grid;gap:10px}
.klr-alasan legend{padding:0;margin-bottom:10px;font-size:13.5px;font-weight:600;color:var(--ink)}
.klr-alasan legend span{font-weight:400;color:var(--ink-3)}
.klr-chips{display:flex;flex-wrap:wrap;gap:8px}
.klr-chip{position:relative;cursor:pointer}
.klr-chip input{position:absolute;opacity:0;pointer-events:none}
.klr-chip span{display:inline-flex;align-items:center;height:34px;padding:0 14px;border-radius:100px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--ink-2)}
.klr-chip:hover span{border-color:var(--ink-3);color:var(--ink)}
.klr-chip input:checked + span{border-color:var(--blue);background:var(--blue-wash);color:var(--blue-ink);font-weight:500}
.klr-chip input:focus-visible + span{outline:3px solid var(--ring);outline-offset:2px}
.klr-aksi{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}

/* kartu permintaan yang diperkaya: kontak, kelengkapan, nomor, catatan */
.kl-req-panggil{font-weight:500;color:var(--ink-3);font-size:13px}
/* jawaban pertanyaan pendaftaran — sinyal utama, dibuat menonjol (kotak bertema) */
.kl-req-jawab{margin-top:14px;padding:14px 16px;border-radius:12px;background:var(--blue-wash)}
.kl-jawab-h{display:block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--blue-ink);margin-bottom:10px}
.kl-jawab-row{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:5px 0}
.kl-jawab-q{font-size:12.5px;color:var(--ink-2);flex:none;max-width:48%}
.kl-jawab-a{font-size:13.5px;font-weight:600;color:var(--ink);text-align:right;word-break:break-word}
.kl-jawab-row.panjang{flex-direction:column;align-items:stretch;gap:3px}
.kl-jawab-row.panjang .kl-jawab-q{max-width:none}
.kl-jawab-row.panjang .kl-jawab-a{text-align:left;font-weight:500;line-height:1.5}
.kl-info-h{display:block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.kl-info-k{display:block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.kl-req-info{margin-top:14px;display:grid;gap:11px 18px;grid-template-columns:1fr;padding:14px 16px;border-radius:12px;background:var(--bg-alt)}
.kl-req-info .kl-info-h{grid-column:1/-1;margin-bottom:0}
@media(min-width:560px){.kl-req-info{grid-template-columns:1fr 1fr}}
.kl-info-row .kl-info-k{margin-bottom:2px}
.kl-info-v{font-size:13.5px;color:var(--ink);line-height:1.45;word-break:break-word}
/* akun media sosial pendaftar di kartu peninjau */
.kl-sosmed{display:flex;flex-wrap:wrap;gap:6px}
.kl-sosmed-i{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:100px;border:1px solid var(--line);
  background:var(--card);color:var(--blue-ink);font-size:12.5px;text-decoration:none;max-width:100%;overflow-wrap:anywhere}
.kl-sosmed-i b{font-weight:600;color:var(--ink-2)}
.kl-sosmed-i:hover{border-color:var(--blue);background:var(--blue-wash)}
.kl-sosmed-i:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.kl-jawab-a.kl-jawab-kosong{color:var(--ink-3);font-weight:500}
.kl-jawab-kosong small{font-size:11.5px}
.kl-verif{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--green);margin-left:4px}
.kl-verif svg{width:11px;height:11px}
.kl-ok{color:var(--green);font-weight:600;display:inline-flex;align-items:center;gap:5px}
.kl-ok svg{width:13px;height:13px}
/* kelengkapan profil pendaftar: meter + isian yang belum diisi */
.kl-lengkap{display:flex;flex-direction:column;gap:6px}
.kl-lengkap-t{display:flex;align-items:center;gap:10px}
.kl-lengkap-bar{width:90px;height:6px;border-radius:100px;background:var(--line-2);overflow:hidden}
.kl-lengkap-bar i{display:block;height:100%;border-radius:100px;background:var(--orange)}
.kl-kurang{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.kl-kurang-l{font-size:12px;color:var(--ink-3)}
.kl-kurang-i{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:100px;background:var(--orange-wash);color:var(--orange-ink)}
/* pop up pengurus: label jawaban gabung yang berkaitan dengan komunitas */
.peng-pp-tags{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:10px}
/* warna label ikut tema komunitas (pop up diwarnai 50-js-tema-komunitas) */
.peng-pp-tags .tag{background:var(--blue-wash);color:var(--blue-ink);border-color:transparent;font-weight:600}
/* tab Dashboard: buat komunitas berikutnya */
.dsb-baru{display:flex;align-items:center;gap:14px;width:100%;margin-top:14px;padding:16px 18px;border:1.5px dashed var(--line);border-radius:13px;background:transparent;color:var(--ink);font:inherit;text-align:left;cursor:pointer;transition:border-color .15s ease,background .15s ease}
.dsb-baru:hover{border-color:var(--blue);background:var(--blue-tint)}
.dsb-baru:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.dsb-baru-ic{width:42px;height:42px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--blue-wash);color:var(--blue-ink);font-size:22px;font-weight:500}
.dsb-baru .t{display:flex;flex-direction:column;gap:2px}
.dsb-baru b{font-size:14.5px;font-weight:600}
.dsb-baru small{font-size:12.5px;color:var(--ink-3)}
.kl-warn{color:var(--orange-ink);font-weight:600}
.kl-req-nomor{margin-top:14px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.kl-req-nomor .kl-info-k{margin-bottom:0}
.kl-idbadge{font-family:"SFMono-Regular",ui-monospace,Menlo,monospace;font-size:12.5px;font-weight:600;
  letter-spacing:.02em;padding:4px 10px;border-radius:8px;background:var(--blue-wash);color:var(--blue-ink)}
.kl-idbadge.sm{font-size:11.5px;padding:3px 8px}
.kl-id-note{font-size:11.5px;color:var(--ink-3)}
/* nomor anggota kecil di atas nama — dipakai di dashboard, daftar & detail anggota */
.mem-id{font-family:"SFMono-Regular",ui-monospace,Menlo,monospace;font-size:10.5px;font-weight:600;
  letter-spacing:.04em;color:var(--ink-3);line-height:1.2;margin-bottom:3px}
.kl-idfield{max-width:220px;height:40px;font-family:"SFMono-Regular",ui-monospace,Menlo,monospace;font-size:13px}
.kl-req-catatan{margin-top:14px}
.kl-req-catatan .inp{height:44px}
.kl-opt{font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink-3)}
.kl-wajib{font-weight:600;color:var(--red);margin-left:2px}
.kl-req-catatan-note{font-size:12px;color:var(--ink-3);line-height:1.45;margin-top:6px}
.kl-req-aksi .btn:disabled{background:var(--disabled);color:var(--ink-3);border-color:transparent;cursor:not-allowed;transform:none}
.kl-riwayat-catatan{margin-top:10px;padding:10px 12px;border-radius:13px;background:var(--bg-alt);border:1px solid var(--line);border-left:3px solid var(--line)}
.kl-riwayat-catatan.diterima{border-left-color:var(--green)}
.kl-riwayat-catatan.ditolak{border-left-color:var(--red)}
.kl-riwayat-catatan-h{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.kl-riwayat-catatan-h svg{width:14px;height:14px;flex:none}
.kl-riwayat-catatan p{font-size:13.5px;color:var(--ink);line-height:1.5;margin-top:4px}

/* ---------- Sekretariat: dashboard pengurus berlangganan ---------- */
/* toggle tampilan Esensial | Advance */
.kl-mode-bar{margin-top:22px;display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap}
.kl-mode{flex:none;display:inline-flex;padding:4px;border-radius:100px;background:var(--bg-alt);border:1px solid var(--line)}
.kl-mode button{font-family:inherit;font-size:13.5px;font-weight:600;height:36px;padding:0 18px;border-radius:100px;border:0;
  background:transparent;color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.kl-mode button:hover{color:var(--ink)}
.kl-mode button[aria-checked="true"]{background:var(--card);color:var(--blue-ink);box-shadow:var(--sh-sm)}
.kl-mode button:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.kl-mode-tag{font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:2px 7px;border-radius:100px;
  background:var(--orange-wash);color:var(--orange-ink)}
.kl-mode-info{flex:1;min-width:220px;font-size:12.5px;color:var(--ink-2);line-height:1.5}
.kl-mode-info b{color:var(--ink);font-weight:600}
.kl-mode-link{font:inherit;font-weight:600;color:var(--blue-ink);background:none;border:0;padding:0;cursor:pointer;
  text-decoration:underline;text-underline-offset:2px}
.kl-mode-link:focus-visible{outline:3px solid var(--ring);outline-offset:2px;border-radius:4px}
.sek-eb{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--orange-ink)}
.sek-eb svg{width:13px;height:13px}
.sek-h h2{font-size:21px;margin:6px 0 6px}
.sek-h .kl-sub{margin-bottom:0}
.sek-blok{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px 18px}
.sek-blok-h{font-size:15px;font-weight:600;line-height:1.35;margin-bottom:4px}
.sek-blok-sub{font-size:12.5px;color:var(--ink-2);line-height:1.5}
.sek-baris{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.sek-kecil{font-size:12px;color:var(--ink-3);line-height:1.5}
.sek-kecil.jarak{margin-top:10px}
.sek-baris.atas{margin-top:0;justify-content:space-between;flex-wrap:nowrap;align-items:flex-start}
.sek-baris.atas .sw{flex:none;margin-top:2px}
.sek-daftar{margin-top:12px}
.sek-file .sek-blok-h{margin:0}
.sek-nudge{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px;padding:12px 14px;
  border-radius:13px;background:var(--orange-wash);font-size:13px;line-height:1.5;color:var(--ink-2)}
.sek-nudge[hidden]{display:none}
.sek-nudge .t{flex:1;min-width:220px}
.sek-nudge b{color:var(--ink)}

/* daftar centang & baris tombol — dipakai pop up langganan dan panel */
.sek-poin{margin-top:16px;display:grid;gap:10px}
.sek-poin li{display:flex;gap:10px;font-size:14px;line-height:1.5}
.sek-poin svg{flex:none;width:18px;height:18px;margin-top:2px;color:var(--green)}
.sek-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}

/* dashboard */
.sek-stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
@media(min-width:720px){.sek-stat{grid-template-columns:repeat(4,1fr)}}
.sek-stat-i{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 14px}
.sek-stat-i b{display:block;font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.sek-stat-i span{display:block;font-size:12px;color:var(--ink-2);line-height:1.4;margin-top:2px}
.sek-stat-i.warn b{color:var(--orange-ink)}

/* dashboard: angka mingguan + grafik garis */
.sek-alat{display:flex;gap:10px 14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:16px}
.sek-judul-k{margin-top:24px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.sek-stat2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.sek-stat-i .sek-delta{margin-top:8px;font-size:11.5px;font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums;
  display:inline-flex;align-items:center;gap:4px;padding:2px 8px 2px 6px;border-radius:100px;background:var(--bg-alt)}

.sek-stat-i .sek-delta.turun{color:var(--red);background:var(--red-wash)}
.sek-stat-h{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.sek-stat-ic{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--blue-wash);color:var(--blue-ink)}
.sek-stat-ic svg{width:18px;height:18px}
.sek-grafik{margin-top:24px}
.sek-grafik-h{display:flex;gap:10px 14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.sek-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:12.5px}
.sek-legend li{display:inline-flex;align-items:center;gap:7px}
.sek-legend span{color:var(--ink-2)}
.sek-legend svg{width:22px;height:10px;flex:none}
.sek-c1{color:var(--viz-1)}
.sek-c2{color:var(--viz-2)}
.sek-c3{color:var(--viz-3)}
.sek-garis{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.sek-garis.putus{stroke-dasharray:5 4}
.sek-plot{position:relative;margin-top:8px;height:220px}
.sek-plot svg{display:block;width:100%;height:220px;overflow:visible}
.sek-plot .grid{stroke:var(--line);stroke-width:1}
.sek-plot .sumbu{fill:var(--ink-3);font-size:11px;font-family:inherit}
.sek-plot .nilai{fill:var(--ink-2);font-size:11px;font-weight:600;font-family:inherit}
.sek-plot .titik{fill:currentColor;stroke:var(--card);stroke-width:2}
.sek-plot .silang{stroke:var(--ink-3);stroke-width:1}
.sek-sasaran{fill:transparent;cursor:crosshair}
.sek-tip{position:absolute;top:0;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:10px;
  box-shadow:var(--sh);padding:8px 10px;font-size:12px;line-height:1.55;color:var(--ink);white-space:nowrap}
.sek-tip[hidden]{display:none}
.sek-tip b{font-weight:600}
.sek-tip .r{display:flex;align-items:center;gap:7px;color:var(--ink-2)}
.sek-tip .r i{width:8px;height:8px;border-radius:100px;background:currentColor;flex:none}
.sek-rinci{margin-top:12px}
.sek-rinci summary{font-size:12.5px;font-weight:600;color:var(--blue-ink);cursor:pointer}
.sek-rinci-w{overflow-x:auto;margin-top:8px}
.sek-rinci table{border-collapse:collapse;font-size:12px;width:100%;font-variant-numeric:tabular-nums}
.sek-rinci th,.sek-rinci td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.sek-rinci th:first-child,.sek-rinci td:first-child{text-align:left}
.sek-rinci th{font-weight:600;color:var(--ink-2)}

/* rapikan jawaban */
.sek-ringkas{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px}
.sek-ringkas div{font-size:12.5px;color:var(--ink-2)}
.sek-ringkas b{display:block;font-size:20px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.sek-varian{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 16px}
.sek-varian.satu{border-color:transparent;background:var(--green-wash)}
.sek-varian.pisah{background:var(--bg-alt)}
.sek-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sek-chip{font-size:12.5px;padding:4px 10px;border-radius:100px;background:var(--bg-alt);border:1px solid var(--line);color:var(--ink)}
.sek-chip i{font-style:normal;color:var(--ink-3);margin-left:4px;font-variant-numeric:tabular-nums}
.sek-chip.jadi{background:var(--card);border-color:var(--green);color:var(--green);font-weight:600}
.sek-panah{width:16px;height:16px;color:var(--ink-3);flex:none}
.sek-ragu{font-size:12.5px;color:var(--orange-ink);line-height:1.5;margin-top:8px}
.sek-varian .sek-baris .inp{max-width:260px;height:40px}

/* akses pengurus */
.sek-level{max-width:170px;height:40px;font-size:13px}
.sek-status{font-size:11px;font-weight:600;padding:3px 9px;border-radius:100px;background:var(--green-wash);color:var(--green)}
.sek-status.undang{background:var(--orange-wash);color:var(--orange-ink)}
.sek-status.pemilik{background:var(--blue-wash);color:var(--blue-ink)}
.sek-undang{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.sek-undang .inp{flex:1;min-width:200px;height:44px}
.sek-undang .sel{max-width:170px;height:44px}
.sek-link{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;padding:10px 12px;border-radius:11px;background:var(--bg-alt);border:1px solid var(--line)}
.sek-link code{flex:1;min-width:0;font-family:"SFMono-Regular",ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--ink);word-break:break-all}
.sek-tabel-w{overflow-x:auto;margin-top:12px}
.sek-tabel{width:100%;border-collapse:collapse;font-size:13px;min-width:460px}
.sek-tabel th,.sek-tabel td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:center}
.sek-tabel th{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.sek-tabel th:first-child,.sek-tabel td:first-child{text-align:left}
.sek-tabel .ya{color:var(--green);font-weight:700}
.sek-tabel .tak{color:var(--ink-3)}
/* akses: centang hak per jabatan */
.sek-hak th{white-space:nowrap}
.sek-hak td:first-child{white-space:normal;min-width:180px}
.sek-hak input{width:18px;height:18px;margin:0;accent-color:var(--blue);cursor:pointer;vertical-align:middle}
.sek-hak td.beda{background:var(--orange-wash)}

/* setting: akun, notifikasi, tagihan */
.sek-form{margin-top:12px;display:grid;gap:8px;max-width:420px}
.sek-form .inp{height:44px}
.sek-lbl{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.sek-kode{max-width:180px;letter-spacing:.3em;font-variant-numeric:tabular-nums}
.sek-nilai{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
.sek-nilai code{font-family:"SFMono-Regular",ui-monospace,Menlo,monospace;font-size:13.5px;color:var(--ink);word-break:break-all}
.sek-opsi-h{font-size:14px;font-weight:600;line-height:1.4}
.sek-garis-b{padding:12px 0;border-bottom:1px solid var(--line)}
.sek-garis-b:last-child{border-bottom:0;padding-bottom:0}
.sek-ingat{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 20px;margin-top:12px;padding:14px;border-radius:13px;background:var(--bg-alt);border:1px solid var(--line)}
.sek-ingat-hari{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sek-ingat-hari .chip{min-width:46px;height:34px;padding:0 12px;font-size:13px}
.sek-ingat-jam{display:grid;gap:6px}
.sek-ingat-jam .sel{height:40px;min-width:110px}
.sek-ingat-ringkas{flex-basis:100%;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--blue-ink)}
.sek-ingat-ringkas svg{width:16px;height:16px;flex:none}
.sek-kuota{flex:none;font-size:12px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.sek-grid2{display:grid;gap:12px;margin-top:12px}
@media(min-width:640px){.sek-grid2{grid-template-columns:1fr 1fr}}
.sek-grid2 > div{display:grid;gap:6px}
.sek-grid2 .inp{height:44px}
.sek-penuh{grid-column:1/-1}
.sek-dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:10px 0 0;font-size:13.5px;line-height:1.5}
.sek-dl dt{color:var(--ink-3)}
.sek-dl dd{margin:0;color:var(--ink);min-width:0;overflow-wrap:anywhere}
.sek-bayar{display:grid;gap:8px;margin-top:12px}
.sek-bayar-i{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:13px;background:var(--card);cursor:pointer}
.sek-bayar-i:has(input:checked){border-color:var(--blue);background:var(--blue-tint)}
.sek-bayar-i input{margin:3px 0 0;flex:none;accent-color:var(--blue)}
.sek-bayar-i .t{flex:1;min-width:0}
.sek-bayar-i b{display:block;font-size:14px;font-weight:600;line-height:1.4}
.sek-bayar-i small{display:block;font-size:12px;color:var(--ink-2);line-height:1.5}
.sek-jejak li{display:flex;gap:10px;justify-content:space-between;font-size:13px;line-height:1.5;padding:8px 0;border-bottom:1px solid var(--line)}
.sek-jejak li:last-child{border-bottom:0}
.sek-jejak span{color:var(--ink-3);font-size:12px;white-space:nowrap}

/* serah terima */
.sek-langkah{display:flex;gap:13px;margin-top:16px}
.sek-no{flex:none;width:28px;height:28px;border-radius:100px;display:grid;place-items:center;font-size:13px;font-weight:600;
  background:var(--blue-wash);color:var(--blue-ink)}
.sek-langkah .t{flex:1;min-width:0}
.sek-langkah .sel,.sek-langkah .inp{max-width:320px;height:44px;margin-top:8px}
.sek-pilih{display:grid;gap:8px;margin-top:8px}
.sek-pilih label{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.5;cursor:pointer}
.sek-pilih input{margin-top:4px;accent-color:var(--blue)}
/* persebaran anggota (Advance › Jawaban pendaftar › Persebaran) */
.sek-sebaran-status{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.sek-lencana{display:inline-flex;align-items:center;flex:none;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:100px;background:var(--green-wash);color:var(--green)}
.sek-lencana.diatur{background:var(--blue-wash);color:var(--blue-ink)}
.sek-sebaran-status .sek-kecil{flex:1;min-width:220px}
.sek-sebaran{display:grid;gap:8px;margin-top:8px}
.sek-sebaran-i{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--card)}
.sek-sebaran-i.on{border-color:var(--blue);background:var(--blue-tint)}
.sek-sebaran-i label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:13.5px;line-height:1.45}
.sek-sebaran-i label>span{display:grid;gap:1px}
.sek-sebaran-i input{margin-top:3px;accent-color:var(--blue)}
.sek-sebaran-cat{grid-column:1 / -1;padding-left:26px;font-size:12px;color:var(--orange-ink);line-height:1.5}
.sek-sebaran-geser{display:flex;gap:4px}
.sek-ikon-btn{width:32px;height:32px;display:grid;place-items:center;border-radius:100px;border:1px solid var(--line);background:var(--card);color:var(--ink-2);cursor:pointer}
.sek-ikon-btn:hover:not(:disabled){border-color:var(--blue);color:var(--blue-ink)}
.sek-ikon-btn:disabled{opacity:.4;cursor:default}
.sek-ikon-btn:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.sek-ikon-btn svg{width:15px;height:15px}
.sek-sebaran-pra{margin-top:10px}
.sek-pindah{display:grid;gap:8px;margin-top:10px}
.sek-pindah li{display:flex;gap:10px;font-size:13px;line-height:1.5}
.sek-pindah svg{flex:none;width:16px;height:16px;margin-top:3px;color:var(--blue-ink)}
.sek-pindah b{font-weight:600}
.sek-jadwal{background:var(--green-wash);border-color:transparent}
.sek-periode-list{margin-top:12px;border-top:1px solid var(--line)}
.sek-periode{border-bottom:1px solid var(--line)}
.sek-periode summary{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:11px 0;cursor:pointer;font-size:13.5px;list-style:none}
.sek-periode summary::-webkit-details-marker{display:none}
.sek-periode summary::before{content:"";flex:none;width:7px;height:7px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(-45deg);transition:transform .15s ease;margin-right:2px}
.sek-periode[open] summary::before{transform:rotate(45deg)}
.sek-periode summary:focus-visible{outline:3px solid var(--ring);outline-offset:2px;border-radius:6px}
.sek-periode summary b{font-weight:600;min-width:86px;font-variant-numeric:tabular-nums}
.sek-periode summary .t{flex:1;min-width:0;color:var(--ink-2)}
.sek-periode .sek-dl{margin:0 0 12px 19px}
.sek-periode .sek-kecil{margin:-4px 0 12px 19px}

/* modal aktifkan */
.lgn-box.sek-box{max-width:880px;text-align:left;padding:30px 34px 28px}
/* pop up langganan Advance: Kapasitas → Pembayaran → Selesai */
.sb-step{display:flex;gap:8px;margin:14px 0 18px;padding:0;list-style:none;flex-wrap:wrap}
.sb-step li{display:flex;align-items:center;gap:7px;padding:5px 12px 5px 6px;border-radius:100px;background:var(--bg-alt);font-size:12.5px;font-weight:600;color:var(--ink-3)}
.sb-step li span{width:20px;height:20px;border-radius:100px;display:grid;place-items:center;background:var(--line);color:var(--ink-2);font-size:11px}
.sb-step li.kini{background:var(--blue-wash);color:var(--blue-ink)}
.sb-step li.kini span{background:var(--blue);color:var(--btn-ink)}
.sb-step li.lewat{color:var(--green)}
.sb-step li.lewat span{background:var(--green);color:var(--btn-ink)}
/* susunan atas-bawah: benefit / metode di atas, kalkulator / ringkasan di bawah — satu kolom yang enak dibaca */
.lgn-box.sek-box:has(.sb-step){max-width:580px;padding:28px 30px 26px}
.sb-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.sek-box:has(.sb-step) h2{font-size:21px}
.sek-box:has(.sb-step) .sb-step{margin:10px 0 14px}
.sek-box:has(.sb-step) .sek-alasan{margin-bottom:12px;padding:10px 12px}
/* benefit: deret chip bercentang, ringkas */
.sb-fitur{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:8px 0 0;padding:0;list-style:none}
@media(max-width:480px){.sb-fitur{grid-template-columns:1fr}}
.sb-fitur li{display:flex;gap:8px;align-items:flex-start}
.sb-fitur svg{width:16px;height:16px;flex:none;margin-top:2px;padding:2px;border-radius:100px;background:var(--green-wash);color:var(--green);stroke-width:2.8;box-sizing:content-box}
.sb-fitur span{display:flex;flex-direction:column;line-height:1.35}
.sb-fitur b{font-size:13.5px;font-weight:600;color:var(--ink)}
.sb-fitur small{font-size:12px;color:var(--ink-3)}
.sek-box:has(.sb-step) .sb-kanan{padding:14px 16px}
.sek-box:has(.sb-step) .sb-baris-k{margin-top:10px}
.sek-box:has(.sb-step) .sb-baris-k .sek-kecil{margin-top:2px}
.sek-box:has(.sb-step) .sb-rinci{margin-top:12px;gap:5px}
.sek-box:has(.sb-step) .kalk-v{margin-top:8px;padding-top:8px}
.sek-box:has(.sb-step) .sb-cta{margin-top:12px}
.sek-box:has(.sb-step) .kalk-seg{padding:7px 4px}
.sek-box:has(.sb-step) .sb-metode{padding:10px 12px}
/* kaki menempel: total + tombol utama selalu terlihat (pop up bisa digulir) */
.sb-kaki{position:sticky;bottom:-26px;z-index:2;display:flex;align-items:center;gap:12px;margin:18px -30px -26px;padding:14px 30px 18px;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -10px 20px -14px rgba(0,0,0,.18)}
.sb-kaki-t{display:flex;flex-direction:column;margin-right:auto;line-height:1.2}
.sb-kaki-t small{font-size:12px;color:var(--ink-3)}
.sb-kaki-t b{font-size:19px;font-weight:700;color:var(--blue-ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.sb-kaki .sb-batal{margin:0}
.sb-kaki .btn{flex:none}
@media(max-width:560px){.sb-kaki{bottom:-20px;margin:16px -18px -20px;padding:12px 18px 16px;flex-wrap:wrap}.sb-kaki .btn{flex:1}.sb-kaki .sb-batal{order:3;width:100%}}
.sb-qris .krd-qr{width:150px}
.sb-qris .krd-qris{max-width:220px}
@media(max-width:560px){.lgn-box.sek-box:has(.sb-step){padding:24px 18px 20px}}
.sb-kanan{padding:18px;border-radius:16px;border:1px solid var(--line);background:var(--bg-alt)}
.sb-poin{margin-top:8px;grid-template-columns:1fr 1fr;gap:10px 14px}
.sb-poin li{font-size:13.5px}
.sb-poin-k{margin-top:8px;line-height:1.5}
@media(max-width:480px){.sb-poin{grid-template-columns:1fr}}
.sb-baris-k{margin-top:14px}
.sb-baris-k input[type=range]{width:100%;accent-color:var(--blue)}
.sb-baris-k .kalk-l{margin-bottom:8px}
.sb-sejajar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sb-sejajar .kalk-l{margin-bottom:0}
.sb-kanan .kalk-durasi{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.sb-rinci{margin-top:16px}
.sb-rinci .sb-sub{padding-top:8px;border-top:1px solid var(--line)}
.sb-rinci .sb-sub dd{font-weight:600}
.sb-cta{width:100%;justify-content:center;margin-top:16px}
.sb-batal{display:block;margin:8px auto 0;padding:6px;border:0;background:none;font:inherit;font-size:13px;font-weight:600;color:var(--ink-3);cursor:pointer}
.sb-batal:hover{color:var(--ink)}
.sb-kini{padding:16px;border-radius:14px;border:1px solid var(--line)}
.sb-metode-l{display:grid;gap:8px;margin-top:8px}
.sb-metode,.sek-bayar-i{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:13px;border:1.5px solid var(--line);background:var(--card);cursor:pointer}
.sb-metode.on{border-color:var(--blue);background:var(--blue-wash)}
.sb-metode input{accent-color:var(--blue)}
.sb-metode .t,.sek-bayar-i .t{flex:1;min-width:0;display:flex;flex-direction:column}
.sb-metode b{font-size:14px}
.sb-metode small{font-size:12px;color:var(--ink-3)}
.sb-metode-ic{width:36px;height:36px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--bg-alt);color:var(--blue-ink)}
.sb-metode-ic svg{width:20px;height:20px}
.sb-dipakai{font-size:11px;font-weight:600;padding:3px 8px;border-radius:100px;background:var(--green-wash);color:var(--green);white-space:nowrap}
.sb-detail{margin-top:14px}
.sb-detail .sek-kecil svg{width:13px;height:13px;vertical-align:-2px;margin-right:4px}
.sb-simpan{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--bg-alt);font-size:13.5px}
.sb-simpan svg{width:20px;height:20px;color:var(--blue-ink)}
.sb-qris .krd-qris{margin-top:0}
.sb-proses{display:flex;flex-direction:column;align-items:center;gap:14px;padding:40px 0;text-align:center;color:var(--ink-2)}
.sb-proses .gspin{width:28px;height:28px}
.sb-ok{text-align:center}
.sb-ok .krd-ok-ic svg{width:26px;height:26px}
.sb-ok-dl{max-width:420px;margin:16px auto 0;text-align:left}
.sb-ok .sb-cta{max-width:420px}
/* panel Langganan: meter kapasitas */
.sb-meter-g{display:grid;gap:14px;margin-top:14px}
@media(min-width:640px){.sb-meter-g{grid-template-columns:1fr 1fr}}
.sb-meter{padding:14px;border-radius:13px;border:1px solid var(--line);background:var(--card)}
.sb-meter-t{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--ink-2)}
.sb-meter-t b{font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.sb-meter-bar{margin:10px 0 6px;height:8px;border-radius:100px;background:var(--line-2);overflow:hidden}
.sb-meter-bar i{display:block;height:100%;border-radius:100px;background:var(--blue)}
.sb-meter.dekat .sb-meter-bar i{background:var(--orange)}
.sb-meter.penuh{border-color:var(--orange);background:var(--orange-wash)}
.sb-meter.penuh .sb-meter-bar i{background:var(--orange)}
.sek-modal-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:start;margin-top:4px}
.sek-modal-samping .sek-harga{margin-top:16px}
.sek-modal-samping .sek-cta{flex-direction:column}
.sek-box .sek-modal-samping .sek-cta .btn{flex:none;width:100%}
@media(max-width:768px){.lgn-box.sek-box{max-width:520px;padding:28px 26px 24px}.sek-modal-grid{grid-template-columns:1fr;gap:0}.sek-modal-samping .sek-cta{flex-direction:row}.sek-box .sek-modal-samping .sek-cta .btn{flex:1;width:auto}}
.sek-box h2{font-size:22px;line-height:1.25;margin:8px 34px 8px 0}
.sek-box .sek-poin li{font-size:13.5px}
.sek-harga{margin-top:18px;padding:14px 16px;border-radius:13px;background:var(--bg-alt);border:1px solid var(--line)}
.sek-harga b{font-size:20px;font-weight:600}
.sek-harga span{font-size:13px;color:var(--ink-2)}
.sek-harga p{font-size:12px;color:var(--ink-3);line-height:1.5;margin-top:4px}
.sek-harga .sek-kira{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--blue-tint);color:var(--ink-2);font-size:12.5px}
.sek-harga .sek-kira b{font-size:13px;font-weight:600;color:var(--blue-ink)}
.sek-box .sek-cta .btn{flex:1}

/* konfigurasi nomor anggota di layar buat */
.nomor-kode{margin-top:12px}
.nomor-kode[hidden]{display:none}
.nomor-kode-lbl{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.nomor-kode .inp{max-width:260px;text-transform:uppercase}

/* ---------- formulir gabung ---------- */
.gabung{margin-top:26px;background:var(--card);border:1px solid var(--blue);border-radius:16px;
  padding:22px;display:flex;flex-direction:column;gap:18px;box-shadow:var(--sh)}
.gabung[hidden]{display:none}
.gabung-h{display:flex;gap:13px;align-items:flex-start}
.gabung-aksi{display:flex;gap:11px;flex-wrap:wrap;align-items:center}

/* ============================================================
   V4 — tambahan dari Feedback Redesign Kolavo Prototype V3
   ============================================================ */
/* nav */
.nav-lnk{font-size:14px;font-weight:500;color:var(--ink-2);text-decoration:none;padding:8px 10px;border-radius:100px}
.nav-lnk:hover{color:var(--blue-ink)}
/* hero V4: profil komunitas (belakang) + persebaran (depan) + profil anggota & keping kenalan (melayang) */
.hero h1{font-size:clamp(30px,4.2vw,46px)}
.hero-rot{color:var(--blue);display:inline-block;transition:opacity .3s ease}
.hero-poin{list-style:none;display:grid;gap:9px;margin-top:26px;font-size:14px;color:var(--ink-2)}
.hero-poin li{display:flex;align-items:flex-start;gap:10px;line-height:1.5}
.hero-poin svg{width:18px;height:18px;flex:none;margin-top:2px;padding:3px;border-radius:100px;background:var(--green-wash);color:var(--green)}
.hba{padding-bottom:108px}
.hp-sinar{position:absolute;inset:6% -6% 12% 4%;border-radius:40%;background:radial-gradient(closest-side,var(--blue-wash),transparent);filter:blur(18px);z-index:0}
.hba-wag,.hba-kolavo{position:relative}
.hba-wag{z-index:1}
.hba-wag .ba-card.hp-kom{padding:0 0 26px;overflow:hidden}
.hp-sampul{height:46px;background:linear-gradient(100deg,var(--blue),var(--orange))}
.hp-kepala{display:flex;align-items:center;gap:12px;padding:0 16px;margin-top:-18px}
.hp-kepala .logo-sq{width:46px;height:46px;border-radius:13px;flex:none;border:3px solid var(--card)}
.hp-kepala > div{padding-top:20px;min-width:0}
.hp-nm{font-size:14px;font-weight:600;line-height:1.35}
.hp-nm .verif svg{width:15px;height:15px}
.hp-meta{font-size:12px;color:var(--ink-3)}
.hp-wajah{display:flex;align-items:center;gap:10px;padding:12px 16px 0}
.hp-wajah .stack .av{width:26px;height:26px}
.hp-angka{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.hp-angka div{padding:12px 16px;display:grid;gap:1px}
.hp-angka div + div{border-left:1px solid var(--line)}
.hp-angka b{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.1;color:var(--blue-ink)}
.hp-angka span{font-size:11.5px;color:var(--ink-3)}
.hp-blok{padding:11px 16px;border-bottom:1px solid var(--line)}
.hp-blok:last-child{border-bottom:none}
.hp-blok .agg-lbl{margin-bottom:7px}
.hp-blok .agg-baris{gap:5px}
.hp-blok .agg-item{font-size:12.5px}
.hp-blok .agg-item .nm{width:42%}
.hp-blok.oranye .agg-bar i{background:var(--orange)}

/* satuan harga di samping angka, kecil & abu-abu — baris jumlah anggota jadi sejajar antar kartu */

.kalk{margin-top:16px;display:grid;gap:26px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:26px}

/* info peninjau: muncul saat hover/fokus (CSS) atau diklik (.buka, untuk layar sentuh) */

.kalk-info{width:20px;height:20px;border-radius:100px;border:1px solid var(--line);background:var(--bg-alt);color:var(--ink-2);font:inherit;font-size:11.5px;font-weight:600;line-height:1;cursor:pointer}

.kalk-tip{display:none;position:absolute;left:-8px;top:calc(100% + 8px);z-index:5;width:250px;padding:12px 14px;border-radius:13px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);font-size:12.5px;font-weight:400;line-height:1.55;color:var(--ink-2)}

.kalk-rinci dt{display:flex;align-items:center;gap:8px}

.kalk-skala{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-top:4px}

.kalk-v b{font-size:22px;font-weight:700;color:var(--blue-ink);white-space:nowrap}

.kalk-out .kalk-c[hidden]{display:none}
/* tombol kartu Advance: Buat + Simulasi biaya berdampingan */

.kalk-heroket{margin-top:4px;font-size:13.5px;color:var(--ink-2)}
.kalk-box .kalk{margin-top:20px;border:0;padding:0;background:transparent;border-radius:0}
