<div class="scr" id="scrKelola" hidden>
  <div class="kom">
    <div class="shell">
      <p class="kom-jalur">
        <button type="button" data-ke="scrDasbor">Dashboard</button>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        <button type="button" data-komunitas-dibuat id="klJalurKom">Halaman komunitas</button>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        <span class="kini" id="klJalurNm">Dashboard pengurus</span>
      </p>

      <div class="kom-head">
        <span class="kom-logo logo-sq baru" id="klLogo" role="img" aria-label="Logo komunitas">K</span>
        <div class="kom-t">
          <h1 class="kom-nm" id="klNm">—</h1>
          <p class="kom-meta" id="klMeta"></p>
        </div>
        <div class="kom-aksi">
          <p class="kom-status pengurus" id="klRole"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v5c0 4.5 3.4 8 8 10 4.6-2 8-5.5 8-10V6l-8-3Z"/></svg>Kamu Community Builder di sini</p>
        </div>
      </div>

      <!-- toggle tampilan Esensial | Advance (digambar 50-js-sekretariat) -->
      <div class="kl-mode-bar" id="klPaket"></div>

      <div class="kl-body">
      <nav class="kl-nav" id="klTabs" role="tablist" aria-label="Menu dashboard pengurus">
        <!-- Advance di atas Kelola. Menu bersub-menu: tombol induk (.kl-induk) membuka
             .kl-subnav di kolom samping; di baris tab (Esensial / layar sempit) induknya
             disembunyikan dan sub-menunya tampil sebagai tab biasa. -->
        <span class="kl-nav-h sek">Advance</span>
        <button type="button" class="kl-tab" data-tab="dasbor" data-sek role="tab"><i class="kl-tab-ic" data-ic="dasbor"></i>Dashboard</button>
        <button type="button" class="kl-tab" data-tab="info" data-sek role="tab"><i class="kl-tab-ic" data-ic="info"></i>Info komunitas</button>
        <!-- Broadcast dibuka lagi (18 Okt 2026): kabar pengurus tampil di Kabar Komunitas halaman komunitas -->
        <button type="button" class="kl-tab" data-tab="broadcast" data-sek role="tab"><i class="kl-tab-ic" data-ic="toa"></i>Broadcast</button>
        <button type="button" class="kl-tab" data-tab="onboard" data-sek role="tab"><i class="kl-tab-ic" data-ic="onboard"></i>Onboarding</button>
        <button type="button" class="kl-tab kl-induk" data-induk="jawaban" data-sek aria-expanded="false"><i class="kl-tab-ic" data-ic="jawaban"></i>Jawaban pendaftar<svg class="kl-induk-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
        <div class="kl-subnav" data-grup="jawaban">
          <button type="button" class="kl-tab sub" data-tab="jawab" data-sek role="tab"><i class="kl-tab-ic" data-ic="mata"></i>Tinjau jawaban</button>
          <button type="button" class="kl-tab sub" data-tab="kelompok" data-sek role="tab"><i class="kl-tab-ic" data-ic="kelompok"></i>Kelompokkan</button>
          <button type="button" class="kl-tab sub" data-tab="rapi" data-sek role="tab"><i class="kl-tab-ic" data-ic="rapi"></i>Rapikan tulisan</button>
          <button type="button" class="kl-tab sub" data-tab="sebaran" data-sek role="tab"><i class="kl-tab-ic" data-ic="sebaran"></i>Persebaran</button>
        </div>
        <button type="button" class="kl-tab" data-tab="email" data-sek role="tab"><i class="kl-tab-ic" data-ic="email"></i>Template email</button>
        <button type="button" class="kl-tab kl-induk" data-induk="setting" data-sek aria-expanded="false"><i class="kl-tab-ic" data-ic="setting"></i>Setting<svg class="kl-induk-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
        <div class="kl-subnav" data-grup="setting">
          <button type="button" class="kl-tab sub" data-tab="akun" data-sek role="tab"><i class="kl-tab-ic" data-ic="akun"></i>Akun</button>
          <button type="button" class="kl-tab sub" data-tab="notif" data-sek role="tab"><i class="kl-tab-ic" data-ic="notif"></i>Notifikasi</button>
          <button type="button" class="kl-tab sub" data-tab="tagihan" data-sek role="tab"><i class="kl-tab-ic" data-ic="tagihan"></i>Langganan</button>
          <button type="button" class="kl-tab sub" data-tab="akses" data-sek role="tab"><i class="kl-tab-ic" data-ic="akses"></i>Akses pengurus</button>
        </div>
        <span class="kl-nav-h">Kelola</span>
        <button type="button" class="kl-tab on" data-tab="minta" role="tab"><i class="kl-tab-ic" data-ic="tambahOrang"></i>Permintaan gabung<span class="kl-badge" id="klMintaN">0</span></button>
        <button type="button" class="kl-tab" data-tab="anggota" role="tab"><i class="kl-tab-ic" data-ic="orang"></i>Anggota<span class="kl-badge" id="klAnggotaN">0</span></button>
        <!-- V4: Serah terima ditahan, jadi tak ada sub-menu. Labelnya diisi JS: "Peninjau" (Esensial) / "Struktur Kepengurusan" (Advance) -->
        <button type="button" class="kl-tab" data-tab="pengurus" role="tab"><i class="kl-tab-ic" data-ic="pengurus"></i><span id="klTabPengurusL">Peninjau</span></button>
      </nav>

      <div class="kl-main">
      <section class="kl-panel" id="klPanelMinta" data-panel="minta" role="tabpanel">
        <div class="kl-lock" id="klLock" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <span id="klLockTeks"></span>
        </div>
        <div id="klMintaList"></div>
      </section>

      <section class="kl-panel" id="klPanelAnggota" data-panel="anggota" role="tabpanel" hidden>
        <p class="kl-sub">Semua yang sudah diterima, lengkap dengan siapa yang menerimanya dan catatan keputusannya.</p>
        <div id="klAnggotaSeg"></div>
        <div id="klAnggotaList"></div>
        <div id="klAnggotaPager"></div>
        <!-- V4: tab Riwayat dilebur ke sini — catatan keputusan ikut di baris anggota, yang ditolak di bawahnya -->
        <div id="klRiwayatList"></div>
      </section>

      <section class="kl-panel" id="klPanelPengurus" data-panel="pengurus" role="tabpanel" hidden>
        <div id="klPengurusList"></div>
      </section>

      <!-- ===== Advance: panel berlangganan. Isinya digambar 50-js-sekretariat. ===== -->
      <section class="kl-panel" id="klPanelDasbor" data-panel="dasbor" role="tabpanel" hidden></section>
      <section class="kl-panel" id="klPanelInfo" data-panel="info" role="tabpanel" hidden></section>
      <section class="kl-panel" id="klPanelBroadcast" data-panel="broadcast" role="tabpanel" hidden></section>
      <section class="kl-panel" id="klPanelOnboard" data-panel="onboard" role="tabpanel" hidden></section>
      <section class="kl-panel" id="klPanelJawab" data-panel="jawab" role="tabpanel" hidden></section>
      <section class="kl-panel" id="klPanelKelompok" data-panel="kelompok" role="tabpanel" hidden></section>
      <section class="kl-panel" id="klPanelRapi" data-panel="rapi" role="tabpanel" hidden></section>
      <section class="kl-panel" id="klPanelSebaran" data-panel="sebaran" role="tabpanel" hidden></section>
      <section class="kl-panel" id="klPanelEmail" data-panel="email" role="tabpanel" hidden></section>
      <section class="kl-panel" id="klPanelAkun" data-panel="akun" role="tabpanel" hidden></section>
      <section class="kl-panel" id="klPanelNotif" data-panel="notif" role="tabpanel" hidden></section>
      <section class="kl-panel" id="klPanelTagihan" data-panel="tagihan" role="tabpanel" hidden></section>
      <section class="kl-panel" id="klPanelAkses" data-panel="akses" role="tabpanel" hidden></section>
      <section class="kl-panel" id="klPanelSerah" data-panel="serah" role="tabpanel" hidden></section>
      </div><!-- /kl-main -->
      </div><!-- /kl-body -->
    </div>
  </div>
</div><!-- /scrKelola -->

<!-- POP UP LANGGANAN ADVANCE — memakai kerangka modal masuk (.lgn), isi sendiri -->
<div class="lgn" id="sekModal" hidden>
  <div class="lgn-scrim" data-sek-tutup></div>
  <div class="lgn-box sek-box" role="dialog" aria-modal="true" aria-labelledby="sekHead">
    <button class="lgn-x" type="button" aria-label="Tutup" data-sek-tutup>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <div id="sekIsi"></div>
  </div>
</div>
