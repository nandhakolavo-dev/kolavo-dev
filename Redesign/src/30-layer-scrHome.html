<!-- ============================================================
     Kolavo App · tab Home (PROMPT-HOME H1) — beranda sesudah masuk.
     Home = apa yang baru & apa yang perlu dilakukan di semua komunitasmu.
     Komunitas (scrApp) = di mana; Dashboard (scrDasbor) = alat pengurus.
     Wadah diisi bertahap: #homeAksi & #homeKabar (H2), #homeKenal (H3).
     ============================================================ -->
<div class="scr" id="scrHome" hidden>
 <div class="app-pg">
  <div class="shell">
    <!-- satu kolom selebar halaman lain (Komunitas, Dashboard): ringkasan pribadi dulu -->
    <header class="app-hd">
      <h1 id="homeSapa">Home</h1>
      <p>Ringkasan aktivitas dan koneksimu di seluruh komunitas.</p>
    </header>
    <div class="home-stat" id="homeRingkas" aria-label="Ringkasan pribadi"></div>
    <section class="app-sek" id="homeAksi" aria-label="Perlu tindakan"></section>
    <section class="app-sek" id="homeKenal" aria-label="Rekomendasi kenalan"></section>
    <section class="app-sek" id="homeKabar" aria-label="Kabar komunitas"></section>
  </div>
 </div>
</div>
