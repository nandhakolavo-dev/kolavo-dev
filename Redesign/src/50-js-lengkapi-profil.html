<script>
/* ============================================================
   Perilaku layar "Lengkapi Profil".
   Dua hal saja: menu akun dan isi menu pilih.
   ============================================================ */

/* ---------- menu akun ---------- */
(function(){
  var btn = document.getElementById('acctBtn'),
      menu = document.getElementById('acctMenu');
  if(!btn || !menu) return;

  function tutup(){ menu.hidden = true; btn.setAttribute('aria-expanded','false'); }
  function buka(){ menu.hidden = false; btn.setAttribute('aria-expanded','true'); }

  btn.addEventListener('click', function(e){
    e.stopPropagation();
    menu.hidden ? buka() : tutup();
  });
  document.addEventListener('click', function(e){
    if(!menu.hidden && !menu.contains(e.target)) tutup();
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && !menu.hidden){ tutup(); btn.focus(); }
  });
  /* memilih butir menu ikut menutupnya — klik di dalam menu tidak kena
     penutup "klik di luar" di atas */
  menu.addEventListener('click', function(e){
    if(e.target.closest('.acct-i')) tutup();
  });
})();

/* ---------- isi menu pilih ---------- */
(function(){
  function isi(el, daftar, nilaiSama){
    if(!el) return;
    daftar.forEach(function(v){
      var o = document.createElement('option');
      o.value = nilaiSama ? v : v.v;
      o.textContent = nilaiSama ? v : v.t;
      el.appendChild(o);
    });
  }

  var hariIni = new Date().getFullYear();

  /* dipakai lagi oleh pertanyaan bertipe tahun dari pengurus komunitas */
  window.KolavoTahun = [];
  for(i = hariIni; i >= hariIni - 45; i--) window.KolavoTahun.push(String(i));
})();

/* ---------- domisili bertingkat ---------- */
(function(){
  var WILAYAH = {
    'Indonesia': {
      'DKI Jakarta': ['Jakarta Pusat','Jakarta Utara','Jakarta Barat','Jakarta Selatan','Jakarta Timur'],
      'Jawa Barat' : ['Kota Bekasi','Kabupaten Bekasi','Kota Bogor','Kota Depok','Kota Bandung'],
      'Banten'     : ['Kota Tangerang','Tangerang Selatan','Kota Serang'],
      'Jawa Tengah': ['Kota Semarang','Kota Surakarta','Kota Magelang'],
      'DI Yogyakarta': ['Kota Yogyakarta','Kabupaten Sleman','Kabupaten Bantul']
    },
    'Malaysia' : { 'Kuala Lumpur': ['Kuala Lumpur'], 'Selangor': ['Shah Alam','Petaling Jaya'] },
    'Singapura': { 'Singapura': ['Singapura'] }
  };

  /* layar buat halaman komunitas memakai daftar yang sama — satu sumber,
     supaya ejaan kotanya tidak bercabang */
  window.KolavoWilayah = WILAYAH;

  var negara   = document.getElementById('negara'),
      provinsi = document.getElementById('provinsi'),
      kota     = document.getElementById('kota');
  if(!negara) return;

  function kosongkan(sel, teks){
    sel.innerHTML = '';
    var o = document.createElement('option');
    o.value = ''; o.textContent = teks;
    sel.appendChild(o);
  }

  negara.addEventListener('change', function(){
    kosongkan(provinsi, 'Provinsi');
    kosongkan(kota, 'Kota/kabupaten');
    kota.disabled = true;
    var p = WILAYAH[negara.value];
    provinsi.disabled = !p;
    if(p) Object.keys(p).forEach(function(n){
      var o = document.createElement('option'); o.textContent = n; provinsi.appendChild(o);
    });
    hitung();
  });

  provinsi.addEventListener('change', function(){
    kosongkan(kota, 'Kota/kabupaten');
    var k = WILAYAH[negara.value] && WILAYAH[negara.value][provinsi.value];
    kota.disabled = !k;
    if(k) k.forEach(function(n){
      var o = document.createElement('option'); o.textContent = n; kota.appendChild(o);
    });
    hitung();
  });
})();

/* ---------- progres ---------- */
function hitung(){}
(function(){
  var kerja = document.getElementById('kerja'),
      kota  = document.getElementById('kota'),
      bio   = document.getElementById('bio'),
      fill  = document.getElementById('progFill'),
      progN = document.getElementById('progN'),
      est   = document.getElementById('progEst');

  /* identitas Google sudah beres sejak awal, lalu empat hal wajib di profil,
     ditambah pertanyaan wajib dari pengurus komunitas — jumlahnya berubah
     tergantung komunitas mana yang sedang dituju */
  function gambarProgres(){
    var beres = 1, total = 5;
    var wa = document.getElementById('wa');
    if(wa && wa.value.trim().length >= 8) beres++;
    var lahir = document.getElementById('lahir');
    if(lahir && lahir.value) beres++;
    if(document.querySelector('#scrLengkapi input[name="jk"]:checked')) beres++;
    if(kota && kota.value) beres++;

    if(progN) progN.textContent = beres;
    if(document.getElementById('progTotal')) document.getElementById('progTotal').textContent = total;
    if(fill) fill.style.width = (beres / total * 100) + '%';
    if(est) est.textContent = beres === total ? 'siap dikirim' : 'sekitar 1 menit';
  }

  hitung = function(){ gambarProgres(); };

  ['input','change'].forEach(function(ev){
    document.addEventListener(ev, function(e){
      if(e.target.closest('.blk, .act')) hitung();
    });
  });

  /* pekerjaan/keahlian: dropdown terkurasi supaya nilainya seragam dan gampang
     dicari. "Lainnya — tulis sendiri" membuka kolom teks bebas; teksnya
     disisipkan sebagai opsi terpilih sehingga kerja.value tetap mengembalikan
     nilai efektif — semua pembaca lain (profil, agregat komunitas, dashboard)
     cukup baca .value seperti biasa. */
  window.KolavoKerjaDefault = 'Anggota komunitas';
  var kerjaLainWrap = document.getElementById('kerjaLainWrap'),
      kerjaLain     = document.getElementById('kerjaLain');

  function kerjaOptCustom(){
    var o = kerja.querySelector('option.kerja-custom');
    if(!o){ o = document.createElement('option'); o.className = 'kerja-custom'; kerja.appendChild(o); }
    return o;
  }
  if(kerja) kerja.addEventListener('change', function(){
    if(kerja.value === '__lain__'){
      if(kerjaLainWrap) kerjaLainWrap.hidden = false;
      if(kerjaLain) kerjaLain.focus();
    } else {
      if(kerjaLainWrap) kerjaLainWrap.hidden = true;
      var o = kerja.querySelector('option.kerja-custom');   /* balik ke daftar: buang opsi custom */
      if(o) o.remove();
    }
    hitung();
  });
  if(kerjaLain) kerjaLain.addEventListener('input', function(){
    var v = kerjaLain.value.trim();
    var o = kerjaOptCustom();
    o.value = v;
    o.textContent = v || 'Lainnya';
    o.selected = true;   /* kerja.value == teks custom */
    hitung();
  });

  if(bio) bio.addEventListener('input', function(){
    var n = document.getElementById('bioN');
    if(n) n.textContent = bio.value.length;
  });
  var beri = document.getElementById('beri');
  if(beri) beri.addEventListener('input', function(){
    var n = document.getElementById('beriN');
    if(n) n.textContent = beri.value.length;
  });

  hitung();
})();

/* ---------- akun media sosial (opsional) ----------
   Baris pilih-platform + nama akun, bisa ditambah sampai lima dan dihapus.
   Baris kosong tidak ikut tersimpan. Hasilnya dibaca lewat KolavoSosmed(). */
(function(){
  var list = document.getElementById('sosmedList'),
      tambah = document.getElementById('sosmedTambah');
  if(!list || !tambah) return;
  var PLATFORM = [
    ['instagram', 'Instagram', '@namaakun'], ['linkedin', 'LinkedIn', 'linkedin.com/in/…'],
    ['tiktok', 'TikTok', '@namaakun'], ['x', 'X (Twitter)', '@namaakun'],
    ['facebook', 'Facebook', 'facebook.com/…'], ['youtube', 'YouTube', '@kanal'], ['web', 'Situs web', 'namamu.com']
  ];
  var MAKS = 5, baris = [{ p: 'instagram', h: '' }];
  function lolos(s){ return String(s).replace(/[&<>"]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function gambar(){
    list.innerHTML = baris.map(function(b, i){
      var pl = PLATFORM.filter(function(p){ return p[0] === b.p; })[0] || PLATFORM[0];
      return '<div class="sosmed-i">' +
        '<select class="sel" data-sosmed-p="' + i + '" aria-label="Platform akun ' + (i + 1) + '">' +
          PLATFORM.map(function(p){ return '<option value="' + p[0] + '"' + (p[0] === b.p ? ' selected' : '') + '>' + p[1] + '</option>'; }).join('') +
        '</select>' +
        '<input class="inp" type="text" maxlength="60" data-sosmed-h="' + i + '" value="' + lolos(b.h) + '" placeholder="' + pl[2] + '" aria-label="Nama akun ' + pl[1] + '">' +
        '<button type="button" class="sosmed-x" data-sosmed-x="' + i + '" aria-label="Hapus akun ' + (i + 1) + '">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>' +
      '</div>';
    }).join('');
    tambah.hidden = baris.length >= MAKS;
  }
  list.addEventListener('input', function(e){
    var i = e.target.getAttribute('data-sosmed-h');
    if(i !== null) baris[+i].h = e.target.value;
  });
  list.addEventListener('change', function(e){
    var i = e.target.getAttribute('data-sosmed-p');
    if(i !== null){ baris[+i].p = e.target.value; gambar(); }
  });
  list.addEventListener('click', function(e){
    var x = e.target.closest('[data-sosmed-x]');
    if(!x) return;
    baris.splice(+x.getAttribute('data-sosmed-x'), 1);
    if(!baris.length) baris.push({ p: 'instagram', h: '' });
    gambar();
  });
  tambah.addEventListener('click', function(){
    if(baris.length >= MAKS) return;
    var dipakai = baris.map(function(b){ return b.p; });
    var sisa = PLATFORM.filter(function(p){ return dipakai.indexOf(p[0]) < 0; })[0];
    baris.push({ p: sisa ? sisa[0] : 'web', h: '' });
    gambar();
    var f = list.querySelector('[data-sosmed-h="' + (baris.length - 1) + '"]'); if(f) f.focus();
  });
  window.KolavoSosmed = function(){
    return baris.filter(function(b){ return b.h.trim(); }).map(function(b){
      var pl = PLATFORM.filter(function(p){ return p[0] === b.p; })[0];
      return { platform: pl ? pl[1] : b.p, akun: b.h.trim() };
    });
  };
  gambar();
})();
</script>
