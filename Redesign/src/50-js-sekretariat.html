<script>
/* ============================================================
   Dashboard pengurus Advance (modul "sekretariat", menempel ke scrKelola).

   Di atas navigasi ada toggle Esensial | Advance.
     Esensial = dashboard yang sudah ada: tinjau pendaftaran satu per satu,
               anggota, kepengurusan, riwayat. Tampilannya tidak berubah.
     Advance = panel tambahan (grup Advance + Serah terima di Kepengurusan). Memilihnya saat belum berlangganan
               memunculkan pop up langganan; sesudah aktif, toggle bebas dipindah
               dan langganannya tetap jalan walau sedang di Esensial.

   Tiap panel menjawab satu kendala administratif yang tercatat:
     dasbor  Dashboard        pertumbuhan anggota & akses vs minggu lalu, grafik, rekap CSV
     info    Info komunitas   pengumuman + tautan grup/peraturan/dokumen di halaman komunitas
     broadcast Broadcast      kirim kabar ke feed halaman komunitas (API 50-js-feed), riwayat, sematkan
     onboard Onboarding       sakelar utama + 5 langkah (D.kom.onboarding), dibaca modal anggota
     Jawaban pendaftar (sub-menu)
       jawab    Tinjau jawaban   jawaban tiap pendaftar/anggota + label kelompoknya
       kelompok Kelompokkan      jawaban bebas -> kelompok (D.kelompok), dipakai filter & kenalan
       rapi     Rapikan tulisan  jawaban beda tulisan -> tag ganda (user testing 18 Juli 2026)
     email   Template email   subjek & isi email diterima/ditolak, variabel, pratinjau
     Setting (sub-menu)
       akun    Akun           ganti email pemilik, dengan kode konfirmasi
       notif   Notifikasi     jenis aktivitas + maks. 3 email pengurus penerima
       tagihan Tagihan        paket, alamat penagihan, metode pembayaran
       akses   Akses pengurus hak per JABATAN (bisa dicentang) + undang pengurus
     serah   Serah terima     pergantian kepengurusan (BP) — sub-menu Kepengurusan

   Langganannya melekat ke KOMUNITAS, bukan ke akun: semua pengurus yang
   diundang ikut memakainya, dan langganan tidak pergi bersama pengurus lama.
   Tanpa penyimpanan.
   ============================================================ */
(function(){
  const el = function(id){ return document.getElementById(id); };
  const scr = el('scrKelola');
  const D = window.KolavoDashboard;
  if(!scr || !D) return;
  const lolos = D.lolos;
  const toast = function(t){ if(window.KolavoToast) window.KolavoToast(t); };

  function svg(isi, kelas){
    return '<svg' + (kelas ? ' class="' + kelas + '"' : '') + ' viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + isi + '</svg>';
  }
  const IK = {
    cek:     svg('<path d="m5 13 4 4L19 7"/>'),
    kantor:  svg('<path d="M3 21h18M5 21V8l7-5 7 5v13M9 21v-6h6v6"/>'),
    panah:   svg('<path d="M5 12h14M13 6l6 6-6 6"/>', 'sek-panah'),
    pindah:  svg('<path d="M5 12h14M13 6l6 6-6 6"/>'),
    unduh:   svg('<path d="M12 4v11M7 10l5 5 5-5M4 20h16"/>'),
    atas:    svg('<path d="M12 19V5M6 11l6-6 6 6"/>'),
    bawah:   svg('<path d="M12 5v14M6 13l6 6 6-6"/>')
  };
  const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

  /* ---------- daftar fitur Advance (dipakai pop up langganan & judul panel) ---------- */
  const FITUR = {
    dasbor: { judul: 'Dashboard',      ringkas: 'pertumbuhan anggota dan akses dokumen minggu demi minggu, dengan rekap yang bisa diunduh.' },
    info:  { judul: 'Info komunitas',  ringkas: 'pengumuman pengurus dan tautan grup WhatsApp, peraturan, dan dokumen di halaman komunitas.' },
    broadcast: { judul: 'Broadcast', ringkas: 'kirim kabar ke feed halaman komunitas; anggota baru disambut otomatis di feed yang sama.' },
    onboard: { judul: 'Onboarding', ringkas: 'sambut anggota baru dengan perkenalan bertahap: sambutan, sejarah, peraturan, alat, dan kenalan.' },
    jawab: { judul: 'Jawaban pendaftar', ringkas: 'tinjau ulang jawaban pendaftar, kelompokkan jadi identitas anggota, rapikan tulisan yang beda-beda, dan pilih persebaran yang tampil di halaman komunitas.' },
    kelompok: { judul: 'Kelompokkan jawaban' },
    sebaran: { judul: 'Persebaran anggota' },
    email: { judul: 'Template email', ringkas: 'atur isi email saat pendaftar diterima atau ditolak.' },
    rapi:  { judul: 'Rapikan tulisan jawaban', ringkas: 'satukan jawaban yang sama tapi ditulis berbeda, supaya tag tidak ganda.' },
    akun:  { judul: 'Akun' },
    notif: { judul: 'Notifikasi' },
    tagihan: { judul: 'Tagihan' },
    akses: { judul: 'Akses pengurus',  ringkas: 'undang pengurus lain dengan akunnya sendiri, dengan hak berbeda.' },
    serah: { judul: 'Serah terima',    ringkas: 'ganti kepengurusan tanpa kehilangan data dan akses.' }
  };
  /* yang ditawarkan di pop up langganan */
  const URUT = ['dasbor', 'info', 'broadcast', 'onboard', 'jawab', 'email', 'akses', 'serah'];

  /* contoh kelompok jawaban. Alumni/himpunan punya kolom jurusan; bentuk lain
     punya cabang. Satu kelompok sengaja meragukan — mesin boleh mengusulkan,
     yang memutuskan tetap pengurus. */
  const GRUP_JURUSAN = [
    { id: 'j1', usul: 'Teknik Informatika', varian: [['Teknik Informatika', 41], ['teknik informatika', 9], ['T. Informatika', 6], ['TI', 4]] },
    { id: 'j2', usul: 'Teknik Multimedia & Jaringan', varian: [['Teknik Multimedia & Jaringan', 22], ['Teknik Multimedia dan Jaringan', 7], ['TMJ', 5]] },
    { id: 'j3', usul: 'Akuntansi', varian: [['Akuntansi', 30], ['Akutansi', 3]] },
    { id: 'j4', usul: 'Teknik Komputer', varian: [['Teknik Komputer', 14], ['Teknik Komputer & Jaringan', 8]],
      ragu: 'Bisa jadi dua jurusan berbeda. Tanyakan dulu ke pengurus angkatan sebelum disatukan.' }
  ];
  const GRUP_CABANG = [
    { id: 'c1', usul: 'Jakarta Utara', varian: [['Jakarta Utara', 38], ['Jakut', 11], ['jakarta utara', 6]] },
    { id: 'c2', usul: 'Tangerang Selatan', varian: [['Tangerang Selatan', 19], ['Tangsel', 8], ['Tangerang Sel.', 2]] },
    { id: 'c3', usul: 'Depok', varian: [['Depok', 12], ['depok', 3]] },
    { id: 'c4', usul: 'Bekasi', varian: [['Bekasi', 17], ['Kab. Bekasi', 9]],
      ragu: 'Kota Bekasi dan Kabupaten Bekasi itu dua wilayah. Satukan hanya kalau cabangmu memang tidak membedakannya.' }
  ];
  const TAG_LAIN = 9;   /* tag lain di kolom yang sama, sudah seragam */
  function alumni(){ return /Alumni|Himpunan/.test((D.kom && D.kom.bentuk) || ''); }
  function grup(){ return alumni() ? GRUP_JURUSAN : GRUP_CABANG; }
  function labelRapi(){ return alumni() ? ((D.kom.bentuk === 'Himpunan') ? 'Program studi' : 'Jurusan') : 'Cabang'; }


  /* ---------- keadaan per komunitas ---------- */
  const S = {};
  function acak(){ return Math.random().toString(36).slice(2, 6).toUpperCase(); }
  function reset(){
    D.sekAktif = false;
    D.mode = 'simple';
    S.rapi = {}; S.namaRapi = {}; S.pilihan = false;
    S.rangkuman = true;
    S.rentang = 12; S.grafik = 'tumbuh';
    S.akses = {}; S.undangan = []; S.email = ''; S.emailJabatan = 'Pengurus';
    S.hak = {}; S.hakDraf = {}; S.infoDraf = null;
    S.bc = { isi: '', tautan: '', pin: false, notif: true, hapus: null };
    S.jawabSaring = 'semua'; S.kelompokKolom = 'kerja'; S.kelompokTeks = ''; D.kelompok = {};
    S.sebaran = null;   /* null = dipilih otomatis; array id sumbu = diatur pengurus */
    /* template diisi saat panelnya pertama digambar (TMPL_AWAL didefinisikan di bawah) */
    S.tmpl = null; S.tmplDraf = null; S.tmplJenis = 'terima'; S.tmplAktif = { terima: true, tolak: true }; S.tmplFokus = 'sekTmplIsi';
    S.akun = { email: emailAku(), langkah: 0, baru: '', kode: '' };
    S.notif = { jenis: { baru: true, lama: true, putus: false, keluar: false }, ke: [emailAku()], email: '', hari: [1], jam: '09.00' };
    S.tagihan = { alamat: { nama: (D.kom && D.kom.nama) || '', email: emailAku(), jalan: '', kota: (D.kom && D.kom.kota) || '', pos: '', npwp: '' },
      ubahAlamat: false, draf: {}, metode: 'va', draftMetode: 'va' };
    S.jejak = [];
    S.serah = { ketua: '', pemegang: '', lama: 'lihat', tanggal: '', jadwal: false };
    S.kode = acak();
  }
  D.onBangun.push(reset);
  /* jabatan diganti nama / dihapus di Struktur Kepengurusan: hak ikut pindah kunci */
  D.onJabatanGanti.push(function(lama, baru){
    [S.hak, S.hakDraf].forEach(function(peta){
      if(baru) peta[baru] = (peta[lama] || HAK_AWAL[lama] || ['dasbor']).slice();
      delete peta[lama];
    });
  });
  reset();

  function catat(teks){ S.jejak.unshift({ teks: teks, waktu: 'baru saja' }); }
  function pemegangAkses(){
    return D.pengurus.filter(function(p){ return p.aku || S.akses[p.nama]; });
  }
  function depan(nama){ return nama === D.aku ? 'Kamu' : nama.split(' ')[0]; }
  function tglIndo(iso){
    const p = (iso || '').split('-');
    return p.length === 3 ? (+p[2]) + ' ' + BULAN[+p[1] - 1] + ' ' + p[0] : iso;
  }
  function semuaOrang(){
    return D.pengurus.map(function(p){ return p.nama; }).concat(D.anggotaBiasa);
  }
  function av(nama){
    return '<div class="av ' + 'abc'[nama.length % 3] + '" aria-hidden="true">' + lolos(D.inisial(nama)) + '</div>';
  }
  function kepala(tab, sub){
    return '<div class="sek-h"><span class="sek-eb">' + IK.kantor + 'Advance</span>' +
      '<h2>' + FITUR[tab].judul + '</h2><p class="kl-sub">' + sub + '</p></div>';
  }

  /* ---------- toggle Esensial | Advance di atas navigasi ---------- */
  function gambarMode(){
    const adv = D.mode === 'advance';
    scr.classList.toggle('mode-adv', adv);
    let info;
    if(adv){
      info = '<b>Advance aktif</b> · ditagihkan ke ' + lolos(D.kom.nama) + ', bukan ke akunmu · ' +
        pemegangAkses().length + ' pengurus memegang dashboard · ' +
        '<button type="button" class="kl-mode-link" data-sek-kelola>Kelola langganan</button>';
    } else if(D.sekAktif){
      info = 'Langganan Advance tetap aktif. Pindah ke Advance kapan saja.';
    } else {
      info = 'Tinjau pendaftaran, kelola anggota dan kepengurusan. <b>Advance</b> menambah alat administrasi yang dipakai bareng semua pengurus.';
    }
    el('klPaket').innerHTML =
      '<div class="kl-mode" role="radiogroup" aria-label="Tampilan dashboard">' +
        '<button type="button" role="radio" data-mode="simple" aria-checked="' + !adv + '">Esensial</button>' +
        '<button type="button" role="radio" data-mode="advance" aria-checked="' + adv + '">Advance' +
          (D.sekAktif ? '' : '<span class="kl-mode-tag">Langganan</span>') + '</button>' +
      '</div>' +
      '<p class="kl-mode-info">' + info + '</p>';
  }

  /* pindah tampilan. Advance tanpa langganan -> pop up dulu, toggle belum pindah. */
  function pilihMode(mode){
    if(mode === 'advance' && !D.sekAktif){ bukaModal(); return; }
    if(mode === D.mode) return;
    D.mode = mode;
    if(mode === 'advance'){ D.tab = 'dasbor'; }
    else if(FITUR[D.tab]){ D.tab = D.tab === 'serah' ? 'pengurus' : 'minta'; }
    D.gambar();
  }

  /* ---------- ajakan di panel permintaan saat antrean menumpuk ---------- */
  function gambarNudge(){
    let n = el('sekNudge');
    if(!n){
      n = document.createElement('div');
      n.id = 'sekNudge'; n.className = 'sek-nudge';
      el('klMintaList').parentNode.insertBefore(n, el('klMintaList'));
    }
    const jml = D.minta.length;
    n.hidden = jml < 4 || D.mode === 'advance';
    if(n.hidden) return;
    const tua = D.minta.reduce(function(m, r){ return Math.max(m, r.hari || 0); }, 0);
    n.innerHTML = '<div class="t"><b>' + jml + ' orang menunggu</b>, yang paling lama sudah ' + tua + ' hari. ' +
      'Di Advance, pengurus lain bisa ikut meninjau dengan akunnya sendiri.</div>' +
      '<button type="button" class="btn outline sm" data-mode="advance">' + (D.sekAktif ? 'Buka Advance' : 'Coba Advance') + '</button>';
  }

  /* ---------- dashboard: pertumbuhan anggota ---------- */
  /* Seri mingguan contoh, 12 minggu, yang terakhir = minggu ini. Diterima/ditolak
     minggu ini ikut bertambah dari keputusan yang dibuat di prototipe (Riwayat). */
  const SERI = {
    pengunjung: { label: 'Pengunjung profil', data: [42, 48, 51, 47, 60, 66, 58, 71, 79, 74, 88, 81] },
    pendaftar:  { label: 'Pendaftar',         data: [6, 7, 9, 8, 11, 12, 10, 14, 15, 13, 17, 19] },
    diterima:   { label: 'Diterima',          data: [5, 6, 7, 7, 9, 10, 8, 11, 13, 11, 14, 15] },
    ditolak:    { label: 'Ditolak',           data: [1, 1, 1, 0, 2, 1, 2, 2, 1, 2, 2, 3] },
    dokumen:    { label: 'Dokumen komunitas', data: [12, 15, 14, 13, 19, 22, 20, 24, 27, 25, 31, 28] },
    komunikasi: { label: 'Alat komunikasi',   data: [18, 21, 22, 20, 26, 29, 27, 33, 36, 34, 40, 44] }
  };
  /* satu sumbu per grafik: tiap grafik berisi besaran yang satuannya sama (orang).
     Warna ikut entitas (--viz-1 biru, -2 oranye, -3 hijau); seri oranye digambar
     putus-putus karena pasangan hijau-oranye mepet untuk buta warna merah. */
  const GRAFIK = {
    tumbuh: { judul: 'Pertumbuhan anggota', seri: [['pendaftar', 1], ['diterima', 3], ['ditolak', 2]] },
    akses:  { judul: 'Kunjungan & akses',   seri: [['pengunjung', 1], ['dokumen', 2], ['komunikasi', 3]] }
  };
  function mingguan(k){
    const d = SERI[k].data.slice();
    if(k === 'diterima' || k === 'ditolak'){
      d[d.length - 1] += D.riwayat.filter(function(r){ return r.status === k && r.waktu === 'baru saja'; }).length;
    }
    return d;
  }
  /* Senin tiap minggu, 12 minggu sampai minggu ini */
  function awalMinggu(){
    const senin = new Date(); senin.setHours(0, 0, 0, 0);
    senin.setDate(senin.getDate() - ((senin.getDay() + 6) % 7));
    const out = [];
    for(let i = 11; i >= 0; i--){ const t = new Date(senin); t.setDate(t.getDate() - 7 * i); out.push(t); }
    return out;
  }
  function tglPendek(t){ return t.getDate() + ' ' + BULAN[t.getMonth()].slice(0, 3); }
  function tglIso(t){ return t.getFullYear() + '-' + ('0' + (t.getMonth() + 1)).slice(-2) + '-' + ('0' + t.getDate()).slice(-2); }

  function selisih(k){
    const d = mingguan(k), kini = d[d.length - 1], lalu = d[d.length - 2];
    let teks, arah = '';
    if(!lalu) teks = kini ? 'minggu lalu 0' : 'sama dengan minggu lalu';
    else {
      const p = Math.round((kini - lalu) / lalu * 100);
      arah = p > 0 ? 'naik' : p < 0 ? 'turun' : '';
      teks = (p ? Math.abs(p) + '%' : 'sama') + ' dari minggu lalu (' + lalu + ')';
    }
    return '<span class="sek-delta' + (arah ? ' ' + arah : '') + '">' + (arah ? window.KolavoIkon(arah) : '') + teks + '</span>';
  }
  const IK_STAT = { pengunjung: 'mata', pendaftar: 'tambahOrang', diterima: 'terimaOrang', ditolak: 'tolakOrang', dokumen: 'dokumen', komunikasi: 'jawaban' };
  function kartuAngka(k, ket){
    const d = mingguan(k);
    return '<div class="sek-stat-i"><div class="sek-stat-h"><b>' + d[d.length - 1] + '</b><i class="sek-stat-ic">' + window.KolavoIkon(IK_STAT[k]) + '</i></div><span>' + ket + '</span>' + selisih(k) + '</div>';
  }
  function segmen(label, attr, pilihan, kini){
    return '<div class="kl-mode" role="radiogroup" aria-label="' + label + '">' + pilihan.map(function(p){
      return '<button type="button" role="radio" ' + attr + '="' + p[0] + '" aria-checked="' + (String(kini) === String(p[0])) + '">' + p[1] + '</button>';
    }).join('') + '</div>';
  }
  function contohGaris(c){
    return '<svg viewBox="0 0 22 10" aria-hidden="true"><line x1="1" y1="5" x2="21" y2="5" class="sek-garis' + (c === 2 ? ' putus' : '') + '"/></svg>';
  }

  function gambarDasbor(){
    const g = GRAFIK[S.grafik];
    const minggu = awalMinggu();
    const kol = Object.keys(SERI);
    const tabel = '<div class="sek-rinci-w"><table><thead><tr><th>Minggu mulai</th>' +
      kol.map(function(k){ return '<th>' + SERI[k].label + '</th>'; }).join('') + '</tr></thead><tbody>' +
      minggu.slice(-S.rentang).map(function(t, j){
        const i = minggu.length - S.rentang + j;
        return '<tr><td>' + tglPendek(t) + '</td>' + kol.map(function(k){ return '<td>' + mingguan(k)[i] + '</td>'; }).join('') + '</tr>';
      }).join('') + '</tbody></table></div>';
    const daft = mingguan('pendaftar'), trm = mingguan('diterima'), tlk = mingguan('ditolak');
    const peninjau = D.peninjau.map(depan);

    el('klPanelDasbor').innerHTML =
      kepala('dasbor', 'Pertumbuhan ' + lolos(D.kom.nama) + ' minggu ini dibanding minggu lalu. Dilihat semua pengurus pemegang dashboard.') +
      '<div class="sek-alat">' +
        segmen('Rentang grafik', 'data-sek-rentang', [[4, '4 minggu'], [12, '12 minggu']], S.rentang) +
        '<button type="button" class="btn outline sm" data-sek-unduh="csv">' + IK.unduh + 'Unduh rekap (CSV)</button>' +
      '</div>' +
      '<p class="sek-judul-k">Pertumbuhan anggota · minggu ini</p>' +
      '<div class="sek-stat">' +
        kartuAngka('pengunjung', 'pengunjung profil komunitas') +
        kartuAngka('pendaftar', 'pendaftar') +
        kartuAngka('diterima', 'diterima jadi anggota') +
        kartuAngka('ditolak', 'ditolak') +
      '</div>' +
      '<p class="sek-judul-k">Akses anggota · minggu ini</p>' +
      '<div class="sek-stat2">' +
        kartuAngka('dokumen', 'orang membuka dokumen komunitas') +
        kartuAngka('komunikasi', 'orang membuka alat komunikasi (grup WhatsApp)') +
      '</div>' +
      '<div class="sek-blok sek-grafik">' +
        '<div class="sek-grafik-h"><div class="sek-blok-h">' + g.judul + ' · ' + S.rentang + ' minggu terakhir</div>' +
          segmen('Data grafik', 'data-sek-grafik', [['tumbuh', 'Anggota'], ['akses', 'Kunjungan & akses']], S.grafik) +
        '</div>' +
        '<ul class="sek-legend">' + g.seri.map(function(s){
          return '<li class="sek-c' + s[1] + '">' + contohGaris(s[1]) + '<span>' + SERI[s[0]].label + '</span></li>';
        }).join('') + '</ul>' +
        '<div class="sek-plot" id="sekPlot"></div>' +
        '<details class="sek-rinci"><summary>Lihat sebagai tabel</summary>' + tabel + '</details>' +
      '</div>' +
      '<div class="sek-blok">' +
        '<div class="sek-baris atas">' +
          '<div><div class="sek-blok-h">Rangkuman mingguan ke WhatsApp</div>' +
          '<div class="sek-blok-sub">Tiap Senin 08.00 ke para peninjau: ' + lolos(peninjau.join(', ')) + '.</div></div>' +
          '<label class="sw"><input type="checkbox" data-sek-rangkuman' + (S.rangkuman ? ' checked' : '') + '><i></i>' + (S.rangkuman ? 'Aktif' : 'Mati') + '</label>' +
        '</div>' +
        (S.rangkuman ? '<p class="sek-kecil jarak">Contoh isi: “Minggu ini ' + daft[11] + ' pendaftar, ' + trm[11] + ' diterima, ' + tlk[11] +
          ' ditolak. Buka dashboard: kolavo.app/k/' + lolos(D.kom.slug) + '/dashboard”</p>' : '') +
      '</div>';
    gambarGrafik();
    /* gambarSemua jalan sebelum panel ditampilkan (lebar 0) — gambar lagi sesudahnya */
    setTimeout(gambarGrafik, 0);
  }

  /* grafik garis digambar ulang sesuai lebar wadahnya (bukan diskalakan), supaya
     teks sumbu tetap 11px di layar sempit. Panel yang tersembunyi lebarnya 0 —
     ResizeObserver menggambarnya begitu panel tampil. */
  let plotRO = null;
  function langkahRapi(v){
    const p = Math.pow(10, Math.floor(Math.log10(Math.max(v, 1))));
    const m = [1, 2, 5, 10].filter(function(x){ return x * p >= v; })[0];
    return Math.max(1, m * p);
  }
  function gambarGrafik(){
    const wadah = el('sekPlot');
    if(!wadah) return;
    if(window.ResizeObserver){
      if(!plotRO) plotRO = new ResizeObserver(function(en){
        const w = Math.round(en[0].contentRect.width);
        if(w && String(w) !== en[0].target.dataset.w) gambarGrafik();
      });
      plotRO.disconnect(); plotRO.observe(wadah);
    }
    const W = wadah.clientWidth;
    wadah.dataset.w = W;
    if(!W) return;
    const H = 220, pad = { l: 34, r: 34, t: 12, b: 26 };
    const n = S.rentang;
    const minggu = awalMinggu().slice(-n);
    const seri = GRAFIK[S.grafik].seri.map(function(s){ return { k: s[0], c: s[1], d: mingguan(s[0]).slice(-n) }; });
    const puncak = Math.max.apply(null, seri.map(function(s){ return Math.max.apply(null, s.d); }));
    const step = langkahRapi(puncak / 4);
    const maks = step * Math.max(1, Math.ceil(puncak / step));
    const lx = W - pad.l - pad.r, ly = H - pad.t - pad.b;
    const x = function(i){ return pad.l + (n > 1 ? i * lx / (n - 1) : lx / 2); };
    const y = function(v){ return pad.t + (1 - v / maks) * ly; };
    const f = function(v){ return Math.round(v * 10) / 10; };

    let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + GRAFIK[S.grafik].judul + ', ' + n + ' minggu terakhir. Rincian ada di tabel.">';
    for(let v = 0; v <= maks; v += step){
      s += '<line class="grid" x1="' + pad.l + '" x2="' + (W - pad.r) + '" y1="' + f(y(v)) + '" y2="' + f(y(v)) + '"/>' +
           '<text class="sumbu" x="' + (pad.l - 8) + '" y="' + f(y(v) + 4) + '" text-anchor="end">' + v + '</text>';
    }
    const tiap = Math.max(1, Math.ceil(n * 44 / lx));
    minggu.forEach(function(t, i){
      if((n - 1 - i) % tiap) return;
      s += '<text class="sumbu" x="' + f(x(i)) + '" y="' + (H - 6) + '" text-anchor="' + (i === 0 && n > 1 ? 'start' : i === n - 1 ? 'end' : 'middle') + '">' +
           (i === n - 1 ? 'Minggu ini' : tglPendek(t)) + '</text>';
    });
    seri.forEach(function(sr){
      s += '<g class="sek-c' + sr.c + '"><path class="sek-garis' + (sr.c === 2 ? ' putus' : '') + '" d="' +
        sr.d.map(function(v, i){ return (i ? 'L' : 'M') + f(x(i)) + ' ' + f(y(v)); }).join('') + '"/>' +
        '<circle class="titik" r="4" cx="' + f(x(n - 1)) + '" cy="' + f(y(sr.d[n - 1])) + '"/></g>';
    });
    /* nilai terakhir di ujung garis, didorong supaya tidak bertumpuk */
    const ujung = seri.map(function(sr){ return { v: sr.d[n - 1], y: y(sr.d[n - 1]) }; }).sort(function(a, b){ return a.y - b.y; });
    ujung.forEach(function(u, i){ if(i && u.y - ujung[i - 1].y < 13) u.y = ujung[i - 1].y + 13; });
    ujung.forEach(function(u){ s += '<text class="nilai" x="' + f(x(n - 1) + 8) + '" y="' + f(u.y + 4) + '">' + u.v + '</text>'; });
    s += '<g class="sek-hover" visibility="hidden"><line class="silang" y1="' + pad.t + '" y2="' + (H - pad.b) + '"/>' +
      seri.map(function(sr){ return '<circle class="titik sek-c' + sr.c + '" r="4"/>'; }).join('') + '</g>' +
      '<rect class="sek-sasaran" x="' + pad.l + '" y="0" width="' + lx + '" height="' + H + '"/></svg>' +
      '<div class="sek-tip" hidden></div>';
    wadah.innerHTML = s;

    const hov = wadah.querySelector('.sek-hover'), tip = wadah.querySelector('.sek-tip');
    const sasaran = wadah.querySelector('.sek-sasaran');
    sasaran.addEventListener('pointermove', function(e){
      const r = wadah.getBoundingClientRect();
      const i = Math.max(0, Math.min(n - 1, Math.round((e.clientX - r.left - pad.l) / (n > 1 ? lx / (n - 1) : 1))));
      const cx = f(x(i));
      hov.setAttribute('visibility', 'visible');
      hov.querySelector('.silang').setAttribute('x1', cx); hov.querySelector('.silang').setAttribute('x2', cx);
      hov.querySelectorAll('circle').forEach(function(c, j){ c.setAttribute('cx', cx); c.setAttribute('cy', f(y(seri[j].d[i]))); });
      tip.innerHTML = '<b>' + (i === n - 1 ? 'Minggu ini' : 'Minggu ' + tglPendek(minggu[i])) + '</b>' +
        seri.map(function(sr){ return '<div class="r"><i class="sek-c' + sr.c + '"></i>' + SERI[sr.k].label + ' <b>' + sr.d[i] + '</b></div>'; }).join('');
      tip.hidden = false;
      const kiri = cx + 12 + tip.offsetWidth > W ? cx - 12 - tip.offsetWidth : cx + 12;
      tip.style.left = Math.max(0, kiri) + 'px';
    });
    sasaran.addEventListener('pointerleave', function(){ hov.setAttribute('visibility', 'hidden'); tip.hidden = true; });
  }

  let unduhan = null;

  function unduhRekap(){
    const minggu = awalMinggu();
    const kol = Object.keys(SERI);
    const baris = [['Minggu mulai'].concat(kol.map(function(k){ return SERI[k].label; }))].concat(minggu.map(function(t, i){
      return [tglIso(t)].concat(kol.map(function(k){ return mingguan(k)[i]; }));
    }));
    const csv = baris.map(function(b){
      return b.map(function(v){ v = String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(',');
    }).join('\n');
    const nama = 'rekap-pertumbuhan-' + (D.kom.slug || 'komunitas') + '.csv';
    /* di viewer Artifact, unduhan lewat kapabilitas downloads (viewer mengonfirmasi);
       dibuka langsung sebagai berkas, pakai tautan Blob biasa. \ufeff = BOM supaya Excel membaca UTF-8 */
    if(unduhan){
      unduhan.save({ filename: nama, data: '\ufeff' + csv }).then(function(){
        toast('Rekap 12 minggu disimpan sebagai CSV.');
      }, function(err){
        const k = err && err.code;
        if(k === 'declined') return;
        toast(k === 'rate_limited' ? 'Konfirmasi unduhan masih terbuka.' : 'Unduhan tidak tersedia di tampilan ini.');
      });
      return;
    }
    try{
      const url = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }));
      const a = document.createElement('a');
      a.href = url; a.download = nama;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      toast('Rekap 12 minggu diunduh sebagai CSV.');
    }catch(err){ toast('Unduhan diblokir di pratinjau ini. Di produk, rekap CSV langsung terunduh.'); }
  }

  /* ---------- jawaban pendaftar: tinjau + kelompokkan ----------
     Sumbernya jawaban saat mendaftar: pekerjaan & domisili dari profil, plus
     pertanyaan teks dari pengurus. Kelompok disimpan di D.kelompok supaya
     halaman komunitas (filter daftar anggota) dan pencocokan kenalan bisa
     membacanya: { kolom: { label: [..], peta: { jawaban: label } } }. */
  function kolomJawab(){
    const q = ((D.kom && D.kom.tanya) || []).filter(function(t){ return t.id !== 'nickname' && t.tipe !== 'tahun'; });
    return [{ id: 'kerja', judul: 'Pekerjaan' }, { id: 'kota', judul: 'Domisili' }].concat(q.map(function(t){
      return { id: 'q:' + t.id, judul: t.judul || 'Pertanyaan' };
    }));
  }
  function nilaiKolom(o, k){
    if(k.id === 'kerja') return o.kerja || '';
    if(k.id === 'kota') return o.kota || '';
    const j = (o.jawaban || []).filter(function(x){ return x.judul === k.judul; })[0];
    return j && j.nilai !== '—' ? j.nilai : '';
  }
  function labelKelompok(o, k){
    const g = D.kelompok[k.id];
    return g ? (g.peta[nilaiKolom(o, k)] || '') : '';
  }
  function orangJawab(){
    const menunggu = D.minta.map(function(r){
      return { nama: r.nama, panggil: r.panggil, full: r.full, kerja: r.kerja, kota: r.kota, jawaban: r.jawaban || [], status: 'menunggu', waktu: r.waktu };
    });
    const anggota = Object.keys(D.mem).filter(function(n){ return n !== D.aku; }).map(function(n){
      const m = D.mem[n];
      return { nama: n, panggil: m.panggil, full: m.full || n, kerja: m.kerja, kota: m.kota, jawaban: m.jawaban || [], status: 'anggota', waktu: '' };
    });
    return menunggu.concat(anggota);
  }
  /* dipakai halaman komunitas: sumbu filter per kolom yang sudah punya kelompok,
     dan label kelompok seseorang per kolom */
  D.kelompokSumbu = function(){
    return kolomJawab().filter(function(k){ const g = D.kelompok[k.id]; return g && Object.keys(g.peta).length; })
      .map(function(k){ return { id: 'g:' + k.id, nama: 'Kelompok ' + k.judul.toLowerCase() }; });
  };
  D.kelompokOrang = function(nama){
    const m = D.mem[nama] || D.minta.filter(function(r){ return r.nama === nama; })[0];
    if(!m) return {};
    const o = { kerja: m.kerja, kota: m.kota, jawaban: m.jawaban || [] };
    const out = {};
    kolomJawab().forEach(function(k){ const l = labelKelompok(o, k); if(l) out['g:' + k.id] = l; });
    return out;
  };

  /* ---------- persebaran anggota (halaman komunitas) ----------
     Esensial: pekerjaan + domisili, tetap. Advance: pengurus memilih sumbu mana
     yang tampil di "Siapa saja yang ada di dalam" dan urutannya. Belum pernah
     diatur (S.sebaran === null) → sistem memilihkan: pekerjaan, domisili, dan
     maksimal satu pertanyaan pengurus yang jawabannya paling beragam tapi masih
     bisa dikelompokkan (tahun, jawaban pendek, atau sudah dikelompokkan). */
  const SEBARAN_MAKS = 4;
  function kandidatSebaran(){
    const q = window.KolavoPertanyaanPengurus ? window.KolavoPertanyaanPengurus() : [];
    return [{ id: 'kerja', judul: 'Pekerjaan & keahlian' }, { id: 'kota', judul: 'Domisili' }].concat(q.map(function(t){
      return { id: 'q:' + t.id, judul: t.judul || 'Pertanyaan', qid: t.id, tahun: t.tipe === 'tahun' };
    }));
  }
  /* nilai seseorang di satu sumbu — label kelompok (Kelompokkan) didahulukan */
  function nilaiSebaran(nama, k){
    const m = D.mem[nama] || {};
    let v;
    if(k.id === 'kerja') v = m.kerja;
    else if(k.id === 'kota') v = m.kota;
    else {
      const j = (m.jawaban || []).filter(function(x){ return x.id === k.qid; })[0];
      v = j && !j.kosong && j.nilai !== '—' ? j.nilai : '';
    }
    const g = D.kelompok[k.id];
    return (g && g.peta[v]) || v || '';
  }
  function statSebaran(k){
    const nilai = semuaOrang().map(function(n){ return nilaiSebaran(n, k); }).filter(Boolean);
    const beda = {}; nilai.forEach(function(v){ beda[v] = 1; });
    const rata = nilai.length ? nilai.reduce(function(s, v){ return s + v.length; }, 0) / nilai.length : 0;
    return { isi: nilai.length, beda: Object.keys(beda).length, panjang: !k.tahun && !D.kelompok[k.id] && rata > 30 };
  }
  /* lima teratas + sisanya (dan yang belum menjawab) jadi "Lainnya" */
  function hitungSebaran(k){
    const peta = {};
    semuaOrang().forEach(function(n){ const v = nilaiSebaran(n, k) || 'Lainnya'; peta[v] = (peta[v] || 0) + 1; });
    const urut = Object.keys(peta).filter(function(v){ return v !== 'Lainnya'; })
      .sort(function(a, b){ return peta[b] - peta[a] || a.localeCompare(b); });
    const atas = urut.slice(0, 5).map(function(v){ return [v, peta[v]]; });
    const sisa = urut.slice(5).reduce(function(s, v){ return s + peta[v]; }, 0) + (peta['Lainnya'] || 0);
    return sisa ? atas.concat([['Lainnya', sisa]]) : atas;
  }
  function sebaranOtomatis(){
    const kand = kandidatSebaran();
    let terbaik = null, skor = 1;
    kand.slice(2).forEach(function(k){
      const s = statSebaran(k);
      if(!s.panjang && s.beda > skor){ terbaik = k; skor = s.beda; }
    });
    return kand.slice(0, 2).concat(terbaik ? [terbaik] : []);
  }
  function sebaranAktif(){
    if(!S.sebaran) return sebaranOtomatis();
    const kand = kandidatSebaran();
    const pilih = S.sebaran.map(function(id){ return kand.filter(function(k){ return k.id === id; })[0]; }).filter(Boolean);
    return pilih.length ? pilih : sebaranOtomatis();
  }
  /* dibaca halaman komunitas; null = tampilan bawaan (Esensial) */
  window.KolavoSumbuPersebaran = function(){
    if(!D.built || !D.sekAktif) return null;
    return sebaranAktif().map(function(k){ return { nama: k.judul, data: hitungSebaran(k) }; });
  };

  function gambarSebaran(){
    const aktif = sebaranAktif().map(function(k){ return k.id; });
    const penuh = aktif.length >= SEBARAN_MAKS;
    const kand = kandidatSebaran();
    const urut = aktif.map(function(id){ return kand.filter(function(k){ return k.id === id; })[0]; })
      .concat(kand.filter(function(k){ return aktif.indexOf(k.id) < 0; }));
    const total = semuaOrang().length || 1;
    const baris = urut.map(function(k){
      const i = aktif.indexOf(k.id), on = i >= 0;
      const s = statSebaran(k);
      const sub = s.isi ? s.isi + ' anggota menjawab · ' + s.beda + ' jawaban berbeda' : 'Belum ada anggota yang menjawab';
      const kunci = (!on && penuh) || (on && aktif.length === 1);
      const geser = on && aktif.length > 1
        ? '<div class="sek-sebaran-geser">' +
            '<button type="button" class="sek-ikon-btn" data-sek-sebaran-geser="' + k.id + '" data-arah="-1" aria-label="Naikkan ' + lolos(k.judul) + '"' + (i === 0 ? ' disabled' : '') + '>' + IK.atas + '</button>' +
            '<button type="button" class="sek-ikon-btn" data-sek-sebaran-geser="' + k.id + '" data-arah="1" aria-label="Turunkan ' + lolos(k.judul) + '"' + (i === aktif.length - 1 ? ' disabled' : '') + '>' + IK.bawah + '</button></div>'
        : '';
      return '<div class="sek-sebaran-i' + (on ? ' on' : '') + '">' +
        '<label><input type="checkbox" data-sek-sebaran-cek="' + k.id + '"' + (on ? ' checked' : '') + (kunci ? ' disabled' : '') + '>' +
          '<span><b>' + (on ? (i + 1) + '. ' : '') + lolos(k.judul) + '</b><span class="sek-kecil">' + sub + '</span></span></label>' + geser +
        (s.panjang ? '<p class="sek-sebaran-cat">Jawabannya panjang-panjang — <button type="button" class="kl-mode-link" data-sek-ke="kelompok">kelompokkan dulu</button> supaya enak dibaca.</p>' : '') +
      '</div>';
    }).join('');
    const pratinjau = sebaranAktif().map(function(k){
      return '<div class="agg-blok"><p class="agg-lbl">' + lolos(k.judul) + '</p><div class="agg-baris">' + hitungSebaran(k).map(function(p){
        return '<div class="agg-item' + (p[0] === 'Lainnya' ? ' lain' : '') + '"><span class="nm">' + lolos(p[0]) + '</span>' +
          '<span class="agg-bar"><i style="width:' + Math.round(p[1] / total * 100) + '%"></i></span><span class="n">' + p[1] + '</span></div>';
      }).join('') + '</div></div>';
    }).join('');
    el('klPanelSebaran').innerHTML =
      kepala('sebaran', 'Pilih jawaban mana yang tampil sebagai persebaran di bagian <b>Siapa saja yang ada di dalam</b> halaman komunitas, beserta urutannya. Tanpa Advance, halaman komunitas selalu menampilkan pekerjaan dan domisili.') +
      '<div class="sek-blok"><div class="sek-sebaran-status">' +
        (S.sebaran
          ? '<span class="sek-lencana diatur">Diatur pengurus</span><button type="button" class="btn outline sm" data-sek-sebaran-auto>Kembalikan ke otomatis</button>'
          : '<span class="sek-lencana">Dipilih otomatis</span><span class="sek-kecil">Pekerjaan dan domisili, ditambah satu pertanyaan yang jawabannya paling beragam tapi masih bisa dikelompokkan. Ikut berubah mengikuti jawaban anggota sampai kamu mengaturnya sendiri.</span>') +
        '</div>' +
        '<div class="sek-blok-h">Sumbu yang tampil <span class="sek-kecil">· maksimal ' + SEBARAN_MAKS + '</span></div>' +
        '<div class="sek-sebaran">' + baris + '</div></div>' +

  function gambarJawab(){

      kepala('jawab', 'Jawaban tiap pendaftar waktu pertama kali mendaftar — yang masih menunggu maupun yang sudah jadi anggota. Label kelompok muncul setelah jawabannya dikelompokkan.') +
      '<div class="sek-alat">' +
        segmen('Saring pendaftar', 'data-sek-jawab-saring', [['semua', 'Semua · ' + n('semua')], ['menunggu', 'Menunggu · ' + n('menunggu')], ['anggota', 'Anggota · ' + n('anggota')]], saring) +

            const v = nilaiKolom(o, k), l = labelKelompok(o, k);

        '</div>';
