  /* usulan awal untuk kolom Pekerjaan — hanya dipakai saat pengurus menekan
     "Isi usulan"; tidak ada yang dikelompokkan diam-diam */
  const USUL_KERJA = [
    [/guru|dosen|pengajar/i, 'Pendidikan'], [/perawat|dokter|bidan|apoteker/i, 'Kesehatan'],
    [/wiras|wirau|usaha|pedagang/i, 'Wirausaha'], [/karyawan|staf|pegawai swasta/i, 'Karyawan swasta'],
    [/teknisi|engineer|desain|developer|programmer/i, 'Teknologi & kreatif'], [/pns|asn|tni|polri/i, 'Aparatur negara'],
    [/mahasiswa|pelajar/i, 'Pelajar & mahasiswa']
  ];
  function gambarKelompok(){
    const kolom = kolomJawab();
    const k = kolom.filter(function(x){ return x.id === S.kelompokKolom; })[0] || kolom[0];
    S.kelompokKolom = k.id;
    const g = D.kelompok[k.id] || { label: [], peta: {} };
    const hitung = {};
    orangJawab().forEach(function(o){ const v = nilaiKolom(o, k); if(v) hitung[v] = (hitung[v] || 0) + 1; });
    const jawaban = Object.keys(hitung).sort(function(a, b){ return hitung[b] - hitung[a] || a.localeCompare(b); });
    const sudah = jawaban.filter(function(v){ return g.peta[v]; }).length;
    el('klPanelKelompok').innerHTML =
      kepala('kelompok', 'Satukan jawaban bebas ke dalam kelompok, misalnya “Guru SD” dan “Dosen” ke Pendidikan. Kelompoknya jadi identitas anggota: dipakai saat menyaring daftar anggota dan mencari kenalan yang cocok.') +
      '<div class="sek-blok"><div class="sek-baris atas"><div><label class="sek-lbl" for="sekKolom">Kelompokkan jawaban</label>' +
          '<select class="sel sek-kolom" id="sekKolom">' + kolom.map(function(x){
            return '<option value="' + lolos(x.id) + '"' + (x.id === k.id ? ' selected' : '') + '>' + lolos(x.judul) + '</option>';
          }).join('') + '</select></div>' +
          '<span class="sek-kuota">' + sudah + ' / ' + jawaban.length + ' dikelompokkan</span></div>' +
        '<div class="sek-blok-h sek-jarak">Kelompok</div>' +
        '<div class="sek-chips">' + (g.label.length ? g.label.map(function(l){
          const pakai = Object.keys(g.peta).filter(function(v){ return g.peta[v] === l; }).length;
          return '<span class="sek-chip">' + lolos(l) + '<i>' + pakai + '</i>' +
            (pakai ? '' : '<button type="button" class="sek-chip-x" data-sek-klp-hapus="' + lolos(l) + '" aria-label="Hapus kelompok ' + lolos(l) + '">×</button>') + '</span>';
        }).join('') : '<span class="sek-kecil">Belum ada kelompok.</span>') + '</div>' +
        '<div class="sek-undang"><input class="inp" id="sekKlpBaru" maxlength="40" placeholder="Nama kelompok baru, mis. Wirausaha" value="' + lolos(S.kelompokTeks) + '" aria-label="Nama kelompok baru">' +
          '<button type="button" class="btn sm" data-sek-klp-tambah>Tambah kelompok</button>' +
          (k.id === 'kerja' ? '<button type="button" class="btn outline sm" data-sek-klp-usul>Isi usulan</button>' : '') + '</div>' +
      '</div>' +
      '<div class="sek-blok"><div class="sek-blok-h">Jawaban “' + lolos(k.judul) + '”</div>' +
        (jawaban.length ? '<div class="sek-tabel-w"><table class="sek-tabel sek-klp"><thead><tr><th>Jawaban</th><th>Orang</th><th>Kelompok</th></tr></thead><tbody>' +
          jawaban.map(function(v){
            return '<tr><td>' + lolos(v) + '</td><td>' + hitung[v] + '</td><td><select class="sel" data-sek-klp="' + lolos(v) + '" aria-label="Kelompok untuk ' + lolos(v) + '">' +
              '<option value="">Belum dikelompokkan</option>' + g.label.map(function(l){
                return '<option' + (g.peta[v] === l ? ' selected' : '') + '>' + lolos(l) + '</option>';
              }).join('') + '</select></td></tr>';
          }).join('') + '</tbody></table></div>'
          : '<div class="sek-blok-sub">Belum ada jawaban di kolom ini.</div>') +
        '<p class="sek-kecil jarak">Perubahan langsung berlaku. Jawaban aslinya tidak diubah — kelompok hanya label tambahan.</p>' +
      '</div>';
  }

  /* ---------- template email keputusan pendaftaran ---------- */
  const TMPL_AWAL = {
    terima: {
      subjek: 'Selamat, kamu diterima di {komunitas}',
      isi: 'Halo {nama},\n\nPendaftaranmu di {komunitas} sudah disetujui pengurus. Mulai sekarang kamu bisa melihat daftar anggota dan berkenalan dengan anggota lain.\n\nBuka halaman komunitas: {tautan}\n\nSalam,\nPengurus {komunitas}'
    },
    tolak: {
      subjek: 'Tentang pendaftaranmu di {komunitas}',
      isi: 'Halo {nama},\n\nTerima kasih sudah mendaftar ke {komunitas}. Untuk saat ini pendaftaranmu belum bisa kami terima.\n\n{alasan}\n\nSalam,\nPengurus {komunitas}'
    }
  };
  const VAR = [
    ['nama', 'nama panggilan'], ['nama_lengkap', 'nama lengkap'], ['komunitas', 'nama komunitas'],
    ['tautan', 'tautan halaman komunitas'], ['alasan', 'catatan penolakan']
  ];
  function isiVar(teks, jenis){
    const r = D.minta[0] || { panggil: 'Putri', full: 'Putri Maharani Lestari' };
    const nilai = {
      nama: r.panggil || 'Putri', nama_lengkap: r.full || r.nama || '', komunitas: D.kom.nama,
      tautan: 'kolavo.app/k/' + (D.kom.slug || 'komunitas'),
      alasan: jenis === 'tolak' ? 'Catatan dari pengurus: komunitas ini khusus alumni angkatan 2010–2016.' : ''
    };
    return lolos(teks).replace(/\{(\w+)\}/g, function(m, k){ return nilai[k] != null ? '<mark>' + lolos(nilai[k]) + '</mark>' : m; });
  }
  function tmplBerubah(j){ return JSON.stringify(S.tmpl[j]) !== JSON.stringify(S.tmplDraf[j]); }
  function segarkanEmail(){
    const j = S.tmplJenis, d = S.tmplDraf[j];
    const p = el('sekEmailPrev');
    if(p) p.innerHTML = '<div class="sek-surat-h"><span>Subjek</span><b>' + isiVar(d.subjek, j) + '</b></div>' +
      '<div class="sek-surat-isi">' + isiVar(d.isi, j) + '</div>';
    const u = tmplBerubah(j);
    scr.querySelectorAll('[data-sek-tmpl-simpan],[data-sek-tmpl-urung]').forEach(function(b){ b.disabled = !u; });
  }
  function gambarEmail(){
    if(!S.tmpl){ S.tmpl = JSON.parse(JSON.stringify(TMPL_AWAL)); S.tmplDraf = JSON.parse(JSON.stringify(TMPL_AWAL)); }
    const j = S.tmplJenis, d = S.tmplDraf[j];
    el('klPanelEmail').innerHTML =
      kepala('email', 'Isi email yang dikirim ke pendaftar saat pendaftarannya diterima atau ditolak. Nanti dikirim otomatis lewat layanan email; di prototipe tidak ada email yang terkirim.') +
      '<div class="sek-alat">' + segmen('Jenis email', 'data-sek-tmpl-jenis', [['terima', 'Diterima'], ['tolak', 'Ditolak']], j) +
        sw('data-sek-tmpl-aktif="' + j + '"', S.tmplAktif[j], 'Kirim email ' + (j === 'terima' ? 'diterima' : 'ditolak') + ' otomatis') + '</div>' +
      '<div class="sek-email">' +
        '<div class="sek-blok"><div class="sek-f"><label class="sek-lbl" for="sekTmplSubjek">Subjek</label>' +
          '<input class="inp" id="sekTmplSubjek" data-sek-tmpl="subjek" maxlength="120" value="' + lolos(d.subjek) + '"></div>' +
          '<div class="sek-f sek-jarak"><label class="sek-lbl" for="sekTmplIsi">Isi email</label>' +
          '<textarea class="ta sek-tmpl-isi" id="sekTmplIsi" data-sek-tmpl="isi" rows="11">' + lolos(d.isi) + '</textarea></div>' +
          '<p class="sek-lbl sek-jarak">Sisipkan data pendaftar</p>' +
          '<div class="sek-chips">' + VAR.filter(function(v){ return j === 'tolak' || v[0] !== 'alasan'; }).map(function(v){
            return '<button type="button" class="sek-sisip" data-sek-var="' + v[0] + '" title="' + v[1] + '">{' + v[0] + '}</button>';
          }).join('') + '</div>' +
          '<div class="sek-baris"><button type="button" class="btn sm" data-sek-tmpl-simpan>Simpan</button>' +
            '<button type="button" class="btn outline sm" data-sek-tmpl-urung>Batalkan</button>' +
            '<button type="button" class="btn outline sm" data-sek-tmpl-bawaan>Kembalikan ke bawaan</button></div>' +
        '</div>' +
        '<div class="sek-blok"><div class="sek-baris atas"><div class="sek-blok-h">Pratinjau</div>' +
          '<button type="button" class="btn outline xs" data-sek-tmpl-uji>Kirim uji ke ' + lolos(S.akun.email) + '</button></div>' +
          '<div class="sek-blok-sub">Diisi dengan data pendaftar pertama di antrean.</div>' +
          '<div class="sek-surat" id="sekEmailPrev"></div></div>' +
      '</div>';
    segarkanEmail();
  }

  /* ---------- rapikan jawaban ---------- */
  function gambarRapi(){
    const g = grup();
    const sebelum = TAG_LAIN + g.reduce(function(s, x){ return s + x.varian.length; }, 0);
    const sesudah = TAG_LAIN + g.reduce(function(s, x){ return s + (S.rapi[x.id] === 'satu' ? 1 : x.varian.length); }, 0);
    const disatukan = g.filter(function(x){ return S.rapi[x.id] === 'satu'; })
      .reduce(function(s, x){ return s + x.varian.slice(1).reduce(function(a, v){ return a + v[1]; }, 0); }, 0);
    const yakinSisa = g.filter(function(x){ return !x.ragu && !S.rapi[x.id]; }).length;

    const chips = function(x){
      return x.varian.map(function(v){ return '<span class="sek-chip">' + lolos(v[0]) + '<i>' + v[1] + '</i></span>'; }).join('');
    };
    const kartu = function(x){
      const st = S.rapi[x.id];
      const total = x.varian.reduce(function(a, v){ return a + v[1]; }, 0);
      const nama = S.namaRapi[x.id] || x.usul;
      if(st === 'satu'){
        return '<div class="sek-varian satu"><div class="sek-chips">' + chips(x) + IK.panah +
          '<span class="sek-chip jadi">' + lolos(nama) + '<i>' + total + '</i></span></div>' +
          '<div class="sek-baris"><span class="sek-kecil">Disatukan. Tag lama di profil anggota ikut berganti.</span>' +
          '<button type="button" class="btn outline xs" data-sek-urung="' + x.id + '">Urungkan</button></div></div>';
      }
      if(st === 'pisah'){
        return '<div class="sek-varian pisah"><div class="sek-chips">' + chips(x) + '</div>' +
          '<div class="sek-baris"><span class="sek-kecil">Dibiarkan terpisah — tidak diusulkan lagi.</span>' +
          '<button type="button" class="btn outline xs" data-sek-urung="' + x.id + '">Urungkan</button></div></div>';
      }
      return '<div class="sek-varian"><div class="sek-chips">' + chips(x) + '</div>' +
        (x.ragu ? '<p class="sek-ragu">' + x.ragu + '</p>' : '') +
        '<div class="sek-baris"><input class="inp" type="text" maxlength="60" data-sek-nama="' + x.id + '" value="' + lolos(nama) + '" aria-label="Nama setelah disatukan">' +
        '<button type="button" class="btn sm" data-sek-satu="' + x.id + '">Satukan</button>' +
        '<button type="button" class="btn outline sm" data-sek-pisah="' + x.id + '">Biarkan terpisah</button></div></div>';
    };

    el('klPanelRapi').innerHTML =
      kepala('rapi', 'Jawaban yang kemungkinan sama dikelompokkan. Kamu yang memutuskan mana yang disatukan — tidak ada yang berubah diam-diam.') +
      '<div class="sek-blok"><div class="sek-blok-h">Kolom “' + labelRapi() + '”</div>' +
        '<div class="sek-blok-sub">Dari jawaban pendaftar dan database yang diimpor. Data di sini contoh.</div>' +
        '<div class="sek-ringkas"><div><b>' + sebelum + ' → ' + sesudah + '</b>tag berbeda</div>' +
          '<div><b>' + disatukan + '</b>jawaban dirapikan</div></div>' +
        (yakinSisa ? '<div class="sek-baris"><button type="button" class="btn outline sm" data-sek-satu-semua>Satukan ' + yakinSisa + ' yang tidak meragukan</button></div>' : '') +
      '</div>' +
      g.map(kartu).join('') +
      '<div class="sek-blok">' +
        '<div class="sek-baris atas">' +
          '<div><div class="sek-blok-h">Jadikan pilihan saat mendaftar</div>' +
          '<div class="sek-blok-sub">Calon anggota memilih dari jawaban yang sudah rapi, dan tetap bisa menulis sendiri kalau pilihannya tidak ada.</div></div>' +
          '<label class="sw"><input type="checkbox" data-sek-pilihan' + (S.pilihan ? ' checked' : '') + '><i></i>' + (S.pilihan ? 'Aktif' : 'Mati') + '</label>' +
        '</div>' +
      '</div>';
  }

  /* ---------- akses pengurus ---------- */
  /* Hak mengikuti JABATAN, bukan orang: centang di tabel "Siapa boleh apa" berlaku
     untuk semua pemegang jabatan itu. Daftar jabatan satu sumber: D.jabatan
     (dipakai juga oleh Struktur Kepengurusan). Pemilik langganan selalu penuh. */
  const HAK = [
    ['dasbor', 'Lihat Dashboard & daftar anggota'],
    ['kontak', 'Lihat WhatsApp & email anggota'],
    ['rapi',   'Kelola jawaban pendaftar & template email'],
    ['broadcast', 'Kirim broadcast ke feed'],
    ['notif',  'Ubah notifikasi'],
    ['undang', 'Undang pengurus & atur hak']
  ];
  const HAK_AWAL = {
    'Ketua':       ['dasbor', 'kontak', 'rapi', 'broadcast', 'notif', 'undang'],
    'Wakil Ketua': ['dasbor', 'kontak', 'rapi', 'broadcast', 'notif'],
    'Sekretaris':  ['dasbor', 'kontak', 'rapi', 'broadcast'],
    'Bendahara':   ['dasbor'],
    'Humas':       ['dasbor', 'kontak', 'broadcast'],
    'Pengurus':    ['dasbor']
  };
  function hakJabatan(peta, j){
    if(!peta[j]) peta[j] = (HAK_AWAL[j] || ['dasbor']).slice();
    return peta[j];
  }
  function ringkasHak(j){
    if(j === 'Community Builder') return 'semua hak (pemilik)';
    const h = hakJabatan(S.hak, j);
    return h.length ? HAK.filter(function(x){ return h.indexOf(x[0]) >= 0; }).map(function(x){ return x[1].replace(/^Lihat /, ''); }).join(' · ') : 'belum ada hak';
  }
  function hakBerubah(){ return JSON.stringify(S.hak) !== JSON.stringify(S.hakDraf); }

  function gambarAkses(){
    const link = 'kolavo.app/k/' + (D.kom.slug || 'komunitas') + '/pengurus/' + S.kode;
    D.jabatan.forEach(function(j){ hakJabatan(S.hak, j); hakJabatan(S.hakDraf, j); });

    const baris = D.pengurus.map(function(p){
      let kanan, aksi = '';
      if(p.aku){
        kanan = '<span class="sek-status pemilik">Pemilik langganan</span>';
      } else if(S.akses[p.nama]){
        kanan = '<span class="sek-status">Sudah masuk</span>';
        aksi = '<button type="button" class="btn sm tolak" data-sek-cabut="' + lolos(p.nama) + '">Cabut</button>';
      } else {
        kanan = '<span class="sek-status undang">Belum punya akses</span>';
        aksi = '<button type="button" class="btn outline sm" data-sek-beri="' + lolos(p.nama) + '">Beri akses</button>';
      }
      return '<div class="kl-row">' + av(p.nama) + '<div class="t"><div class="kl-row-nm">' + lolos(p.nama) +
        '<span class="kl-jabatan">' + lolos(p.jabatan) + '</span>' + kanan + '</div>' +
        '<div class="kl-row-sub">Boleh: ' + ringkasHak(p.aku ? 'Community Builder' : p.jabatan) + '</div></div>' +
        (aksi ? '<div class="kl-row-aksi">' + aksi + '</div>' : '') + '</div>';
    }).join('') +
    S.undangan.map(function(u, i){
      return '<div class="kl-row">' + av(u.email) + '<div class="t"><div class="kl-row-nm">' + lolos(u.email) +
        '<span class="kl-jabatan">' + lolos(u.jabatan) + '</span><span class="sek-status undang">Undangan terkirim</span></div>' +
        '<div class="kl-row-sub">Jadi pengurus setelah dia masuk dengan akun Google ini</div></div>' +
        '<div class="kl-row-aksi"><button type="button" class="btn outline sm" data-sek-demo="' + i + '">Terima undangan (demo)</button>' +
        '<button type="button" class="btn sm tolak" data-sek-batal="' + i + '">Batalkan</button></div></div>';
    }).join('');

    const ubah = hakBerubah();
    el('klPanelAkses').innerHTML =
      kepala('akses', 'Satu langganan untuk seluruh pengurus ' + lolos(D.kom.nama) + '. Tiap orang masuk dengan akun Google-nya sendiri — tidak ada password yang dibagi di grup.') +
      '<div class="sek-blok"><div class="sek-blok-h">Pengurus & haknya</div>' +
        '<div class="sek-blok-sub">Hak tiap orang mengikuti jabatannya di tabel Siapa boleh apa. Jabatan diatur di menu Struktur Kepengurusan.</div>' +
        '<div class="sek-daftar">' + baris + '</div>' +
      '</div>' +
      '<div class="sek-blok"><div class="sek-blok-h">Siapa boleh apa</div>' +
        '<div class="sek-blok-sub">Centang hak untuk tiap jabatan, lalu simpan. Berlaku untuk semua pemegang jabatan itu.</div>' +
        '<div class="sek-tabel-w"><table class="sek-tabel sek-hak"><thead><tr><th>Hak</th>' +
          D.jabatan.map(function(j){ return '<th>' + lolos(j) + '</th>'; }).join('') + '</tr></thead><tbody>' +
          HAK.map(function(h){
            return '<tr><td>' + h[1] + '</td>' + D.jabatan.map(function(j){
              const on = S.hakDraf[j].indexOf(h[0]) >= 0;
              const beda = on !== (S.hak[j].indexOf(h[0]) >= 0);
              return '<td' + (beda ? ' class="beda"' : '') + '><input type="checkbox" data-sek-hak="' + lolos(j) + '|' + h[0] + '"' + (on ? ' checked' : '') +
                ' aria-label="' + lolos(j) + ': ' + h[1] + '"></td>';
            }).join('') + '</tr>';
          }).join('') +
        '</tbody></table></div>' +
        '<div class="sek-baris"><button type="button" class="btn sm" data-sek-hak-simpan' + (ubah ? '' : ' disabled') + '>Simpan perubahan</button>' +
          '<button type="button" class="btn outline sm" data-sek-hak-urung' + (ubah ? '' : ' disabled') + '>Kembalikan</button>' +
          (ubah ? '<span class="sek-kecil">Ada perubahan yang belum disimpan.</span>' : '') + '</div>' +
        '<p class="sek-kecil jarak">Menyetujui pendaftaran tetap mengikuti <b>peninjau pendaftaran</b> di menu Struktur Kepengurusan. Serah terima dan langganan hanya oleh pemilik langganan.</p>' +
      '</div>' +
      '<div class="sek-blok"><div class="sek-blok-h">Undang pengurus yang belum ada di sini</div>' +
        '<div class="sek-blok-sub">Kalau dia belum jadi anggota, dia diminta mendaftar dulu — pendaftarannya langsung diterima.</div>' +
        '<div class="sek-undang"><input class="inp" id="sekEmail" type="email" placeholder="alamat Gmail pengurus" value="' + lolos(S.email) + '" aria-label="Email pengurus">' +
          '<select class="sel" id="sekEmailJabatan" aria-label="Jabatan">' + D.jabatan.map(function(j){
            return '<option' + (j === S.emailJabatan ? ' selected' : '') + '>' + lolos(j) + '</option>';
          }).join('') + '</select>' +
          '<button type="button" class="btn sm" data-sek-undang>Kirim undangan</button></div>' +
        '<div class="sek-link"><code>' + lolos(link) + '</code><button type="button" class="btn outline xs" data-sek-salin="' + lolos(link) + '">Salin link</button></div>' +
        '<p class="sek-kecil jarak">Atau bagikan link ke grup pengurus. Berlaku 7 hari; yang membukanya masuk sebagai Pengurus sampai jabatannya kamu ubah.</p>' +
      '</div>' +
      '<div class="sek-blok"><div class="sek-blok-h">Jejak aktivitas</div>' +
        (S.jejak.length ? '<ul class="sek-jejak">' + S.jejak.slice(0, 8).map(function(j){
          return '<li>' + lolos(j.teks) + '<span>' + lolos(j.waktu) + '</span></li>';
        }).join('') + '</ul>' : '<div class="sek-blok-sub">Belum ada aktivitas.</div>') +
      '</div>';
  }

  /* ---------- serah terima ---------- */
  /* Sejarah kepengurusan: satu baris per periode, bisa dibuka untuk melihat
     siapa memegang jabatan apa. Periode sekarang dibaca langsung dari susunan
     pengurus; dua periode lama adalah contoh (nama rekaan, tanpa foto). */
  const SEJARAH_LAMA = [
    { mundur: 2, susunan: [['Ketua', ['Hendra Wijaya']], ['Wakil Ketua', ['Laras Ayuningtyas']], ['Sekretaris', ['Fajar Nugroho']],
      ['Bendahara', ['Maya Kusuma']], ['Humas', ['Rizky Ananda', 'Tiara Putri']]] },
    { mundur: 4, susunan: [['Ketua', ['Agung Pratama']], ['Sekretaris', ['Nadia Rahma']], ['Bendahara', ['Yusuf Hakim']],
      ['Pengurus', ['Indra Saputra', 'Wulan Sari']]] }
  ];
  function susunanKini(){
    const urut = ['Community Builder'].concat(D.jabatan);
    const peta = {};
    D.pengurus.forEach(function(p){ (peta[p.jabatan] = peta[p.jabatan] || []).push(p.nama); });
    return urut.filter(function(j){ return peta[j]; }).map(function(j){ return [j, peta[j]]; });
  }
  function periodeItem(label, susunan, catatan, buka, tanda){
    const ketua = susunan.filter(function(s){ return s[0] === 'Ketua'; })[0];
    const jml = susunan.reduce(function(n, s){ return n + s[1].length; }, 0);
    return '<details class="sek-periode"' + (buka ? ' open' : '') + '><summary>' +
        '<b>' + label + '</b><span class="t">' + (ketua ? 'Ketua ' + lolos(ketua[1].join(', ')) + ' · ' : '') + jml + ' pengurus</span>' +
        (tanda ? '<span class="tag hi">' + tanda + '</span>' : '') + '</summary>' +
      '<dl class="sek-dl">' + susunan.map(function(s){
        return '<dt>' + lolos(s[0]) + '</dt><dd>' + s[1].map(lolos).join(', ') + '</dd>';
      }).join('') + '</dl>' +
      (catatan ? '<p class="sek-kecil jarak">' + catatan + '</p>' : '') +
    '</details>';
  }
  function gambarSejarah(mulai, akhir){
    const s = S.serah;
    return '<div class="sek-blok"><div class="sek-blok-h">Sejarah kepengurusan</div>' +
      '<div class="sek-blok-sub">Siapa saja yang pernah mengurus ' + lolos(D.kom.nama) + ', per periode. Tercatat otomatis tiap serah terima.</div>' +
      '<div class="sek-periode-list">' +
        (s.jadwal ? periodeItem(akhir + '–' + (akhir + 2), [['Ketua', [s.ketua]]], 'Mulai ' + tglIndo(s.tanggal) + '. Susunan lengkapnya diatur ketua baru setelah serah terima.', false, 'dijadwalkan') : '') +
        periodeItem(mulai + '–' + akhir, susunanKini(), 'Berakhir Desember ' + akhir + '. Ikut berubah saat susunan di Struktur Kepengurusan diubah.', true, 'sekarang') +
        SEJARAH_LAMA.map(function(p){
          return periodeItem((mulai - p.mundur) + '–' + (mulai - p.mundur + 2), p.susunan, '', false, '');
        }).join('') +
      '</div>' +
      '<p class="sek-kecil jarak">Periode sebelum ' + (mulai - 4) + ' belum dicatat.</p>' +
    '</div>';
  }
  function gambarSerah(){
    const s = S.serah;
    const mulai = D.tahun, akhir = D.tahun + 2;
    const orang = semuaOrang();
    const ketua = s.ketua, pemegang = s.pemegang || s.ketua;
    const opsi = function(pilih, kosong){
      return '<option value="">' + kosong + '</option>' + orang.map(function(n){
        return '<option' + (n === pilih ? ' selected' : '') + '>' + lolos(n) + '</option>';
      }).join('');
    };
    const pindah = [
      'Jabatan ketua dan hak <b>peninjau pendaftaran</b> pindah ke <b>' + lolos(ketua || 'ketua baru') + '</b>',
      'Langganan, tagihan, dan akses penuh pindah ke <b>' + lolos(pemegang || 'pemegang baru') + '</b> — tanpa berhenti berlangganan',
      'Pengurus periode ' + mulai + '–' + akhir + ' tercatat di Sejarah Kepengurusan',
      'Database, nomor anggota, dan riwayat keputusan tetap di komunitas',
      'Pengurus lama ' + (s.lama === 'lihat' ? 'tetap bisa melihat dashboard sebagai penasihat' : 'kembali jadi anggota biasa, akses dashboard dicabut')
    ];
    const daftarPindah = '<ul class="sek-pindah">' + pindah.map(function(t){ return '<li>' + IK.pindah + '<span>' + t + '</span></li>'; }).join('') + '</ul>';

    const periode = gambarSejarah(mulai, akhir);

    if(s.jadwal){
      el('klPanelSerah').innerHTML =
        kepala('serah', 'Pergantian pengurus yang tidak membuat komunitas mulai dari nol.') +
        '<div class="sek-blok sek-jadwal"><div class="sek-blok-h">Serah terima dijadwalkan ' + tglIndo(s.tanggal) + '</div>' +
          '<div class="sek-blok-sub">Semua pengurus sudah diberi tahu. Di tanggal itu, ini terjadi sendiri:</div>' + daftarPindah +
          '<div class="sek-baris"><button type="button" class="btn outline sm" data-sek-batal-jadwal>Batalkan jadwal</button></div>' +
        '</div>' + periode;
      return;
    }

    const siap = !!(ketua && s.tanggal);
    el('klPanelSerah').innerHTML =
      kepala('serah', 'Pergantian pengurus yang tidak membuat komunitas mulai dari nol. Siapkan sekarang, berlaku di tanggal yang kamu pilih.') +
      '<div class="sek-blok">' +
        '<div class="sek-langkah"><span class="sek-no">1</span><div class="t"><div class="sek-blok-h">Ketua periode ' + akhir + '–' + (akhir + 2) + '</div>' +
          '<div class="sek-blok-sub">Hasil pemilihan di rapat anggota. Pilih dari anggota komunitas.</div>' +
          '<select class="sel" data-sek-serah="ketua" aria-label="Ketua baru">' + opsi(ketua, 'Pilih anggota') + '</select></div></div>' +
        '<div class="sek-langkah"><span class="sek-no">2</span><div class="t"><div class="sek-blok-h">Pemegang langganan</div>' +
          '<div class="sek-blok-sub">Biasanya ketua atau bendahara. Tagihan tetap atas nama komunitas.</div>' +
          '<select class="sel" data-sek-serah="pemegang" aria-label="Pemegang langganan">' + opsi(s.pemegang, 'Sama dengan ketua baru') + '</select></div></div>' +
        '<div class="sek-langkah"><span class="sek-no">3</span><div class="t"><div class="sek-blok-h">Pengurus lama setelahnya</div>' +
          '<div class="sek-pilih">' +
            '<label><input type="radio" name="sekLama" value="lihat" data-sek-serah="lama"' + (s.lama === 'lihat' ? ' checked' : '') + '>Tetap bisa melihat dashboard sebagai penasihat (Lihat saja)</label>' +
            '<label><input type="radio" name="sekLama" value="anggota" data-sek-serah="lama"' + (s.lama === 'anggota' ? ' checked' : '') + '>Kembali jadi anggota biasa — akses dashboard dicabut</label>' +
          '</div></div></div>' +
        '<div class="sek-langkah"><span class="sek-no">4</span><div class="t"><div class="sek-blok-h">Tanggal serah terima</div>' +
          '<input class="inp" type="date" data-sek-serah="tanggal" value="' + lolos(s.tanggal) + '" aria-label="Tanggal serah terima"></div></div>' +
      '</div>' +
      '<div class="sek-blok"><div class="sek-blok-h">Yang terjadi di tanggal itu</div>' + daftarPindah +
        '<div class="sek-baris"><button type="button" class="btn sm" data-sek-jadwal' + (siap ? '' : ' disabled') + '>Jadwalkan serah terima</button>' +
        '<span class="sek-kecil">' + (siap ? 'Ketua baru dan semua pengurus diberi tahu. Bisa dibatalkan sampai tanggal itu.' : 'Pilih ketua baru dan tanggalnya dulu.') + '</span></div>' +
      '</div>' + periode;
  }

  /* ---------- modal aktifkan ---------- */
  const modal = el('sekModal');
  function bukaModal(){
    el('sekIsi').innerHTML = '<span class="sek-eb">' + IK.kantor + 'Dashboard Advance</span>' +
      '<h2 id="sekHead">Berlangganan Advance untuk ' + lolos(D.kom.nama) + '</h2>' +
      '<p class="lgn-sub">Alat administrasi tambahan di dashboard pengurus. Satu langganan untuk komunitas — setiap pengurus yang kamu undang ikut memakainya dengan akunnya sendiri.</p>' +
      '<div class="sek-modal-grid"><ul class="sek-poin">' + URUT.map(function(k){
        return '<li>' + IK.cek + '<span><b>' + FITUR[k].judul + '</b> — ' + FITUR[k].ringkas + '</span></li>';
      }).join('') + '</ul>' +
      '<div class="sek-modal-samping"><div class="sek-harga"><b>Rp XXXX</b> <span>/ anggota / bulan</span>' +
        '<p>Minimal 50 anggota. Ditagihkan ke komunitas, jadi langganan tidak ikut pergi saat kepengurusan berganti. Bisa kembali ke tampilan Esensial kapan saja.</p></div>' +
      '<div class="sek-cta"><button type="button" class="btn md" data-sek-aktifkan>Berlangganan</button>' +
        '<button type="button" class="btn outline md" data-sek-tutup>Tetap di Esensial</button></div></div></div>';
    modal.hidden = false;
    void modal.offsetWidth;
    modal.classList.add('on');
    document.body.classList.add('lgn-open');
    const b = modal.querySelector('[data-sek-aktifkan]'); if(b) b.focus();
  }
  function tutupModal(){
    modal.classList.remove('on');
    document.body.classList.remove('lgn-open');
    setTimeout(function(){ if(!modal.classList.contains('on')) modal.hidden = true; }, 170);
  }
  modal.addEventListener('click', function(e){
    if(e.target.closest('[data-sek-tutup]')){ tutupModal(); return; }
    if(e.target.closest('[data-sek-aktifkan]')){
      D.sekAktif = true;
      D.mode = 'advance';
      D.tab = D.tabSesudah || 'dasbor'; D.tabSesudah = null;
      catat('Kamu berlangganan dashboard Advance');
      tutupModal();
      D.gambar();
      toast('Advance aktif. Di produk, langkah ini membuka pembayaran.');
    }
  });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && !modal.hidden) tutupModal(); });

  /* ---------- menggambar, ikut siklus dashboard ---------- */
  function gambarSemua(){
    gambarMode();
    gambarNudge();
    if(D.sekAktif){ gambarDasbor(); gambarInfoKom(); gambarBroadcast(); gambarOnboard(); gambarJawab(); gambarKelompok(); gambarRapi(); gambarSebaran(); gambarEmail(); gambarSetting(); gambarAkses(); gambarSerah(); }
  }
  D.onGambar.push(gambarSemua);
  function ulang(){ D.gambar(); }

  /* ---------- aksi ---------- */
  scr.addEventListener('click', function(e){
    const mode = e.target.closest('[data-mode]');
    if(mode){ pilihMode(mode.dataset.mode); return; }

    const hari = e.target.closest('[data-sek-hari]');
    if(hari){
      const h = +hari.dataset.sekHari, daftar = S.notif.hari, i = daftar.indexOf(h);
      if(i >= 0 && daftar.length === 1){ toast('Pilih minimal satu hari.'); return; }
      if(i >= 0) daftar.splice(i, 1); else daftar.push(h);
      gambarNotif();
      const b = scr.querySelector('[data-sek-hari="' + h + '"]'); if(b) b.focus();
      return;
    }

    if(e.target.closest('.kl-tab[data-tab="dasbor"]')) setTimeout(gambarGrafik, 0);
    /* persebaran */
    if(e.target.closest('[data-sek-sebaran-auto]')){ S.sebaran = null; gambarSebaran(); toast('Persebaran kembali dipilih otomatis.'); return; }
    const geser = e.target.closest('[data-sek-sebaran-geser]');
    if(geser){
      const a = sebaranAktif().map(function(k){ return k.id; });
      const i = a.indexOf(geser.dataset.sekSebaranGeser), j = i + (+geser.dataset.arah);
      if(i >= 0 && j >= 0 && j < a.length){ const t = a[i]; a[i] = a[j]; a[j] = t; S.sebaran = a; gambarSebaran(); }
      return;
    }
    if(e.target.closest('[data-sek-sebaran-lihat]')){ if(window.KolavoBukaKomunitasDibuat) window.KolavoBukaKomunitasDibuat(); return; }

    const ke = e.target.closest('[data-sek-ke]');
    if(ke){
      D.tab = ke.dataset.sekKe;
      D.pilihTab(D.tab);
      const body = scr.querySelector('.kl-body');
      if(body && body.getBoundingClientRect().top < 0) body.scrollIntoView({ block: 'start' });
      return;
    }
    if(e.target.closest('[data-sek-kelola]')){ D.pilihTab('tagihan'); return; }
    const unduh = e.target.closest('[data-sek-unduh]');
    if(unduh){ unduhRekap(); return; }
    const rentang = e.target.closest('[data-sek-rentang]');
    if(rentang){ S.rentang = +rentang.dataset.sekRentang; gambarDasbor(); return; }
    const grafik = e.target.closest('[data-sek-grafik]');
    if(grafik){ S.grafik = grafik.dataset.sekGrafik; gambarDasbor(); return; }

    /* rapikan */
    const satu = e.target.closest('[data-sek-satu]');
    if(satu){
      const id = satu.dataset.sekSatu;
      const f = scr.querySelector('[data-sek-nama="' + id + '"]');
      if(f && f.value.trim()) S.namaRapi[id] = f.value.trim();
      S.rapi[id] = 'satu';
      const g = grup().filter(function(x){ return x.id === id; })[0];
      catat('Kamu menyatukan ' + g.varian.length + ' tulisan jadi “' + (S.namaRapi[id] || g.usul) + '”');
      ulang();
      return;
    }
    if(e.target.closest('[data-sek-satu-semua]')){
      const g = grup().filter(function(x){ return !x.ragu && !S.rapi[x.id]; });
      g.forEach(function(x){ S.rapi[x.id] = 'satu'; });
      catat('Kamu menyatukan ' + g.length + ' kelompok jawaban “' + labelRapi() + '”');
      ulang();
      toast(g.length + ' kelompok disatukan. Yang meragukan dibiarkan untuk kamu putuskan.');
      return;
    }
    const pisah = e.target.closest('[data-sek-pisah]');
    if(pisah){ S.rapi[pisah.dataset.sekPisah] = 'pisah'; ulang(); return; }
    const urung = e.target.closest('[data-sek-urung]');
    if(urung){ delete S.rapi[urung.dataset.sekUrung]; ulang(); return; }

    /* akses */
    const beri = e.target.closest('[data-sek-beri]');
    if(beri){
      const nama = beri.dataset.sekBeri;
      const p = D.pengurus.filter(function(x){ return x.nama === nama; })[0];
      S.akses[nama] = true;
      catat('Kamu memberi ' + nama.split(' ')[0] + ' akses dashboard (' + (p ? p.jabatan : 'Pengurus') + ')');
      ulang();
      toast(nama.split(' ')[0] + ' bisa membuka dashboard dengan akunnya sendiri, dengan hak ' + (p ? p.jabatan : 'Pengurus') + '.');
      return;
    }
    const cabut = e.target.closest('[data-sek-cabut]');
    if(cabut){
      const nama = cabut.dataset.sekCabut;
      delete S.akses[nama];
      catat('Kamu mencabut akses dashboard ' + nama.split(' ')[0]);
      ulang();
      toast('Akses dashboard ' + nama.split(' ')[0] + ' dicabut. Jabatannya di halaman komunitas tetap.');
      return;
    }
    if(e.target.closest('[data-sek-undang]')){
      const email = S.email.trim();
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ toast('Tulis alamat email yang lengkap dulu.'); return; }
      S.undangan.push({ email: email, jabatan: S.emailJabatan });
      catat('Kamu mengundang ' + email + ' sebagai ' + S.emailJabatan);
      S.email = '';
      ulang();
      toast('Undangan terkirim ke ' + email + '.');
      return;
    }
    const demo = e.target.closest('[data-sek-demo]');
    if(demo){
      const u = S.undangan[+demo.dataset.sekDemo];
      if(!u) return;
      const nama = u.email.split('@')[0].split(/[._-]+/).filter(Boolean).map(function(k){
        return k.charAt(0).toUpperCase() + k.slice(1);
      }).join(' ') || 'Pengurus Baru';
      S.undangan.splice(+demo.dataset.sekDemo, 1);
      if(!D.mem[nama]) D.mem[nama] = { nama: nama, kerja: '', kota: '' };
      if(!D.pengurus.some(function(p){ return p.nama === nama; })){
        D.anggotaBiasa = D.anggotaBiasa.filter(function(n){ return n !== nama; });
        D.pengurus.push({ nama: nama, jabatan: u.jabatan || 'Pengurus' });
      }
      S.akses[nama] = true;
      catat(nama + ' menerima undangan dan masuk dashboard');
      ulang();
      toast(nama.split(' ')[0] + ' sekarang pengurus dan memegang dashboard dengan akunnya sendiri.');
      return;
    }
    const batal = e.target.closest('[data-sek-batal]');
    if(batal){ S.undangan.splice(+batal.dataset.sekBatal, 1); ulang(); return; }
    const salin = e.target.closest('[data-sek-salin]');
    if(salin){
      try{ navigator.clipboard.writeText('https://' + salin.dataset.sekSalin); }catch(err){}
      toast('Link undangan pengurus disalin.');
      return;
    }

    /* onboarding */
    if(e.target.closest('[data-sek-ob-pratinjau]')){
      if(window.KolavoBukaOnboarding) window.KolavoBukaOnboarding({ pratinjau: true });
      else toast('Pratinjau muncul di sini begitu modal onboarding anggota selesai dibuat.');
      return;
    }

    /* jawaban pendaftar */
    const js = e.target.closest('[data-sek-jawab-saring]');
    if(js){ S.jawabSaring = js.dataset.sekJawabSaring; gambarJawab(); return; }
    if(e.target.closest('[data-sek-klp-tambah]')){
      const nama = S.kelompokTeks.trim().replace(/\s+/g, ' ');
      if(!nama){ toast('Tulis nama kelompoknya dulu.'); return; }
      const g = D.kelompok[S.kelompokKolom] = D.kelompok[S.kelompokKolom] || { label: [], peta: {} };
      if(g.label.some(function(l){ return l.toLowerCase() === nama.toLowerCase(); })){ toast('Kelompok “' + nama + '” sudah ada.'); return; }
      g.label.push(nama); S.kelompokTeks = '';
      gambarKelompok();
      const f = el('sekKlpBaru'); if(f) f.focus();
      return;
    }
    const klpX = e.target.closest('[data-sek-klp-hapus]');
    if(klpX){
      const g = D.kelompok[S.kelompokKolom];
      if(g) g.label = g.label.filter(function(l){ return l !== klpX.dataset.sekKlpHapus; });
      gambarKelompok();
      return;
    }
    if(e.target.closest('[data-sek-klp-usul]')){
      const k = kolomJawab()[0];
      const g = D.kelompok.kerja = D.kelompok.kerja || { label: [], peta: {} };
      let n = 0;
      orangJawab().forEach(function(o){
        const v = nilaiKolom(o, k);
        if(!v || g.peta[v]) return;
        const u = USUL_KERJA.filter(function(x){ return x[0].test(v); })[0];
        if(!u) return;
        if(g.label.indexOf(u[1]) < 0) g.label.push(u[1]);
        g.peta[v] = u[1]; n++;
      });
      if(n) catat('Kamu mengisi usulan kelompok untuk ' + n + ' jawaban pekerjaan');
      gambarKelompok(); gambarJawab();
      toast(n ? n + ' jawaban diisi usulan. Periksa dan ubah kalau kurang pas.' : 'Tidak ada jawaban baru yang bisa diusulkan.');
      return;
    }
    /* template email */
    const tj = e.target.closest('[data-sek-tmpl-jenis]');
    if(tj){ S.tmplJenis = tj.dataset.sekTmplJenis; gambarEmail(); return; }
    const sisip = e.target.closest('[data-sek-var]');
    if(sisip){
      const f = el(S.tmplFokus) || el('sekTmplIsi');
      const v = '{' + sisip.dataset.sekVar + '}';
      const a = f.selectionStart == null ? f.value.length : f.selectionStart, b = f.selectionEnd == null ? a : f.selectionEnd;
      f.value = f.value.slice(0, a) + v + f.value.slice(b);
      f.focus(); f.setSelectionRange(a + v.length, a + v.length);
      f.dispatchEvent(new Event('input', { bubbles: true }));
      return;
    }
    if(e.target.closest('[data-sek-tmpl-simpan]')){
      const j = S.tmplJenis;
      if(!S.tmplDraf[j].subjek.trim() || !S.tmplDraf[j].isi.trim()){ toast('Subjek dan isi email tidak boleh kosong.'); return; }
      S.tmpl[j] = JSON.parse(JSON.stringify(S.tmplDraf[j]));
      catat('Kamu mengubah template email ' + (j === 'terima' ? 'diterima' : 'ditolak'));
      segarkanEmail();
      toast('Template email ' + (j === 'terima' ? 'diterima' : 'ditolak') + ' tersimpan.');
      return;
    }
    if(e.target.closest('[data-sek-tmpl-urung]')){ S.tmplDraf[S.tmplJenis] = JSON.parse(JSON.stringify(S.tmpl[S.tmplJenis])); gambarEmail(); return; }
    if(e.target.closest('[data-sek-tmpl-bawaan]')){ S.tmplDraf[S.tmplJenis] = JSON.parse(JSON.stringify(TMPL_AWAL[S.tmplJenis])); gambarEmail(); return; }
    if(e.target.closest('[data-sek-tmpl-uji]')){ toast('Di produk, email uji dikirim ke ' + S.akun.email + ' lewat layanan email.'); return; }

    /* info komunitas */
    if(e.target.closest('[data-sek-info-simpan]')){
      const d = {};
      Object.keys(INFO_KOSONG).forEach(function(k){ d[k] = String(S.infoDraf[k] || '').trim(); });
      const salah = INFO_F.filter(function(f){ return f[0] !== 'pengumuman' && d[f[0]] && !URL_OK.test(d[f[0]]); })[0];
      if(salah){ toast(salah[1] + ' harus alamat lengkap, diawali https://'); const f = el('sekInfo-' + salah[0]); if(f) f.focus(); return; }
      D.kom.info = d; S.infoDraf = Object.assign({}, d);
      catat('Kamu memperbarui info komunitas');
      gambarInfoKom(); gambarOnboard();
      toast('Info komunitas tersimpan dan tampil di halaman komunitas.');
      return;
    }
    if(e.target.closest('[data-sek-info-urung]')){ S.infoDraf = infoTersimpan(); gambarInfoKom(); return; }

    /* broadcast */
    if(e.target.closest('[data-sek-bc-kirim]')){
      if(!bcBoleh()) return;
      const p = bcPost();
      if(!window.KolavoFeedTambah || !window.KolavoFeedTambah('l-dibuat', p)){ toast('Broadcast butuh paket Advance.'); return; }
      const notif = S.bc.notif;
      catat('Kamu mengirim broadcast' + (p.sematkan ? ' dan menyematkannya' : ''));
      S.bc = { isi: '', tautan: '', pin: false, notif: true, hapus: null };
      gambarBroadcast();
      toast('Terkirim ke feed' + (notif ? ' dan notifikasi ' + Math.max(D.jumlahAnggota() - 1, 0) + ' anggota' : '') + '. Mode demo — notifikasinya belum sungguhan.');
      return;
    }
    const bcPin = e.target.closest('[data-sek-bc-pin]');
    if(bcPin){
      const id = bcPin.dataset.sekBcPin;
      const on = !(window.KolavoFeed('l-dibuat').filter(function(p){ return p.id === id; })[0] || {}).sematkan;
      window.KolavoFeedSemat('l-dibuat', id, on);
      catat(on ? 'Kamu menyematkan broadcast' : 'Kamu melepas sematan broadcast');
      gambarBroadcast();
      return;
    }
    const bcHapus = e.target.closest('[data-sek-bc-hapus]');
    if(bcHapus){ S.bc.hapus = bcHapus.dataset.sekBcHapus; gambarBroadcast(); return; }
    if(e.target.closest('[data-sek-bc-batal]')){ S.bc.hapus = null; gambarBroadcast(); return; }
    const bcOk = e.target.closest('[data-sek-bc-hapus-ok]');
    if(bcOk){
      window.KolavoFeedHapus('l-dibuat', bcOk.dataset.sekBcHapusOk);
      S.bc.hapus = null;
      catat('Kamu menghapus broadcast');
      gambarBroadcast();
      toast('Broadcast dihapus dari feed.');
      return;
    }

    /* setting: akun */
    const akun = e.target.closest('[data-sek-akun]');
    if(akun){
      const a = S.akun, aksi = akun.dataset.sekAkun;
      if(aksi === 'mulai' || aksi === 'ulang'){ a.langkah = 1; a.kode = ''; }
      else if(aksi === 'batal'){ a.langkah = 0; a.baru = ''; a.kode = ''; }
      else if(aksi === 'kirim'){
        const baru = a.baru.trim();
        if(!EMAIL_OK.test(baru)){ toast('Tulis alamat email yang lengkap dulu.'); return; }
        if(baru === a.email){ toast('Itu email pemilik yang sekarang.'); return; }
        a.baru = baru; a.langkah = 2;
        toast('Kode konfirmasi dikirim ke ' + baru + '.');
      } else if(aksi === 'konfirmasi'){
        if(!/^\d{6}$/.test(a.kode)){ toast('Kodenya 6 angka.'); return; }
        const lama = a.email;
        a.email = a.baru; a.langkah = 0; a.baru = ''; a.kode = '';
        const i = S.notif.ke.indexOf(lama); if(i >= 0) S.notif.ke[i] = a.email;
        if(S.tagihan.alamat.email === lama) S.tagihan.alamat.email = a.email;
        catat('Kamu mengganti email pemilik ke ' + a.email);
        toast('Email pemilik sekarang ' + a.email + '.');
        gambarSetting();
        return;
      }
      gambarAkun();
      const f = el(a.langkah === 1 ? 'sekAkunBaru' : 'sekAkunKode'); if(f) f.focus();
      return;
    }
    /* setting: notifikasi */
    const hapusN = e.target.closest('[data-sek-notif-hapus]');
    if(hapusN){
      const e1 = S.notif.ke.splice(+hapusN.dataset.sekNotifHapus, 1)[0];
      catat('Kamu menghapus ' + e1 + ' dari penerima notifikasi');
      gambarNotif();
      return;
    }
    if(e.target.closest('[data-sek-notif-tambah]')){
      const n = S.notif, email = n.email.trim().toLowerCase();
      if(n.ke.length >= 3) return;
      if(!EMAIL_OK.test(email)){ toast('Tulis alamat email yang lengkap dulu.'); return; }
      if(n.ke.indexOf(email) >= 0){ toast('Email itu sudah jadi penerima.'); return; }
      n.ke.push(email); n.email = '';
      catat('Kamu menambah ' + email + ' sebagai penerima notifikasi');
      gambarNotif();
      toast(email + ' akan menerima email notifikasi.');
      return;
    }
    /* setting: tagihan */
    const tagih = e.target.closest('[data-sek-tagih]');
    if(tagih){
      const tg = S.tagihan, aksi = tagih.dataset.sekTagih;
      if(aksi === 'ubah-alamat'){ tg.ubahAlamat = true; tg.draf = JSON.parse(JSON.stringify(tg.alamat)); }
      else if(aksi === 'batal-alamat'){ tg.ubahAlamat = false; }
      else if(aksi === 'simpan-alamat'){
        if(!(tg.draf.nama || '').trim()){ toast('Nama di tagihan wajib diisi.'); return; }
        if(!EMAIL_OK.test((tg.draf.email || '').trim())){ toast('Email tagihan belum lengkap.'); return; }
        tg.alamat = JSON.parse(JSON.stringify(tg.draf)); tg.ubahAlamat = false;
        catat('Kamu memperbarui alamat penagihan');
        toast('Alamat penagihan tersimpan.');
      } else if(aksi === 'simpan-metode'){
        tg.metode = tg.draftMetode;
        const b = BAYAR.filter(function(x){ return x.k === tg.metode; })[0];
        catat('Kamu mengganti metode pembayaran ke ' + b.h);
        toast('Tagihan berikutnya dibayar lewat ' + b.h + '.');
      }
      gambarTagihan();
      return;
    }
    /* akses: siapa boleh apa */
    if(e.target.closest('[data-sek-hak-simpan]')){
      S.hak = JSON.parse(JSON.stringify(S.hakDraf));
      catat('Kamu mengubah hak per jabatan di Siapa boleh apa');
      gambarAkses();
      toast('Hak per jabatan tersimpan. Berlaku untuk semua pemegang jabatannya.');
      return;
    }
    if(e.target.closest('[data-sek-hak-urung]')){ S.hakDraf = JSON.parse(JSON.stringify(S.hak)); gambarAkses(); return; }

    /* serah terima */
    if(e.target.closest('[data-sek-jadwal]')){
      if(!S.serah.ketua || !S.serah.tanggal) return;
      S.serah.jadwal = true;
      catat('Kamu menjadwalkan serah terima ke ' + S.serah.ketua + ' pada ' + tglIndo(S.serah.tanggal));
      ulang();
      toast('Serah terima dijadwalkan ' + tglIndo(S.serah.tanggal) + '.');
      return;
    }
    if(e.target.closest('[data-sek-batal-jadwal]')){
      S.serah.jadwal = false;
      catat('Kamu membatalkan jadwal serah terima');
      ulang();
      return;
    }
  });

  scr.addEventListener('change', function(e){
    const t = e.target;
    if(t.matches('[data-sek-pilihan]')){ S.pilihan = t.checked; gambarRapi(); return; }
    if(t.matches('[data-sek-sebaran-cek]')){
      /* suntingan pertama berangkat dari pilihan otomatis yang sedang tampil */
      const a = sebaranAktif().map(function(k){ return k.id; });
      const id = t.dataset.sekSebaranCek;
      if(t.checked){ if(a.indexOf(id) < 0 && a.length < SEBARAN_MAKS) a.push(id); }
      else if(a.length > 1) a.splice(a.indexOf(id), 1);
      S.sebaran = a; gambarSebaran(); return;
    }
    if(t.matches('[data-sek-rangkuman]')){ S.rangkuman = t.checked; gambarDasbor(); return; }
    if(t.matches('[data-sek-bc-sw]')){ S.bc[t.dataset.sekBcSw] = t.checked; gambarBroadcast(); return; }
    if(t.id === 'sekEmailJabatan'){ S.emailJabatan = t.value; return; }
    if(t.matches('[data-sek-ob-utama]')){
      ob().aktif = t.checked;
      catat('Kamu ' + (t.checked ? 'menyalakan' : 'mematikan') + ' onboarding anggota baru');
      gambarOnboard();
      return;
    }
    if(t.matches('[data-sek-ob-aktif]')){
      const l = OB_LANGKAH.filter(function(x){ return x.k === t.dataset.sekObAktif; })[0];
      ob().langkah[l.k].aktif = t.checked;
      catat('Kamu ' + (t.checked ? 'menyalakan' : 'mematikan') + ' langkah onboarding “' + l.h + '”');
      gambarOnboard();
      const f = scr.querySelector('[data-sek-ob-aktif="' + l.k + '"]'); if(f) f.focus();
      return;
    }
    if(t.matches('[data-sek-ob-cocok]')){ ob().langkah.kenalan.cocok[t.dataset.sekObCocok] = t.checked; return; }
    if(t.id === 'sekKolom'){ S.kelompokKolom = t.value; gambarKelompok(); return; }
    if(t.matches('[data-sek-klp]')){
      const g = D.kelompok[S.kelompokKolom] = D.kelompok[S.kelompokKolom] || { label: [], peta: {} };
      const v = t.dataset.sekKlp;
      if(t.value) g.peta[v] = t.value; else delete g.peta[v];
      catat('Kamu mengelompokkan “' + v + '” ' + (t.value ? 'ke ' + t.value : 'jadi belum dikelompokkan'));
      gambarKelompok(); gambarJawab();
      const f = [].filter.call(scr.querySelectorAll('[data-sek-klp]'), function(x){ return x.dataset.sekKlp === v; })[0]; if(f) f.focus();
      return;
    }
    if(t.matches('[data-sek-tmpl-aktif]')){ S.tmplAktif[t.dataset.sekTmplAktif] = t.checked; gambarEmail(); return; }
    if(t.id === 'sekIngatJam'){ S.notif.jam = t.value; gambarNotif(); const f = el('sekIngatJam'); if(f) f.focus(); return; }
    if(t.matches('[data-sek-notif]')){
      S.notif.jenis[t.dataset.sekNotif] = t.checked;
      catat('Kamu ' + (t.checked ? 'menyalakan' : 'mematikan') + ' email notifikasi “' + NOTIF.filter(function(x){ return x.k === t.dataset.sekNotif; })[0].h + '”');
      gambarNotif();
      return;
    }
    if(t.matches('[data-sek-bayar]')){ S.tagihan.draftMetode = t.value; gambarTagihan(); return; }
    if(t.matches('[data-sek-hak]')){
      const bag = t.dataset.sekHak.split('|'), daftar = S.hakDraf[bag[0]];
      const i = daftar.indexOf(bag[1]);
      if(t.checked && i < 0) daftar.push(bag[1]);
      if(!t.checked && i >= 0) daftar.splice(i, 1);
      gambarAkses();
      const f = scr.querySelector('[data-sek-hak="' + t.dataset.sekHak + '"]'); if(f) f.focus();
      return;
    }
    if(t.matches('[data-sek-serah]')){ S.serah[t.dataset.sekSerah] = t.value; gambarSerah(); return; }
  });
  /* sisipan variabel masuk ke kolom template yang terakhir difokus */
  scr.addEventListener('focusin', function(e){ if(e.target.id === 'sekTmplSubjek' || e.target.id === 'sekTmplIsi') S.tmplFokus = e.target.id; });
  scr.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && e.target.id === 'sekKlpBaru'){ e.preventDefault(); const b = scr.querySelector('[data-sek-klp-tambah]'); if(b) b.click(); }
  });
  scr.addEventListener('input', function(e){
    const t = e.target;
    if(t.id === 'sekEmail'){ S.email = t.value; return; }
    if(t.id === 'sekKlpBaru'){ S.kelompokTeks = t.value; return; }
    if(t.matches('[data-sek-ob]')){ const p = t.dataset.sekOb.split('.'); ob().langkah[p[0]][p[1]] = t.value; return; }
    if(t.matches('[data-sek-tmpl]')){ S.tmplDraf[S.tmplJenis][t.dataset.sekTmpl] = t.value; segarkanEmail(); return; }
    if(t.matches('[data-sek-info]')){ S.infoDraf[t.dataset.sekInfo] = t.value; segarkanTombolInfo(); return; }
    if(t.matches('[data-sek-bc]')){ S.bc[t.dataset.sekBc] = t.value; segarkanBc(); return; }
    if(t.id === 'sekAkunBaru'){ S.akun.baru = t.value; return; }
    if(t.id === 'sekAkunKode'){ S.akun.kode = t.value.replace(/\D/g, '').slice(0, 6); if(t.value !== S.akun.kode) t.value = S.akun.kode; return; }
    if(t.id === 'sekNotifEmail'){ S.notif.email = t.value; return; }
    if(t.matches('[data-sek-alamat]')){ S.tagihan.draf[t.dataset.sekAlamat] = t.value; return; }
    if(t.matches('[data-sek-nama]')){ S.namaRapi[t.dataset.sekNama] = t.value; return; }
  });
})();
</script>
