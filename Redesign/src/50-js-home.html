<script>
/* ============================================================
   Home Kolavo App (PROMPT-HOME H2): Perlu tindakanmu + Kabar dari komunitasmu.
   Semua dibaca dari keadaan yang ada — tidak ada data contoh baru selain
   satu ajakan kenalan masuk (lihat kenalanMasuk), karena prototipe sebelumnya
   hanya punya ajakan keluar.
   ============================================================ */
(function(){
  const App = function(){ return window.KolavoApp || {}; };
  const el = function(id){ return document.getElementById(id); };
  const toast = function(t){ if(window.KolavoToast) window.KolavoToast(t); };
  const ic = function(n){ return window.KolavoIkon ? window.KolavoIkon(n) : ''; };
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  const BATAS = 10;
  let saring = 'semua', tampil = BATAS;

  /* ---------- komunitas ---------- */
  function kartu(kelas){
    const l = document.querySelector('#direktori .ccard .logo-sq.' + kelas);
    return l ? l.closest('.ccard') : null;
  }
  function info(kelas){
    if(kelas === 'l-dibuat'){
      const d = App().dibuat || {};
      const gaya = d.logo ? ' style="background-image:url(' + d.logo + ')"' : '';
      return { nama: d.nama || 'Komunitasmu', logo: '<span class="logo-sq baru"' + gaya + '>' + (d.logo ? '' : esc(d.inisial || '')) + '</span>' };
    }
    const k = kartu(kelas), h = k && k.querySelector('h3');
    return { nama: h ? h.firstChild.textContent.trim() : kelas, logo: '<span class="logo-sq ' + kelas + '"></span>' };
  }
  /* komunitas yang sudah menerimamu (+ buatan sendiri, kamu selalu di dalamnya) */
  function diterima(){
    const a = App(), dj = a.diajukan || {};
    const daftar = Object.keys(dj).filter(function(k){ return dj[k] === 'anggota'; });
    if(a.dibuat && !a.dibuat.arsip) daftar.unshift('l-dibuat');
    return daftar;
  }
  function bukaKom(kelas){
    if(kelas === 'l-dibuat'){ if(window.KolavoBukaKomunitasDibuat) window.KolavoBukaKomunitasDibuat(); return; }
    const k = kartu(kelas);
    if(k) window.KolavoLihatKomunitas(k);
  }

  /* ---------- ajakan kenalan masuk ----------
     Contoh: satu anggota yang baru disambut di komunitas yang menerimamu
     mengajakmu kenalan. Muncul sekali, setelah kamu diterima. */
  function kenalanMasuk(){
    const a = App();
    a.kenalanMasuk = a.kenalanMasuk || [];
    if(!a.kenalanSeed){
      diterima().some(function(kelas){
        const kn = a.kenalan || {};
        const p = (window.KolavoFeed ? window.KolavoFeed(kelas) : []).filter(function(x){ return x.jenis === 'sambutan' && x.anggota && !x.aku && !kn[x.anggota]; })[0];
        if(!p) return false;
        a.kenalanMasuk.push({ nama: p.anggota, kelas: kelas, kerja: p.kerja, kota: p.kota });
        a.kenalanSeed = true;
        return true;
      });
    }
    return a.kenalanMasuk;
  }

  /* ---------- Perlu tindakanmu ---------- */
  /* judul bagian Home: ikon dalam kotak berwarna + teks (+ jumlah bila ada) */
  function judulSek(ikon, teks, warna, n){
    return '<div class="hsek-h"><span class="hsek-ic ' + warna + '" aria-hidden="true">' + ic(ikon) + '</span>' +
      '<h2>' + teks + '</h2>' + (n ? '<span class="hsek-n">' + n + '</span>' : '') + '</div>';
  }
  /* satu baris Tindak Lanjut: jenis menentukan warna ikon & label */
  const JENIS = {
    kenalan:  { label: 'Kenalan',    ikon: 'tangan',      warna: 'oranye' },
    daftar:   { label: 'Pendaftaran', ikon: 'tambahOrang', warna: 'biru' },
    ajuan:    { label: 'Pengajuan',  ikon: 'jam',         warna: 'ungu' },
    profil:   { label: 'Profil',     ikon: 'profil',      warna: 'hijau' }
  };
  function barisAksi(jenis, judul, sub, aksi){
    const j = JENIS[jenis];
    return '<div class="ha-i ha-' + j.warna + '"><span class="ha-ic" aria-hidden="true">' + ic(j.ikon) + '</span>' +
      '<div class="t"><span class="ha-jenis">' + j.label + '</span><div class="n">' + judul + '</div>' + (sub ? '<div class="s">' + sub + '</div>' : '') + '</div>' +
      (aksi ? '<div class="ha-aksi">' + aksi + '</div>' : '') + '</div>';
  }
  function gambarAksi(){
    const a = App(), item = [];
    kenalanMasuk().forEach(function(o, i){
      const pg = o.nama.split(' ')[0];
      item.push(barisAksi('kenalan', '<b>' + esc(pg) + '</b> ingin berkenalan denganmu',
        esc([o.kerja, o.kota].filter(Boolean).join(' · ')) + ' · ' + esc(info(o.kelas).nama),
        '<button type="button" class="btn sm" data-home-kenal-terima="' + i + '">Terima</button>' +
        '<button type="button" class="btn outline sm" data-home-kenal-tolak="' + i + '">Tolak</button>'));
    });
    /* pendaftar menunggu, hanya di komunitas yang kamu kelola dan kamu peninjaunya */
    [[a.dibuat && !a.dibuat.arsip ? a.dibuat : null, 'dibuat'],
     [window.KolavoKomDiangkat ? window.KolavoKomDiangkat() : null, 'diangkat']].forEach(function(x){
      const kom = x[0];
      if(!kom || !window.KolavoRingkasMinta) return;
      const r = window.KolavoRingkasMinta(kom);
      if(!r || !r.n || !r.bisa) return;
      item.push(barisAksi('daftar', r.n + ' pendaftar menunggu persetujuanmu', esc(kom.nama),
        '<button type="button" class="btn sm" data-home-tinjau="' + x[1] + '">Tinjau</button>'));
    });
    const dj = a.diajukan || {};
    Object.keys(dj).filter(function(k){ return dj[k] === 'menunggu'; }).forEach(function(k){
      item.push(barisAksi('ajuan', 'Pengajuan bergabung sedang ditinjau', esc(info(k).nama) + ' · keputusan ada di pengurus', ''));
    });
    if(!a.lengkap){
      item.push(barisAksi('profil', 'Lengkapi profilmu', 'Pengurus perlu memastikan identitasmu sebelum menyetujui.',
        '<button type="button" class="btn sm" data-ke="scrLengkapi">Lengkapi profil</button>'));
    }
    el('homeAksi').innerHTML = judulSek('bendera', 'Tindak Lanjut', 'oranye', item.length) + (item.length
      ? '<div class="ha-panel">' + item.join('') + '</div>'
      : '<div class="ha-panel ha-beres"><span class="ha-ic" aria-hidden="true">' + ic('terimaOrang') + '</span>' +
        '<div class="t"><div class="n">Semua sudah ditindaklanjuti</div><div class="s">Tidak ada permintaan atau persetujuan yang menunggumu.</div></div></div>');
  }

  /* ---------- Kabar dari komunitasmu ---------- */
  function gambarKabar(){
    const w = el('homeKabar'), kom = diterima();
    if(!kom.length){
      w.innerHTML = judulSek('toa', 'Kabar Komunitas', 'biru') + '<div class="empty">' +
        '<div class="empty-ic">' + ic('orang') + '</div>' +
        '<h3>Kabar muncul setelah kamu diterima di komunitas</h3>' +
        '<p>Cari komunitasmu lalu ajukan gabung. Punya tautan undangan dari pengurus? Buka tautannya untuk langsung bergabung.</p>' +
        '<div class="empty-cta"><button type="button" class="btn" data-ke="scrApp" data-anchor="direktori">Cari komunitas</button></div></div>';
      return;
    }
    let semua = [];
    kom.forEach(function(k){
      (window.KolavoFeed ? window.KolavoFeed(k) : []).forEach(function(p){ semua.push({ p: p, kelas: k }); });
    });
    const punya = kom.filter(function(k){ return semua.some(function(x){ return x.kelas === k; }); });
    if(saring !== 'semua' && punya.indexOf(saring) < 0) saring = 'semua';
    const list = semua.filter(function(x){ return saring === 'semua' || x.kelas === saring; })
      .sort(function(a, b){ return (b.p.sematkan ? 1 : 0) - (a.p.sematkan ? 1 : 0) || b.p.waktu - a.p.waktu; });
    const chip = function(k, label){ return '<button type="button" class="chip' + (saring === k ? ' on' : '') + '" data-home-saring="' + k + '">' + esc(label) + '</button>'; };
    w.innerHTML = judulSek('toa', 'Kabar Komunitas', 'biru') +
      (punya.length > 1 ? '<div class="hk-chips">' + chip('semua', 'Semua') + punya.map(function(k){ return chip(k, info(k).nama); }).join('') + '</div>' : '') +
      (list.length
        ? '<div class="hk-list">' + list.slice(0, tampil).map(function(x){
            const i = info(x.kelas);
            return '<div class="hk-i' + (x.p.sematkan ? ' pin' : '') + '"><div class="hk-kepala"><button type="button" class="hk-kom" data-home-kom="' + x.kelas + '">' + i.logo + '<span>' + esc(i.nama) + '</span></button>' +
              (x.p.sematkan ? '<span class="hk-pin">Disematkan</span>' : '') + '</div>' +
              '<ol class="fd-tl">' + window.KolavoFeedUnitBaca(x.p) + '</ol></div>';
          }).join('') + '</div>' +
          (list.length > tampil ? '<button type="button" class="btn outline sm hk-lagi" data-home-lagi>Lihat lainnya</button>' : '')
        : '<p class="app-kosong">Komunitasmu belum punya kabar baru. Kabar tampil di komunitas paket Advance.</p>');
  }

  /* ---------- Orang yang mungkin kamu kenal (H3) ----------
     Pencocokan memakai KolavoCocokkan (fungsi yang sama dengan langkah Kenalan di
     onboarding). Urutan: paling banyak kesamaan dulu, lalu urutan daftar asal. */
  function saranKenal(semua){
    if(!window.KolavoCocokkan || !window.KolavoAnggotaKomunitas) return [];
    const a = App(), kn = a.kenalan || {};
    const aku = window.KolavoProfilKu ? window.KolavoProfilKu() : {};
    const akuNama = (el('pfNm') && el('pfNm').textContent.trim()) || '';
    const masuk = (a.kenalanMasuk || []).map(function(o){ return o.nama; });
    const peta = {}, urut = [];
    diterima().forEach(function(kelas){
      const orang = window.KolavoAnggotaKomunitas(kelas).filter(function(o){
        return !o.aku && o.n !== akuNama && !kn[o.n] && masuk.indexOf(o.n) < 0;
      });
      window.KolavoCocokkan({ kerja: aku.kerja, kota: aku.kota }, orang).forEach(function(s){
        s.hasil.forEach(function(o){
          if(!peta[o.n]){ peta[o.n] = { o: o, kelas: kelas, alasan: [] }; urut.push(o.n); }
          if(peta[o.n].alasan.indexOf(s.alasan) < 0) peta[o.n].alasan.push(s.alasan);
        });
      });
    });
    return urut.map(function(n, i){ return Object.assign({ i: i }, peta[n]); })
      .sort(function(x, y){ return y.alasan.length - x.alasan.length || x.i - y.i; }).slice(0, semua ? undefined : 5);
  }
  function gambarKenal(){
    const w = el('homeKenal');
    if(!w) return;
    const list = saranKenal();
    if(!list.length){ w.innerHTML = ''; return; }   /* kosong: bagian disembunyikan */
    const K = window.KolavoKredit;
    w.innerHTML = '<div class="hn-kepala">' + judulSek('orang', 'Rekomendasi Kenalan', 'hijau') +
        '<button type="button" class="hn-saldo" data-kredit-topup>' + ic('koin') + '<span>Saldo <b data-kredit-saldo>' + (K ? K.saldo() : 0) + '</b> kredit</span><em>Top up</em></button></div>' +
      '<p class="app-sub">Anggota komunitasmu yang paling dekat denganmu. Lihat profilnya dulu, lalu ajak berkenalan — setiap ajakan memakai 10 kredit.</p>' +
      '<div class="hn-grid">' + list.map(function(x, j){
        const o = x.o, pg = o.pg || o.n.split(' ')[0];
        /* nama panggilan saja — nama lengkap termasuk data pribadi */
        const av = o.f ? '<span class="av photo ' + o.f + '" role="img" aria-label="Foto profil ' + esc(pg) + ' — gambar AI"></span>'
                       : '<span class="av ' + 'abc'[j % 3] + '" aria-hidden="true">' + esc(o.n.split(' ').map(function(w){ return w[0]; }).join('').slice(0, 2)) + '</span>';
        const profil = ' data-home-profil="' + esc(o.n) + '" data-kelas="' + x.kelas + '"';
        /* alasan cocok sebagai chip ber-centang; konteks tambahan (angkatan) chip netral */
        const chip = x.alasan.map(function(t){ return '<span class="hn-chip cocok">' + ic('terimaOrang') + esc(t) + '</span>'; }).join('') +
          (o.a ? '<span class="hn-chip">Angkatan ' + esc(o.a) + '</span>' : '');
        return '<article class="hn-i">' +
          '<button type="button" class="hn-orang"' + profil + ' title="Lihat profil ' + esc(pg) + '">' + av +
            '<span class="t"><b>' + esc(pg) + '</b><span>' + esc([o.k, o.d].filter(function(v){ return v && v !== '—'; }).join(' · ')) + '</span>' +
            '<span class="hn-kom">' + info(x.kelas).logo + esc(info(x.kelas).nama) + '</span></span></button>' +
          '<div class="hn-alasan"><span class="hn-lbl">Kenapa cocok</span><div class="hn-chips">' + chip + '</div></div>' +
          '<div class="hn-aksi"><button type="button" class="btn outline sm"' + profil + '>Lihat profil</button>' +
            '<button type="button" class="btn sm" data-home-ajak="' + esc(o.n) + '">Ajak kenalan<small>10 kredit</small></button></div>' +
        '</article>';
      }).join('') + '</div>';
  }

  /* ---------- visual kartu ringkasan ----------
     Bukan ikon generik: gambar dari datanya sendiri (logo komunitas, foto/inisial
     orang) bertumpuk. Kalau kosong, ikon dalam lingkaran berwarna khas kartunya. */
  function fotoOrang(){
    const peta = {};
    diterima().forEach(function(k){
      (window.KolavoAnggotaKomunitas ? window.KolavoAnggotaKomunitas(k) : []).forEach(function(o){ if(o.f) peta[o.n] = o.f; });
    });
    return peta;
  }
  function tumpukOrang(nama, foto){
    return '<span class="hs-tumpuk">' + nama.slice(0, 3).map(function(n, i){
      const pg = n.split(' ')[0];
      return foto[n] ? '<span class="av photo ' + foto[n] + '" role="img" aria-label="' + esc(pg) + '"></span>'
                     : '<span class="av ' + 'abc'[i % 3] + '" aria-hidden="true">' + esc(n.split(' ').map(function(w){ return w[0]; }).join('').slice(0, 2)) + '</span>';
    }).join('') + (nama.length > 3 ? '<span class="av lagi">+' + (nama.length - 3) + '</span>' : '') + '</span>';
  }
  function tumpukKom(kelas){
    return '<span class="hs-tumpuk hs-tkom">' + kelas.slice(0, 3).map(function(k){
      if(k === 'l-dibuat'){ const d = App().dibuat || {}; return '<span class="logo-sq baru"' + (d.logo ? ' style="background-image:url(' + d.logo + ')"' : '') + '>' + (d.logo ? '' : esc(d.inisial || '')) + '</span>'; }
      return '<span class="logo-sq ' + k + '"></span>';
    }).join('') + '</span>';
  }

  function gambarRingkas(){
    const a = App(), kn = a.kenalan || {};
    const nm = (el('pfNm') && el('pfNm').textContent.trim()) || '';
    if(el('homeSapa')) el('homeSapa').textContent = nm ? 'Selamat datang, ' + nm.split(' ')[0] : 'Home';
    const foto = fotoOrang();
    const kom = diterima();
    const terhubung = Object.keys(kn).filter(function(k){ return kn[k] === 'terhubung'; });
    const masuk = kenalanMasuk().map(function(o){ return o.nama; });   /* siapkan dulu ajakan contoh */
    const saran = saranKenal(true).map(function(x){ return x.o.n; });
    /* empat angka saja; tiap kartu membawa ke bagian yang relevan */
    const kotak = function(angka, ket, varian, vis, ikon, ke, jangkar, warn){
      return '<button type="button" class="sek-stat-i hs-i hs-' + varian + (warn ? ' warn' : '') + '" data-ke="' + ke + '"' + (jangkar ? ' data-anchor="' + jangkar + '"' : '') + '>' +
        /* ikon raksasa transparan di pojok sebagai watermark dekoratif */
        '<i class="hs-wm" aria-hidden="true">' + ic(ikon) + '</i>' +
        '<span class="hs-vis">' + (vis || '<i class="hs-ic">' + ic(ikon) + '</i>') + '</span>' +
        '<b>' + angka + '</b><span>' + ket + '</span></button>';
    };
    el('homeRingkas').innerHTML = '<div class="sek-stat">' +
      kotak(kom.length, 'Komunitas Diikuti', 'biru', kom.length ? tumpukKom(kom) : '', 'komunitas', 'scrApp', '') +
      kotak(terhubung.length, 'Kenalan Terhubung', 'hijau', terhubung.length ? tumpukOrang(terhubung, foto) : '', 'tangan', 'scrHome', 'homeKenal') +
      kotak(masuk.length, 'Permintaan Kenalan', 'oranye', masuk.length ? tumpukOrang(masuk, foto) : '', 'tambahOrang', 'scrHome', 'homeAksi', masuk.length > 0) +
      kotak(saran.length, 'Rekomendasi Kenalan', 'ungu', saran.length ? tumpukOrang(saran, foto) : '', 'orang', 'scrHome', 'homeKenal') +
      '</div>';
  }

  window.KolavoGambarHome = function(){
    if(!el('homeAksi')) return;
    gambarRingkas();
    gambarAksi();
    gambarKabar();
    gambarKenal();
  };
  const segar = function(){ window.KolavoGambarHome(); };

  document.addEventListener('click', function(e){
    const t = e.target;
    let b;
    if((b = t.closest('[data-home-kenal-terima]'))){
      const a = App(), o = a.kenalanMasuk.splice(+b.dataset.homeKenalTerima, 1)[0];
      a.kenalan = a.kenalan || {}; a.kenalan[o.nama] = 'terhubung';
      toast('Kamu dan ' + o.nama.split(' ')[0] + ' sekarang saling kenal.');
      gambarKenal();
      segar(); return;
    }
    if((b = t.closest('[data-home-kenal-tolak]'))){
      const o = App().kenalanMasuk.splice(+b.dataset.homeKenalTolak, 1)[0];
      toast('Ajakan ' + o.nama.split(' ')[0] + ' ditolak. Dia tidak diberi tahu alasannya.');
      segar(); return;
    }
    if((b = t.closest('[data-home-tinjau]'))){
      window.KolavoBukaDashboard('minta', b.dataset.homeTinjau === 'diangkat' ? window.KolavoKomDiangkat() : null);
      return;
    }
    if((b = t.closest('[data-home-profil]'))){
      /* buka profil anggota di komunitasnya: siapkan konteks komunitas dulu, tanpa pindah layar */
      const kelas = b.dataset.kelas, nama = b.dataset.homeProfil;
      if(kelas === 'l-dibuat'){ if(window.KolavoBukaKomunitasDibuat) window.KolavoBukaKomunitasDibuat(); }
      else { const k = kartu(kelas); if(k && window.KolavoBukaKomunitas) window.KolavoBukaKomunitas(k); }
      if(window.KolavoBukaAnggota) window.KolavoBukaAnggota(nama);
      return;
    }
    if((b = t.closest('[data-home-ajak]'))){
      if(window.KolavoAjakKenalan) window.KolavoAjakKenalan(b.dataset.homeAjak);
      gambarKenal(); gambarRingkas(); return;
    }
    if((b = t.closest('[data-home-saring]'))){ saring = b.dataset.homeSaring; tampil = BATAS; gambarKabar(); return; }
    if(t.closest('[data-home-lagi]')){ tampil += BATAS; gambarKabar(); return; }
    if((b = t.closest('[data-home-kom]'))){ bukaKom(b.dataset.homeKom); }
  });
})();
</script>
