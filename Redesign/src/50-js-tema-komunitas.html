<script>
/* ============================================================
   Warna tema komunitas.
   Di produk ini ketetapan pengurus saat komunitas dibuat, bukan pilihan
   pengunjung — jadi tidak ada pemilih warna di tampilan anggota. Tiap
   komunitas dipetakan ke satu dari 13 warna /api/themes kolavo.app,
   diambil dari warna dominan logonya (pola --acc yang sudah dipakai kartu).

   Warnanya tidak dipakai mentah: halaman ini punya mode gelap sementara
   produknya tidak, dan #4B0082 di atas #0D1017 praktis tak terlihat.
   ============================================================ */
(function(){
  const TEMA = {
    'l-forpastara': '#FD8A0D',   /* jingga, ikut logonya */
    'l-iapnj':      '#30AEE0',   /* biru toska */
    'l-iasman52':   '#DB462E',   /* merah bata */
    'l-ppiju':      '#31D9A5'    /* hijau */
  };
  const BAWAAN = '#2D6BE4';      /* sama dengan bawaan produk */
  const layar = document.getElementById('scrKomunitas');

  /* Dua layar memakai warna tema: halaman komunitas (warna komunitas yang
     sedang dibuka) dan layar buat halaman (warna yang sedang dipilih
     pengurus). Turunan gelap/terangnya cuma satu, dipakai per elemen. */
  const daftar = [];

  const rgb = function(h){
    return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
  };
  const campur = function(h, ke, p){
    return 'rgb(' + rgb(h).map(function(v){ return Math.round(v + (ke - v) * p); }).join(',') + ')';
  };
  /* luminansi kasar; dipakai buat memilih warna teks di atas tombol */
  const terang = function(h){
    const c = rgb(h);
    return (c[0] * 299 + c[1] * 587 + c[2] * 114) / 1000;
  };
  const gelapMode = function(){
    const m = getComputedStyle(document.body).backgroundColor.match(/\d+/g);
    if(!m) return false;
    return (m[0] * 299 + m[1] * 587 + m[2] * 114) / 1000 < 128;
  };

  function warnai(sasaran, h){
    const c = rgb(h), gelap = gelapMode(), L = terang(h);
    const set = function(k, v){ sasaran.style.setProperty(k, v); };

    /* isian tombol & batang: di mode gelap warna pekat perlu diangkat sedikit */
    set('--blue', gelap && L < 90 ? campur(h, 255, .28) : h);
    set('--blue-hover', gelap ? campur(h, 255, .5) : campur(h, 0, .22));
    /* teks berwarna: di mode gelap ditarik ke arah putih supaya terbaca */
    set('--blue-ink', gelap ? campur(h, 255, Math.max(.3, (140 - L) / 200)) : campur(h, 0, L > 170 ? .34 : 0));
    /* wash dihitung dari warnanya sendiri, bukan dari degraded_color —
       pastel bawaan produk cuma benar di atas latar putih */
    set('--blue-wash', 'rgba(' + c.join(',') + ',' + (gelap ? .16 : .09) + ')');
    set('--ring', 'rgba(' + c.join(',') + ',.4)');
    /* teks di atas tombol mengikuti terang-gelapnya warna, bukan selalu putih —
       situs live memakai putih di atas kuning dan kontrasnya jadi tipis */
    set('--btn-ink', L > 165 ? '#1A1A1A' : '#FFFFFF');
  }

  function terapkan(){
    daftar.forEach(function(t){ warnai(t.el, t.hex); });
  }

  function pasang(sasaran, hex){
    if(!sasaran) return;
    const ada = daftar.filter(function(t){ return t.el === sasaran; })[0];
    if(ada) ada.hex = hex; else daftar.push({ el: sasaran, hex: hex });
    terapkan();
  }

  window.KolavoTema = function(kelas){ pasang(layar, TEMA[kelas] || BAWAAN); };
  /* dipakai layar buat halaman: warnanya belum punya kelas komunitas */
  window.KolavoWarnai = function(sasaran, hex){ pasang(sasaran, hex || BAWAAN); };

  pasang(layar, BAWAAN);

  /* mode terang/gelap bisa berubah kapan saja — warnanya perlu dihitung ulang */
  new MutationObserver(terapkan).observe(document.documentElement, {
    attributes: true, attributeFilter: ['data-theme']
  });
  if(window.matchMedia){
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    (mq.addEventListener ? mq.addEventListener.bind(mq, 'change') : mq.addListener.bind(mq))(terapkan);
  }
})();
</script>
