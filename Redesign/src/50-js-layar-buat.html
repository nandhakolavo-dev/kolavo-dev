<script>
/* ============================================================
   Layar buat halaman komunitas.

   Tiga hal yang tidak ada di /create kolavo.app dan sengaja ditaruh di sini:

   1. Warna tema. REFERENCE sudah menetapkan warna itu ketetapan pengurus saat
      komunitas dibuat — kalau tidak ditanyakan di sini, tidak ada tempat lain
      yang boleh menanyakannya.
   2. Formulir pendaftaran. Di produk ia hidup terpisah di /membership-settings,
      dan kartu bawaannya berjudul kosong — pengurus ditinggal menebak apa yang
      harus diketik. Di sini judulnya sudah terisi menurut bentuk komunitasnya.
   3. Alamat halaman. Yang sebenarnya dipakai pengurus sesudah ini cuma satu
      link, jadi link itu ditunjukkan sejak dibuat, bukan dicari belakangan.
   ============================================================ */
(function(){
  const scr = document.getElementById('scrBuat');
  if(!scr) return;
  const el = function(id){ return document.getElementById(id); };

  /* 13 warna /api/themes kolavo.app, urut dari biru ke cokelat */
  const WARNA = ['#2D6BE4','#0D7FFD','#30AEE0','#30D4E0','#31D9A5','#30E04D','#EBC81E',
                 '#FD8A0D','#DB462E','#E3269B','#CB30E0','#4B0082','#895129'];

  /* Pertanyaan bawaan menurut bentuk komunitas. Inilah yang di kolavo.app
     dikosongkan: kartu kedua judulnya kosong, "Contoh: Tahun Angkatan" cuma
     placeholder. Padahal bentuk komunitasnya sudah ditanyakan beberapa kolom
     di atas — jawabannya cukup buat menebak judul yang benar. */
  const BAWAAN = {
    'Ikatan Alumni': { judul: 'Tahun Lulus',      tanya: 'Kamu lulus tahun berapa?' },
    'Organisasi'   : { judul: 'Tahun Pengukuhan', tanya: 'Kapan kamu dikukuhkan?' },
    'Asosiasi'     : { judul: 'Tahun Bergabung',  tanya: 'Sejak tahun berapa kamu bergabung?' },
    'Himpunan'     : { judul: 'Angkatan',         tanya: 'Kamu angkatan berapa?' },
    'Komunitas'    : { judul: 'Tahun Bergabung',  tanya: 'Sejak kapan kamu ikut di sini?' }
  };
  const MAKS = 5;

  /* pertanyaan kedua bawaan: alasan bergabung — paling sering dipakai pengurus
     untuk menyaring, dan jadi bahan Tinjau jawaban / Kelompokkan. Tetap bisa
     diubah atau dihapus seperti pertanyaan biasa. */
  let tanya  = [{ id: 'q1', judul: '', tanya: '', tipe: 'tahun', wajib: false, bawaan: true },
                { id: 'q2', judul: 'Alasan Bergabung', tanya: 'Kenapa kamu ingin bergabung di komunitas ini?', tipe: 'teks', wajib: false, bawaan: false }];
  let urut   = 2;
  let warna  = WARNA[0];
  let logo   = '';
  let slugKetik = false;
  let dibuat = null;
  let nomorMode = 'auto';   /* auto | manual | off */
  let kodeKetik = false;    /* pengurus sudah mengetik kode sendiri? */

  /* ---------- warna tema ---------- */
  el('bkTema').innerHTML = WARNA.map(function(h, i){
    return '<label class="tema-r"><input type="radio" name="bkWarna" value="' + h + '"' +
           (i === 0 ? ' checked' : '') + ' aria-label="Warna ' + h + '">' +
           '<span style="background:' + h + '"></span></label>';
  }).join('');

  function pakaiWarna(){
    if(window.KolavoWarnai) window.KolavoWarnai(scr, warna);
  }
  pakaiWarna();

  /* ---------- petak logo ---------- */
  function inisial(nama){
    const kata = nama.trim().split(/\s+/).filter(Boolean);
    if(!kata.length) return 'K';
    return (kata[0][0] + (kata[1] ? kata[1][0] : '')).toUpperCase();
  }

  function gambarLogo(){
    const kotak = el('bkLogo');
    kotak.textContent = logo ? '' : inisial(el('bkNama').value);
    kotak.style.backgroundImage = logo ? 'url("' + logo + '")' : '';
    el('bkLogoHapus').hidden = !logo;
  }

  el('bkLogoPilih').addEventListener('click', function(){ el('bkLogoFile').click(); });
  el('bkLogoFile').addEventListener('change', function(){
    const f = this.files && this.files[0];
    if(!f) return;
    const baca = new FileReader();
    baca.onload = function(ev){ logo = ev.target.result; gambarLogo(); };
    baca.readAsDataURL(f);
    this.value = '';
  });
  el('bkLogoHapus').addEventListener('click', function(){ logo = ''; gambarLogo(); });

  /* ---------- alamat halaman ----------
     Nama panjang jadi singkatan seperti yang sudah dipakai komunitas asli:
     kata pendek dan kata berangka dibiarkan utuh, kata panjang tinggal
     huruf depannya. "Ikatan Alumni PNJ" -> iapnj, "Purna Paskibraka
     Indonesia Jakarta Utara" -> ppiju. */
  function keSlug(nama){
    return nama.trim().split(/\s+/).map(function(k){
      const bersih = k.replace(/[^0-9A-Za-z]/g, '').toLowerCase();
      if(!bersih) return '';
      return (bersih.length <= 4 || /\d/.test(bersih)) ? bersih : bersih[0];
    }).join('').slice(0, 24);
  }

  /* ---------- nomor anggota ----------
     Kode = awalan nomor. Diturunkan dari slug (huruf besar, tanpa tanda),
     boleh diganti pengurus. Format nomor: KODE-TAHUN MASUK-URUTAN. */
  function keKode(s){
    return String(s || '').toUpperCase().replace(/[^0-9A-Z]/g, '').slice(0, 12);
  }
  function gambarNomor(){
    const wrap = el('bkKodeWrap'), why = el('bkNomorWhy');
    const tahun = new Date().getFullYear();
    const kode = el('bkKode').value.trim() || keKode(el('bkSlug').value || el('bkNama').value) || 'KOMU';
    const contoh = lolos(kode + '-' + tahun + '-001');
    if(nomorMode === 'off'){
      wrap.hidden = true;
      why.innerHTML = 'Anggota tidak diberi nomor. Bisa diaktifkan lagi nanti dari pengaturan komunitas.';
    } else if(nomorMode === 'manual'){
      wrap.hidden = false;
      why.innerHTML = 'Pengurus mengisi nomor sendiri saat menerima pendaftaran, dan bisa diperbaiki lagi kalau salah. Awalan yang disarankan: <b>' + contoh + '</b>.';
    } else {
      wrap.hidden = false;
      why.innerHTML = 'Kolavo memberi nomor otomatis tiap anggota diterima: <b>kode–tahun masuk–urutan</b>. Anggota ke berapa mengikuti urutan penerimaan tahun itu. Contoh: <b>' + contoh + '</b>.';
    }
  }

  /* ---------- domisili bertingkat ---------- */
  (function(){
    const WILAYAH = window.KolavoWilayah || {};
    const negara = el('bkNegara'), provinsi = el('bkProvinsi'), kota = el('bkKota');

    function kosongkan(sel, teks){
      sel.innerHTML = '';
      const o = document.createElement('option');
      o.value = ''; o.textContent = teks;
      sel.appendChild(o);
    }
    function isi(sel, daftar){
      daftar.forEach(function(v){
        const o = document.createElement('option');
        o.textContent = v;
        sel.appendChild(o);
      });
    }

    negara.addEventListener('change', function(){
      kosongkan(provinsi, 'Provinsi');
      kosongkan(kota, 'Kota/kabupaten');
      kota.disabled = true;
      const p = WILAYAH[negara.value];
      provinsi.disabled = !p;
      if(p) isi(provinsi, Object.keys(p));
    });
    provinsi.addEventListener('change', function(){
      kosongkan(kota, 'Kota/kabupaten');
      const k = WILAYAH[negara.value] && WILAYAH[negara.value][provinsi.value];
      kota.disabled = !k;
      if(k) isi(kota, k);
    });
  })();

  /* ---------- kartu pertanyaan ---------- */
  const X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>';

  function gambarTanya(){
    const bentuk = pilihBentuk();
    const b = BAWAAN[bentuk] || BAWAAN['Komunitas'];

    el('bkTanyaList').innerHTML =
      '<div class="qcard kunci">' +
        '<div class="qcard-h"><span class="qcard-no">1</span>' +
        '<input class="inp" value="Nama Panggilan" disabled></div>' +
        '<p class="qcard-kunci">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>' +
          '<span>Selalu ada dan selalu wajib. Ini cara anggotamu saling menyapa — bukan nama di ijazah.</span>' +
        '</p>' +
      '</div>' +
      tanya.map(function(t, i){
        const judul = t.bawaan && !t.judul ? b.judul : t.judul;
        const isiTanya = t.bawaan && !t.tanya ? b.tanya : t.tanya;
        return '<div class="qcard" data-q="' + t.id + '" data-def-judul="' + lolos(t.bawaan ? b.judul : '') + '" data-def-tanya="' + lolos(t.bawaan ? b.tanya : '') + '">' +
          '<div class="qcard-h"><span class="qcard-no">' + (i + 2) + '</span>' +
          '<input class="inp" data-k="judul" maxlength="28" value="' + lolos(judul) + '" placeholder="Judul singkat — misal Tahun Lulus">' +
          '<button type="button" class="qcard-x" data-hapus="' + t.id + '" aria-label="Hapus pertanyaan ini">' + X + '</button></div>' +
          '<input class="inp" data-k="tanya" maxlength="70" value="' + lolos(isiTanya) + '" placeholder="Pertanyaannya, ditulis buat calon anggota">' +
          '<div class="qfoot">' +
            '<div class="pills">' +
              '<label class="pill-r"><input type="radio" name="tipe-' + t.id + '" data-k="tipe" value="tahun"' + (t.tipe === 'tahun' ? ' checked' : '') + '><span>Pilih tahun</span></label>' +
              '<label class="pill-r"><input type="radio" name="tipe-' + t.id + '" data-k="tipe" value="teks"' + (t.tipe === 'teks' ? ' checked' : '') + '><span>Jawaban teks</span></label>' +
            '</div>' +
            '<label class="sw"><input type="checkbox" data-k="wajib"' + (t.wajib ? ' checked' : '') + '><i></i>Wajib diisi</label>' +
          '</div>' +
          '<p class="f-galat">Judul pertanyaan perlu diisi, atau hapus kartunya.</p>' +
        '</div>';
      }).join('');

    el('bkTambah').disabled = tanya.length >= MAKS;
    el('bkTanyaSisa').textContent = tanya.length >= MAKS
      ? 'Sudah lima pertanyaan — batasnya di sini. Formulir yang panjang bikin orang berhenti di tengah.'
      : 'Maksimal lima pertanyaan. Formulir yang panjang bikin orang berhenti di tengah.';
  }

  function lolos(s){
    return String(s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }

  function pilihBentuk(){
    const r = scr.querySelector('input[name="bkBentuk"]:checked');
    return r ? r.value : '';
  }

  el('bkTambah').addEventListener('click', function(){
    if(tanya.length >= MAKS) return;
    simpanTanya();
    urut++;
    tanya.push({ id: 'q' + urut, judul: '', tanya: '', tipe: 'teks', wajib: false, bawaan: false });
    gambarTanya();
    const baru = scr.querySelector('.qcard[data-q="q' + urut + '"] .inp');
    if(baru) baru.focus();
  });

  scr.addEventListener('click', function(e){
    const h = e.target.closest('[data-hapus]');
    if(!h) return;
    simpanTanya();
    tanya = tanya.filter(function(t){ return t.id !== h.dataset.hapus; });
    if(!tanya.length) tanya = [{ id: 'q' + (++urut), judul: '', tanya: '', tipe: 'teks', wajib: false, bawaan: false }];
    gambarTanya();
  });

  /* nilai kartu disimpan balik ke modelnya, supaya menambah atau menghapus
     satu kartu tidak menghapus yang sudah diketik di kartu lain */
  function simpanTanya(){
    tanya.forEach(function(t){
      const kartu = scr.querySelector('.qcard[data-q="' + t.id + '"]');
      if(!kartu) return;
      const judul = kartu.querySelector('[data-k="judul"]').value;
      const isi   = kartu.querySelector('[data-k="tanya"]').value;
      const tipe  = kartu.querySelector('[data-k="tipe"]:checked');
      /* kartu bawaan yang belum disentuh tetap kosong di model, supaya
         judulnya ikut berubah waktu bentuk komunitasnya diganti */
      const utuh = t.bawaan && judul === (kartu.dataset.defJudul || '')
                            && isi   === (kartu.dataset.defTanya || '');
      t.bawaan = utuh;
      t.judul = utuh ? '' : judul;
      t.tanya = utuh ? '' : isi;
      t.tipe  = tipe ? tipe.value : t.tipe;
      t.wajib = kartu.querySelector('[data-k="wajib"]').checked;
    });
  }

  /* ---------- progres ---------- */
  function progres(){
    let beres = 0;
    if(el('bkNama').value.trim()) beres++;
    if(pilihBentuk()) beres++;
    if(el('bkKota').value) beres++;
    if(el('bkAjak').value.trim()) beres++;
    el('bkN').textContent = beres;
    el('bkFill').style.width = (beres / 4 * 100) + '%';
    el('bkEst').textContent = beres === 4 ? 'siap dibuat' : 'sekitar 3 menit';
  }

  /* ---------- perubahan isian ---------- */
  scr.addEventListener('input', function(e){
    if(e.target === el('bkNama')){
      gambarLogo();
      if(!slugKetik) el('bkSlug').value = keSlug(el('bkNama').value);
      if(!kodeKetik) el('bkKode').value = keKode(el('bkSlug').value);
    }
    if(e.target === el('bkSlug')){
      slugKetik = true;
      e.target.value = e.target.value.replace(/[^0-9a-z-]/g, '');
      if(!kodeKetik) el('bkKode').value = keKode(e.target.value);
    }
    if(e.target === el('bkKode')){
      kodeKetik = true;
      e.target.value = keKode(e.target.value);
    }
    if(e.target === el('bkAjak')) el('bkAjakN').textContent = e.target.value.length;
    if(e.target === el('bkNama') || e.target === el('bkSlug') || e.target === el('bkKode')) gambarNomor();
    progres();
    /* tanda merah hilang begitu kolomnya disentuh, sama seperti layar profil */
    const f = e.target.closest('.f.salah, .qcard.salah');
    if(f) f.classList.remove('salah');
    if(!scr.querySelector('.salah')) el('bkGalat').hidden = true;
  });

  scr.addEventListener('change', function(e){
    if(e.target.name === 'bkWarna'){ warna = e.target.value; pakaiWarna(); return; }
    if(e.target.name === 'bkBentuk'){
      simpanTanya();
      gambarTanya();   /* kartu bawaan ikut ganti judul selama belum diketik */
    }
    if(e.target.name === 'bkNomor'){ nomorMode = e.target.value; gambarNomor(); }
    progres();
    const f = e.target.closest('.f.salah, .qcard.salah');
    if(f) f.classList.remove('salah');
  });

  /* ---------- periksa & buat ---------- */
  function periksa(){
    let pertama = null;
    scr.querySelectorAll('.salah').forEach(function(n){ n.classList.remove('salah'); });

    const tandai = function(node){
      if(!node) return;
      node.classList.add('salah');
      if(!pertama) pertama = node;
    };

    if(!el('bkNama').value.trim())  tandai(el('bkNama').closest('.f'));
    if(!pilihBentuk())              tandai(scr.querySelector('input[name="bkBentuk"]').closest('.f'));
    if(!el('bkKota').value)         tandai(el('bkKota').closest('.f'));
    if(!el('bkAjak').value.trim())  tandai(el('bkAjak').closest('.f'));

    tanya.forEach(function(t){
      if(!t.judul.trim()) tandai(scr.querySelector('.qcard[data-q="' + t.id + '"]'));
    });
    return pertama;
  }

  /* ---------- lihat contoh halaman ----------
     Pratinjau tanpa memaksa form beres: yang kosong diisi contoh sementara,
     yang sudah diketik dipakai apa adanya — biar pengurus lihat hasilnya
     dari sisi calon anggota sebelum menekan Buat. */
  el('bkPratinjau').addEventListener('click', function(){
    simpanTanya();
    const bentuk = pilihBentuk() || 'Komunitas';
    const b = BAWAAN[bentuk] || BAWAAN['Komunitas'];
    const nama = el('bkNama').value.trim() || 'Nama Komunitasmu';
    const tanyaPrev = [{ id: 'nickname', judul: 'Nama Panggilan',
                         tanya: 'Apa nama panggilan kamu di komunitas ini?', tipe: 'teks', wajib: true }]
      .concat(tanya.map(function(t){
        return { id: t.id,
                 judul: t.judul.trim() || (t.bawaan ? b.judul : 'Pertanyaan'),
                 tanya: t.tanya.trim() || (t.bawaan ? b.tanya : ''),
                 tipe: t.tipe, wajib: t.wajib };
      }));
    const kom = {
      nama: nama,
      slug: el('bkSlug').value.trim() || keSlug(nama) || 'komunitasmu',
      bentuk: bentuk,
      kota: el('bkKota').value || 'Indonesia',
      warna: warna, logo: logo, inisial: inisial(nama),
      ajakan: el('bkAjak').value.trim() || 'Tempat kita saling kenal, bukan cuma saling punya nomor.',
      tanya: tanyaPrev
    };
    if(window.KolavoPratinjau) window.KolavoPratinjau(kom);
  });

  el('bkKirim').addEventListener('click', function(){
    simpanTanya();
    /* kartu bawaan yang tidak disentuh dipakai apa adanya — yang terlihat di
       layar itulah yang tersimpan, bukan kolom kosong */
    const b = BAWAAN[pilihBentuk()] || BAWAAN['Komunitas'];
    tanya.forEach(function(t){
      if(!t.bawaan) return;
      t.judul = t.judul || b.judul;
      t.tanya = t.tanya || b.tanya;
      t.bawaan = false;
    });
    const kurang = periksa();
    if(kurang){
      el('bkGalat').hidden = false;
      kurang.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    el('bkGalat').hidden = true;

    const nama = el('bkNama').value.trim();
    const slug = el('bkSlug').value.trim() || keSlug(nama);
    const data = {
      nama: nama,
      slug: slug,
      bentuk: pilihBentuk(),
      kota: el('bkKota').value,
      warna: warna,
      logo: logo,
      inisial: inisial(nama),
      ajakan: el('bkAjak').value.trim(),
      /* penomoran anggota: mode + awalan kode, dipakai dashboard saat menerima */
      nomorMode: nomorMode,
      kode: (el('bkKode').value.trim() || keKode(slug) || 'KOMU'),
      /* bentuk yang sama dengan data-tanya di kartu direktori — formulir
         pendaftaran yang barusan disusun memang benda yang sama */
      tanya: [{ id: 'nickname', judul: 'Nama Panggilan',
                tanya: 'Apa nama panggilan kamu di komunitas ini?', tipe: 'teks', wajib: true }]
              .concat(tanya.map(function(t){
                return { id: t.id, judul: t.judul.trim(), tanya: t.tanya.trim(),
                         tipe: t.tipe, wajib: t.wajib };
              }))
    };
    if(modeSunting && dibuat){
      Object.assign(dibuat, data);
      if(window.KolavoApp) window.KolavoApp.dibuat = dibuat;
      modeSunting = false;
      el('bkKirim').textContent = 'Buat halaman komunitas';
      const hh = scr.querySelector('.ph-h1'); if(hh) hh.textContent = 'Bikin basecamp komunitasmu.';
      if(window.KolavoIsiProfil) window.KolavoIsiProfil();
      if(window.KolavoToast) window.KolavoToast('Pengaturan komunitas tersimpan.');
      if(window.KolavoKe) window.KolavoKe('scrProfil');
      return;
    }
    dibuat = data;
    if(window.KolavoApp) window.KolavoApp.dibuat = dibuat;

    el('bkDoneH').textContent = 'Halaman ' + nama + ' sudah jadi.';
    el('bkDoneNm').textContent = nama;
    el('bkDoneMeta').textContent = [dibuat.bentuk, dibuat.kota, 'belum ada anggota'].filter(Boolean).join(' · ');
    el('bkDoneLink').textContent = 'kolavo.app/' + slug;
    const petak = el('bkDoneLogo');
    petak.textContent = logo ? '' : dibuat.inisial;
    petak.style.backgroundImage = logo ? 'url("' + logo + '")' : '';

    el('buatForm').hidden = true;
    el('buatDone').hidden = false;
    window.scrollTo(0, 0);
    if(window.KolavoIsiProfil) window.KolavoIsiProfil();
    if(window.KolavoToast) window.KolavoToast('Halaman komunitasmu sudah dibuat.');
  });

  /* ---------- menyebar linknya ----------
     Sama seperti "Ajak pengurusmu bikin halaman" di beranda: disalin, bukan
     dibuka. Prototipe ini juga jalan di iframe ber-sandbox, tempat membuka
     jendela baru diam-diam diblokir. */
  function salin(teks, tombol, sesudah){
    const label = tombol.textContent;
    const selesai = function(){
      tombol.textContent = sesudah;
      setTimeout(function(){ tombol.textContent = label; }, 2200);
    };
    try {
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(teks).then(selesai, selesai);
      } else { selesai(); }
    } catch(err){ selesai(); }
  }

  el('bkSalin').addEventListener('click', function(){
    salin('https://kolavo.app/' + (dibuat ? dibuat.slug : ''), this, 'Tersalin ✓');
  });

  el('bkWa').addEventListener('click', function(){
    const teks = 'Halaman ' + (dibuat ? dibuat.nama : 'komunitas kita') + ' sudah ada di Kolavo. ' +
                 'Daftar di sini biar kita bisa saling kenal: https://kolavo.app/' + (dibuat ? dibuat.slug : '');
    salin(teks, this, 'Ajakan tersalin ✓');
    if(window.KolavoToast) window.KolavoToast('Di produk, tombol ini langsung membuka WhatsApp.');
  });

  /* dipakai layar profil: komunitas yang dia buat sendiri ikut di daftar
     "Komunitas saya", dengan peran pengurus + kontrol arsip/hapus */
  let konfHapus = false;
  let menuBuka = false;
  let modeSunting = false;
  const IC_KEBAB = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>';
  const IC_ARSIP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"/><path d="M10 12h4"/></svg>';
  const IC_PULIH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"/><path d="M12 17v-5"/><path d="m9.5 14 2.5-2.5 2.5 2.5"/></svg>';
  const IC_HAPUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M6 6v14a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V6"/><path d="M10 11v6M14 11v6"/></svg>';
  const IC_TUTUP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>';
  const rerenderP = function(){ if(window.KolavoIsiProfil) window.KolavoIsiProfil(); };
  const toastP = function(t){ if(window.KolavoToast) window.KolavoToast(t); };

  window.KolavoArsipkanDibuat = function(flag){
    if(!dibuat) return;
    dibuat.arsip = (flag === undefined) ? !dibuat.arsip : !!flag;
    if(window.KolavoApp) window.KolavoApp.dibuat = dibuat;
  };
  window.KolavoHapusDibuat = function(){
    dibuat = null; konfHapus = false; menuBuka = false;
    if(window.KolavoApp) window.KolavoApp.dibuat = null;
  };
  const IC_SETTING = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.09a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>';
  /* buka layar Buat dalam mode sunting: isi ulang nilai, Simpan meng-update yang sama */
  function suntingDibuat(){
    if(!dibuat) return;
    modeSunting = true;
    el('bkNama').value = dibuat.nama || '';
    el('bkSlug').value = dibuat.slug || ''; slugKetik = true;
    el('bkAjak').value = dibuat.ajakan || '';
    const rb = scr.querySelector('input[name="bkBentuk"][value="' + (dibuat.bentuk || '') + '"]');
    if(rb) rb.checked = true;
    const kotaSel = el('bkKota');
    if(dibuat.kota){
      if(![].some.call(kotaSel.options, function(o){ return o.value === dibuat.kota; })){
        const o = document.createElement('option'); o.value = dibuat.kota; o.textContent = dibuat.kota; kotaSel.appendChild(o);
      }
      kotaSel.disabled = false; kotaSel.value = dibuat.kota;
    }
    warna = dibuat.warna || warna;
    const wr = scr.querySelector('input[name="bkWarna"][value="' + warna + '"]');
    if(wr) wr.checked = true;
    pakaiWarna();
    logo = dibuat.logo || '';
    nomorMode = dibuat.nomorMode || 'auto';
    el('bkKode').value = dibuat.kode || ''; kodeKetik = true;
    tanya = (dibuat.tanya || []).filter(function(t){ return t.id !== 'nickname'; }).map(function(t){
      return { id: t.id, judul: t.judul || '', tanya: t.tanya || '', tipe: t.tipe || 'teks', wajib: !!t.wajib, bawaan: false };
    });
    if(!tanya.length) tanya = [{ id: 'q' + (++urut), judul: '', tanya: '', tipe: 'tahun', wajib: false, bawaan: true }];
    const h1 = scr.querySelector('.ph-h1'); if(h1) h1.textContent = 'Pengaturan komunitas';
    el('bkKirim').textContent = 'Simpan perubahan';
    el('buatForm').hidden = false; el('buatDone').hidden = true;
    gambarLogo(); gambarNomor(); gambarTanya(); progres();
    if(window.KolavoKe) window.KolavoKe('scrBuat');
    window.scrollTo(0, 0);
  }
  window.KolavoSuntingDibuat = suntingDibuat;
  window.KolavoDibuatItem = function(){
    if(!dibuat) return '';
    const gaya = dibuat.logo ? ' style="background-image:url(' + dibuat.logo + ')"' : '';
    const arsip = !!dibuat.arsip;
    const status = '<span class="status ' + (arsip ? 'arsip' : 'pengurus') + '">' + (arsip ? 'Diarsipkan' : 'Pengurus') + '</span>';
    const open = '<div class="pf-open" data-komunitas-dibuat role="button" tabindex="0" title="Buka halaman komunitas">' +
        '<span class="logo-sq baru"' + gaya + ' role="img" aria-label="Logo komunitas">' + (dibuat.logo ? '' : dibuat.inisial) + '</span>' +
        '<div class="t"><div class="n">' + lolos(dibuat.nama) + '</div>' +
        '<div class="s">' + lolos([dibuat.bentuk, dibuat.kota].filter(Boolean).join(' · ')) + '</div></div>' +
      '</div>';
    let aksi;
    if(konfHapus){
      aksi = '<div class="pf-item-aksi"><span class="pf-konf-t">Hapus permanen?</span>' +
          '<div class="pf-aksi-btn"><button type="button" class="pf-mini danger" data-dibuat-hapus-ok>Ya, hapus</button>' +
          '<button type="button" class="pf-mini" data-dibuat-hapus-batal>Batal</button></div></div>';
    } else if(menuBuka){
      aksi = '<div class="pf-item-aksi">' + status + '<div class="pf-menu">' +
            '<button type="button" class="pf-ic" data-dibuat-setting aria-label="Pengaturan warna & pertanyaan" title="Pengaturan">' + IC_SETTING + '</button>' +
            '<button type="button" class="pf-ic" data-dibuat-arsip aria-label="' + (arsip ? 'Pulihkan' : 'Arsipkan') + '" title="' + (arsip ? 'Pulihkan' : 'Arsipkan') + '">' + (arsip ? IC_PULIH : IC_ARSIP) + '</button>' +
            '<button type="button" class="pf-ic danger" data-dibuat-hapus aria-label="Hapus" title="Hapus">' + IC_HAPUS + '</button>' +
            '<button type="button" class="pf-ic" data-dibuat-menu-tutup aria-label="Tutup" title="Tutup">' + IC_TUTUP + '</button>' +
          '</div></div>';
    } else {
      aksi = '<div class="pf-item-aksi">' + status +
          '<button type="button" class="pf-ic" data-dibuat-menu aria-label="Kelola komunitas" title="Kelola komunitas">' + IC_KEBAB + '</button></div>';
    }
    return '<div class="pf-item' + (arsip ? ' pf-item--arsip' : '') + '">' + open + aksi + '</div>';
  };

  /* aksi arsip/hapus di kartu "Komunitas saya" — elemennya dirender router,
     jadi listenernya di document. Kebab membuka menu ikon; hapus dua langkah. */
  document.addEventListener('click', function(e){
    if(e.target.closest('[data-ke="scrBuat"]')){ modeSunting = false; const h1r = scr.querySelector('.ph-h1'); if(h1r) h1r.textContent = 'Bikin basecamp komunitasmu.'; el('bkKirim').textContent = 'Buat halaman komunitas'; }
    if(e.target.closest('[data-dibuat-setting]')){ e.preventDefault(); menuBuka = false; rerenderP(); suntingDibuat(); return; }
    if(e.target.closest('[data-dibuat-menu]')){
      e.preventDefault(); menuBuka = !menuBuka; konfHapus = false; rerenderP(); return;
    }
    if(e.target.closest('[data-dibuat-menu-tutup]')){
      e.preventDefault(); menuBuka = false; rerenderP(); return;
    }
    if(e.target.closest('[data-dibuat-hapus-ok]')){
      e.preventDefault();
      const nm = dibuat ? dibuat.nama : 'Komunitas';
      window.KolavoHapusDibuat();
      rerenderP();
      toastP('“' + nm + '” dihapus permanen.');
      return;
    }
    if(e.target.closest('[data-dibuat-hapus-batal]')){
      e.preventDefault(); konfHapus = false; rerenderP(); return;
    }
    if(e.target.closest('[data-dibuat-hapus]')){
      e.preventDefault(); konfHapus = true; menuBuka = false; rerenderP(); return;
    }
    if(e.target.closest('[data-dibuat-arsip]')){
      e.preventDefault(); if(!dibuat) return;
      window.KolavoArsipkanDibuat(); menuBuka = false; konfHapus = false;
      rerenderP();
      toastP(dibuat.arsip ? 'Komunitas diarsipkan — tidak tampil di direktori publik. Bisa dipulihkan kapan saja.' : 'Komunitas dipulihkan.');
      return;
    }
    /* klik di luar area aksi menutup menu yang sedang terbuka */
    if(menuBuka && !e.target.closest('.pf-item-aksi')){ menuBuka = false; rerenderP(); }
  });

  gambarTanya();
  gambarLogo();
  gambarNomor();
  progres();
})();
</script>
