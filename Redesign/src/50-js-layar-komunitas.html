  function bar(daftar, wadah, total){
    wadah.innerHTML = '';

      const baris = document.createElement('div');
      baris.className = 'agg-item' + (p[0] === 'Lainnya' ? ' lain' : '');

        '<span class="n">' + p[1] + '</span>';
      baris.querySelector('.nm').textContent = p[0];
      wadah.appendChild(baris);
    });

     sini, tanpa data kembar. */
  function aggDibuat(){
    const D = window.KolavoDashboard;
    if(!D || !D.built) return { profesi: [], kota: [], angkatan: '—', anggota: [], pengurus: [] };
    const nama = D.pengurus.map(function(p){ return p.nama; }).concat(D.anggotaBiasa);
    const anggota = nama.map(function(n){
      const m = D.mem[n] || { nama: n };
      /* panggilan pemilik diambil dari namanya (dashboard mengisinya "Kamu") */
      const o = { n: n, pg: n === D.aku ? '' : (m.panggil || ''), full: m.full || '', k: m.kerja || '—', d: m.kota || '—', j: (m.tags || []).slice(), id: m.id || '', aku: !!m.aku };

      return D.kelompokOrang ? Object.assign(o, D.kelompokOrang(n)) : o;

    const tally = function(key){
      const peta = {};
      anggota.forEach(function(o){ const v = o[key] || 'Lainnya'; peta[v] = (peta[v] || 0) + 1; });
      return Object.keys(peta).map(function(k){ return [k, peta[k]]; });

    return {

      pengurus: D.pengurus.map(function(p){ return { n: p.nama, j: p.jabatan, kenal: p.perkenalan || '' }; })

  function daftarOrang(){
    const dasar = (kini && kini.agg && kini.agg.anggota) || [];
    /* di halaman pemilik, dasar sudah memuat dirinya (dari dashboard) —
       jangan ditambah baris "aku" lagi supaya tidak dobel */
    if(founder) return dasar;
    return akuAnggota() ? [aku()].concat(dasar) : dasar;
  }

  /* komposisi ikut bertambah satu di keranjang yang cocok; kalau nama kotanya
     tidak persis sama dengan yang di agregat, jatuh ke 'Lainnya' */
  /* agregat menulis "Kab. Bekasi", pemilih domisili menulis "Kabupaten Bekasi" —
     tanpa penyeragaman ini penggunanya selalu jatuh ke keranjang 'Lainnya' */
  function samakan(s){
    return (s || '').toLowerCase()
      .replace(/^kab\.?\s+|^kabupaten\s+/, 'kab ')
      .replace(/^kota\s+/, 'kota ')
      .trim();
  }

  function komposisi(daftar, nilai){
    const salin = daftar.map(function(p){ return [p[0], p[1]]; });
    if(!akuAnggota()) return salin;
    const cocok = salin.filter(function(p){ return samakan(p[0]) === samakan(nilai); })[0]
               || salin.filter(function(p){ return p[0] === 'Lainnya'; })[0];
    if(cocok) cocok[1] += 1;
    else salin.push([nilai || 'Lainnya', 1]);
    return salin;
  }

  /* Sumbu penelusuran. kolavo.app menaruh ini sebagai pengalih di dalam modal
     ("Lihat Berdasarkan: Tahun Angkatan | Kelas"); di sini dinaikkan ke daftarnya. */
  const SUMBU = [
    { id: 'k', nama: 'Keahlian' },
    { id: 'a', nama: 'Angkatan' },
    { id: 'd', nama: 'Domisili' }
  ];
  let sumbuKini = 'k';
  /* di halaman pemilik, kelompok jawaban yang dibuat pengurus ikut jadi sumbu */
  function sumbuDaftar(){
    const D = window.KolavoDashboard;
    return SUMBU.concat(founder && D && D.kelompokSumbu ? D.kelompokSumbu() : []);
  }

  /* Anggota di kolavo.app tetap bisa membetulkan jawabannya lewat
     "Edit Data Pendaftaran" — formulirnya sama, cuma sudah terisi. */
  let modeSunting = false;

  function jawabanKini(){
    const peta = {};
    document.querySelectorAll('#gabungList [data-tanya-id]').forEach(function(e){
      peta[e.dataset.tanyaId] = e.value;
    });
    return peta;
  }

  function pasangJawaban(peta){
    document.querySelectorAll('#gabungList [data-tanya-id]').forEach(function(e){
      if(peta[e.dataset.tanyaId] != null) e.value = peta[e.dataset.tanyaId];
    });
  }

  /* saringan "Belum kenalan" berdiri sendiri, bisa digabung dengan chip sumbu */
  let bidangKini = '';
  let hanyaBelum = false;
  const KN_LABEL = { belum: 'Belum kenalan', menunggu: 'Menunggu', terhubung: 'Sudah kenal' };
  /* ikon orang: + (belum), jam (menunggu), centang (sudah kenal) */
  const ORG = '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/>';
  const KN_IKON = {
    belum: ORG + '<path d="M19 8v6M16 11h6"/>',
    menunggu: ORG + '<circle cx="19" cy="11" r="3.2"/><path d="M19 9.6V11l.9.7"/>',
    terhubung: ORG + '<path d="m16 11 2 2 4-4"/>'
  };
  function svgKenal(st){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + KN_IKON[st] + '</svg>';
  }
  /* ikon yang sama dengan notifikasi "… menerima ajakan kenalanmu" (50-js-notifikasi) */
  const IKON_TERIMA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>';
  window.KolavoIkonKenal = svgKenal;
  /* dipakai daftar anggota & kartu sambutan feed: cincin, ikon, dan saringan ikut segar */
  function segarKenal(){
    if(kini && !el('komBuka').hidden){ gambarProgres(); saring(bidangKini); }
    if(window.KolavoGambarFeed) window.KolavoGambarFeed();
  }
  window.KolavoAjakKenal = function(nama){
    const App = window.KolavoApp || {};
    App.kenalan = App.kenalan || {};
    if(App.kenalan[nama]) return;
    App.kenalan[nama] = 'menunggu';
    tandaiDemo();
    segarKenal();
    if(window.KolavoToast) window.KolavoToast('Ajakan kenalan dikirim ke ' + nama.split(' ')[0] + '.');
  };
  /* keadaan halaman yang sedang dibuka, dibaca modul feed */
  window.KolavoKomKini = function(){
    if(!kini) return null;
    return { kelas: kini.kelas, nama: kini.nama, premium: !!kini.premium, founder: founder,
      pratinjau: pratinjau, anggota: !pratinjau && anggotaKini(), agg: kini.agg };
  };
  function ikonKenal(o){
    if(o.aku) return '';
    const st = window.KolavoStatusKenal(o.n);
    return '<span class="kn-ic ' + st + '" role="img" aria-label="' + KN_LABEL[st] + '" title="' + KN_LABEL[st] + '">' + svgKenal(st) + '</span>';
  }
  function gambarProgres(){
    const lain = daftarOrang().filter(function(o){ return !o.aku; });
    const kenal = lain.filter(function(o){ return statusKenal(o.n) === 'terhubung'; }).length;
    const belum = lain.filter(function(o){ return !statusKenal(o.n); }).length;
    const w = el('bukaKenal');
    w.hidden = !lain.length;
    if(!lain.length) return;
    if(!belum) hanyaBelum = false;
    /* cincin: keliling r=26 ≈ 163.4; bagian hijau = porsi yang sudah kenal */
    const kel = 163.4;
    w.innerHTML =
      '<div class="kn-ring" role="img" aria-label="Sudah kenal ' + kenal + ' dari ' + lain.length + ' anggota">' +
        '<svg viewBox="0 0 60 60" aria-hidden="true"><circle class="jalur" cx="30" cy="30" r="26"/>' +
        '<circle class="isi" cx="30" cy="30" r="26" stroke-dasharray="' + kel + '" stroke-dashoffset="' + (kel * (1 - kenal / lain.length)).toFixed(1) + '"/></svg>' +
        '<span class="kn-ring-in">' + IKON_TERIMA + '<b>' + kenal + '/' + lain.length + '</b></span></div>' +
      '<div class="kn-prog-t"><b>Sudah kenal ' + kenal + ' dari ' + lain.length + ' anggota</b>' +
        '<span>' + (belum ? 'Ajak kenalan supaya bisa diskusi dan kolab bareng soal komunitas.' : 'Semua anggota di sini sudah kamu ajak kenalan.') + '</span></div>' +
      (belum ? '<button type="button" class="chip' + (hanyaBelum ? ' on' : '') + '" id="bukaBelum" aria-pressed="' + hanyaBelum + '">' + svgKenal('belum') + 'Belum kenalan · ' + belum + '</button>' : '');
  }

  function saring(bidang){
    bidangKini = bidang || '';
    const orang = daftarOrang().filter(function(o){
      return !bidang || String(o[sumbuKini] == null ? '' : o[sumbuKini]) === bidang;
    }).filter(function(o){
      return !hanyaBelum || (!o.aku && !statusKenal(o.n));
    });
    const wadah = el('bukaList');
    if(!orang.length){
      wadah.innerHTML = '<p class="buka-kosong">' + (hanyaBelum
        ? (bidang ? 'Semua anggota di kelompok ini sudah kamu ajak kenalan.' : 'Semua anggota di sini sudah kamu ajak kenalan.')
        : 'Belum ada anggota dengan keahlian itu.') + '</p>';
      return;
    }
    wadah.innerHTML = orang.map(function(o, i){
      const av = o.f
        ? '<div class="av photo ' + o.f + '" role="img" aria-label="Foto profil ' + panggilan(o) + ' — gambar AI"></div>'
        : '<div class="av ' + 'abc'[i % 3] + '" aria-hidden="true">' + inisial(o.n) + '</div>';
      return '<div class="m" role="button" tabindex="0" data-nm="' + o.n + '">' + av +
        '<div>' + (o.id ? '<div class="mem-id">' + o.id + '</div>' : '') +
        '<div class="nm-baris"><div class="nm">' + panggilan(o) + '</div>' +
        (founder ? '<span class="nm-full">' + (o.full || o.n) + '</span>' : '') +
        (o.aku ? '<span class="aku">Kamu</span>' : '') + '</div>' +
        '<div class="tags"><span class="tag hi">' + o.k + '</span>' +
        '<span class="tag">' + o.d + '</span>' +
        (o.a && !(o.j || []).length ? '<span class="tag">Angkatan ' + o.a + '</span>' : '') +
        (o.j || []).map(function(v){ return '<span class="tag">' + v + '</span>'; }).join('') +
        '</div></div>' + ikonKenal(o) + '</div>';
    }).join('');
    if(!bidang && !hanyaBelum && kini && orang.length < angkaKini()){
      wadah.insertAdjacentHTML('beforeend',
        '<p class="buka-kosong">Menampilkan ' + orang.length + ' dari ' + angkaKini() +
        ' anggota — sisanya belum dibuat di prototipe.</p>');
    }
  }

  /* chip disusun dari baris yang benar-benar ada, bukan dari agregat —
     chip dari agregat bisa menyaring jadi kosong dan itu terbaca sebagai rusak */
  function gambarNilai(orang){
    const nilai = [];
    orang.forEach(function(o){
      const v = o[sumbuKini];
      if(v == null || v === '') return;
      if(nilai.indexOf(String(v)) < 0) nilai.push(String(v));
    });
    if(sumbuKini === 'a') nilai.sort(function(a, b){ return b - a; });
    el('bukaFilter').innerHTML =
      '<span class="chip on" data-saring="">Semua</span>' +
      nilai.map(function(v){
        return '<span class="chip" data-saring="' + v + '">' + v + '</span>';
      }).join('');
    saring('');
  }

  /* Nama komunitas dibaca dari kartunya di direktori, bukan disalin ke sini —
     satu sumber, supaya tidak ada dua nama yang bisa berselisih. */
  function namaKelas(kelas){
    const logo = document.querySelector('#direktori .ccard .logo-sq.' + kelas);
    const kartu = logo && logo.closest('.ccard');
    return kartu ? kartu.querySelector('h3').textContent.trim() : kelas;
  }

  function komunitasOrang(nama){
    const hasil = [];
    Object.keys(DATA).forEach(function(kelas){
      const d = DATA[kelas];
      const peng = (d.pengurus || []).filter(function(p){ return p.n === nama; })[0];
      const ang = (d.anggota || []).filter(function(p){ return p.n === nama; })[0];
      if(!peng && !ang) return;
      hasil.push({ kelas: kelas, peran: peng ? peng.j : 'Anggota' });
    });
    return hasil;
  }

  /* ---------- kenalan ----------
     Persetujuan dua arah: satu minta, satu menerima, baru nomornya kebuka.
     Ini yang membedakan halaman anggota Kolavo dari daftar kontak — di WAG
     nomor semua orang otomatis kelihatan, di sini orangnya yang memutuskan. */
  function statusKenal(nama){
    return ((window.KolavoApp || {}).kenalan || {})[nama];
  }
  /* tiga keadaan untuk tampilan: tanpa nilai berarti belum pernah diajak */
  window.KolavoStatusKenal = function(nama){ return statusKenal(nama) || 'belum'; };

  function gambarKenal(nama, o){
    const wadah = el('agKenal');
    /* tidak ada tombol kenalan di profil sendiri */
    if(o.aku){ wadah.hidden = true; return; }
    wadah.hidden = false;

    const st = statusKenal(nama);
    const panggil = nama.split(' ')[0];

    if(st === 'terhubung'){
      wadah.className = 'ag-kenal buka';
      wadah.innerHTML =
        '<p class="ag-kenal-h"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.4 2.4 2.4 4.6-5"/></svg>Kalian sudah kenalan</p>' +
        '<p class="ag-kenal-s">' + panggil + ' menerima ajakanmu, jadi nomornya kebuka buat kamu — dan nomormu kebuka buat dia.</p>' +
        '<div class="ag-wa"><span class="ag-wa-n">' + (o.wa || '—') + '</span>' +
        '<button type="button" class="btn sm" id="agKenalChat">Chat di WhatsApp</button></div>';
      return;
    }

    if(st === 'menunggu'){
      wadah.className = 'ag-kenal';
      wadah.innerHTML =
        '<p class="ag-kenal-h"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Ajakan kenalan terkirim</p>' +
        '<p class="ag-kenal-s">Nomornya kebuka begitu ' + panggil + ' menerima. Sampai itu terjadi, dia cuma tahu kamu ingin kenalan.</p>' +
        '<button type="button" class="btn outline sm" id="agKenalBatal">Batalkan ajakan</button>';
      return;
    }

    wadah.className = 'ag-kenal';
    wadah.innerHTML =
      '<p class="ag-kenal-h"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>Nomor WhatsApp belum kebuka</p>' +
      '<p class="ag-kenal-s">Sesama anggota tidak otomatis saling pegang nomor. Ajak ' + panggil + ' kenalan — kalau dia setuju, nomor kalian kebuka dua-duanya.</p>' +
      '<button type="button" class="btn sm" id="agKenalMinta">Ajak kenalan</button>';
  }

  /* dipakai langkah Kenalan di onboarding: ajak tanpa membuka profil dulu */
  window.KolavoAjakKenalan = function(nama){
    const App = window.KolavoApp || {};
    App.kenalan = App.kenalan || {};
    if(App.kenalan[nama]) return;
    App.kenalan[nama] = 'menunggu';
    tandaiDemo();
    if(window.KolavoToast) window.KolavoToast('Ajakan kenalan dikirim ke ' + nama.split(' ')[0] + '.');
  };

  window.KolavoTerimaKenalan = function(){
    const App = window.KolavoApp || {};
    const kn = App.kenalan || {};
    const nama = Object.keys(kn).filter(function(n){ return kn[n] === 'menunggu'; })[0];
    if(!nama) return;
    kn[nama] = 'terhubung';
    tandaiDemo();
    if(window.KolavoNotifTambah) window.KolavoNotifTambah({ jenis: 'kenalan', judul: nama.split(' ')[0] + ' menerima ajakan kenalanmu', teks: 'Nomor WhatsApp kalian sekarang saling terbuka.', anggota: nama });
    if(el('agNm').dataset.nm === nama) gambarAnggota(nama);
    segarKenal();
    if(window.KolavoToast) window.KolavoToast(nama.split(' ')[0] + ' menerima ajakan kenalanmu. Nomornya kebuka.');
  };

  /* Keanggotaan pengguna sendiri tidak ada di DATA — dia bukan bagian dari data
     contoh, keanggotaannya tumbuh saat prototipe dipakai. Jadi dibaca dari
     App.diajukan, dan yang masih menunggu ikut ditampilkan apa adanya. */
  function komunitasAku(){
    const d = (window.KolavoApp || {}).diajukan || {};
    return Object.keys(d).map(function(kelas){
      return { kelas: kelas, peran: d[kelas] === 'anggota' ? 'Anggota' : 'Menunggu persetujuan' };
    });
  }

  function gambarAnggota(nama){
    const dasar = daftarOrang().filter(function(p){ return p.n === nama; })[0];
    if(!dasar) return false;
    /* baris sendiri tidak diambilkan dari ORANG — apa yang tampil harus persis
       yang diisi penggunanya, termasuk kalau isiannya masih tipis */
    const o = dasar.aku ? dasar : Object.assign({}, ORANG[nama] || {}, KONTAK[nama] || {}, dasar);

    const foto = el('agFoto');
    foto.className = 'ag-foto' + (o.f ? ' ' + o.f : ' ini ' + 'abc'[nama.length % 3]);
    foto.textContent = o.f ? '' : inisial(nama);
    foto.setAttribute('aria-label', 'Foto profil ' + panggilan(o) + (o.f ? ' — gambar AI' : ''));

    /* sesama anggota melihat nama panggilan; nama lengkap cuma untuk pengurus */
    el('agNm').textContent = panggilan(o);
    /* judul berisi panggilan; kunci orangnya (nama di data) disimpan di sini untuk tombol kenalan */
    el('agNm').dataset.nm = nama;
    el('agJalurNm').textContent = panggilan(o);
    el('agBalik').textContent = kini ? kini.nama : 'Komunitas';
    /* nomor anggota kecil di atas nama — kelihatan sesama anggota kalau ada */
    const agId = el('agId');
    if(agId){ agId.textContent = o.id || ''; agId.hidden = !o.id; }
    /* baris teratas setelah nama: apa yang dia kerjakan sekarang. Di kolavo.app
       tempat ini diisi nomor WhatsApp dan nama lengkap — keduanya keterangan
       administratif, bukan alasan orang membuka profil sesama anggota. */
    el('agKerja').textContent = o.p || o.k || '';

    const full = el('agFull');
    full.textContent = founder ? 'Nama lengkap: ' + (o.full || nama) : '';
    full.hidden = !founder;

    /* domisili pindah dari tag ke baris meta — mengikuti kolavo.app, yang
       menaruh kota sebagai baris tersendiri dan menyisakan tag untuk jawaban
       pertanyaan pengurus. Sebelumnya domisili tampil dua kali. */
    el('agTags').innerHTML =
      '<span class="tag hi">' + o.k + '</span>' +
      (o.a && !(o.j || []).length ? '<span class="tag">Angkatan ' + o.a + '</span>' : '') +
      (o.j || []).map(function(v){ return '<span class="tag">' + v + '</span>'; }).join('');

    const sejak = o.aku ? 'Baru bergabung' : (o.s ? 'Anggota sejak ' + o.s : '');
    el('agMeta').innerHTML =
      '<span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11Z"/><circle cx="12" cy="10" r="2.6"/></svg>' + o.d + ' \uD83C\uDDEE\uD83C\uDDE9</span>' +
      (sejak ? '<span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2.5"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>' + sejak + '</span>' : '');

    gambarKenal(nama, o);

    const bio = el('agBio');
    bio.textContent = o.bio || '';
    bio.hidden = !o.bio;

    /* Di profil orang lain komunitas yang sedang dibuka disembunyikan — sudah
       jelas dia anggota di sini, itu sebabnya kamu melihatnya dari daftar ini.
       Di profil sendiri justru semuanya ditampilkan: yang dicari "aku ada di
       mana saja", bukan "selain di sini dia di mana". */
    const lain = o.aku
      ? komunitasAku()
      : komunitasOrang(nama).filter(function(k){ return !kini || k.kelas !== kini.kelas; });
    el('agKomH').textContent = o.aku ? 'Komunitas saya' : 'Juga di komunitas';
    el('agKomSub').textContent = o.aku
      ? 'Semua komunitas yang kamu ikuti.'
      : 'Tempat lain yang dia ikuti — mungkin kamu juga ada di situ.';
    el('agKomSec').hidden = !lain.length;
    el('agKom').innerHTML = lain.map(function(k){
      return '<div class="pf-item"><span class="logo-sq ' + k.kelas + '" role="img" aria-label="Logo komunitas"></span>' +
             '<div class="t"><div class="n">' + namaKelas(k.kelas) + '</div>' +
             '<div class="s">' + k.peran + '</div></div></div>';
    }).join('');
    return true;
  }

  window.KolavoBukaAnggota = function(nama){
    if(gambarAnggota(nama)) window.KolavoKe('scrAnggota');
  };

  function gambarDaftar(terbuka){
    el('komKunci').hidden = terbuka;
    el('komBuka').hidden = !terbuka;
    /* bagian Pengurus baru muncul setelah diterima jadi anggota */
    el('komPengSec').hidden = !terbuka;
    el('komKunciSub').textContent = terbuka
      ? 'Kebuka karena kamu anggota di sini. Dari luar, halaman ini tetap tertutup.'
      : 'Kebuka setelah pengurus menyetujui pendaftaranmu.';
    /* peninjauannya sudah lewat begitu diterima — kalimatnya ikut pindah
       dari "yang akan menilai kamu" ke "yang mengurus tempat ini" */
    el('komPengSub').textContent = terbuka
      ? 'Mereka yang mengurus komunitas ini.'
      : 'Mereka yang akan meninjau pendaftaranmu.';
    if(!terbuka) return;

    const orang = daftarOrang();
    el('bukaJml').textContent = angkaKini() + ' anggota';
    gambarProgres();

    const sumbu = sumbuDaftar();
    if(!sumbu.some(function(s){ return s.id === sumbuKini; })) sumbuKini = 'k';
    el('bukaSumbu').innerHTML = '<span class="buka-lbl">Lihat berdasarkan</span>' +
      sumbu.map(function(s){
        return '<span class="chip' + (s.id === sumbuKini ? ' on' : '') + '" data-sumbu="' + s.id + '">' + s.nama + '</span>';
      }).join('');

    gambarNilai(orang);
  }

  /* Tombol "Setujui pendaftaran" di bilah demo memerankan pengurus — di produk
     keputusan ini datang dari orang lain, jadi tidak ada padanannya di layar
     pengguna. Ditaruh di bilah demo supaya jelas itu alat prototipe. */
  function tandaiDemo(){
    const b = document.getElementById('demoSetuju');
    if(b){
      const d = (window.KolavoApp || {}).diajukan || {};
      b.hidden = !Object.keys(d).some(function(k){ return d[k] === 'menunggu'; });
    }
    const k = document.getElementById('demoKenal');
    if(k){
      const kn = (window.KolavoApp || {}).kenalan || {};
      k.hidden = !Object.keys(kn).some(function(n){ return kn[n] === 'menunggu'; });
    }
  }

  window.KolavoSetujui = function(){
    const App = window.KolavoApp || {};
    const d = App.diajukan || {};
    const kelas = Object.keys(d).filter(function(k){ return d[k] === 'menunggu'; })[0];
    if(!kelas) return;
    d[kelas] = 'anggota';
    tandaiDemo();
    /* sambutan otomatis di feed — KolavoFeedTambah sendiri menolak komunitas Esensial */
    if(window.KolavoFeedTambah){
      const s = aku();
      window.KolavoFeedTambah(kelas, { jenis: 'sambutan', anggota: s.n, kerja: s.k, kota: s.d, f: s.f, aku: true });
    }

    const nama = (kini && kini.kelas === kelas) ? kini.nama
               : ((App.komunitas && App.komunitas.nama) || 'komunitas itu');
    /* daftar komunitas di layar profil membaca angka ini — kalau tidak ikut
       diperbarui, profilnya bilang 22 sementara halaman komunitasnya 23 */
    if(kini && kini.kelas === kelas && App.komunitas && App.komunitas.kelas === kelas){
      App.komunitas.jumlah = angkaKini() + ' anggota';
    }
    if(kini && kini.kelas === kelas) gambar();
    if(window.KolavoIsiProfil) window.KolavoIsiProfil();
    if(window.KolavoToast) window.KolavoToast('Pengurus ' + nama + ' menyetujui pendaftaranmu.');
    if(window.KolavoNotifTambah){
      const logo = document.querySelector('#direktori .ccard .logo-sq.' + kelas);
      const premium = !!(logo && logo.closest('.ccard').dataset.premium === '1');
      window.KolavoNotifTambah({ jenis: 'diterima', kelas: kelas, judul: 'Pendaftaranmu diterima di ' + nama,
        teks: premium ? 'Buka halamannya untuk perkenalan singkat dari pengurus.' : 'Sekarang kamu bisa melihat daftar anggota dan berkenalan.' });
    }
    if(kini && kini.kelas === kelas && !document.getElementById('scrKomunitas').hidden){
      el('komBuka').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  };

  /* ---------- info komunitas (paket Advance) ----------
     Esensial tidak punya panel ini sama sekali — kecuali pemiliknya sendiri,
     yang melihat satu kartu ajakan kecil. Advance: pengumuman + tiga tautan,
     masing-masing hanya kalau diisi. Grup WhatsApp dan dokumen hanya terbuka
     untuk anggota, sejalan dengan daftar anggota; peraturan terbuka untuk
     siapa pun karena calon anggota perlu membacanya sebelum mendaftar. */
  const INFO = {
    'l-forpastara': {
      pengumuman: 'Penerimaan anggota baru ditinjau setiap hari Senin. Pendaftaran yang masuk di akhir pekan diproses Senin berikutnya.',
      wa: 'https://chat.whatsapp.com/contoh-forpastara',
      peraturan: 'https://kolavo.app/k/forpastara/peraturan.pdf',
      dokumen: 'https://drive.google.com/contoh-forpastara'
    },
    'l-iasman52': {
      pengumuman: 'Reuni akbar 25 tahun: daftar ulang dibuka sampai akhir bulan ini. Detail acara ada di grup WhatsApp.',
      wa: 'https://chat.whatsapp.com/contoh-iasman52',
      peraturan: 'https://kolavo.app/k/iasman52/peraturan.pdf',
      dokumen: ''
    }
  };
  function svgI(isi){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + isi + '</svg>';
  }
  const IK_INFO = {
    toa:    svgI('<path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>'),
    wa:     svgI('<path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.5-4.1A8 8 0 1 1 20 11.5Z"/><path d="M9 9.5c.3 1.9 1.6 3.3 3.5 4l1-1 2 .8-.3 1.2c-3.1.1-6.4-2.8-6.7-6l1.2-.3.8 2Z"/>'),
    unduh:  svgI('<path d="M12 4v11M7 10l5 5 5-5M4 20h16"/>'),
    dok:    svgI('<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>'),
    gembok: svgI('<rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>'),
    advance:svgI('<path d="M3 21h18M5 21V8l7-5 7 5v13M9 21v-6h6v6"/>')
  };
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function isiInfo(i){ return !!(i && (i.pengumuman || i.wa || i.peraturan || i.dokumen)); }
  function anggotaKini(){ return founder || (window.KolavoApp.diajukan || {})[kini.kelas] === 'anggota'; }

  function gambarInfo(){
    const w = el('komInfo');
    const kosongkan = function(){ w.hidden = true; w.innerHTML = ''; };
    if(pratinjau) return kosongkan();
    const info = kini.info || {};
    if(!kini.premium){
      if(!founder) return kosongkan();
      w.hidden = false;
      w.innerHTML = '<div class="kom-info-ajak">' + IK_INFO.advance +
        '<div class="t"><strong>Tambahkan pengumuman, peraturan, dan tautan grup WA dengan paket Advance</strong>' +
        '<p>Cuma kamu yang melihat kartu ini — pengunjung dan anggota tidak.</p></div>' +
        '<button type="button" class="btn outline xs" data-info-advance>Lihat Advance</button></div>';
      return;
    }
    if(!isiInfo(info)){
      if(!founder) return kosongkan();
      w.hidden = false;
      w.innerHTML = '<div class="kom-info-ajak">' + IK_INFO.toa +
        '<div class="t"><strong>Info komunitas masih kosong</strong>' +
        '<p>Pengumuman dan tautan grup, peraturan, dan dokumen tampil di sini setelah diisi.</p></div>' +
        '<button type="button" class="btn outline xs" data-info-advance>Isi di dashboard</button></div>';
      return;
    }
    const boleh = anggotaKini();
    const tautan = [
      ['wa', 'Grup WhatsApp', info.wa, true, IK_INFO.wa, 'Buka grup'],
      ['peraturan', 'Peraturan komunitas', info.peraturan, false, IK_INFO.unduh, 'Unduh berkas'],
      ['dokumen', 'Dokumen komunitas', info.dokumen, true, IK_INFO.dok, 'Buka dokumen']
    ].filter(function(t){ return t[2]; });
    w.hidden = false;
    w.innerHTML =
      (info.pengumuman ? '<div class="kom-umum" role="note"><span class="kom-umum-ic">' + IK_INFO.toa + '</span>' +
        '<div><p class="kom-umum-h">Pengumuman pengurus</p><p class="kom-umum-t">' + esc(info.pengumuman) + '</p></div></div>' : '') +
      (boleh && !founder && window.KolavoAdaOnboarding && window.KolavoAdaOnboarding()
        ? '<button type="button" class="kom-ob-lagi" data-ob-lagi>Buka lagi perkenalan komunitas</button>' : '') +
      (tautan.length ? '<div class="kom-tautan">' + tautan.map(function(t){
        const kunci = t[3] && !boleh;
        return '<button type="button" class="kom-tautan-i" data-info-buka="' + t[0] + '"' + (kunci ? ' data-kunci' : '') + '>' +
          '<span class="kom-tautan-ic">' + (kunci ? IK_INFO.gembok : t[4]) + '</span>' +
          '<span class="t"><b>' + t[1] + '</b><small>' + (kunci ? 'Kebuka setelah kamu jadi anggota' : t[5]) + '</small></span></button>';
      }).join('') + '</div>' : '');
  }

  /* ---------- bagikan tautan: pengunjung, anggota, dan pengurus, semua paket ---------- */
  function alamatKini(){
    const slug = founder ? (((window.KolavoApp || {}).dibuat || {}).slug || '') : String(kini.kelas || '').replace(/^l-/, '');
    return 'https://kolavo.app/k/' + (slug || 'komunitas');
  }
  function bagikan(){
    const url = alamatKini(), pendek = url.replace(/^https:\/\//, '');
    const toast = function(t){ if(window.KolavoToast) window.KolavoToast(t); };
    const salin = function(){
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(url).then(function(){ toast('Tautan disalin: ' + pendek); }, function(){ toast('Tautan komunitas: ' + pendek); });
      } else toast('Tautan komunitas: ' + pendek);
    };
    if(navigator.share){
      navigator.share({ title: kini.nama, text: 'Gabung ke ' + kini.nama + ' di Kolavo', url: url })
        .catch(function(err){ if(!err || err.name !== 'AbortError') salin(); });
    } else salin();
  }

  /* nama yang tampil ke sesama anggota: nama panggilan. Nama lengkap hanya di
     tampilan pengurus (halaman pemilik), karena termasuk data pribadi. */
  function panggilan(o){ return o.pg || String(o.n || '').split(' ')[0]; }

  /* tombol ikon bulat di samping aksi utama: Edit data pendaftaran (anggota) dan
     Bagikan tautan (semua). Label ada di aria-label + tooltip data-tip. */
  function tombolIkon(ikon, label, attr){
    return '<button type="button" class="btn-ikon" ' + attr + ' aria-label="' + label + '" data-tip="' + label + '">' + window.KolavoIkon(ikon) + '</button>';
  }
  function gambarAksi(){
    isiAksi();
    if(pratinjau) return;
    const w = el('komAksi'), utama = w.firstElementChild;
    const baris = document.createElement('div');
    baris.className = 'kom-aksi-baris';
    w.insertBefore(baris, utama);
    baris.appendChild(utama);
    const anggota = !founder && (window.KolavoApp.diajukan || {})[kini.kelas] === 'anggota';
    baris.insertAdjacentHTML('beforeend',
      (anggota ? tombolIkon('pensil', 'Edit data pendaftaran', 'id="komEdit"') : '') +
      tombolIkon('bagikan', 'Bagikan tautan', 'data-kom-bagikan'));
  }
  function isiAksi(){
    const wadah = el('komAksi');
    wadah.innerHTML = '';

    /* halaman pemilik: bukan tombol Gabung, tapi pintu ke dashboard pengurus */
    if(founder){
      const jab = (window.KolavoDashboard && window.KolavoDashboard.jabatanAku && window.KolavoDashboard.jabatanAku()) || 'Pengurus';
      wadah.innerHTML =
        '<p class="kom-status pengurus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v5c0 4.5 3.4 8 8 10 4.6-2 8-5.5 8-10V6l-8-3Z"/></svg>Kamu ' + jab + ' di sini</p>' +
        '<button type="button" class="btn" data-dashboard>Dashboard pengurus</button>';
      return;
    }

    const status = (window.KolavoApp.diajukan || {})[kini.kelas];

    if(status === 'anggota'){
      wadah.innerHTML =
        '<p class="kom-status anggota"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.4 2.4 2.4 4.6-5"/></svg>Kamu anggota di sini</p>';
      return;
    }

    if(status === 'menunggu'){
      wadah.innerHTML =
        '<p class="kom-status tunggu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Menunggu persetujuan</p>' +
        '<p class="catat">Pengurus akan meninjau pendaftaranmu.</p>';
      return;
    }
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn lead';
    b.id = 'komGabungBtn';
    b.textContent = 'Gabung';
    wadah.appendChild(b);
    const c = document.createElement('p');
    c.className = 'catat';
    c.textContent = 'Pengurus yang memutuskan diterima atau tidak.';
    wadah.appendChild(c);
  }

  /* ---------- pop up profil pengurus ----------
     Klik kartu pengurus → foto/inisial, jabatan, perkenalan singkat. Perkenalan
     ditulis pengurusnya di dashboard → Struktur Kepengurusan (field `kenal`). */
  let pengKini = [];
  const pengModal = el('pengModal');
  function avPeng(p, i){
    return p.f
      ? '<span class="av photo ' + p.f + '" role="img" aria-label="Foto profil ' + esc(p.n) + ' — gambar AI"></span>'
      : '<span class="av ' + 'abc'[i % 3] + '" aria-hidden="true">' + inisial(p.n) + '</span>';
  }
  function bukaPengurus(i){
    const p = pengKini[i]; if(!p) return;
    el('pengIsi').innerHTML = '<div class="peng-pp">' + avPeng(p, i) + '</div>' +
      '<h2 class="peng-pp-nm" id="pengHead">' + esc(p.n) + '</h2>' +
      '<p class="peng-pp-j">' + esc(p.j) + (kini ? ' · ' + esc(kini.nama) : '') + '</p>' +
      '<div class="peng-pp-kenal"><span class="peng-pp-lbl">Perkenalan singkat</span>' +
        (p.kenal ? '<p>' + esc(p.kenal) + '</p>' : '<p class="peng-pp-kosong">Belum ada perkenalan.</p>') + '</div>';
    pengModal.hidden = false;
    void pengModal.offsetWidth;
    pengModal.classList.add('on');
    document.body.classList.add('lgn-open');
    const x = pengModal.querySelector('.lgn-x'); if(x) x.focus();
  }
  function tutupPengurus(){
    pengModal.classList.remove('on');
    document.body.classList.remove('lgn-open');
    setTimeout(function(){ if(!pengModal.classList.contains('on')) pengModal.hidden = true; }, 170);
  }
  pengModal.addEventListener('click', function(e){ if(e.target.closest('[data-peng-tutup]')) tutupPengurus(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && !pengModal.hidden) tutupPengurus(); });
  el('komPengurus').addEventListener('click', function(e){
    const b = e.target.closest('[data-peng]'); if(b) bukaPengurus(+b.dataset.peng);
  });

  function gambar(){
    if(!kini) return;
    el('komJalurNm').textContent = kini.nama;
    el('komNm').textContent = kini.nama;
    if(kini.premium) el('komNm').insertAdjacentHTML('beforeend', ' <span class="verif" title="Komunitas premium terverifikasi" aria-label="Terverifikasi"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="var(--blue)" d="M23 12l-2.44-2.79.34-3.69-3.61-.82-1.89-3.2L12 2.96 8.6 1.5 6.71 4.69 3.1 5.5l.34 3.7L1 12l2.44 2.79-.34 3.7 3.61.82L8.6 22.5l3.4-1.47 3.4 1.46 1.89-3.19 3.61-.82-.34-3.69L23 12z"/><path fill="#fff" d="M9.38 16.01L7 13.61c-.39-.39-.39-1.02 0-1.41.39-.39 1.03-.39 1.42 0l1.68 1.68 4.6-4.6c.39-.39 1.03-.39 1.42 0 .39.39.39 1.02 0 1.41l-5.32 5.32c-.38.39-1.02.39-1.42 0z"/></svg></span>');
    el('komAlias').textContent = kini.alias || '';
    el('komAlias').hidden = !kini.alias;
    el('komDesc').textContent = kini.desc;
    const logo = el('komLogo');
    if(founder || pratinjau){
      logo.className = 'kom-logo logo-sq baru';
      logo.style.backgroundImage = kini.logo ? 'url("' + kini.logo + '")' : '';
      logo.textContent = kini.logo ? '' : (kini.inisial || '');
    } else {
      logo.className = 'kom-logo logo-sq ' + kini.kelas;
      logo.style.backgroundImage = '';
      logo.textContent = '';
    }

    el('komMeta').innerHTML = '';
    /* jumlahnya dihitung, bukan diambil apa adanya dari kartu — begitu
       penggunanya diterima, kepala halaman dan angka besar harus sama */
    [kini.bentuk, kini.lokasi, angkaKini() + ' anggota'].forEach(function(v, i){
      if(i){ const t = document.createElement('span'); t.className = 'titik'; t.textContent = '·'; el('komMeta').appendChild(t); }
      const s = document.createElement('span');
      s.textContent = v;
      el('komMeta').appendChild(s);
    });

    const a = kini.agg;
    el('komStat').innerHTML =
      '<div><span class="n">' + angkaKini() + '</span><span class="k">anggota</span></div>' +
      '<div><span class="n">' + (a ? a.kota.filter(function(k){ return k[0] !== 'Lainnya'; }).length + '+' : '—') + '</span><span class="k">kota</span></div>' +
      '<div><span class="n">' + (a ? a.profesi.filter(function(k){ return k[0] !== 'Lainnya'; }).length + '+' : '—') + '</span><span class="k">bidang pekerjaan</span></div>' +
      '<div><span class="n">' + (a ? a.angkatan : '—') + '</span><span class="k">rentang angkatan</span></div>';

    if(a){
      /* di halaman pemilik agregatnya sudah lengkap dari dashboard — tidak
         perlu menyuntikkan baris "aku" seperti di tampilan calon anggota */
      if(founder || pratinjau){
        bar(a.profesi, el('aggProfesi'), angkaKini());
        bar(a.kota, el('aggKota'), angkaKini());
      } else {
      bar(komposisi(a.profesi, nilaiProfil('kerja')), el('aggProfesi'), angkaKini());
      bar(komposisi(a.kota, nilaiProfil('kota')), el('aggKota'), angkaKini());
      }
      /* Bagas Prakoso dilepas dari daftar pengurus: dia pengguna demonya sendiri,
         dan sebelumnya orang mendaftar ke komunitas yang mencantumkan namanya
         sendiri sebagai Sekretaris. Penggantinya tanpa foto — cuma empat wajah
         hasil AI yang boleh dipakai. */
      pengKini = a.pengurus;
      el('komPengurus').innerHTML = a.pengurus.map(function(p, i){
        return '<button type="button" class="peng-i" data-peng="' + i + '" aria-haspopup="dialog">' + avPeng(p, i) +
               '<div><div class="peng-nm">' + esc(p.n) + '</div><div class="peng-j">' + esc(p.j) + '</div></div></button>';
      }).join('');
    }

    if(founder || pratinjau){
      if(window.KolavoWarnai) window.KolavoWarnai(document.getElementById('scrKomunitas'), kini.warna);
    } else if(window.KolavoTema) window.KolavoTema(kini.kelas);
    el('komKunciT').textContent = angkaKini() + ' anggota di dalam';
    gambarAksi();
    gambarInfo();
    if(window.KolavoGambarFeed) window.KolavoGambarFeed();
    gambarFounder();
    gambarDaftar(founder || (window.KolavoApp.diajukan || {})[kini.kelas] === 'anggota');
    el('komGabung').hidden = true;
    el('komGabungBtn') && (el('komGabung').hidden = true);
    /* anggota baru komunitas Advance: perkenalan bertahap, sekali per komunitas */
    if(!founder && !pratinjau && window.KolavoCekOnboarding) window.KolavoCekOnboarding();
  }

  /* ---------- notifikasi pemilik: siapa yang menunggu disetujui ----------
     Cara termudah tahu ada yang mau gabung: begitu buka halaman komunitasmu,
     angkanya langsung di depan, dengan pintu langsung ke tinjauannya. */
  function gambarFounder(){
    const fb = el('komFounder');
    if(!fb) return;
    if(pratinjau){
      fb.hidden = false;
      fb.className = 'kom-founder ada';
      fb.innerHTML =
        '<div class="kom-founder-t"><span class="kom-founder-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="2.6"/></svg></span>' +
          '<div><strong>Ini contoh tampilan halaman komunitas</strong>' +
          '<p>Begini yang dilihat calon anggota. Komposisi anggota di sini cuma misal — halaman komunitas beneran mulai dari kosong.</p></div></div>' +
        '<div class="kom-founder-aksi"><button type="button" class="btn sm" data-ke="' + pratinjauKembali.ke + '"' +
          (pratinjauKembali.anchor ? ' data-anchor="' + pratinjauKembali.anchor + '"' : '') + '>' + pratinjauKembali.label + '</button></div>';
      return;
    }
    if(!founder){ fb.hidden = true; fb.innerHTML = ''; return; }
    fb.hidden = false;
    const D = window.KolavoDashboard;
    const pend = (D && D.minta) ? D.minta.length : 0;
    fb.className = 'kom-founder' + (pend ? ' ada' : '');
    if(pend){
      fb.innerHTML =
        '<div class="kom-founder-t"><span class="kom-founder-badge">' + pend + '</span>' +
          '<div><strong>' + pend + ' orang menunggu persetujuanmu</strong>' +
          '<p>Tinjau dan setujui di dashboard pengurus.</p></div></div>' +
        '<div class="kom-founder-aksi"><button type="button" class="btn xs" data-dashboard="minta">Tinjau permintaan</button></div>';
    } else {
      fb.innerHTML =
        '<div class="kom-founder-t"><span class="kom-founder-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg></span>' +
          '<div><strong>Semua permintaan sudah kamu tinjau</strong>' +
          '<p>Belum ada permintaan gabung baru. Sebar lagi linknya ke grup.</p></div></div>';
    }
  }

  /* ---------- dipanggil router ---------- */
  window.KolavoBukaKomunitas = function(kartu){
    founder = false; pratinjau = false;   /* dari direktori: tampilan calon anggota */
    kartuAsal = kartu;
    kini = dariKartu(kartu);
    window.KolavoApp.komunitas = {
      nama: kini.nama, kelas: kini.kelas, jumlah: kini.jumlah,
      bentuk: kini.bentuk, tanya: kini.tanya
    };
    gambar();
  };
  window.KolavoKomunitasKini = function(){ return kini; };
  window.KolavoLihatKomunitas = function(kartu){
    window.KolavoBukaKomunitas(kartu);
    window.KolavoKe('scrKomunitas');
  };
  window.KolavoGambarKomunitas = gambar;

  /* ---------- gabung ---------- */
  document.addEventListener('click', function(e){
    if(e.target.closest('[data-kom-bagikan]')){ bagikan(); return; }
    if(e.target.closest('[data-ob-lagi]')){ if(window.KolavoBukaOnboarding) window.KolavoBukaOnboarding(); return; }
    if(e.target.closest('[data-info-advance]')){ if(window.KolavoBukaInfoKomunitas) window.KolavoBukaInfoKomunitas(); return; }
    const infoBuka = e.target.closest('[data-info-buka]');
    if(infoBuka && kini){
      const k = infoBuka.dataset.infoBuka, url = (kini.info || {})[k] || '';
      const toast = function(t){ if(window.KolavoToast) window.KolavoToast(t); };
      if(infoBuka.hasAttribute('data-kunci')){ toast('Grup WhatsApp dan dokumen kebuka setelah pendaftaranmu disetujui pengurus.'); return; }
      toast((k === 'peraturan' ? 'Di produk, berkas peraturan diunduh dari ' : 'Di produk, ini membuka ') + url.replace(/^https?:\/\//, ''));
      return;
    }
    if(e.target.closest('#komGabungBtn')){
      const App = window.KolavoApp || {};

      /* di mode contoh, Gabung cuma pajangan — halamannya belum ada */
      if(pratinjau){
        if(window.KolavoToast) window.KolavoToast('Ini cuma contoh. Buat halamannya dulu supaya orang bisa mendaftar.');
        return;
      }

      /* gerbangnya di sini, bukan di tombol "Lihat": orang boleh melihat
         isi komunitas dulu, baru diminta masuk waktu benar-benar mau gabung */
      if(!App.masuk){
        window.KolavoBukaModal('anggota', kartuAsal, e.target.closest('#komGabungBtn'));
        return;
      }
      if(!App.lengkap){
        if(window.KolavoToast) window.KolavoToast('Lengkapi profilmu dulu supaya pengurus bisa menilai.');
        window.KolavoKe('scrLengkapi');
        return;
      }

      const g = el('komGabung');
      modeSunting = false;
      el('gabungKirim').textContent = 'Kirim permintaan gabung';
      window.KolavoGambarTanya('gabungList');
      g.hidden = false;
      g.scrollIntoView({ behavior: 'smooth', block: 'center' });
      const p = el('gabungH');
      if(p && kini) p.textContent = 'Pertanyaan dari pengurus ' + kini.nama;
      return;
    }
    const sumbu = e.target.closest('#bukaSumbu .chip');
    if(sumbu){
      sumbuKini = sumbu.dataset.sumbu;
      gambarDaftar(true);
      return;
    }
    const baris = e.target.closest('#bukaList .m');
    if(baris && baris.dataset.nm){
      window.KolavoBukaAnggota(baris.dataset.nm);
      return;
    }
    if(e.target.closest('#bukaBelum')){
      hanyaBelum = !hanyaBelum;
      gambarProgres();
      saring(bidangKini);
      return;
    }
    const chip = e.target.closest('#bukaFilter .chip');
    if(chip){
      document.querySelectorAll('#bukaFilter .chip').forEach(function(c){ c.classList.toggle('on', c === chip); });
      saring(chip.dataset.saring || '');
      return;
    }
    if(e.target.closest('#demoSetuju')){
      window.KolavoSetujui();
      return;
    }
    if(e.target.closest('#demoKenal')){
      window.KolavoTerimaKenalan();
      return;
    }
    if(e.target.closest('#agKenalMinta') || e.target.closest('#agKenalBatal')){
      const nama = el('agNm').dataset.nm;
      const App = window.KolavoApp || {};
      App.kenalan = App.kenalan || {};
      const minta = !!e.target.closest('#agKenalMinta');
      if(minta) App.kenalan[nama] = 'menunggu';
      else delete App.kenalan[nama];
      tandaiDemo();
      gambarAnggota(nama);
      segarKenal();
      if(window.KolavoToast){
        window.KolavoToast(minta
          ? 'Ajakan kenalan dikirim ke ' + nama.split(' ')[0] + '.'
          : 'Ajakan kenalan dibatalkan.');
      }
      return;
    }
    if(e.target.closest('#agKenalChat')){
      if(window.KolavoToast) window.KolavoToast('Mode demo — di produk, ini membuka WhatsApp ke nomornya.');
      return;
    }
    if(e.target.closest('#komEdit')){
      const g = el('komGabung');
      modeSunting = true;
      window.KolavoGambarTanya('gabungList');
      pasangJawaban(((window.KolavoApp || {}).jawabanTersimpan || {})[kini.kelas] || {});
      el('gabungKirim').textContent = 'Simpan perubahan';
      el('gabungH').textContent = 'Pertanyaan dari pengurus ' + kini.nama;
      g.hidden = false;
      g.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    if(e.target.closest('#gabungBatal')){
      el('komGabung').hidden = true;
      el('gabungGalat').hidden = true;
      modeSunting = false;
      el('gabungKirim').textContent = 'Kirim permintaan gabung';
      return;
    }
    if(e.target.closest('#gabungKirim')){
      let kurang = null;
      document.querySelectorAll('#gabungList .f.salah').forEach(function(f){ f.classList.remove('salah'); });
      document.querySelectorAll('#gabungList [data-wajib]').forEach(function(inp){
        if(inp.value.trim()) return;
        const f = inp.closest('.f');
        if(f) f.classList.add('salah');
        if(!kurang) kurang = f;
      });
      if(kurang){
        el('gabungGalat').hidden = false;
        kurang.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      el('gabungGalat').hidden = true;
      window.KolavoApp.jawabanTersimpan = window.KolavoApp.jawabanTersimpan || {};
      window.KolavoApp.jawabanTersimpan[kini.kelas] = jawabanKini();

      if(modeSunting){
        modeSunting = false;
        el('komGabung').hidden = true;
        el('gabungKirim').textContent = 'Kirim permintaan gabung';
        gambar();
        if(window.KolavoIsiProfil) window.KolavoIsiProfil();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        if(window.KolavoToast) window.KolavoToast('Data pendaftaranmu diperbarui.');
        return;
      }

      window.KolavoApp.diajukan = window.KolavoApp.diajukan || {};
      window.KolavoApp.diajukan[kini.kelas] = 'menunggu';
      if(window.KolavoNotifTambah) window.KolavoNotifTambah({ jenis: 'terkirim', judul: 'Permintaan gabung terkirim', teks: 'Pengurus ' + kini.nama + ' akan meninjau pendaftaranmu.', kelas: kini.kelas });
      el('komGabung').hidden = true;
      gambarAksi();
      tandaiDemo();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      if(window.KolavoToast) window.KolavoToast('Permintaan gabung dikirim ke pengurus ' + kini.nama + '.');
    }
  });

  /* barisnya role="button", jadi papan ketik harus bisa membukanya juga */
  document.addEventListener('keydown', function(e){
    if(e.key !== 'Enter' && e.key !== ' ') return;
    const baris = e.target.closest && e.target.closest('#bukaList .m');
    if(!baris || !baris.dataset.nm) return;
    e.preventDefault();
    window.KolavoBukaAnggota(baris.dataset.nm);
  });

  /* galat per kolom hilang begitu diisi */
  ['input','change'].forEach(function(ev){
    document.addEventListener(ev, function(e){
      const f = e.target.closest('#gabungList .f.salah');
      if(f) f.classList.remove('salah');
    });
  });

  /* pemicu dari layar profil: kartu komunitas yang dibuat sendiri membuka
     halaman komunitas versi pemilik, bukan langsung dashboard */
  document.addEventListener('click', function(e){
    if(e.target.closest('[data-komunitas-dibuat]')){ e.preventDefault(); window.KolavoBukaKomunitasDibuat(); return; }
    /* "Lihat contoh halaman" di beranda: contoh siap-pakai, kembali ke beranda */
    if(e.target.closest('[data-contoh]')){
      e.preventDefault();
      window.KolavoPratinjau(CONTOH_KOM, { ke: 'scrBeranda', anchor: 'pengurus', label: 'Tutup contoh' });
    }
  });
  document.addEventListener('keydown', function(e){
    if((e.key === 'Enter' || e.key === ' ') && e.target.closest && e.target.closest('[data-komunitas-dibuat]')){
      e.preventDefault(); window.KolavoBukaKomunitasDibuat();
    }
  });
})();
</script>
