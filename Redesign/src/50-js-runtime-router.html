<script>
/* ============================================================
   Prototipe berjalan: keadaan + router + sambungan antar layar.
   Sengaja tanpa penyimpanan — muat ulang mengulang alur dari awal,
   supaya siapa pun yang membuka tautannya melihat cerita yang sama.
   ============================================================ */
(function(){
  const App = {
    masuk: false,       /* sudah lewat modal Google? */
    mode: 'landing',    /* 'landing' (halaman jualan, scrBeranda) | 'app' (semua layar lain) */
    lengkap: false,     /* profil sudah diisi? */
    niat: null,         /* 'anggota' | 'pengurus' | 'nav' — pemicu yang membawa ke sini */
    komunitas: null     /* {nama, kelas, jumlah} — kartu yang tadi diklik */
  };
  window.KolavoApp = App;

  /* ---------- router ----------
     Layar disimpan di variabel, bukan di location.hash. Prototipe ini juga
     dibuka dari data: URL dan iframe ber-sandbox, tempat hash tidak selalu
     bisa ditulis — di sana routing berbasis hash diam-diam tidak jalan.
     Anchor dalam halaman (#direktori, #pengurus) tetap seperti biasa. */
  const LAYAR = ['scrBeranda', 'scrMasuk', 'scrHome', 'scrKenalan', 'scrApp', 'scrDasbor', 'scrLengkapi', 'scrProfil', 'scrKomunitas', 'scrAnggota', 'scrBuat', 'scrKelola'];
  /* Dua pintu (PROMPT-APP): scrBeranda = landing jualan; layar lain = Kolavo App.
     Tab app: Komunitas (scrApp) · Profil · Dashboard (scrDasbor). Layar terlindung
     tanpa akun → scrMasuk + App.tujuan. Halaman komunitas sendiri tetap tanpa
     penjaga (bisa dilihat sebelum Gabung), tapi pintunya kini lewat tautan/QR
     undangan (KolavoBukaTautan) yang meminta masuk dulu. */
  /* detail anggota cuma bisa dicapai dari daftar yang sudah terbuka, tapi
     penjaganya tetap dipasang supaya tidak bisa dibuka lewat KolavoKe langsung */
  const perluMasuk = { scrHome: true, scrKenalan: true, scrApp: true, scrDasbor: true, scrLengkapi: true, scrProfil: true, scrAnggota: true, scrBuat: true, scrKelola: true };
  let sekarang = 'scrBeranda';

  window.KolavoKe = function(id, anchor){ ke(id, anchor); };

  function ke(id, anchor){
    sekarang = id;
    gambar();
    if(anchor){
      const a = document.getElementById(anchor);
      if(a) a.scrollIntoView({ behavior: 'smooth' });
    }
  }

  function gambar(){
    let id = sekarang;
    /* penjaga: layar yang butuh akun tidak bisa dibuka sebelum masuk */
    /* sudah masuk: halaman masuk tidak relevan lagi, teruskan ke tujuannya */
    if(id === 'scrMasuk' && App.masuk){ id = App.tujuan || 'scrHome'; App.tujuan = null; }
    /* belum masuk: layar terlindung diganti halaman masuk penuh (bukan modal),
       tujuannya diingat supaya sesudah masuk langsung ke sana */
    if(perluMasuk[id] && !App.masuk){ App.tujuan = id; id = 'scrMasuk'; }
    /* buat halaman juga menunggu profil beres — calon anggota perlu lihat
       pengurusnya orang asli, bukan akun kosong */
    if((id === 'scrProfil' || id === 'scrBuat') && !App.lengkap) id = 'scrLengkapi';
    /* dashboard pengurus baru ada setelah komunitasnya dibuat */
    /* ...atau komunitas orang lain yang mengangkatmu sedang dibuka di dashboard */
    const D = window.KolavoDashboard;
    if(id === 'scrKelola' && !App.dibuat && !(D && D.built && D.kom && D.kom.diangkat && App.diangkat)) id = 'scrDasbor';
    sekarang = id;
    /* dua pintu: landing untuk jualan ke pengurus, app untuk yang sudah punya akun.
       Nav & footer membaca kelas body ini, bukan memeriksa layar satu per satu. */
    App.mode = id === 'scrBeranda' ? 'landing' : 'app';
    document.body.classList.toggle('m-app', App.mode === 'app');
    /* halaman masuk berdiri sendiri, tanpa nav */
    document.body.classList.toggle('m-masuk', id === 'scrMasuk');
    document.body.dataset.layar = id;
    tabNav(id);
    if(id === 'scrMasuk' && window.KolavoIsiMasuk){
      window.KolavoIsiMasuk(App.undangan ? 'undangan' : (App.niatMasuk || 'nav'), App.undangan || null);
    }

    LAYAR.forEach(function(n){
      const el = document.getElementById(n);
      if(el) el.hidden = (n !== id);
    });
    window.scrollTo(0, 0);
    if(id === 'scrProfil') isiProfil();
    if(id === 'scrKenalan' && window.KolavoGambarKenalan) window.KolavoGambarKenalan();
    /* remah halaman komunitas: pengunjung (dari etalase landing) kembali ke landing,
       pengguna yang sudah masuk kembali ke tab Komunitas */
    if(id === 'scrKomunitas'){
      /* profil publik (pengunjung belum masuk): Kabar & Daftar anggota disembunyikan */
      document.getElementById('scrKomunitas').toggleAttribute('data-publik', !App.masuk);
      const j = document.querySelector('#scrKomunitas .kom-jalur button');
      if(j){
        j.textContent = App.masuk ? 'Komunitas' : 'Beranda';
        j.dataset.ke = App.masuk ? 'scrApp' : 'scrBeranda';
        j.dataset.anchor = App.masuk ? 'direktori' : 'etalase';
      }
    }
    if((id === 'scrBeranda' || id === 'scrHome' || id === 'scrApp' || id === 'scrDasbor') && window.KolavoGambarApp) window.KolavoGambarApp(id);
  }

  /* ---------- tab nav Kolavo App (A3) ----------
     Tab aktif mengikuti layar, bukan klik terakhir: layar yang dibuka lewat
     tautan lain (kartu, notifikasi) tetap menyalakan tab induknya. */
  /* Profil & Lengkapi dibuka dari avatar — tidak menyalakan tab mana pun (PROMPT-HOME H1) */
  const TAB = { scrHome: 'home', scrKenalan: 'home', scrApp: 'komunitas', scrKomunitas: 'komunitas', scrAnggota: 'komunitas',
                scrDasbor: 'dashboard', scrKelola: 'dashboard', scrBuat: 'dashboard' };
  function tabNav(id){
    const ada = App.mode === 'app' && App.masuk && id !== 'scrMasuk';
    document.body.classList.toggle('m-tab', ada);
    const tab = document.getElementById('navTab');
    if(tab) tab.hidden = !ada;
    const kredit = document.getElementById('navKredit');
    if(kredit) kredit.hidden = !ada;
    document.querySelectorAll('#navTab .nt').forEach(function(t){
      const on = ada && t.dataset.tab === TAB[id];
      t.classList.toggle('on', on);
      if(on) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
    });
  }

  /* ---------- keadaan masuk di nav ---------- */
  function gambarNav(){
    const masuk = document.getElementById('btnMasuk'),
          acct  = document.getElementById('acct'),
          warn  = document.querySelector('.acct-warn'),
          pill  = document.getElementById('acctPill');
    if(masuk) masuk.hidden = App.masuk;
    const bukaApp = document.getElementById('btnApp');
    if(bukaApp) bukaApp.hidden = !App.masuk;
    if(acct)  acct.hidden  = !App.masuk;
    const notif = document.getElementById('notif');
    if(notif) notif.hidden = !App.masuk;
    if(warn)  warn.hidden  = App.lengkap;
    if(pill)  pill.hidden  = App.lengkap;
  }

  /* ---------- pemberitahuan ---------- */
  let toastTimer = null;
  function toast(teks){
    const t = document.getElementById('toast');
    if(!t) return;
    document.getElementById('toastTeks').textContent = teks;
    t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('on'); }, 4200);
  }
  window.KolavoToast = toast;

  /* ---------- masuk selesai: dipanggil dari modal ---------- */
  window.KolavoMasuk = function(niat, kartu){
    App.masuk = true;
    App.undangan = null;
    App.niat = niat;
    App.kartu = kartu || null;
    if(kartu){
      var tanya = [];
      try { tanya = JSON.parse(kartu.dataset.tanya || '[]'); } catch(err) { tanya = []; }
      App.komunitas = {
        nama: kartu.querySelector('h3').textContent.trim(),
        kelas: [...kartu.querySelector('.logo-sq').classList].find(function(c){ return c.indexOf('l-') === 0; }),
        jumlah: kartu.querySelector('.mem').textContent.trim(),
        bentuk: kartu.dataset.bentuk,
        tanya: tanya
      };
    }
    gambarNav();
    sesuaikanLengkapi();
    /* baru masuk: profil dulu. Kalau sudah lengkap, langsung ke komunitas
       yang tadi diklik — itu yang sebenarnya dia tuju. */
    if(!App.lengkap){
      ke('scrLengkapi');
    } else if(niat === 'pengurus'){
      /* pengurus tidak sedang mencari komunitas — dia mau bikin satu */
      ke('scrBuat');
    } else if(kartu && window.KolavoBukaKomunitas){
      window.KolavoBukaKomunitas(kartu);
      ke('scrKomunitas');
    } else if(App.tujuan){
      const t = App.tujuan; App.tujuan = null; ke(t);
    } else {
      ke('scrHome');
    }
  };

  /* ---------- copy layar "lengkapi" mengikuti pemicunya ---------- */
  function sesuaikanLengkapi(){
    const lede = document.getElementById('lengkapiLede'),
          kirim = document.getElementById('kirim');

    if(App.niat === 'anggota' && App.komunitas){
      if(lede) lede.innerHTML = 'Pengurus <b>' + App.komunitas.nama + '</b> perlu memastikan kamu orang asli sebelum menyetujui. Sisanya boleh dilewati — tapi justru itu yang bikin kamu dikenali.';
      /* gabungnya terjadi di halaman komunitas, bukan di sini — labelnya
         tidak boleh menjanjikan permintaan terkirim */
      if(kirim) kirim.textContent = 'Simpan & lanjut';
    } else if(App.niat === 'pengurus'){
      if(lede) lede.innerHTML = 'Sebelum bikin halaman komunitas, Kolavo perlu memastikan kamu orang asli — supaya calon anggotamu percaya halamannya bukan akun kosong.';
      if(kirim) kirim.textContent = 'Simpan & lanjut bikin halaman';
    } else {
      if(lede) lede.innerHTML = 'Isi sekali, berlaku di semua komunitas yang kamu ikuti. Sisanya boleh dilewati — tapi justru itu yang bikin kamu dikenali.';
      if(kirim) kirim.textContent = 'Simpan profil';
    }
  }

  /* ---------- pertanyaan yang disusun pengurus komunitas ----------
     Bukan kolom platform: yang di ikatan alumni berbunyi "Tahun Lulus",
     di organisasi bisa "Tahun Pengukuhan", di asosiasi lain lagi.
     Karena itu jawabannya melekat ke keanggotaan, bukan ke profil orangnya. */
  /* Pertanyaan pengurus hidup di langkah gabung, bukan di profil — sesuai
     kolavo.app, tempat `/join-membership` terpisah dari `/profile/edit`.
     Jawabannya melekat ke keanggotaan, jadi tempatnya memang di sana. */
  function gambarTanya(){
    const list = document.getElementById('gabungList');
    if(!list) return;

    const daftar = (App.komunitas && App.komunitas.tanya) || [];
    if(!daftar.length){ list.innerHTML = ''; return; }
    list.innerHTML = '';

    daftar.forEach(function(t){
      const f = document.createElement('div');
      f.className = 'f';

      const lbl = document.createElement('label');
      lbl.className = 'f-lbl';
      lbl.setAttribute('for', 'tanya-' + t.id);
      lbl.textContent = t.judul;
      lbl.insertAdjacentHTML('beforeend', t.wajib
        ? '<span class="must" aria-hidden="true">*</span>'
        : '<span class="opt">Opsional</span>');
      f.appendChild(lbl);

      let kolom;
      if(t.tipe === 'tahun'){
        kolom = document.createElement('select');
        kolom.className = 'sel';
        kolom.innerHTML = '<option value="">Pilih tahun</option>';
        (window.KolavoTahun || []).forEach(function(y){
          const o = document.createElement('option');
          o.textContent = y;
          kolom.appendChild(o);
        });
      } else {
        kolom = document.createElement('input');
        kolom.className = 'inp';
        kolom.type = 'text';
        /* V4: jawaban angka — keypad angka di ponsel, huruf dibuang saat mengetik */
        if(t.tipe === 'angka'){
          kolom.inputMode = 'numeric';
          kolom.placeholder = 'Tulis angka';
          kolom.addEventListener('input', function(){ kolom.value = kolom.value.replace(/[^0-9.,]/g, ''); });
        }
      }
      kolom.id = 'tanya-' + t.id;
      kolom.dataset.tanyaId = t.id;
      kolom.dataset.judul = t.judul;
      if(t.wajib) kolom.dataset.wajib = '';
      f.appendChild(kolom);

      const why = document.createElement('p');
      why.className = 'f-why';
      why.textContent = t.tanya;
      f.appendChild(why);

      const galat = document.createElement('p');
      galat.className = 'f-galat';
      galat.textContent = t.judul + ' perlu diisi.';
      f.appendChild(galat);

      list.appendChild(f);
    });

    /* pertanyaan wajib ikut menambah total langkah, jadi progres perlu dihitung ulang */
    if(window.hitung) window.hitung();
  }
  window.KolavoGambarTanya = gambarTanya;

  /* jawaban yang pantas jadi tag di daftar anggota — nama panggilan tidak,
     karena itu cara menyapa, bukan cara mengenali */
  window.KolavoJawaban = function(){
    return [...document.querySelectorAll('#gabungList [data-tanya-id]')]
      .filter(function(e){ return e.dataset.tanyaId !== 'nickname' && e.value.trim(); })
      .map(function(e){
        const v = e.value.trim();
        return /^\d{4}$/.test(v) ? e.dataset.judul + ' ' + v : v;
      });
  };

  /* ---------- validasi & simpan ---------- */
  const WAJIB = [
    { id: 'wa',       uji: function(e){ return e.value.replace(/\D/g,'').length >= 8; } },
    { id: 'lahir',    uji: function(e){ return !!e.value; } },
    { id: 'negara',   uji: function(e){ return !!e.value; }, grup: 'domisili' },
    { id: 'provinsi', uji: function(e){ return !!e.value; }, grup: 'domisili' },
    { id: 'kota',     uji: function(e){ return !!e.value; }, grup: 'domisili' }
  ];

  function periksa(){
    let pertama = null;
    document.querySelectorAll('#scrLengkapi .f.salah').forEach(function(f){ f.classList.remove('salah'); });

    WAJIB.forEach(function(w){
      const el = document.getElementById(w.id);
      if(!el || w.uji(el)) return;
      const f = el.closest('.f');
      if(f) f.classList.add('salah');
      if(!pertama) pertama = f || el;
    });

    if(!document.querySelector('#scrLengkapi input[name="jk"]:checked')){
      const f = document.querySelector('#scrLengkapi input[name="jk"]').closest('.f');
      if(f) f.classList.add('salah');
      if(!pertama) pertama = f;
    }

    /* persetujuan TnC + Kebijakan Privasi: tanpa ini profil tidak boleh dikirim.
       Yang opsional (#setujuKabar) sengaja tidak diperiksa. */
    const legal = document.getElementById('setujuLegal');
    if(legal && !legal.checked){
      const f = legal.closest('.f');
      if(f) f.classList.add('salah');
      if(!pertama) pertama = f || legal;
    }

    return pertama;
  }

  /* komunitas yang diikuti — satu sumber untuk Profil dan tab Komunitas (A4) */
  /* dibangun dari status keanggotaan per komunitas (App.diajukan), BUKAN dari
     App.komunitas — itu "komunitas yang terakhir dibuka" dan berubah setiap kali
     pengguna melihat profil komunitas lain */
  function itemIkut(){
    const dj = App.diajukan || {};
    return Object.keys(dj).filter(function(k){ return dj[k] === 'anggota' || dj[k] === 'menunggu'; }).map(function(kelas){
      const l = document.querySelector('#direktori .ccard .logo-sq.' + kelas);
      const kartu = l && l.closest('.ccard');
      if(!kartu) return '';
      const nama = kartu.querySelector('h3').firstChild.textContent.trim(), alias = kartu.dataset.alias || '';
      const jumlah = (kartu.querySelector('.mem') || {}).textContent || '';
      const jawab = App.komunitas && App.komunitas.kelas === kelas && window.KolavoJawaban ? window.KolavoJawaban() : [];
      return '<div class="pf-item"><div class="pf-open" data-komunitas-anggota="' + kelas + '" role="button" tabindex="0" title="Buka halaman komunitas">' +
        '<span class="logo-sq ' + kelas + '" role="img" aria-label="Logo komunitas"></span>' +
        '<div class="t">' + (alias ? '<div class="al">' + alias + '</div>' : '') + '<div class="n">' + nama + '</div>' +
        '<div class="s">' + [jumlah].concat(jawab).filter(Boolean).join(' · ') + '</div></div></div>' +
        (dj[kelas] === 'anggota' ? aksiIkut(kelas) : '<span class="status tunggu">Menunggu persetujuan</span>') + '</div>';
    }).join('');
  }
  /* kartu Komunitasku untuk yang sudah diterima: menu ⋯ berisi "Keluar dari komunitas"
     (dialognya milik 50-js-layar-komunitas, KolavoKeluarKomunitas) */
  let ikutMenu = null;
  /* kebab tegak, sama dengan IC_KEBAB kartu komunitas buatan sendiri */
  const IC_LAIN = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>';
  function aksiIkut(kelas){
    return '<div class="pf-item-aksi"><span class="status anggota">Anggota</span>' +
      (ikutMenu === kelas
        ? '<div class="pf-aksi-btn"><button type="button" class="pf-mini danger" data-keluar-kom="' + kelas + '">' + (window.KolavoIkonKeluar || '') + 'Keluar dari komunitas</button>' +
            '<button type="button" class="pf-mini" data-ikut-menu-tutup>Batal</button></div>'
        : '<button type="button" class="pf-ic" data-ikut-menu="' + kelas + '" aria-label="Lainnya" title="Lainnya">' + IC_LAIN + '</button>') +
      '</div>';
  }
  function gambarUlangKu(){
    if(window.KolavoIsiProfil) window.KolavoIsiProfil();
    const app = document.getElementById('scrApp');
    if(app && !app.hidden && window.KolavoGambarApp) window.KolavoGambarApp('scrApp');
  }
  document.addEventListener('click', function(e){
    const m = e.target.closest('[data-ikut-menu]');
    if(m){ e.preventDefault(); ikutMenu = m.dataset.ikutMenu; gambarUlangKu(); return; }
    if(e.target.closest('[data-ikut-menu-tutup]')){ e.preventDefault(); ikutMenu = null; gambarUlangKu(); return; }
    /* setelah dialog keluar dibuka, menu kartu dilipat lagi */
    if(e.target.closest('[data-keluar-kom]')) ikutMenu = null;
  });
  window.KolavoKomunitasKu = function(){
    return (window.KolavoDibuatItem ? window.KolavoDibuatItem() : '') + itemIkut();
  };

  /* ---------- Profil & Setting: sunting langsung di halaman ----------
     Tiap isian dibuka jadi kontrol yang sama dengan formulir Lengkapi profil (teks, telepon,
     tanggal, wilayah bertingkat, daftar pilihan, kotak cerita, media sosial). Simpan menulis
     ke formulir Lengkapi — satu sumber data — lalu halaman digambar ulang. */
  let pfEdit = null, pfSos = null;
  const elv = function(id){ const e = document.getElementById(id); return e ? e.value : ''; };
  const escA = function(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  function opsi(daftar, pilih, kosong){
    return '<option value="">' + kosong + '</option>' + daftar.map(function(n){ return '<option' + (n === pilih ? ' selected' : '') + '>' + escA(n) + '</option>'; }).join('');
  }
  function editorDom(neg, prov, kota){
    const W = window.KolavoWilayah || {}, P = W[neg] || {}, K = P[prov] || [];
    return '<div class="pf-ed-g3">' +
      '<select class="sel" id="pfENeg" aria-label="Negara">' + opsi(Object.keys(W), neg, 'Negara') + '</select>' +
      '<select class="sel" id="pfEProv" aria-label="Provinsi"' + (neg ? '' : ' disabled') + '>' + opsi(Object.keys(P), prov, 'Provinsi') + '</select>' +
      '<select class="sel" id="pfEKota" aria-label="Kota atau kabupaten"' + (prov ? '' : ' disabled') + '>' + opsi(K, kota, 'Kota/kabupaten') + '</select></div>';
  }
  function editorSos(){
    const PL = window.KolavoSosmedPlatform || [];
    return '<div class="pf-ed-sos">' + pfSos.map(function(b, i){
      return '<div class="pf-ed-sos-i"><select class="sel" data-pf-sos-p="' + i + '" aria-label="Platform">' +
        PL.map(function(p){ return '<option value="' + p[0] + '"' + (p[0] === b.p ? ' selected' : '') + '>' + p[1] + '</option>'; }).join('') + '</select>' +
        '<input class="inp" data-pf-sos-h="' + i + '" maxlength="60" value="' + escA(b.h) + '" placeholder="@namaakun" aria-label="Nama akun">' +
        '<button type="button" class="pf-ed-x" data-pf-sos-x="' + i + '" aria-label="Hapus akun">×</button></div>';
    }).join('') + (pfSos.length < 5 ? '<button type="button" class="pf-ed-tambah" data-pf-sos-tambah>+ Tambah akun</button>' : '') + '</div>';
  }
  function editorIsian(k){
    let isi = '';
    if(k === 'nama') isi = '<input class="inp" id="pfE" maxlength="60" value="' + escA((document.getElementById('idNama') || {}).textContent || '') + '" aria-label="Nama lengkap">';
    else if(k === 'wa') isi = '<div class="tel"><span class="tel-pfx">🇮🇩 +62</span><input id="pfE" type="tel" inputmode="numeric" placeholder="812 3456 7890" value="' + escA(elv('wa')) + '" aria-label="Nomor WhatsApp"></div>';
    else if(k === 'lahir') isi = '<input class="inp" id="pfE" type="date" max="' + new Date().toISOString().slice(0, 10) + '" value="' + escA(elv('lahir')) + '" aria-label="Tanggal lahir">';
    else if(k === 'dom') isi = editorDom(elv('negara') || 'Indonesia', elv('provinsi'), elv('kota'));
    else if(k === 'kerja'){
      const src = document.getElementById('kerja'), lain = elv('kerja') === '__lain__';
      isi = '<select class="sel" id="pfE" aria-label="Pekerjaan atau keahlian">' + (src ? src.innerHTML : '') + '</select>' +
        '<input class="inp" id="pfE2" maxlength="40" placeholder="Tulis pekerjaanmu" value="' + escA(elv('kerjaLain')) + '"' + (lain ? '' : ' hidden') + ' aria-label="Pekerjaan lainnya">';
    }
    else if(k === 'didik'){
      const src = document.getElementById('didik');
      isi = '<div class="pf-ed-g2"><select class="sel" id="pfE" aria-label="Jenjang">' + (src ? src.innerHTML : '') + '</select>' +
        '<input class="inp" id="pfE2" maxlength="60" placeholder="Jurusan dan kampus atau sekolah" value="' + escA(elv('didikDi')) + '" aria-label="Jurusan dan kampus"></div>';
    }

  /* tulis ke kontrol formulir Lengkapi + picu event-nya, supaya progres & logika formulir ikut */

    else if(k === 'beri' || k === 'bio') tulis(k, v.trim());
    else if(k === 'sos'){ if(window.KolavoSosmedPasang) window.KolavoSosmedPasang(pfSos); }

        ke('scrBuat');
        toast('Profil kamu sudah lengkap. Sekarang halaman komunitasnya.');
      } else if(App.niat === 'anggota' && App.kartu && window.KolavoBukaKomunitas){
        window.KolavoBukaKomunitas(App.kartu);
        ke('scrKomunitas');
        toast('Profil kamu sudah lengkap. Tinggal minta gabung.');
      } else if(App.tujuan){
        const t = App.tujuan; App.tujuan = null; ke(t);
        toast('Profil kamu sudah lengkap.');
      } else {
        ke('scrHome');
        toast('Profil kamu sudah lengkap.');
      }
      return;
    }

    if(e.target.closest('#keluar')){
      e.preventDefault();
      location.reload();
    }
  });

  const reset = document.getElementById('demoReset');
  if(reset) reset.addEventListener('click', function(){ location.reload(); });

  /* dipanggil skrip komunitas begitu pendaftaran disetujui — chip di daftar
     komunitas harus ikut berubah walau layarnya sedang tidak terbuka */
  window.KolavoIsiProfil = isiProfil;

  gambarNav();
  sesuaikanLengkapi();
  gambarTanya();
  gambar();
})();
</script>
